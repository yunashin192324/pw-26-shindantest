<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一括QRコード生成ツール</title>
<style>
  :root {
    --bg: #f8fafc; --panel: #ffffff; --line: #e2e8f0; --line-strong: #cbd5e1;
    --text: #1e293b; --sub: #64748b; --muted: #94a3b8;
    --accent: #4f46e5; --accent-hover: #4338ca; --accent-soft: #eef2ff;
    --dark: #1e293b; --dark-hover: #0f172a;
    --warn-bg: #fffbeb; --warn-line: #fcd34d; --warn-text: #92400e;
    --err-bg: #fef2f2; --err-line: #fca5a5; --err-text: #991b1b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 48px;
    font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic UI", Meiryo, sans-serif;
    font-size: 15px; line-height: 1.6;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  html { scroll-padding-top: 80px; }
  header { background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 10; }
  .header-inner { max-width: 1152px; margin: 0 auto; padding: 14px 16px; display: flex; align-items: center; gap: 12px; }
  .logo { background: var(--accent); color: #fff; width: 40px; height: 40px; border-radius: 8px; display: grid; place-items: center; flex: none; }
  h1 { font-size: 20px; margin: 0; }
  main { max-width: 1152px; margin: 32px auto 0; padding: 0 16px; display: grid; grid-template-columns: 1fr; gap: 24px; }
  @media (min-width: 1024px) { main { grid-template-columns: 5fr 7fr; gap: 32px; align-items: start; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 24px; min-width: 0; }
  h2 { font-size: 17px; margin: 0 0 16px; display: flex; align-items: center; gap: 8px; }
  .field { margin-bottom: 20px; }
  .label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; }
  .help { font-size: 12px; color: var(--sub); margin: 6px 0 0; }
  textarea, input[type=text], select {
    width: 100%; border: 1px solid var(--line-strong); border-radius: 12px; padding: 10px 14px; background: #fff; font-size: 14px;
  }
  textarea { resize: vertical; min-height: 180px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Hiragino Kaku Gothic ProN", Meiryo, monospace; white-space: pre; overflow-wrap: normal; overflow-x: auto; }
  textarea:focus, input[type=text]:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
  .prefix-wrap { position: relative; }
  .prefix-wrap span { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
  .prefix-wrap input { padding-left: 28px; }
  .options { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 24px; display: grid; gap: 14px; }
  .check { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
  .check input { width: 18px; height: 18px; margin: 3px 0 0; accent-color: var(--accent); flex: none; }
  .check b { display: block; font-size: 14px; font-weight: 600; }
  .check small { display: block; font-size: 12px; color: var(--sub); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .row2 .label { font-size: 13px; margin-bottom: 4px; }
  .btn { border: 0; border-radius: 12px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; transition: background .15s; text-decoration: none; }
  .btn:disabled { opacity: .6; cursor: not-allowed; }
  .btn-primary { width: 100%; background: var(--accent); color: #fff; padding: 14px 20px; font-size: 15px; }
  .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
  .btn-dark { background: var(--dark); color: #fff; padding: 8px 14px; font-size: 13px; border-radius: 8px; }
  .btn-dark:hover:not(:disabled) { background: var(--dark-hover); }
  .btn-light { width: 100%; background: #f1f5f9; color: #334155; padding: 8px 10px; font-size: 13px; border-radius: 8px; }
  .btn-light:hover { background: #e2e8f0; }
  .out { min-height: 500px; display: flex; flex-direction: column; }
  .out-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .out-head h2 { margin: 0; }
  .summary { font-size: 13px; color: var(--sub); margin: 0 0 12px; }
  .state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--muted); text-align: center; gap: 12px; }
  .spinner { width: 40px; height: 40px; border: 4px solid var(--accent-soft); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
  .spinner.small { width: 16px; height: 16px; border-width: 2px; border-color: rgba(255,255,255,.35); border-top-color: #fff; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .notice { border-radius: 12px; padding: 12px 14px; font-size: 13px; margin-bottom: 14px; }
  .notice.err { background: var(--err-bg); border: 1px solid var(--err-line); color: var(--err-text); }
  .notice.warn { background: var(--warn-bg); border: 1px solid var(--warn-line); color: var(--warn-text); }
  .notice ul { margin: 6px 0 0; padding-left: 20px; }
  .notice li { word-break: break-all; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  @media (min-width: 640px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  .qr-card { border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .qr-card img { width: 100%; height: auto; border: 1px solid #f1f5f9; border-radius: 8px; background: #fff; display: block; }
  .qr-card .no { font-size: 11px; color: var(--muted); }
  .qr-card .dest { font-size: 11px; color: var(--sub); word-break: break-all; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .qr-card .w { font-size: 11px; color: var(--warn-text); background: var(--warn-bg); border-radius: 6px; padding: 4px 6px; }
  .hidden { display: none !important; }
  .overlay { position: fixed; inset: 0; background: rgba(15,23,42,.5); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
  .dialog { background: #fff; border-radius: 16px; padding: 24px; max-width: 400px; width: 100%; }
  .dialog h3 { margin: 0 0 10px; font-size: 17px; }
  .dialog p { margin: 0 0 20px; font-size: 14px; color: #475569; white-space: pre-wrap; }
  .dialog .actions { display: flex; justify-content: flex-end; }
  noscript div { max-width: 1152px; margin: 16px auto; padding: 12px 16px; background: var(--err-bg); color: var(--err-text); border-radius: 12px; }
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="logo" aria-hidden="true">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M3 3h8v8H3V3zm2 2v4h4V5H5zm8-2h8v8h-8V3zm2 2v4h4V5h-4zM3 13h8v8H3v-8zm2 2v4h4v-4H5zm8-2h2v2h-2v-2zm2 2h2v2h-2v-2zm2-2h2v2h-2v-2zm2 2h2v2h-2v-2zm-6 2h2v2h-2v-2zm2 2h2v2h-2v-2zm2-2h2v2h-2v-2zm2 2h2v2h-2v-2z"/></svg>
    </div>
    <h1>一括QRコード生成ツール</h1>
  </div>
</header>
<noscript><div>このツールはJavaScriptを使用します。ブラウザの設定でJavaScriptを有効にしてください。</div></noscript>

<main>
  <!-- 入力 -->
  <section class="card">
    <h2>入力データ</h2>

    <div class="field">
      <label class="label" for="urls-input">URLリスト（1行に1つ）</label>
      <textarea id="urls-input" rows="9" spellcheck="false" placeholder="https://example.com&#10;https://example.com/2&#9;店舗A&#10;https://example.com/3 イベント用"></textarea>
      <p class="help">URLの後ろに「タブ」または「空白」を入れて文字を書くと、その文字をQRコードの下に印字します。Excelの2列（URL・文字）をそのまま貼り付けられます。</p>
    </div>

    <div class="field">
      <label class="label" for="params-input">全URLの末尾に付ける文字列（任意）</label>
      <div class="prefix-wrap">
        <span>?</span>
        <input type="text" id="params-input" spellcheck="false" placeholder="utm_source=qr&amp;utm_medium=print">
      </div>
      <p class="help">URLにすでに「?」がある場合は「&amp;」でつなぎます。「#」以降がある場合はその手前に入れます。</p>
    </div>

    <div class="options">
      <label class="check">
        <input type="checkbox" id="enable-label" checked>
        <span><b>QRコードの下に文字を入れる</b><small>指定した文字、指定がない場合はURLを印字します（長い場合は2行まで）</small></span>
      </label>
      <label class="check">
        <input type="checkbox" id="comma-separator">
        <span><b>カンマ（,）も区切りとして扱う</b><small>「URL,文字」形式（CSV）のときに使います。URLの中にカンマがある場合はオフにしてください</small></span>
      </label>
      <label class="check">
        <input type="checkbox" id="add-https" checked>
        <span><b>「https://」がないURLに自動で付ける</b><small>例：example.com → https://example.com</small></span>
      </label>
      <div class="row2">
        <div>
          <label class="label" for="size-select">画像の大きさ</label>
          <select id="size-select">
            <option value="300">小（約300px）</option>
            <option value="600" selected>中（約600px）</option>
            <option value="1000">大（約1000px・印刷向け）</option>
          </select>
        </div>
        <div>
          <label class="label" for="ecc-select">読み取りの強さ</label>
          <select id="ecc-select">
            <option value="L">低（長いURL向け）</option>
            <option value="M" selected>標準</option>
            <option value="Q">高</option>
            <option value="H">最高（汚れに強い）</option>
          </select>
        </div>
      </div>
    </div>

    <button id="generate-btn" type="button" class="btn btn-primary">QRコードを一括生成</button>
  </section>

  <!-- 結果 -->
  <section class="card out">
    <div class="out-head">
      <h2>生成結果</h2>
      <button id="bulk-download-btn" type="button" class="btn btn-dark hidden">ZIPで一括ダウンロード</button>
    </div>

    <div id="notices"></div>
    <p id="summary" class="summary hidden"></p>

    <div id="empty-state" class="state">
      <p>URLを入力して生成ボタンを押してください</p>
    </div>
    <div id="loading" class="state hidden">
      <div class="spinner"></div>
      <p id="loading-text">QRコードを生成中...</p>
    </div>
    <div id="results-grid" class="grid hidden"></div>
  </section>
</main>

<script>
// qrcode-generator 1.4.4 (MIT License) by Kazuhiko Arase
//---------------------------------------------------------------------
//
// QR Code Generator for JavaScript
//
// Copyright (c) 2009 Kazuhiko Arase
//
// URL: http://www.d-project.com/
//
// Licensed under the MIT license:
//  http://www.opensource.org/licenses/mit-license.php
//
// The word 'QR Code' is registered trademark of
// DENSO WAVE INCORPORATED
//  http://www.denso-wave.com/qrcode/faqpatent-e.html
//
//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

          utf8.push(0xc0 | (charcode >> 6),
              0x80 | (charcode & 0x3f));
        }
        else if (charcode < 0xd800 || charcode >= 0xe000) {
          utf8.push(0xe0 | (charcode >> 12),
              0x80 | ((charcode>>6) & 0x3f),
              0x80 | (charcode & 0x3f));
        }
        // surrogate pair
        else {
          i++;
          // UTF-16 encodes 0x10000-0x10FFFF by
          // subtracting 0x10000 and splitting the
          // 20 bits of 0x0-0xFFFFF into two halves
          charcode = 0x10000 + (((charcode & 0x3ff)<<10)
            | (str.charCodeAt(i) & 0x3ff));
          utf8.push(0xf0 | (charcode >>18),
              0x80 | ((charcode>>12) & 0x3f),
              0x80 | ((charcode>>6) & 0x3f),
              0x80 | (charcode & 0x3f));
        }
      }
      return utf8;
    }
    return toUTF8Array(s);
  };

}();

(function (factory) {
  if (typeof define === 'function' && define.amd) {
      define([], factory);
  } else if (typeof exports === 'object') {
      module.exports = factory();
  }
}(function () {
    return qrcode;
}));

</script>
<script>
(function () {
  'use strict';

  // ---------- 要素 ----------
  var $ = function (id) { return document.getElementById(id); };
  var generateBtn = $('generate-btn');
  var urlsInput = $('urls-input');
  var paramsInput = $('params-input');
  var enableLabel = $('enable-label');
  var commaSeparator = $('comma-separator');
  var addHttps = $('add-https');
  var sizeSelect = $('size-select');
  var eccSelect = $('ecc-select');
  var resultsGrid = $('results-grid');
  var bulkDownloadBtn = $('bulk-download-btn');
  var loading = $('loading');
  var loadingText = $('loading-text');
  var emptyState = $('empty-state');
  var notices = $('notices');
  var summary = $('summary');

  var LABEL_FONT = '"Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", "YuGothic", Meiryo, "Noto Sans JP", "Noto Sans CJK JP", sans-serif';
  var QUIET_ZONE = 4;          // QRコード規格で必要な周囲の余白（セル4個分）
  var generated = [];          // { blob, filename, objectUrl }
  var busy = false;

  if (typeof qrcode !== 'function') {
    showDialog('QRコード作成部品の読み込みに失敗しました。ファイルが壊れている可能性があります。');
    generateBtn.disabled = true;
    return;
  }
  // 日本語などを正しく符号化するため、文字列をUTF-8のバイト列として扱う
  qrcode.stringToBytes = qrcode.stringToBytesFuncs['UTF-8'];

  // ---------- 入力の解析 ----------
  var INVISIBLE = /[​-‍⁠﻿]/g;

  function stripQuotes(s) {
    s = s.trim();
    if (s.length >= 2 && s.charAt(0) === '"' && s.charAt(s.length - 1) === '"') {
      s = s.slice(1, -1).replace(/""/g, '"').trim();
    }
    return s;
  }

  // 1行を「URL」と「印字する文字」に分ける
  function splitLine(line, useComma) {
    var idx = line.indexOf('\t');
    if (idx === -1) idx = line.search(/[ 　]/);                 // 半角・全角空白（URL内に空白は入らない）
    if (idx === -1 && useComma) idx = line.indexOf(',');
    if (idx === -1) return { url: stripQuotes(line), label: '' };
    var rest = line.slice(idx + 1).replace(/^[\s　,]+/, '');
    return { url: stripQuotes(line.slice(0, idx)), label: stripQuotes(rest) };
  }

  var SCHEME = /^[a-zA-Z][a-zA-Z0-9+.\-]*:/;

  function normalizeUrl(raw, autoHttps, warnings) {
    var url = raw;
    var hasScheme = SCHEME.test(url) && !/^([^:\/?#]+\.[^:\/?#]+|localhost):\d+(?:[\/?#]|$)/i.test(url);   // "example.com:8080" は scheme なし扱い
    if (!hasScheme) {
      if (autoHttps && /^(\/\/)?[^\s\/?#]+\.[^\s\/?#]+/.test(url)) {
        url = 'https://' + url.replace(/^\/\//, '');
      } else {
        warnings.push('「http://」や「https://」で始まっていません。スマートフォンでURLとして開けない場合があります');
        return url;
      }
    }
    if (/^https?:/i.test(url)) {
      try {
        // 日本語などを「%E6%97%A5…」の形に変換し、どの読み取りアプリでも開けるようにする
        return new URL(url).href;
      } catch (e) {
        warnings.push('URLの形式が正しくない可能性があります');
      }
    }
    return url;
  }

  function appendParams(url, params) {
    if (!params) return url;
    var hashIdx = url.indexOf('#');
    var base = hashIdx === -1 ? url : url.slice(0, hashIdx);
    var hash = hashIdx === -1 ? '' : url.slice(hashIdx);
    var sep = base.indexOf('?') === -1 ? '?' : (/[?&]$/.test(base) ? '' : '&');
    var joined = base + sep + params + hash;
    if (/^https?:/i.test(joined)) {
      try { return new URL(joined).href; } catch (e) { /* そのまま使う */ }
    }
    return joined;
  }

  function cleanParams(s) {
    return s.replace(INVISIBLE, '').trim().replace(/^[?&]+/, '').replace(/&+$/, '').trim();
  }

  // ---------- QRコード描画 ----------
  function makeQr(text, ecc) {
    var qr = qrcode(0, ecc);   // 0 = 内容の長さに合わせて大きさを自動選択
    qr.addData(text, 'Byte');
    qr.make();
    return qr;
  }

  function tooLongMessage(text) {
    var bytes = qrcode.stringToBytes(text).length;
    return 'URLが長すぎてQRコードに入りません（' + bytes + 'バイト）。「読み取りの強さ」を下げると入る場合があります（「低」で最大2953バイト）';
  }

  // 文字を最大 maxLines 行に折り返し、入りきらない部分は「…」で省略する
  function wrapText(ctx, text, maxWidth, maxLines) {
    var chars = Array.from(text);
    var lines = [];
    var cur = '';
    for (var i = 0; i < chars.length; i++) {
      var next = cur + chars[i];
      if (ctx.measureText(next).width > maxWidth && cur !== '') {
        lines.push(cur);
        cur = chars[i];
        if (lines.length === maxLines) { cur = null; break; }
      } else {
        cur = next;
      }
    }
    if (cur !== null) {
      if (cur !== '') lines.push(cur);
      return lines;
    }
    // 省略が必要
    var last = Array.from(lines[maxLines - 1]);
    while (last.length > 0 && ctx.measureText(last.join('') + '…').width > maxWidth) last.pop();
    lines[maxLines - 1] = last.join('') + '…';
    return lines;
  }

  function renderCanvas(qr, labelText, targetSize) {
    var count = qr.getModuleCount();
    var cells = count + QUIET_ZONE * 2;
    var cell = Math.max(2, Math.round(targetSize / cells));   // セルの大きさを整数にして、境界をくっきりさせる
    var qrPx = cells * cell;

    var fontSize = Math.max(14, Math.round(qrPx * 0.045));
    var lineHeight = Math.round(fontSize * 1.35);
    var lines = [];
    var canvas = document.createElement('canvas');
    var ctx = canvas.getContext('2d');
    if (!ctx) throw new Error('この環境では画像を作成できません');

    if (labelText) {
      ctx.font = '600 ' + fontSize + 'px ' + LABEL_FONT;
      lines = wrapText(ctx, labelText, qrPx - cell * QUIET_ZONE * 2, 2);
    }
    // 文字はQRコード下の余白（規格で必要なセル4個分）より下に置き、その下にセル2個分の余白を取る
    var textArea = lines.length ? lines.length * lineHeight + cell * 2 : 0;

    canvas.width = qrPx;
    canvas.height = qrPx + textArea;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#000000';
    for (var r = 0; r < count; r++) {
      for (var c = 0; c < count; c++) {
        if (qr.isDark(r, c)) ctx.fillRect((c + QUIET_ZONE) * cell, (r + QUIET_ZONE) * cell, cell, cell);
      }
    }

    if (lines.length) {
      ctx.font = '600 ' + fontSize + 'px ' + LABEL_FONT;
      ctx.fillStyle = '#1e293b';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      var top = qrPx;   // qrPx にはQRコード下の余白（セル4個分）がすでに含まれている
      for (var i = 0; i < lines.length; i++) {
        ctx.fillText(lines[i], qrPx / 2, top + lineHeight * i + lineHeight / 2);
      }
    }
    return canvas;
  }

  function canvasToBlob(canvas) {
    return new Promise(function (resolve, reject) {
      if (canvas.toBlob) {
        canvas.toBlob(function (b) { b ? resolve(b) : reject(new Error('画像の書き出しに失敗しました')); }, 'image/png');
      } else {
        try {
          var bin = atob(canvas.toDataURL('image/png').split(',')[1]);
          var arr = new Uint8Array(bin.length);
          for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
          resolve(new Blob([arr], { type: 'image/png' }));
        } catch (e) { reject(e); }
      }
    });
  }

  // ---------- ファイル名 ----------
  function safeName(s) {
    var name = Array.from(s.replace(/^[a-z][a-z0-9+.\-]*:\/\//i, '')
      .replace(/[\\\/:*?"<>|\u0000-\u001F\u007F]+/g, '_')
      .replace(/[\s　]+/g, '_')
      .replace(/_+/g, '_')
      .replace(/^[_.]+|[_.]+$/g, '')).slice(0, 40).join('');
    return name.replace(/[_.]+$/g, '');
  }

  // ---------- 表示まわり ----------
  function clearResults() {
    generated.forEach(function (g) { URL.revokeObjectURL(g.objectUrl); });
    generated = [];
    resultsGrid.textContent = '';
    notices.textContent = '';
    summary.classList.add('hidden');
    bulkDownloadBtn.classList.add('hidden');
  }

  function addNotice(kind, title, items) {
    var box = document.createElement('div');
    box.className = 'notice ' + kind;
    var strong = document.createElement('strong');
    strong.textContent = title;
    box.appendChild(strong);
    if (items && items.length) {
      var ul = document.createElement('ul');
      items.slice(0, 50).forEach(function (t) {
        var li = document.createElement('li');
        li.textContent = t;
        ul.appendChild(li);
      });
      if (items.length > 50) {
        var li = document.createElement('li');
        li.textContent = 'ほか ' + (items.length - 50) + ' 件';
        ul.appendChild(li);
      }
      box.appendChild(ul);
    }
    notices.appendChild(box);
  }

  function addCard(item, warnings) {
    var card = document.createElement('div');
    card.className = 'qr-card';
    card.title = 'QRコードの中身: ' + item.text;

    var no = document.createElement('div');
    no.className = 'no';
    no.textContent = item.lineNo + '行目';

    var img = document.createElement('img');
    img.src = item.objectUrl;
    img.alt = 'QRコード（' + item.text + '）';

    var dest = document.createElement('div');
    dest.className = 'dest';
    dest.textContent = item.text;

    var dl = document.createElement('a');
    dl.className = 'btn btn-light';
    dl.href = item.objectUrl;
    dl.download = item.filename;
    dl.textContent = '保存';

    card.appendChild(no);
    card.appendChild(img);
    card.appendChild(dest);
    warnings.forEach(function (w) {
      var el = document.createElement('div');
      el.className = 'w';
      el.textContent = '注意: ' + w;
      card.appendChild(el);
    });
    card.appendChild(dl);
    resultsGrid.appendChild(card);
  }

  function showDialog(message) {
    var overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.setAttribute('role', 'alertdialog');
    overlay.setAttribute('aria-modal', 'true');
    var box = document.createElement('div');
    box.className = 'dialog';
    var h = document.createElement('h3');
    h.textContent = 'お知らせ';
    var p = document.createElement('p');
    p.textContent = message;
    var actions = document.createElement('div');
    actions.className = 'actions';
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'btn btn-dark';
    btn.textContent = '閉じる';
    var close = function () {
      if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
      document.removeEventListener('keydown', onKey);
    };
    var onKey = function (e) { if (e.key === 'Escape') close(); };
    btn.addEventListener('click', close);
    overlay.addEventListener('click', function (e) { if (e.target === overlay) close(); });
    document.addEventListener('keydown', onKey);
    actions.appendChild(btn);
    box.appendChild(h); box.appendChild(p); box.appendChild(actions);
    overlay.appendChild(box);
    document.body.appendChild(overlay);
    btn.focus();
  }

  function nextFrame() {
    return new Promise(function (r) { setTimeout(r, 0); });
  }

  // ---------- 生成 ----------
  generateBtn.addEventListener('click', function () {
    if (busy) return;
    run().catch(function (e) {
      console.error(e);
      showDialog('予期しないエラーが発生しました: ' + (e && e.message ? e.message : e));
    }).then(function () {
      busy = false;
      generateBtn.disabled = false;
      bulkDownloadBtn.disabled = false;
      loading.classList.add('hidden');
    });
  });

  async function run() {
    var rawLines = urlsInput.value.split(/\r\n|\r|\n/);
    var entries = [];
    rawLines.forEach(function (line, i) {
      var t = line.replace(INVISIBLE, '').trim();
      if (t) entries.push({ lineNo: i + 1, line: t });
    });
    if (entries.length === 0) {
      showDialog('URLを入力してください。');
      return;
    }

    busy = true;
    generateBtn.disabled = true;
    bulkDownloadBtn.disabled = true;
    clearResults();
    emptyState.classList.add('hidden');
    resultsGrid.classList.add('hidden');
    loading.classList.remove('hidden');

    var params = cleanParams(paramsInput.value);
    var useLabel = enableLabel.checked;
    var useComma = commaSeparator.checked;
    var autoHttps = addHttps.checked;
    var targetSize = parseInt(sizeSelect.value, 10) || 600;
    var ecc = eccSelect.value || 'M';

    var errors = [];
    var commaHints = [];
    var usedNames = Object.create(null);
    var digits = Math.max(3, String(entries.length).length);

    for (var n = 0; n < entries.length; n++) {
      var e = entries[n];
      if (n % 10 === 0) {
        loadingText.textContent = 'QRコードを生成中... (' + n + ' / ' + entries.length + ')';
        await nextFrame();
      }
      try {
        var parts = splitLine(e.line, useComma);
        if (!parts.url) {
          errors.push(e.lineNo + '行目: URLがありません');
          continue;
        }
        if (!useComma && /,[^\/?#=&]*[^\x00-\x7F]/.test(parts.url)) commaHints.push(e.lineNo);

        var warnings = [];
        var text = appendParams(normalizeUrl(parts.url, autoHttps, warnings), params);

        var qr;
        try {
          qr = makeQr(text, ecc);
        } catch (err) {
          if (String(err).indexOf('code length overflow') !== -1) {
            errors.push(e.lineNo + '行目: ' + tooLongMessage(text));
            continue;
          }
          throw err;
        }

        var labelText = useLabel ? (parts.label || parts.url) : '';
        var canvas = renderCanvas(qr, labelText, targetSize);
        var blob = await canvasToBlob(canvas);

        var num = String(e.lineNo).padStart(digits, '0');
        var base = safeName(parts.label || '');
        var filename = 'qrcode_' + num + (base ? '_' + base : '') + '.png';
        var k = 2;
        while (usedNames[filename]) filename = 'qrcode_' + num + (base ? '_' + base : '') + '_' + (k++) + '.png';
        usedNames[filename] = true;

        var item = { lineNo: e.lineNo, text: text, blob: blob, filename: filename, objectUrl: URL.createObjectURL(blob) };
        generated.push(item);
        addCard(item, warnings);
      } catch (err) {
        console.error('line ' + e.lineNo, err);
        errors.push(e.lineNo + '行目: 作成に失敗しました（' + (err && err.message ? err.message : err) + '）');
      }
    }

    if (errors.length) addNotice('err', errors.length + '件は作成できませんでした', errors);
    if (commaHints.length) {
      addNotice('warn', 'URLの中にカンマ（,）があり、その後ろに日本語などが続いています。「URL,文字」の形式なら「カンマ（,）も区切りとして扱う」をオンにして作り直してください。',
        commaHints.map(function (l) { return l + '行目'; }));
    }

    if (generated.length) {
      summary.textContent = generated.length + '件のQRコードを作成しました。画像の下の文字が、QRコードに入っている中身です。';
      summary.classList.remove('hidden');
      resultsGrid.classList.remove('hidden');
      bulkDownloadBtn.classList.remove('hidden');
    } else {
      emptyState.classList.remove('hidden');
    }
    // スマートフォンなど縦並びの画面では、結果が画面外にあるため結果の位置まで移動する
    var out = document.querySelector('.out');
    if (out.getBoundingClientRect().top > window.innerHeight * 0.6 && out.scrollIntoView) {
      out.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  }

  // ---------- ZIP 作成（外部部品を使わずに作成） ----------
  var CRC_TABLE = (function () {
    var t = new Uint32Array(256);
    for (var n = 0; n < 256; n++) {
      var c = n;
      for (var k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      t[n] = c >>> 0;
    }
    return t;
  })();

  function crc32(bytes) {
    var c = 0xFFFFFFFF;
    for (var i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }

  function readBlob(blob) {
    if (blob.arrayBuffer) return blob.arrayBuffer();
    return new Promise(function (resolve, reject) {
      var fr = new FileReader();
      fr.onload = function () { resolve(fr.result); };
      fr.onerror = function () { reject(fr.error); };
      fr.readAsArrayBuffer(blob);
    });
  }

  async function buildZip(files) {
    var enc = new TextEncoder();
    var now = new Date();
    var dosTime = (now.getHours() << 11) | (now.getMinutes() << 5) | Math.floor(now.getSeconds() / 2);
    var dosDate = ((Math.max(now.getFullYear(), 1980) - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();
    var parts = [];
    var central = [];
    var offset = 0;

    for (var i = 0; i < files.length; i++) {
      var name = enc.encode(files[i].name);
      var data = new Uint8Array(await readBlob(files[i].blob));
      var crc = crc32(data);

      var lh = new DataView(new ArrayBuffer(30));
      lh.setUint32(0, 0x04034b50, true);
      lh.setUint16(4, 20, true);
      lh.setUint16(6, 0x0800, true);          // ファイル名をUTF-8で記録（日本語名の文字化け防止）
      lh.setUint16(8, 0, true);               // 無圧縮（PNGはもともと圧縮済み）
      lh.setUint16(10, dosTime, true);
      lh.setUint16(12, dosDate, true);
      lh.setUint32(14, crc, true);
      lh.setUint32(18, data.length, true);
      lh.setUint32(22, data.length, true);
      lh.setUint16(26, name.length, true);
      lh.setUint16(28, 0, true);
      parts.push(lh.buffer, name, data);

      var ch = new DataView(new ArrayBuffer(46));
      ch.setUint32(0, 0x02014b50, true);
      ch.setUint16(4, 20, true);
      ch.setUint16(6, 20, true);
      ch.setUint16(8, 0x0800, true);
      ch.setUint16(10, 0, true);
      ch.setUint16(12, dosTime, true);
      ch.setUint16(14, dosDate, true);
      ch.setUint32(16, crc, true);
      ch.setUint32(20, data.length, true);
      ch.setUint32(24, data.length, true);
      ch.setUint16(28, name.length, true);
      ch.setUint16(30, 0, true);
      ch.setUint16(32, 0, true);
      ch.setUint16(34, 0, true);
      ch.setUint16(36, 0, true);
      ch.setUint32(38, 0, true);
      ch.setUint32(42, offset, true);
      central.push(ch.buffer, name);

      offset += 30 + name.length + data.length;
      if (offset > 0xFFFFFFFF) throw new Error('ZIPの容量上限（4GB）を超えました');
      if (i % 20 === 19) await nextFrame();
    }

    var centralSize = 0;
    central.forEach(function (p) { centralSize += p.byteLength; });
    var end = new DataView(new ArrayBuffer(22));
    end.setUint32(0, 0x06054b50, true);
    end.setUint16(4, 0, true);
    end.setUint16(6, 0, true);
    end.setUint16(8, files.length, true);
    end.setUint16(10, files.length, true);
    end.setUint32(12, centralSize, true);
    end.setUint32(16, offset, true);
    end.setUint16(20, 0, true);

    return new Blob(parts.concat(central, [end.buffer]), { type: 'application/zip' });
  }

  bulkDownloadBtn.addEventListener('click', async function () {
    if (busy || generated.length === 0) return;
    if (generated.length > 65535) {
      showDialog('一度にZIPにまとめられるのは65535件までです。');
      return;
    }
    busy = true;
    var original = bulkDownloadBtn.textContent;
    bulkDownloadBtn.disabled = true;
    generateBtn.disabled = true;
    bulkDownloadBtn.textContent = '';
    var sp = document.createElement('span');
    sp.className = 'spinner small';
    bulkDownloadBtn.appendChild(sp);
    bulkDownloadBtn.appendChild(document.createTextNode(' ZIP作成中...'));
    try {
      var zip = await buildZip(generated.map(function (g) { return { name: g.filename, blob: g.blob }; }));
      var url = URL.createObjectURL(zip);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'qrcodes_bulk.zip';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 60000);   // すぐに消すとダウンロードが始まらない環境があるため
    } catch (e) {
      console.error(e);
      showDialog('ZIPファイルの作成中にエラーが発生しました: ' + (e && e.message ? e.message : e));
    } finally {
      bulkDownloadBtn.textContent = original;
      bulkDownloadBtn.disabled = false;
      generateBtn.disabled = false;
      busy = false;
    }
  });
})();
</script>
</body>
</html>
