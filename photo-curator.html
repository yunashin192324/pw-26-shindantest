<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>写真セレクター</title>
<style>
:root{--bg:#0a0a0a;--panel:#111;--line:#262626;--fg:#e8e0d8;--mute:#8a8a8a;--gold:#c9a96e;--ok:#22c55e;--warn:#f59e0b;--bad:#ef4444}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;font-size:14px}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
header{position:sticky;top:0;z-index:20;background:rgba(15,15,15,.96);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
header h1{margin:0;font-size:16px;font-weight:600}
header small{color:var(--mute);font-size:11px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{background:#222;border:1px solid #3a3a3a;border-radius:6px;padding:7px 12px;font-size:12px}
.btn:hover{background:#2e2e2e}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#000;font-weight:700}
.btn.gold:hover{background:#d8b97e}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.danger:hover{background:#3a1515;color:#fca5a5}
.btn.on{border-color:var(--gold);color:var(--gold);background:rgba(201,169,110,.12)}
.btn.ng.on{border-color:var(--bad);color:#fca5a5;background:rgba(239,68,68,.12)}
select,input[type=number]{background:#1a1a1a;border:1px solid #333;border-radius:6px;padding:6px 8px;font-size:12px}
#progress{display:none;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
#progress .bar{height:6px;background:#222;border-radius:3px;overflow:hidden;margin-top:6px}
#progress .bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .2s}
#progress .t{display:flex;justify-content:space-between;font-size:12px;color:#aaa}
.toolbar{padding:10px 16px;border-bottom:1px solid #1a1a1a;display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}
.chip{border:1px solid #333;background:transparent;border-radius:999px;padding:5px 12px;font-size:12px;color:#aaa}
.chip.on{border-color:var(--gold);color:var(--gold);background:rgba(201,169,110,.1)}
#summary{display:none;margin:12px 16px 0;padding:12px 14px;background:#14120e;border:1px solid #3a3222;border-radius:8px;font-size:12px;line-height:1.7;color:#d8ccb8}
#summary b{color:var(--gold)}
#notice{margin:12px 16px 0;padding:10px 14px;border:1px solid #2a2a2a;border-radius:8px;font-size:12px;line-height:1.7;color:#aaa;background:#101010}
#drop{margin:24px auto;max-width:640px;border:2px dashed #333;border-radius:16px;padding:56px 20px;text-align:center;cursor:pointer;color:var(--mute);line-height:1.8}
#drop.over{border-color:var(--gold);background:rgba(201,169,110,.08)}
#drop b{display:block;font-size:18px;color:var(--fg);margin-bottom:6px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;padding:16px 16px 90px}
.card{background:var(--panel);border:1px solid #1e1e1e;border-radius:10px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer}
.card.rec{border-color:#2a3a2a}
.card.ng{opacity:.5}
.card.sel{outline:2px solid var(--gold);outline-offset:2px}
.card .im{position:relative;aspect-ratio:4/3;background:#050505;overflow:hidden}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.badges{position:absolute;left:6px;bottom:6px;right:6px;display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end}
.bd{background:rgba(0,0,0,.72);border-radius:4px;padding:1px 6px;font-size:10px;color:#ddd}
.bd.g{color:var(--gold);border:1px solid rgba(201,169,110,.35)}
.bd.c{background:rgba(201,169,110,.92);color:#000;font-weight:600}
.bd.pin{background:var(--gold);color:#000;font-weight:700}
.num{position:absolute;top:6px;right:6px;background:var(--gold);color:#000;font-weight:800;border-radius:999px;min-width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:12px;padding:0 6px}
.ov{position:absolute;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;font-size:12px;text-align:center;padding:10px}
.ov.err{background:rgba(70,10,10,.78);color:#fecaca}
.body{padding:10px 12px;display:flex;flex-direction:column;gap:8px;flex:1}
.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.nm{font-size:11px;color:#999;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;padding-top:3px}
.score{font-family:ui-monospace,monospace;font-weight:700;font-size:18px;color:#fff;border-radius:6px;padding:0 8px}
.score.h{background:var(--ok)}.score.m{background:var(--warn)}.score.l{background:var(--bad)}
.flaws{display:flex;flex-wrap:wrap;gap:4px}
.flaws span{font-size:10px;background:#3a1a1a;color:#fca5a5;border-radius:4px;padding:1px 6px}
.crit{margin-top:auto;border-top:1px solid #222;padding-top:8px}
.crit div{display:flex;align-items:center;gap:6px;font-size:10px;color:#999;margin-bottom:3px}
.crit em{font-style:normal;width:64px}
.crit .b{flex:1;height:4px;background:#222;border-radius:2px;overflow:hidden}
.crit .b i{display:block;height:100%}
.acts{display:flex;justify-content:flex-end;gap:6px;flex-wrap:wrap}
.acts .btn{font-size:10px;padding:4px 8px}
#fab{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(15,15,15,.97);border-top:1px solid #222;padding:10px 16px;display:none;align-items:center;gap:12px}
#fab .names{flex:1;font-size:11px;color:#777;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:100;display:none;align-items:center;justify-content:center;padding:16px}
.modal.on{display:flex}
.modal .box{background:var(--panel);border:1px solid #333;border-radius:12px;padding:20px;max-width:480px;width:100%;max-height:90vh;overflow:auto}
.modal h3{margin:0 0 10px;font-size:16px}
.modal p,.modal label{font-size:12px;line-height:1.7;color:#bbb}
.modal label{display:block;margin-top:10px}
.modal input[type=number]{width:100%;margin-top:4px}
.modal .row{justify-content:flex-end;margin-top:16px}
.note{font-size:11px;color:#888;line-height:1.6}
</style>
</head>
<body>
<header>
  <div>
    <small>PHOTO CURATOR（外部通信なし）</small>
    <h1>写真セレクター</h1>
  </div>
  <div class="row">
    <span id="stat" style="font-size:12px;color:#aaa"></span>
    <button class="btn gold" id="btnPick" style="display:none">おすすめを自動選定</button>
    <select id="pickCount" style="display:none" title="掲載枠数（横写真=1枠、縦写真=0.5枠）"></select>
    <button class="btn" id="btnAdd">写真を追加</button>
    <button class="btn" id="btnFolder">フォルダ読込</button>
    <button class="btn" id="btnSettings">設定</button>
    <button class="btn danger" id="btnClear" style="display:none">全データ消去</button>
  </div>
</header>

<div id="progress">
  <div class="t"><span id="pgText"></span><span id="pgPct"></span></div>
  <div class="bar"><i id="pgBar"></i></div>
</div>

<main>
  <div id="drop"><b>画像ファイルをここにドロップ</b>またはクリックして選択（複数可・JPEG / PNG / WebP）<br>写真はこのパソコンの中だけで処理され、外部へは送信されません</div>
  <div id="notice" style="display:none"></div>
  <div id="summary"></div>
  <div class="toolbar" id="toolbar" style="display:none">
    <div class="row" id="filters"></div>
    <div class="row" id="sorts"></div>
  </div>
  <div id="grid"></div>
</main>

<div id="fab">
  <b style="color:var(--gold);white-space:nowrap" id="fabCount"></b>
  <div class="names" id="fabNames"></div>
  <button class="btn gold" id="btnZip">選択した画像をZIPで保存</button>
</div>

<div class="modal" id="mSettings"><div class="box">
  <h3>設定</h3>
  <label>保存サイズ（横px × 縦px）
    <div class="row" style="flex-wrap:nowrap;justify-content:flex-start"><input type="number" id="sW" min="100" max="6000"><input type="number" id="sH" min="100" max="6000"></div>
  </label>
  <label><input type="checkbox" id="sHalf"> 縦写真は幅を半分にして保存する（横幅の半分×同じ高さ。縦2枚で1枠分になります）</label>
  <div class="row"><button class="btn" id="sCancel">閉じる</button><button class="btn gold" id="sSave">保存</button></div>
</div></div>

<div class="modal" id="mConfirm"><div class="box">
  <h3 style="color:#f87171">データを完全に消去しますか？</h3>
  <p>ブラウザに保存されている画像データと解析結果をすべて削除します。取り消せません。</p>
  <div class="row"><button class="btn" id="cNo">キャンセル</button><button class="btn danger" id="cYes">完全に消去する</button></div>
</div></div>

<div class="modal" id="mError"><div class="box">
  <h3 style="color:#f87171">エラー</h3>
  <p id="errText" style="white-space:pre-wrap;color:#ddd"></p>
  <div class="row"><button class="btn" id="eClose">閉じる</button></div>
</div></div>

<input type="file" id="fileIn" multiple accept="image/jpeg,image/png,image/webp" hidden>
<input type="file" id="folderIn" multiple webkitdirectory hidden>

<script>
"use strict";
// ==========================================================
// 定数（このページは外部サーバーと一切通信しません）
// ==========================================================
const TONES = ["青系（海・空）","緑系（自然）","暖色系（夕景・街）","白系（明るい室内・教会等）","暗め（夜景・室内）","その他"];
const SHOT_LABEL = {wide:"引き",medium:"標準","close-up":"寄り"};
const PARTS = [
  {key:"sharp",label:"ピント",w:3},{key:"focus",label:"被写体のピント",w:0.5},{key:"expo",label:"明るさ",w:2},
  {key:"contrast",label:"コントラスト",w:1},{key:"color",label:"色の鮮やかさ",w:1},{key:"person",label:"人物(推定)",w:2},{key:"res",label:"解像度",w:0.5}
];
const AI_EDGE = 192;
const DEFAULTS = {w:900,h:600,half:true};

const mem = {};
const ls = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return mem[k]??null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){ mem[k]=v; } }
};
let settings = Object.assign({}, DEFAULTS);
try{ Object.assign(settings, JSON.parse(ls.get("curator2.settings")||"{}")); }catch(e){}

// ==========================================================
// 保存（IndexedDB。使えない環境では今回の作業中のみ保持）
// ==========================================================
const DB_NAME="PhotoCurator3", STORE="photos";
let dbP=null;
function db(){
  if(!dbP) dbP=new Promise((res,rej)=>{
    try{
      const r=indexedDB.open(DB_NAME,1);
      r.onupgradeneeded=()=>{ r.result.createObjectStore(STORE,{keyPath:"id"}); };
      r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
    }catch(e){ rej(e); }
  });
  return dbP;
}
const SAVE_KEYS=["id","fp","name","file","thumb","status","errorMsg","local","orientation","w","h","selected","pin","ng"];
async function dbPut(p){
  try{
    const d=await db(); const o={}; for(const k of SAVE_KEYS) o[k]=p[k];
    await new Promise((res,rej)=>{ const t=d.transaction(STORE,"readwrite"); t.objectStore(STORE).put(o); t.oncomplete=res; t.onerror=()=>rej(t.error); });
  }catch(e){}
}
async function dbAll(){
  try{ const d=await db(); return await new Promise((res,rej)=>{ const r=d.transaction(STORE).objectStore(STORE).getAll(); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
  catch(e){ return []; }
}
async function dbClear(){
  try{ const d=await db(); await new Promise((res,rej)=>{ const t=d.transaction(STORE,"readwrite"); t.objectStore(STORE).clear(); t.oncomplete=res; t.onerror=()=>rej(t.error); }); }catch(e){}
}

// ==========================================================
// 画像解析（すべてブラウザ内）
// ==========================================================
async function decode(file){
  if(window.createImageBitmap){ try{ return await createImageBitmap(file); }catch(e){} }
  const url=URL.createObjectURL(file);
  try{
    return await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>rej(new Error("画像を読み込めません")); i.src=url; });
  } finally { URL.revokeObjectURL(url); }
}
const bw=(s)=>s.width||s.naturalWidth, bh=(s)=>s.height||s.naturalHeight;
function canvasOf(src,edge){
  const w0=bw(src),h0=bh(src),k=Math.min(1,edge/Math.max(w0,h0));
  const c=document.createElement("canvas"); c.width=Math.max(1,Math.round(w0*k)); c.height=Math.max(1,Math.round(h0*k));
  c.getContext("2d").drawImage(src,0,0,c.width,c.height);
  return c;
}
const toBlob=(c,q)=>new Promise(r=>c.toBlob(r,"image/jpeg",q));

function localMetrics(src){
  const c=canvasOf(src,256), W=c.width, H=c.height;
  const d=c.getContext("2d").getImageData(0,0,W,H).data, n=W*H;
  const g=new Float32Array(n), hist=new Float32Array(64);
  let lum=0,lum2=0,dark=0,bright=0,sat=0,rg=0,rg2=0,yb=0,yb2=0,skin=0,skinC=0,cn=0,blue=0,green=0,warm=0;
  const x0=W*0.25,x1=W*0.75,y0=H*0.25,y1=H*0.75;
  for(let i=0;i<n;i++){
    const r=d[i*4],gg=d[i*4+1],b=d[i*4+2], y=0.299*r+0.587*gg+0.114*b;
    g[i]=y; lum+=y; lum2+=y*y; if(y<35)dark++; if(y>238)bright++;
    const mx=Math.max(r,gg,b), mn=Math.min(r,gg,b); sat+=mx?(mx-mn)/mx:0;
    hist[(r>>6)*16+(gg>>6)*4+(b>>6)]++;
    const a=r-gg, bb=0.5*(r+gg)-b; rg+=a; rg2+=a*a; yb+=bb; yb2+=bb*bb;
    const isSkin=r>95&&gg>40&&b>20&&mx-mn>15&&Math.abs(r-gg)>15&&r>gg&&r>b&&y>60;
    const px=i%W, py=(i/W)|0, inC=px>=x0&&px<x1&&py>=y0&&py<y1;
    if(inC) cn++;
    if(isSkin){ skin++; if(inC) skinC++; }
    if(b>r+15&&b>gg-5) blue++; else if(gg>r+10&&gg>b+10) green++; else if(r>b+25&&r>=gg) warm++;
  }
  const mean=lum/n, sd=Math.sqrt(Math.max(0,lum2/n-mean*mean));
  const mRg=rg/n, mYb=yb/n;
  const colorfulness=Math.sqrt(Math.max(0,rg2/n-mRg*mRg)+Math.max(0,yb2/n-mYb*mYb))+0.3*Math.sqrt(mRg*mRg+mYb*mYb);
  // ピント: 8x8マスごとのラプラシアン平均。全体は上位10%マス、中央/周辺は各領域の上位マス
  const T=8, tw=Math.ceil(W/T), th=Math.ceil(H/T), tile=new Float32Array(tw*th), cnt=new Float32Array(tw*th);
  for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){
    const i=y*W+x, l=Math.abs(4*g[i]-g[i-1]-g[i+1]-g[i-W]-g[i+W]), t=((y/T)|0)*tw+((x/T)|0);
    tile[t]+=l; cnt[t]++;
  }
  const all=[],ctr=[],edg=[];
  for(let ty=0;ty<th;ty++)for(let tx=0;tx<tw;tx++){
    const t=ty*tw+tx; if(!cnt[t]) continue; const v=tile[t]/cnt[t]; all.push(v);
    (tx>=tw*0.25&&tx<tw*0.75&&ty>=th*0.25&&ty<th*0.75?ctr:edg).push(v);
  }
  const topMean=(arr,f)=>{ if(!arr.length) return 0; const s=[...arr].sort((a,b)=>b-a).slice(0,Math.max(1,Math.ceil(arr.length*f))); return s.reduce((a,b)=>a+b,0)/s.length; };
  for(let i=0;i<64;i++) hist[i]/=n;
  const h=document.createElement("canvas"); h.width=9; h.height=8;
  h.getContext("2d").drawImage(c,0,0,9,8);
  const hd=h.getContext("2d").getImageData(0,0,9,8).data; let bits="";
  const gy=(x,y)=>0.299*hd[(y*9+x)*4]+0.587*hd[(y*9+x)*4+1]+0.114*hd[(y*9+x)*4+2];
  for(let y=0;y<8;y++)for(let x=0;x<8;x++) bits+=gy(x,y)>gy(x+1,y)?"1":"0";
  return {sharp:+topMean(all,0.1).toFixed(2), center:+topMean(ctr,0.3).toFixed(2), edge:+topMean(edg,0.3).toFixed(2),
    lum:mean, sd, dark:dark/n, bright:bright/n, sat:sat/n, cf:colorfulness, skin:skin/n, skinC:cn?skinC/cn:0,
    blue:blue/n, green:green/n, warm:warm/n, hash:bits, hist:Array.from(hist,v=>+v.toFixed(4))};
}
const hamming=(a,b)=>{let d=0;for(let i=0;i<a.length;i++) if(a[i]!==b[i]) d++;return d;};
const cosine=(a,b)=>{let s=0,x=0,y=0;for(let i=0;i<a.length;i++){s+=a[i]*b[i];x+=a[i]*a[i];y+=b[i]*b[i];}return s/(Math.sqrt(x*y)||1);};

async function prepare(p){
  const src=await decode(p.file);
  try{
    p.w=bw(src); p.h=bh(src);
    p.orientation=p.h>p.w?"portrait":"landscape";
    p.thumb=await toBlob(canvasOf(src,480),0.75);
    p.local=localMetrics(src);
  } finally { if(src.close) src.close(); }
}

function coverBlob(file,W,H){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file), i=new Image();
    i.onload=()=>{
      URL.revokeObjectURL(url);
      const c=document.createElement("canvas"); c.width=W; c.height=H;
      const x=c.getContext("2d"); x.imageSmoothingQuality="high";
      const sr=i.width/i.height, dr=W/H; let sx=0,sy=0,sw=i.width,sh=i.height;
      if(sr>dr){ sw=i.height*dr; sx=(i.width-sw)/2; } else { sh=i.width/dr; sy=(i.height-sh)/2; }
      x.drawImage(i,sx,sy,sw,sh,0,0,W,H);
      c.toBlob(b=>b?res(b):rej(new Error("変換失敗")),"image/jpeg",0.92);
    };
    i.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error("画像を読み込めません")); };
    i.src=url;
  });
}
function outSize(p){
  const W=+settings.w||900,H=+settings.h||600;
  return p.orientation==="portrait"&&settings.half?[Math.round(W/2),H]:[W,H];
}

// ---- 依存なしの簡易ZIP作成（JPEGは圧縮済みのため無圧縮格納） ----
const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(u){let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=CRC_T[(c^u[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
async function makeZip(files){
  const enc=new TextEncoder(), parts=[], cen=[]; let off=0;
  const now=new Date(), dt=((now.getHours()<<11)|(now.getMinutes()<<5)|(now.getSeconds()>>1)), dd=(((now.getFullYear()-1980)<<9)|((now.getMonth()+1)<<5)|now.getDate());
  for(const f of files){
    const data=new Uint8Array(await f.blob.arrayBuffer()), nm=enc.encode(f.name), crc=crc32(data);
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,0,true);
    lh.setUint16(10,dt,true);lh.setUint16(12,dd,true);lh.setUint32(14,crc,true);lh.setUint32(18,data.length,true);lh.setUint32(22,data.length,true);lh.setUint16(26,nm.length,true);lh.setUint16(28,0,true);
    parts.push(lh.buffer,nm,data);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(10,0,true);
    ch.setUint16(12,dt,true);ch.setUint16(14,dd,true);ch.setUint32(16,crc,true);ch.setUint32(20,data.length,true);ch.setUint32(24,data.length,true);ch.setUint16(28,nm.length,true);ch.setUint32(42,off,true);
    cen.push(ch.buffer,nm);
    off+=30+nm.length+data.length;
  }
  let cs=0; for(const b of cen) cs+=b.byteLength;
  const end=new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true);end.setUint16(8,files.length,true);end.setUint16(10,files.length,true);end.setUint32(12,cs,true);end.setUint32(16,off,true);
  return new Blob([...parts,...cen,end.buffer],{type:"application/zip"});
}
function saveBlob(blob,name){
  const url=URL.createObjectURL(blob), a=document.createElement("a");
  a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),10000);
}

// ==========================================================
// スコア計算・選定ロジック（ブラウザ内・即時）
// ==========================================================
const collator=new Intl.Collator("ja",{numeric:true});
const byName=(a,b)=>collator.compare(a.name,b.name);
const clamp01=(x)=>Math.max(0,Math.min(1,x));

function toneOf(L){
  if(L.lum<60) return TONES[4];
  if(L.blue>=0.3&&L.blue>=L.green&&L.blue>=L.warm) return TONES[0];
  if(L.green>=0.3&&L.green>=L.warm) return TONES[1];
  if(L.warm>=0.35) return TONES[2];
  if(L.lum>165&&L.sat<0.22) return TONES[3];
  return TONES[5];
}
function shotOf(L){ return L.skin>=0.18?"close-up":L.skin>=0.05?"medium":"wide"; }

function computeScores(){
  const done=state.photos.filter(p=>p.status==="done"&&p.local);
  const sharps=done.map(p=>p.local.sharp).sort((a,b)=>a-b);
  for(const p of done){
    const L=p.local, parts={};
    let lt=0,eq=0; for(const v of sharps){ if(v<L.sharp) lt++; else if(v===L.sharp) eq++; }
    const pct=sharps.length>1?(lt+(eq-1)/2)/(sharps.length-1):0.5;
    parts.sharp=pct;
    parts.focus=L.edge>0?clamp01((L.center/L.edge)/1.5):0.5;
    const dev=L.lum<100?(100-L.lum)/100:L.lum>185?(L.lum-185)/70:0;
    parts.expo=clamp01(1-dev*1.2-Math.max(0,L.dark-0.25)*1.5-Math.max(0,L.bright-0.15)*2);
    parts.contrast=L.sd<35?clamp01(L.sd/35):clamp01(1-(L.sd-70)/60);
    const mono=L.sat<0.05;
    parts.color=mono?0.6:clamp01(L.cf/45);
    parts.person=clamp01((L.skinC-0.02)/0.10);
    parts.res=clamp01(Math.max(p.w,p.h)/1800);
    let s=0; for(const k of PARTS) s+=parts[k.key]*k.w;
    const flaws=[];
    if(sharps.length>=8&&pct<0.15) flaws.push("ピンぼけの疑い");
    if(L.lum<60||L.dark>0.5) flaws.push("暗い");
    if(L.bright>0.3) flaws.push("白飛び");
    if(Math.max(p.w,p.h)<1200) flaws.push("解像度が低い");
    if(flaws.includes("ピンぼけの疑い")) s-=2;
    if(flaws.includes("暗い")) s-=2;
    if(flaws.includes("白飛び")) s-=1;
    s=Math.max(0,s);
    p.q={score:+s.toFixed(1),parts,flaws,mono,tone:toneOf(L),shot:shotOf(L),hard:flaws.includes("ピンぼけの疑い")||flaws.includes("暗い")};
  }
  // 推奨: 上位40%かつ重大な欠点なし
  const ranked=done.filter(p=>!p.q.hard).sort((a,b)=>b.q.score-a.q.score);
  done.forEach(p=>{p.q.rec=false;});
  const cut=Math.ceil(ranked.length*0.4);
  ranked.forEach((p,i)=>{ p.q.rec=i<cut; });
}

// 枠数(横=1,縦=0.5)に合わせて、品質・多様性・撮影順の均等配分を同時に満たす写真を選ぶ
function selectPhotos(slots){
  const done=state.photos.filter(p=>p.status==="done"&&p.q);
  const ordered=[...done].sort(byName); const idx=new Map(ordered.map((p,i)=>[p.id,i]));
  const N=ordered.length; if(!N) return null;
  const cost=(p)=>p.orientation==="portrait"?0.5:1;
  const capacity=(arr)=>arr.reduce((s,p)=>s+cost(p),0);
  const notes=[];

  const pins=done.filter(p=>p.pin&&!p.ng);
  const usable=done.filter(p=>!p.ng&&!p.pin);
  let pool=usable.filter(p=>!p.q.hard);
  const kept=[], dups=[];
  for(const p of [...pool].sort((a,b)=>b.q.score-a.q.score)){
    (kept.some(k=>hamming(k.local.hash,p.local.hash)<=10)||pins.some(k=>hamming(k.local.hash,p.local.hash)<=10)?dups:kept).push(p);
  }
  pool=kept;
  if(capacity(pool)+capacity(pins)<slots) pool=pool.concat(dups.sort((a,b)=>b.q.score-a.q.score));
  if(capacity(pool)+capacity(pins)<slots) pool=pool.concat(usable.filter(p=>p.q.hard));
  if(capacity(pool)+capacity(pins)<slots) notes.push(`使える写真が少なく、${slots}枠を満たせません（候補は合計${capacity(pool)+capacity(pins)}枠分）。`);

  const sel=[]; let used=0, mono=0;
  const spacing=Math.max(1,N/Math.max(1,slots*0.9));
  const chosen=new Set();
  const value=(c)=>{
    let v=c.q.score;
    if(sel.length){
      let dmin=1e9, near=false, catN=0, shotN=0, cosMax=0, adjSame=false;
      for(const s of sel){
        const d=Math.abs(idx.get(s.id)-idx.get(c.id)); if(d<dmin) dmin=d;
        if(hamming(s.local.hash,c.local.hash)<=10) near=true;
        if(s.q.tone===c.q.tone){ catN++; if(d<=spacing*0.6) adjSame=true; }
        if(s.q.shot===c.q.shot) shotN++;
        const cs=cosine(s.local.hist,c.local.hist); if(cs>cosMax) cosMax=cs;
      }
      v+=1.6*Math.min(1,dmin/spacing);
      v-=near?6:0;
      v-=2.0*(catN/sel.length);
      v-=1.2*(shotN/sel.length);
      v-=cosMax>0.93?1.5:0;
      v-=adjSame?1.5:0;
    }
    return v;
  };
  const pick=(c)=>{ sel.push(c); chosen.add(c.id); used+=cost(c); if(c.q.mono) mono++; };
  for(const p of pins){ if(used+cost(p)<=slots+1e-9) pick(p); else notes.push(`「必ず採用」の写真が多く、${p.name} は枠に入りませんでした。`); }
  for(;;){
    const slack=slots-used; if(slack<=0) break;
    let best=null,bv=-1e9;
    for(const c of pool){
      if(chosen.has(c.id)||cost(c)>slack) continue;
      if(c.q.mono&&mono>=2) continue;
      const v=value(c); if(v>bv){bv=v;best=c;}
    }
    if(!best) break;
    pick(best);
  }
  if(slots-used===0.5){
    const add=pool.filter(c=>!chosen.has(c.id)&&cost(c)===0.5&&!(c.q.mono&&mono>=2)).sort((a,b)=>value(b)-value(a))[0];
    if(add) pick(add);
    else{
      const ports=sel.filter(p=>cost(p)===0.5&&!p.pin).sort((a,b)=>a.q.score-b.q.score);
      if(ports.length){
        const rm=ports[0]; sel.splice(sel.indexOf(rm),1); chosen.delete(rm.id); used-=0.5; if(rm.q.mono) mono--;
        const l=pool.filter(c=>!chosen.has(c.id)&&cost(c)===1).sort((a,b)=>value(b)-value(a))[0];
        if(l) pick(l);
      }
    }
  }
  if(Math.abs(slots-used)>1e-6) notes.push(`枠数が${used}/${slots}になりました（縦横の組み合わせ上、ぴったり埋められませんでした）。`);
  sel.sort(byName);
  const tally=(f)=>{const m={};sel.forEach(p=>{const k=f(p);m[k]=(m[k]||0)+1;});return m;};
  return {sel,used,notes,tone:tally(p=>p.q.tone),shot:tally(p=>SHOT_LABEL[p.q.shot]),mono,
          dupRemoved:dups.length,hardRemoved:usable.filter(p=>p.q.hard).length,ngN:done.filter(p=>p.ng).length,pinN:pins.length,total:N,
          adjacent:sel.slice(1).filter((p,i)=>p.q.tone===sel[i].q.tone).length};
}

// ==========================================================
// アプリ状態・描画
// ==========================================================
const state={photos:[],filter:"all",sort:"score",pick:16,run:{on:false,total:0,finished:0,start:0}};
const $=(s)=>document.querySelector(s);
const cards=new Map(), urls=new Map();
const urlOf=(p)=>{ if(!p.thumb) return ""; let u=urls.get(p.id); if(!u){u=URL.createObjectURL(p.thumb);urls.set(p.id,u);} return u; };
function el(tag,cls,text){const e=document.createElement(tag); if(cls)e.className=cls; if(text!==undefined)e.textContent=text; return e;}
const uid=()=>crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now().toString(36);
function showError(msg){ $("#errText").textContent=msg; $("#mError").classList.add("on"); }
let raf=0; const schedule=()=>{ if(!raf) raf=requestAnimationFrame(()=>{raf=0;renderAll();}); };
let selInfo=null;

function buildCard(p){
  let c=cards.get(p.id); if(!c){ c=el("div","card"); c.addEventListener("click",()=>{ if(p.status==="done") toggle(p.id); }); cards.set(p.id,c); }
  const done=p.status==="done"&&p.q;
  c.className="card"+(done&&p.q.rec?" rec":"")+(p.selected?" sel":"")+(p.ng?" ng":"");
  c.textContent="";
  const im=el("div","im"); const img=el("img"); img.loading="lazy"; img.alt=p.name; img.src=urlOf(p); im.appendChild(img);
  if(done){
    const b=el("div","badges");
    if(p.pin) b.append(el("span","bd pin","必ず採用"));
    b.append(el("span","bd g",p.orientation==="portrait"?"縦":"横"), el("span","bd",SHOT_LABEL[p.q.shot]+"(推定)"));
    if(p.q.mono) b.append(el("span","bd","モノクロ"));
    b.append(el("span","bd c",p.q.tone)); im.appendChild(b);
    const rank=selInfo?.rank.get(p.id);
    if(p.selected) im.appendChild(el("div","num",rank?String(rank):"✓"));
  } else if(p.status==="error"){
    const o=el("div","ov err"); o.textContent="解析失敗: "+(p.errorMsg||"").slice(0,80); im.appendChild(o);
  } else { const o=el("div","ov"); o.textContent="解析中…"; im.appendChild(o); }
  c.appendChild(im);
  const body=el("div","body"), top=el("div","top"); const nm=el("div","nm",p.name); nm.title=p.name; top.appendChild(nm);
  if(done){ const s=p.q.score; top.appendChild(el("div","score "+(s>=7?"h":s>=5?"m":"l"),s.toFixed(1))); }
  body.appendChild(top);
  if(done){
    if(p.q.flaws.length){ const f=el("div","flaws"); p.q.flaws.forEach(k=>f.appendChild(el("span",null,k))); body.appendChild(f); }
    const cr=el("div","crit");
    for(const k of PARTS){
      const v=p.q.parts[k.key], row=el("div"), bar=el("div","b"), i=el("i");
      i.style.width=Math.round(v*100)+"%"; i.style.background=v>=0.7?"var(--ok)":v>=0.4?"var(--warn)":"var(--bad)"; bar.appendChild(i);
      row.append(el("em",null,k.label),bar); cr.appendChild(row);
    }
    body.appendChild(cr);
    const acts=el("div","acts");
    const pin=el("button","btn"+(p.pin?" on":""),"★必ず採用"); pin.onclick=(e)=>{e.stopPropagation();p.pin=!p.pin;if(p.pin)p.ng=false;dbPut(p);schedule();};
    const ng=el("button","btn ng"+(p.ng?" on":""),"✕使わない"); ng.onclick=(e)=>{e.stopPropagation();p.ng=!p.ng;if(p.ng){p.pin=false;p.selected=false;}dbPut(p);schedule();};
    const dl=el("button","btn","個別保存"); dl.onclick=(e)=>{e.stopPropagation();downloadOne(p);};
    acts.append(pin,ng,dl); body.appendChild(acts);
  }
  c.appendChild(body);
  return c;
}

function visiblePhotos(){
  const list=[...state.photos];
  list.sort((a,b)=>{
    if(state.sort==="name") return byName(a,b);
    const sa=a.q?.score??-1, sb=b.q?.score??-1; return sb-sa;
  });
  return list.filter(p=>{
    if(state.filter==="rec") return p.q?.rec;
    if(state.filter==="sel") return p.selected;
    if(state.filter==="ex") return p.status==="done"&&!p.q?.rec;
    return true;
  });
}

function renderAll(){
  computeScores();
  const P=state.photos, has=P.length>0;
  $("#drop").style.display=has?"none":"block";
  $("#toolbar").style.display=has?"flex":"none";
  for(const id of ["#btnPick","#pickCount","#btnClear"]) $(id).style.display=has?"":"none";
  const nDone=P.filter(p=>p.status==="done").length, nSel=P.filter(p=>p.selected).length;
  $("#btnPick").disabled=state.run.on||nDone===0;
  $("#btnPick").textContent=`おすすめを自動選定（${state.pick}枠）`;
  $("#stat").textContent=has?`解析完了 ${nDone}/${P.length}枚 ／ 選択中 ${nSel}枚`:"";
  const nt=$("#notice");
  if(has&&nDone){ nt.style.display="block"; nt.textContent="※ この版はAIを使わず、ピント・明るさ・コントラスト・色・人物の写り（肌色の面積からの推定）・類似度だけで自動判定します。表情や目つぶり、構図の良し悪しは判定できません。最終確認は目視で行い、「★必ず採用」「✕使わない」で調整してください。背景の分類（色調）と寄り引きは色からの推定で、誤ることがあります。"; }
  else nt.style.display="none";
  const F=[["all",`すべて (${P.length})`],["rec",`推奨 (${P.filter(p=>p.q?.rec).length})`],["sel",`選択中 (${nSel})`],["ex",`非推奨 (${P.filter(p=>p.status==="done"&&!p.q?.rec).length})`]];
  $("#filters").replaceChildren(...F.map(([k,l])=>{const b=el("button","chip"+(state.filter===k?" on":""),l);b.onclick=()=>{state.filter=k;renderAll();};return b;}));
  $("#sorts").replaceChildren(el("span","note","並び替え:"),...[["score","点数順"],["name","ファイル名順"]].map(([k,l])=>{const b=el("button","chip"+(state.sort===k?" on":""),l);b.onclick=()=>{state.sort=k;renderAll();};return b;}));
  const vis=visiblePhotos();
  $("#grid").replaceChildren(...vis.map(buildCard));
  if(!vis.length&&has) $("#grid").appendChild(el("div","note","表示できる画像がありません。"));
  $("#fab").style.display=nSel?"flex":"none";
  $("#fabCount").textContent=`${nSel}枚選択中`;
  $("#fabNames").textContent=P.filter(p=>p.selected).sort(byName).map(p=>p.name).join(" / ");
  const r=state.run;
  $("#progress").style.display=r.on?"block":"none";
  if(r.on){
    const pct=r.total?Math.round(r.finished/r.total*100):0;
    $("#pgText").textContent=`画像を解析しています（${r.finished}/${r.total}枚）`;
    $("#pgPct").textContent=pct+"%"; $("#pgBar").style.width=pct+"%";
  }
  const sm=$("#summary");
  if(selInfo&&nSel){
    const s=selInfo, kv=(o)=>Object.entries(o).map(([k,v])=>`${k} ${v}枚`).join(" / ");
    sm.style.display="block"; sm.textContent="";
    const add=(html,text)=>{const d=el("div"); if(html){const b=el("b",null,html); d.appendChild(b);} d.appendChild(document.createTextNode(text)); sm.appendChild(d);};
    add("自動選定の結果","："+`${s.sel.length}枚（${s.used}枠）を撮影順（ファイル名順）に並べました。番号がその順序です。`);
    add(null,"色調："+kv(s.tone)); add(null,"寄り引き（推定）："+kv(s.shot)+(s.mono?` ／ モノクロ ${s.mono}枚`:""));
    add(null,`除外：ほぼ同じ写真 ${s.dupRemoved}枚、ピンぼけ疑い・暗い写真 ${s.hardRemoved}枚、「使わない」${s.ngN}枚（候補全${s.total}枚中）／ 「必ず採用」${s.pinN}枚`);
    if(s.adjacent) add(null,`前後で同じ色調になっている箇所が ${s.adjacent} か所あります。`);
    s.notes.forEach(n=>add(null,"※ "+n));
  } else sm.style.display="none";
}

function toggle(id){
  const p=state.photos.find(x=>x.id===id); if(!p) return;
  p.selected=!p.selected; if(p.selected) p.ng=false; dbPut(p); if(selInfo) selInfo.rank.delete(id); schedule();
}

// ==========================================================
// 取り込みと解析
// ==========================================================
async function handleFiles(fileList){
  const files=Array.from(fileList).filter(f=>/^image\/(jpeg|png|webp)$/.test(f.type));
  if(!files.length) return;
  const known=new Set(state.photos.map(p=>p.fp));
  const fresh=[];
  for(const f of files){
    const fp=`${f.name}|${f.size}|${f.lastModified}`;
    if(known.has(fp)) continue; known.add(fp);
    fresh.push({id:uid(),fp,name:f.name,file:f,thumb:null,status:"pending",errorMsg:"",local:null,orientation:null,w:0,h:0,selected:false,pin:false,ng:false});
  }
  if(!fresh.length){ showError("同じ写真は追加済みです。"); return; }
  state.photos.push(...fresh);
  const r=state.run;
  if(r.on){ r.queue.push(...fresh); r.total+=fresh.length; schedule(); return; }
  Object.assign(r,{on:true,total:fresh.length,finished:0,start:Date.now(),queue:[...fresh]});
  schedule();
  const worker=async()=>{
    while(r.queue.length){
      const p=r.queue.shift();
      try{ await prepare(p); p.status="done"; }
      catch(e){ p.status="error"; p.errorMsg=e.message||"読み込みに失敗"; }
      await dbPut(p);
      r.finished++; schedule();
    }
  };
  await Promise.all(Array.from({length:Math.min(3,fresh.length)},worker));
  r.on=false; schedule();
}

// ==========================================================
// 保存
// ==========================================================
async function downloadOne(p){
  try{ const [W,H]=outSize(p); saveBlob(await coverBlob(p.file,W,H),p.name.replace(/\.[^.]+$/,"")+"_resized.jpg"); }
  catch(e){ showError("画像の個別保存に失敗しました。"); }
}
async function downloadZip(){
  const sel=state.photos.filter(p=>p.selected).sort(byName); if(!sel.length) return;
  const btn=$("#btnZip"); btn.disabled=true; btn.textContent="ZIP作成中…";
  try{
    const files=[];
    for(let i=0;i<sel.length;i++){
      const [W,H]=outSize(sel[i]);
      files.push({name:`${String(i+1).padStart(2,"0")}_${sel[i].name.replace(/\.[^.]+$/,"")}_resized.jpg`,blob:await coverBlob(sel[i].file,W,H)});
    }
    saveBlob(await makeZip(files),`wedding_photos_${new Date().toISOString().slice(0,10).replace(/-/g,"")}.zip`);
  }catch(e){ showError("ZIPの作成・保存に失敗しました。埋め込み環境で制限されている場合は「個別保存」をお使いください。"); }
  finally{ btn.disabled=false; btn.textContent="選択した画像をZIPで保存"; }
}

// ==========================================================
// イベント
// ==========================================================
function autoSelect(){
  computeScores();
  const res=selectPhotos(state.pick);
  if(!res){ showError("解析が完了した写真がありません。"); return; }
  const ids=new Set(res.sel.map(p=>p.id)); res.rank=new Map(res.sel.map((p,i)=>[p.id,i+1]));
  for(const p of state.photos){ const s=ids.has(p.id); if(p.selected!==s){p.selected=s;dbPut(p);} }
  selInfo=res; state.filter="sel"; state.sort="name"; renderAll();
}
const pc=$("#pickCount");
[4,6,8,10,12,16,20,24,30,40].forEach(n=>{const o=el("option",null,n+"枠");o.value=n;pc.appendChild(o);}); pc.value=16;
pc.onchange=()=>{state.pick=+pc.value;renderAll();};
$("#btnPick").onclick=autoSelect;
$("#btnAdd").onclick=()=>$("#fileIn").click();
$("#btnFolder").onclick=()=>$("#folderIn").click();
$("#fileIn").onchange=(e)=>{handleFiles(e.target.files);e.target.value="";};
$("#folderIn").onchange=(e)=>{handleFiles(e.target.files);e.target.value="";};
$("#btnZip").onclick=downloadZip;
const drop=$("#drop");
drop.onclick=()=>$("#fileIn").click();
["dragover","dragenter"].forEach(t=>document.addEventListener(t,e=>{e.preventDefault();drop.classList.add("over");}));
["dragleave","drop"].forEach(t=>document.addEventListener(t,e=>{e.preventDefault();drop.classList.remove("over");}));
document.addEventListener("drop",e=>{ if(e.dataTransfer?.files?.length) handleFiles(e.dataTransfer.files); });
$("#btnSettings").onclick=()=>{ $("#sW").value=settings.w; $("#sH").value=settings.h; $("#sHalf").checked=!!settings.half; $("#mSettings").classList.add("on"); };
$("#sCancel").onclick=()=>$("#mSettings").classList.remove("on");
$("#sSave").onclick=()=>{
  settings={w:+$("#sW").value||900,h:+$("#sH").value||600,half:$("#sHalf").checked};
  ls.set("curator2.settings",JSON.stringify(settings)); $("#mSettings").classList.remove("on");
};
$("#btnClear").onclick=()=>$("#mConfirm").classList.add("on");
$("#cNo").onclick=()=>$("#mConfirm").classList.remove("on");
$("#cYes").onclick=async()=>{
  await dbClear(); urls.forEach(u=>URL.revokeObjectURL(u)); urls.clear(); cards.clear();
  state.photos=[]; selInfo=null; state.filter="all"; $("#mConfirm").classList.remove("on"); renderAll();
};
$("#eClose").onclick=()=>$("#mError").classList.remove("on");

(async()=>{
  const saved=await dbAll();
  for(const s of saved){
    if(s.status==="pending"){ s.status="error"; s.errorMsg="再読み込みにより中断されました。写真を追加し直してください。"; dbPut(s); }
    state.photos.push(s);
  }
  renderAll();
})();
renderAll();
