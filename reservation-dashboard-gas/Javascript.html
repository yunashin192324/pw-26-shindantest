/**
 * 同じGoogleアカウントの行が複数ある場合（人事データCSVで所属変更を履歴として追加した場合など）、
 * ログイン時に実際に使われるのは一番下の行だけ（Code.gsのgetCurrentUserContext_）。
 * どの行が有効かを返す（メールアドレス（小文字）→ 有効な行のrowIndex）。
 */
function latestStaffRowIndexByEmail_(list) {
  var latest = {};
  list.forEach(function (s) { latest[String(s.email || '').trim().toLowerCase()] = s.rowIndex; });
  return latest;
}

function renderStaffList(list) {
  STATE.staffList = list || [];
  var tbody = document.getElementById('staff-tbody');
  document.getElementById('staff-empty').classList.toggle('hidden', STATE.staffList.length > 0);
  var latest = latestStaffRowIndexByEmail_(STATE.staffList);
  tbody.innerHTML = STATE.staffList.map(function (s) {
    // 有効でない（古い）行は「履歴」として薄く表示し、編集ボタンは出さない。古い行の権限を変更しても
    // ログイン時の判定には使われず、「変更したのに本人の権限が変わらない」状態になるため。
    var isHistory = latest[String(s.email || '').trim().toLowerCase()] !== s.rowIndex;
    var historyBadge = isHistory
      ? ' <span class="text-[10px] font-semibold text-slate-500 bg-slate-200 rounded px-1 py-0.5" title="同じアカウントのより新しい行があるため、この行はログイン時の判定に使われません（所属の履歴）">履歴（無効）</span>'
      : '';
    var editBtn = isHistory
      ? ''
      : '<button type="button" class="staff-edit text-blue-600 hover:underline text-xs mr-2" data-row="' + s.rowIndex + '">編集</button>';
    return '<tr' + (isHistory ? ' class="text-slate-400 bg-slate-50"' : '') + '>' +
      '<td class="px-3 py-2 font-mono text-xs">' + escapeHtml(s.email) + historyBadge + '</td>' +
      '<td class="px-3 py-2">' + escapeHtml(s.name) + '</td>' +
      '<td class="px-3 py-2">' + escapeHtml(s.office) + '</td>' +
      '<td class="px-3 py-2">' + escapeHtml(s.area) + '</td>' +
      '<td class="px-3 py-2">' + escapeHtml(s.role) + '</td>' +
      '<td class="px-3 py-2 text-right">' + editBtn +
      '<button type="button" class="staff-delete text-red-600 hover:underline text-xs" data-row="' + s.rowIndex + '">削除</button>' +
      '</td></tr>';
  }).join('');
}

/**
 * 権限の追加・変更・削除の後の共通処理。自分自身のマスタ権限を外した（別のマスタ権限の人がいる
 * 場合のみ可能）ときは、管理画面をそのまま使い続けられないため、画面を読み込み直す。
 */
function onStaffListChanged_(list) {
  renderStaffList(list);
  var me = STATE.userContext && STATE.userContext.email ? String(STATE.userContext.email).toLowerCase() : '';
  if (!me) return;
  var latest = latestStaffRowIndexByEmail_(STATE.staffList);
  var myRow = STATE.staffList.filter(function (s) { return s.rowIndex === latest[me]; })[0];
  if (!myRow || myRow.role !== 'マスタ権限') {
    showToast('あなた自身のマスタ権限が外れたため、画面を読み込み直します。', 'info');
    boot();
  }
}

/**
 * 照合できない所属名ごとに（同じ所属名の人はまとめて）、予約データ側のどの所属に当たるかを選んで
 * 「所属の対応表」に登録する欄を作る。候補（名前の近いもの）を先頭に並べ、その他の所属も選べるようにする。
 */
function aliasFormHtml_(problems, d) {
  var groups = {}, order = [];
  problems.forEach(function (s) {
    if (!s.kind || !s.aliasFrom) return;
    var key = s.kind + '|' + s.aliasFrom;
    if (!groups[key]) { groups[key] = { kind: s.kind, from: s.aliasFrom, count: 0, suggestions: s.suggestions || [], proposal: s.proposal || null }; order.push(key); }
    groups[key].count++;
  });
  var registeredHtml = (d.aliases || []).length
    ? '<details class="mt-1"><summary class="cursor-pointer text-slate-600">登録済みの対応（' + formatNumber(d.aliases.length) + '件）</summary>' +
      d.aliases.map(function (a) { return escapeHtml((a.kind === 'area' ? 'エリア：' : '店舗：') + a.from + ' ＝ ' + a.to + (a.note ? '　' + a.note : '')); }).join('<br>') + '</details>'
    : '';
  if (!order.length) return registeredHtml ? '<div class="mt-2 bg-white rounded-lg p-2">' + registeredHtml + '</div>' : '';
  order.sort(function (a, b) { return groups[b].count - groups[a].count; });
  var html = '<div class="mt-2 bg-white rounded-lg p-2"><p class="font-semibold text-indigo-800">予約データ側の所属と対応づける（同じ所属名の人はまとめて直ります）</p>' +
    '<p class="text-slate-500">自動では決めきれなかった所属名です。一番有力な候補を選んだ状態にしてあるので、右の理由を見て正しければそのまま、' +
    '違えば選び直してください（店舗ではない部署などは「（選んでください）」のままにします）。「選んだものをまとめて対応づける」で一度に登録できます。' +
    'シート「所属の対応表」に記録され、取り消す場合はそのシートの行を削除します。</p>' +
    '<div class="my-1"><button type="button" id="btn-alias-add-all" class="bg-indigo-700 hover:bg-indigo-800 text-white rounded px-3 py-1 font-semibold">選んだものをまとめて対応づける</button></div>' +
    '<div class="overflow-auto max-h-[40vh]"><table class="w-full"><tbody>';
  order.forEach(function (key, i) {
    var g = groups[key];
    var all = g.kind === 'area' ? (d.dataAreas || []) : (d.dataOffices || []);
    var sugg = g.suggestions.map(function (v) { return v.value; });
    if (g.proposal && g.proposal.to && sugg.indexOf(g.proposal.to) === -1) {
      g.suggestions = [{ value: g.proposal.to }].concat(g.suggestions);
      sugg.unshift(g.proposal.to);
    }
    var selectedValue = g.proposal && g.proposal.to ? g.proposal.to : '';
    var options = '<option value="">（選んでください）</option>' +
      (sugg.length ? '<optgroup label="候補">' + g.suggestions.map(function (v) {
        var why = v.share !== undefined ? '（この所属の人の担当予約の' + Math.round(v.share * 100) + '%）' : (v.value === selectedValue ? '' : '（名前が近い）');
        return '<option value="' + escapeHtml(v.value) + '"' + (v.value === selectedValue ? ' selected' : '') + '>' + escapeHtml(v.value) + why + '</option>';
      }).join('') + '</optgroup>' : '') +
      '<optgroup label="予約データにある' + (g.kind === 'area' ? 'エリア' : '営業所') + '">' +
      all.filter(function (v) { return sugg.indexOf(v.value) === -1; }).map(function (v) {
        return '<option value="' + escapeHtml(v.value) + '">' + escapeHtml(v.value) + '（' + formatNumber(v.count) + '件）</option>';
      }).join('') + '</optgroup>';
    html += '<tr class="border-t border-slate-100"><td class="px-2 py-1">' + (g.kind === 'area' ? 'エリア' : '店舗') + '</td>' +
      '<td class="px-2 py-1 font-semibold">' + escapeHtml(g.from) + '</td><td class="px-2 py-1 text-slate-500">' + formatNumber(g.count) + '人</td>' +
      '<td class="px-2 py-1">＝ <select class="alias-target border border-slate-300 rounded text-xs p-1 max-w-xs" data-index="' + i +
      '" data-kind="' + g.kind + '" data-from="' + escapeHtml(g.from) + '">' + options + '</select>' +
      (g.proposal && g.proposal.reason ? '<div class="text-slate-500">' + escapeHtml(g.proposal.auto ? '以前に自動で登録したものが削除されています。確認してください。' : g.proposal.reason) + '</div>' : '') + '</td>' +
      '<td class="px-2 py-1"><button type="button" class="alias-add bg-indigo-600 hover:bg-indigo-700 text-white rounded px-2 py-1" data-index="' + i +
      '" data-kind="' + g.kind + '" data-from="' + escapeHtml(g.from) + '">対応づける</button></td></tr>';
  });
  html += '</tbody></table></div>' + registeredHtml;
  return html + '</div>';
}

function onAliasAddClick_(e) {
  if (e.target.closest('#btn-alias-add-all')) { onAliasAddAll_(); return; }
  var btn = e.target.closest('.alias-add');
  if (!btn) return;
  var select = document.querySelector('#affiliation-diagnostics select.alias-target[data-index="' + btn.dataset.index + '"]');
  var to = select ? select.value : '';
  if (!to) { showToast('予約データ側の所属を選んでください。', 'error'); return; }
  var kindLabel = btn.dataset.kind === 'area' ? 'エリア' : '店舗';
  if (!window.confirm(kindLabel + '「' + btn.dataset.from + '」を、予約データの「' + to + '」と同じ' + kindLabel + 'として扱います。よろしいですか？')) return;
  btn.disabled = true;
  google.script.run
    .withSuccessHandler(function () { showToast('対応づけました。照合状況を確認し直します。', 'success'); loadAffiliationDiagnostics_(); })
    .withFailureHandler(function (err) { btn.disabled = false; onServerError(err); })
    .addAffiliationAlias(btn.dataset.kind, btn.dataset.from, to);
}

/** 照合状況の画面で、所属が選ばれている行をまとめて所属の対応表に登録する。 */
function onAliasAddAll_() {
  var items = Array.from(document.querySelectorAll('#affiliation-diagnostics select.alias-target'))
    .filter(function (sel) { return !!sel.value; })
    .map(function (sel) { return { kind: sel.dataset.kind, from: sel.dataset.from, to: sel.value }; });
  if (!items.length) { showToast('対応づける所属が選ばれていません。', 'error'); return; }
  var preview = items.slice(0, 15).map(function (it) { return '・' + it.from + ' ＝ ' + it.to; }).join('\n') + (items.length > 15 ? '\n…ほか' + (items.length - 15) + '件' : '');
  if (!window.confirm(items.length + '件をまとめて対応づけます。内容を確認してください。\n\n' + preview)) return;
  var btn = document.getElementById('btn-alias-add-all');
  if (btn) btn.disabled = true;
  google.script.run
    .withSuccessHandler(function (res) {
      showToast(formatNumber(res.added) + '件を対応づけました' + (res.errors.length ? '（' + res.errors.length + '件は登録できませんでした：' + res.errors[0].message + '）' : '') + '。照合状況を確認し直します。',
        res.errors.length ? 'error' : 'success');
      loadAffiliationDiagnostics_();
    })
    .withFailureHandler(function (err) { if (btn) btn.disabled = false; onServerError(err); })
    .addAffiliationAliases(items);
}

/** 所属の照合状況（各アカウントに何件の予約が見えるか・表記が紛らわしい所属名）を表示する。 */

  }

  if (amb.length) {

}

  document.getElementById('btn-affiliation-diagnostics').addEventListener('click', loadAffiliationDiagnostics_);

    if (delBtn) {
      if (!window.confirm('このアカウントを削除しますか？')) return;
      var delRow = Number(delBtn.dataset.row);

        .deleteStaffAccess(delRow, delTarget ? delTarget.email : null);

  document.getElementById('staff-form').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var rowIndex = document.getElementById('staff-form-rowindex').value;

    var name = document.getElementById('staff-form-name').value.trim();

      : google.script.run.withSuccessHandler(onStaffSaved).withFailureHandler(onServerError).addStaffAccess(email, name, office, area, role);

// ============================================================================
// CSVファイルの文字コード自動判定（UTF-8 / Shift_JIS 両対応）
// ============================================================================

/**
 * CSVファイルの中身をArrayBufferから文字列に変換する。
 * UTF-8のBOM付き／BOM無しはUTF-8として、UTF-8として解釈できない場合は
 * 業務系システムのCSV書き出しで多いShift_JIS（CP932）として解釈する。
 * これにより「006:エリア」等の見出しが文字化けして検出できない、という問題を防ぐ。
 */
function decodeCsvArrayBuffer_(buffer) {
  var bytes = new Uint8Array(buffer);
  if (bytes.length >= 3 && bytes[0] === 0xEF && bytes[1] === 0xBB && bytes[2] === 0xBF) {
    return new TextDecoder('utf-8').decode(bytes.subarray(3));
  }
  try {
    return new TextDecoder('utf-8', { fatal: true }).decode(bytes);
  } catch (e) {
    return new TextDecoder('shift_jis').decode(bytes);
  }
}

  for (var s = 0; s < sheetDefs.length; s++) {
    var def = sheetDefs[s];
    if (!def.path || !entries[def.path]) continue; // グラフシートなど、表ではないシート
    var xml = await readZipXml_(entries, def.path);
    var matrix = [], width = 0;
    var rowRe = /<row\b([^>]*?)(?:\/>|>([\s\S]*?)<\/row>)/g, rowM;
    while ((rowM = rowRe.exec(xml)) !== null) {
      var cellsXml = rowM[2] || '';
      if (!cellsXml) continue;
      var rowArr = [], nextCol = 0, any = false;
      var cRe = /<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g, cm;
      while ((cm = cRe.exec(cellsXml)) !== null) {
        var attrs = cm[1] || '', inner = cm[2] || '';
        var ref = xmlAttr_(attrs, 'r');
        var refM = ref ? ref.match(/^([A-Za-z]+)\d*$/) : null;
        var col = refM ? colLettersToIndex_(refM[1].toUpperCase()) : nextCol;
        nextCol = col + 1;
        var t = xmlAttr_(attrs, 't') || 'n';
        var styleIdx = Number(xmlAttr_(attrs, 's') || 0);
        var vM = inner.match(/<v\b[^>]*>([\s\S]*?)<\/v>/);
        var raw = vM ? decodeXmlEntities_(vM[1]) : '';
        var val = '';
        if (t === 's') {
          var si = Number(raw);
          val = (raw !== '' && si >= 0 && si < sharedStrings.length) ? sharedStrings[si] : '';
        } else if (t === 'inlineStr') {
          var isM = inner.match(/<is\b[^>]*>([\s\S]*?)<\/is>/);
          val = isM ? excelRichTextToString_(isM[1]) : '';
        } else if (t === 'str' || t === 'e') {
          val = raw;
        } else if (t === 'b') {
          val = raw === '1' ? 'TRUE' : (raw === '0' ? 'FALSE' : raw);
        } else if (t === 'd') {
          val = /^\d{4}-\d{2}-\d{2}/.test(raw) ? raw.slice(0, 10) : raw;
        } else if (raw !== '') {
          var kind = styleKinds[styleIdx] || null;
          if (kind && kind.kind === 'date') val = excelSerialToIsoDate_(raw, date1904);
          else if (kind && kind.kind === 'time') val = excelSerialToTime_(raw, true);
          else if (kind && kind.kind === 'zero' && /^\d+$/.test(raw) && raw.length < kind.width) val = new Array(kind.width - raw.length + 1).join('0') + raw;
          else val = excelNumberText_(raw);
        }
        while (rowArr.length < col) rowArr.push('');
        rowArr[col] = val;
        if (val !== '') any = true;
      }
      if (!any) continue; // 空の行は取り込みに関係しないため除く
      if (rowArr.length > width) width = rowArr.length;
      matrix.push(rowArr);
    }
    matrix.forEach(function (r) { while (r.length < width) r.push(''); });
    sheets.push({ name: def.name, hidden: def.hidden, matrix: matrix });
  }
  return sheets;
}

/** 見出しの文字から、先頭の番号（006:）や記号（■）・空白を除く（シートの判定用）。 */
function normalizeExcelHeaderCell_(cell) {
  return String(cell || '').replace(/^[﻿\s■●◆□]+/, '').replace(/^\d{1,6}\s*[:：]\s*/, '').replace(/\s+/g, '');
}

/**
 * 複数のシートがある場合に、取り込みたい表のシートを選ぶための点数（先頭20行の見出しらしさ）。
 * mode='reservation'：予約データの項目名と一致する見出しの数／mode='staff'：人事データの代表的な見出しの数。
 */
function scoreSheetMatrixForMode_(matrix, mode) {
  var labels = {};
  if (mode === 'staff') {
    ['担当者NO', '担当者No', '担当者コード', '担当者CD', '社員NO', '社員番号', '社員コード', 'スタッフコード',
      '社員名称', '社員名', '氏名', '漢字氏名', '担当者名', 'スタッフ名', '駐在所属名称', '所属', '所属名称', '役職', '役職名称']
      .forEach(function (l) { labels[l] = 1; });
  } else {
    (STATE.columns || []).forEach(function (c) { labels[normalizeExcelHeaderCell_(c.label)] = 1; });
  }
  var best = 0, limit = Math.min((matrix || []).length, 20); // サーバー側の見出し検出（先頭20行）と同じ範囲
  for (var r = 0; r < limit; r++) {
    var score = 0, seen = {};
    if (mode === 'staff') {
      // サーバー側で必須の「担当者NO」「社員名称」が同じ行にそろっていれば、そのシートを最優先にする。
      var keys = (matrix[r] || []).map(normalizeExcelHeaderCell_);
      if (keys.indexOf('担当者NO') !== -1 && keys.indexOf('社員名称') !== -1) score += 1000;
    }
    (matrix[r] || []).forEach(function (cell) {
      var key = normalizeExcelHeaderCell_(cell);
      if (key && labels[key] && !seen[key]) { seen[key] = 1; score++; }
      else if (mode === 'staff' && /メール|アカウント|Email|Gmail/i.test(key) && !seen.mail) { seen.mail = 1; score++; }
    });
    if (score > best) best = score;
  }
  return best;
}

/** .xlsx のバイト列から、取り込む表のシートを選び、その表（行×列の文字列）を返す。 */
async function convertExcelBytesToCsv_(bytes, mode) {
  var sheets = await parseXlsxBytes_(bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes));
  var usable = sheets.filter(function (s) { return s.matrix.length > 0; });
  if (!usable.length) throw new Error('Excelファイルの中に、データの入ったシートが見つかりませんでした。');
  var best = null, bestScore = -1;
  usable.forEach(function (s) {
    var sc = scoreSheetMatrixForMode_(s.matrix, mode) * 2 + (s.hidden ? 0 : 1); // 同点なら表示中のシートを優先
    if (sc > bestScore) { bestScore = sc; best = s; }
  });
  return { matrix: best.matrix, sheetName: best.name, sheetCount: usable.length };
}

function isZipBytes_(bytes) {
  return bytes.length >= 4 && bytes[0] === 0x50 && bytes[1] === 0x4B && bytes[2] === 0x03 && bytes[3] === 0x04;
}
function isOle2Bytes_(bytes) {
  return bytes.length >= 8 && bytes[0] === 0xD0 && bytes[1] === 0xCF && bytes[2] === 0x11 && bytes[3] === 0xE0 &&
    bytes[4] === 0xA1 && bytes[5] === 0xB1 && bytes[6] === 0x1A && bytes[7] === 0xE1;
}

var EXCEL_XLS_UNSUPPORTED_MESSAGE_ = '古い形式のExcelファイル（.xls）には対応していません。Excelで開き、「名前を付けて保存」で' +
  '「Excelブック（.xlsx）」または「CSV」を選んで保存し直してから取り込んでください（パスワード付きの .xls も同様です）。';

/**
 * CSVまたはExcelファイル（パスワード付き.xlsx含む）を読み込む共通処理。中身（先頭のバイト）で形式を判定する。
 * 結果は onReady({csvText}（CSVの場合）または {matrix, sheetName, sheetCount}（Excelの場合））／
 * パスワード付きなら onEncrypted(bytes) ／ 失敗なら onError(err)。
 */
function readSpreadsheetFileAuto_(file, mode, onReady, onEncrypted, onError) {
  if (file.size > EXCEL_MAX_FILE_BYTES_) {
    onError(new Error('ファイルが大きすぎます（' + Math.round(file.size / 1024 / 1024) + 'MB）。60MB以下のファイルにしてください。'));
    return;
  }
  var reader = new FileReader();
  reader.onload = function (evt) {
    var bytes = new Uint8Array(evt.target.result);
    Promise.resolve().then(function () {
      if (isOle2Bytes_(bytes)) {
        if (isEncryptedOfficeFile_(bytes)) { onEncrypted(bytes); return null; }
        throw new Error(EXCEL_XLS_UNSUPPORTED_MESSAGE_);
      }
      if (isZipBytes_(bytes)) return convertExcelBytesToCsv_(bytes, mode).then(onReady);
      var ext = (file.name.split('.').pop() || '').toLowerCase();
      if (ext === 'xlsx' || ext === 'xlsm' || ext === 'xls') throw new Error('Excelファイルとして読み取れませんでした（ファイルが壊れている可能性があります）。');
      onReady({ csvText: decodeCsvArrayBuffer_(evt.target.result), sheetName: null, sheetCount: 0 });
      return null;
    }).catch(onError);
  };
  reader.onerror = function () { onError(reader.error || new Error('ファイルの読み込みに失敗しました。')); };
  reader.readAsArrayBuffer(file);
}

async function unlockEncryptedSpreadsheetBuffer_(bytes, password, mode) {
  if (!password) throw new Error('パスワードを入力してください。');
  var decrypted = await decryptOfficeEncryptedXlsx_(bytes, password);
  if (!isZipBytes_(decrypted)) throw new Error(EXCEL_XLS_UNSUPPORTED_MESSAGE_);
  return convertExcelBytesToCsv_(decrypted, mode);
}

/**
 * ファイル選択欄・パスワード入力欄・概要表示・取込ボタンをまとめて扱う（CSV取込と人事データ取込で共通）。
 * 別のファイルを選び直した場合は、前のファイルの読み取り結果が後から届いても使わない（取り違え防止）。
 * ids：{file, passwordBox, passwordInput, unlockBtn, summary, submit}。
 * onData(取込データ, fileName)：取込データはCSVなら文字列、Excelなら {matrix}（サーバーの取込処理はどちらも受け付ける）。
 */
function bindSpreadsheetPicker_(mode, ids, onData, onClear) {
  var el = function (id) { return document.getElementById(id); };
  var state = { seq: 0, encrypted: null, fileName: null, busy: false };
  var setSummary = function (text) { var s = el(ids.summary); s.textContent = text; s.classList.toggle('hidden', !text); };
  var reset = function () {
    state.seq++;
    state.encrypted = null;
    state.fileName = null;
    el(ids.passwordBox).classList.add('hidden');
    el(ids.passwordInput).value = '';
    el(ids.submit).disabled = true;
    onClear();
  };
  var describe = function (file, res) {
    return 'ファイル：' + file.name + '（' + Math.ceil(file.size / 1024) + ' KB）' +
      (res.sheetName ? '　読み込むシート：「' + res.sheetName + '」' + (res.sheetCount > 1 ? '（' + res.sheetCount + 'シート中。見出しから自動で選択）' : '') : '');
  };
  el(ids.file).addEventListener('change', function (e) {
    reset();
    setSummary('');
    var file = e.target.files && e.target.files[0];
    if (!file) return;
    var mySeq = state.seq;
    state.fileName = file.name;
    setSummary('ファイルを読み取っています…：' + file.name);
    readSpreadsheetFileAuto_(file, mode, function (res) {
      if (mySeq !== state.seq) return;
      onData(res.matrix ? { matrix: res.matrix } : res.csvText, file.name);
      setSummary(describe(file, res));
      el(ids.submit).disabled = false;
    }, function (bytes) {
      if (mySeq !== state.seq) return;
      state.encrypted = { bytes: bytes, file: file };
      el(ids.passwordBox).classList.remove('hidden');
      setSummary('パスワード付きのExcelファイルです：' + file.name + '（パスワードを入力して「ロック解除して読み込む」を押してください）');
      el(ids.passwordInput).focus();
    }, function (err) {
      if (mySeq !== state.seq) return;
      setSummary('');
      showToast((err && err.message) || 'ファイルの読み込みに失敗しました。', 'error');
    });
  });
  var unlock = function () {
    if (!state.encrypted || state.busy) return;
    var password = el(ids.passwordInput).value;
    if (!password) { showToast('Excelのパスワードを入力してください。', 'error'); return; }
    var mySeq = state.seq, enc = state.encrypted, btn = el(ids.unlockBtn);
    state.busy = true;
    btn.disabled = true;
    unlockEncryptedSpreadsheetBuffer_(enc.bytes, password, mode).then(function (res) {
      if (mySeq !== state.seq) return;
      state.encrypted = null;
      el(ids.passwordBox).classList.add('hidden');
      el(ids.passwordInput).value = '';
      onData({ matrix: res.matrix }, enc.file.name);
      setSummary('ロックを解除しました。' + describe(enc.file, res));
      el(ids.submit).disabled = false;
    }).catch(function (err) {
      if (mySeq !== state.seq) return;
      showToast((err && err.message) || 'パスワードの解除に失敗しました。', 'error');
      el(ids.passwordInput).select();
    }).then(function () {
      state.busy = false;
      btn.disabled = false;
    });
  };
  el(ids.unlockBtn).addEventListener('click', unlock);
  el(ids.passwordInput).addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); unlock(); }
  });
  return { reset: function () { el(ids.file).value = ''; reset(); setSummary(''); } };
}

  showToast('CSVを取り込みました（新規 ' + result.imported + ' 件）', 'success');
  boot();
}

// ============================================================================
// イベント結線・タブ切り替え
// ============================================================================

function bindStaticEvents() {
  document.querySelectorAll('.tab-btn').forEach(function (btn) {
    btn.addEventListener('click', function () { switchTab(btn.getAttribute('data-tab')); });
  });

  // 再読込ボタンは、未保存の変更がある場合に確認してから読み込み直す（boot()は確認しない）。
  document.getElementById('btn-refresh').addEventListener('click', function () { requestDataWindow_(buildRangeOptionFromUi_()); });
  document.getElementById('btn-run-setup').addEventListener('click', runSetup);

  // 表示期間（データが増えるほど画面が重くなるのを防ぐための絞り込み）
  document.getElementById('data-window-mode').addEventListener('change', onDataWindowModeChange_);
  document.getElementById('btn-apply-data-window').addEventListener('click', function () {
    requestDataWindow_(buildRangeOptionFromUi_());
  });
  document.getElementById('data-window-include-archive').addEventListener('change', function () {
    requestDataWindow_(buildRangeOptionFromUi_());
  });

  // 分析ダッシュボードタブのフィルタ
  ['dash-filter-area', 'dash-filter-office', 'dash-filter-category', 'dash-filter-tourbrand', 'dash-filter-destination', 'dash-filter-date-field'].forEach(function (id) {
    document.getElementById(id).addEventListener('change', applyDashFilters);
  });
  document.getElementById('dash-filter-date-from').addEventListener('change', applyDashFilters);
  document.getElementById('dash-filter-date-to').addEventListener('change', applyDashFilters);
  document.getElementById('btn-clear-dash-filter').addEventListener('click', clearDashFilters);

  document.querySelectorAll('#tab-panel-dashboard [data-sort]').forEach(function (th) {
    th.addEventListener('click', function () {
      var key = th.getAttribute('data-sort');
      if (STATE.rankingSortKey === key) STATE.rankingSortDir *= -1; else { STATE.rankingSortKey = key; STATE.rankingSortDir = -1; }
      renderRanking();
    });
  });

  // 予約データ一覧タブのフィルタ
  ['data-filter-area', 'data-filter-office'].forEach(function (id) {
    document.getElementById(id).addEventListener('change', function () {
      updateDataOfficeStaffFilterOptions_();
      applyDataFilters();
    });
  });
  ['data-filter-staff',
    'data-filter-insurance-status', 'data-filter-wifi-status', 'data-filter-tavica-status', 'data-filter-cansapo-status'].forEach(function (id) {
    document.getElementById(id).addEventListener('change', applyDataFilters);
  });
  document.getElementById('data-filter-date-from').addEventListener('change', applyDataFilters);
  document.getElementById('data-filter-date-to').addEventListener('change', applyDataFilters);
  document.getElementById('btn-clear-data-filter').addEventListener('click', clearDataFilters);

  document.getElementById('btn-prev-page').addEventListener('click', function () { STATE.dataPage--; renderDataTable(); });
  document.getElementById('btn-next-page').addEventListener('click', function () { STATE.dataPage++; renderDataTable(); });
  bindDataTableEditEvents_();
  bindBulkEditEvents_();
  bindPendingChangesEvents_();

  document.getElementById('btn-open-csv-modal').addEventListener('click', openCsvModal);
  document.getElementById('btn-close-csv-modal').addEventListener('click', closeCsvModal);
  document.getElementById('btn-cancel-csv-modal').addEventListener('click', closeCsvModal);
  STATE.csvPicker = bindSpreadsheetPicker_('reservation', {
    file: 'csv-file-input', passwordBox: 'csv-password-box', passwordInput: 'csv-password-input',
    unlockBtn: 'btn-unlock-csv-xlsx', summary: 'csv-file-summary', submit: 'btn-submit-csv'
  }, function (text, fileName) {
    csvSelectedText = text;
    csvSelectedFileName = fileName;
  }, function () {
    csvSelectedText = null;
    csvSelectedFileName = null;
  });
  document.getElementById('btn-submit-csv').addEventListener('click', submitCsvImport);

  // 個人別サマリータブ
  document.getElementById('personal-search').addEventListener('input', debounce_(renderPersonalTab, 200));
  document.querySelectorAll('#tab-panel-personal [data-sort]').forEach(function (th) {
    th.addEventListener('click', function () {
      var key = th.getAttribute('data-sort');
      if (STATE.personalSortKey === key) STATE.personalSortDir *= -1; else { STATE.personalSortKey = key; STATE.personalSortDir = -1; }
      renderPersonalTab();
    });
  });

  // データ管理タブ
  bindColumnOrderEvents_();
  document.getElementById('btn-remove-duplicates').addEventListener('click', removeDuplicates);
  document.getElementById('btn-clear-all-data').addEventListener('click', clearAllData);
  document.getElementById('btn-preview-archive').addEventListener('click', previewArchive);
  document.getElementById('btn-run-archive').addEventListener('click', runArchive);
  bindStaffEvents_();
  bindStaffNameEvents_();
  bindStaffNameImportEvents_();
}

function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(function (b) { b.classList.toggle('active', b.getAttribute('data-tab') === tab); });
  document.querySelectorAll('.tab-panel').forEach(function (p) { p.classList.toggle('hidden', p.id !== 'tab-panel-' + tab); });
  STATE.activeTab = tab;
  hideHoverTooltip_();
  // 非表示の間に編集が行われて「汚れている」タブへ切り替えた時だけ、ここで初めて再描画する。
  if (tab === 'dashboard' && STATE.dashDirty) { applyDashFilters(); STATE.dashDirty = false; }
  if (tab === 'personal' && STATE.personalDirty) { renderPersonalTab(); STATE.personalDirty = false; }
}

// ============================================================================
// 共通ユーティリティ
// ============================================================================

function formatNumber(n) { return Number(n || 0).toLocaleString('ja-JP'); }
function formatDateTime(iso) {
  var d = new Date(iso);
  if (isNaN(d.getTime())) return iso;
  return d.getFullYear() + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + String(d.getDate()).padStart(2, '0') +
    ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function debounce_(fn, wait) {
  var t = null;
  return function () {
    var args = arguments;
    clearTimeout(t);
    t = setTimeout(function () { fn.apply(null, args); }, wait);
  };
}

function showToast(message, type) {
  var container = document.getElementById('toast-container');
  var color = type === 'error' ? 'bg-red-600' : (type === 'success' ? 'bg-emerald-600' : 'bg-slate-700');
  var icon = type === 'error' ? 'fa-circle-exclamation' : (type === 'success' ? 'fa-circle-check' : 'fa-circle-info');
  var toast = document.createElement('div');
  toast.className = 'toast ' + color + ' text-white text-sm rounded-lg shadow-lg px-4 py-3 flex items-start gap-2';
  toast.innerHTML = '<i class="fa-solid ' + icon + ' mt-0.5"></i><span>' + escapeHtml(message) + '</span>';
  container.appendChild(toast);
  setTimeout(function () {
    toast.style.transition = 'opacity .3s ease';
    toast.style.opacity = '0';
    setTimeout(function () { toast.remove(); }, 300);
  }, 4000);
}
