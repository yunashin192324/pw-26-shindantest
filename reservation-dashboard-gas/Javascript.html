<script>
/**
 * ============================================================================
 * Javascript.html
 * 営業セールスダッシュボード - フロントエンド
 * ----------------------------------------------------------------------------
 * サーバー（Code.gs）からは起動時に一度だけ（権限で絞り込み済みの）全データを取得し、
 * 絞り込み・並べ替え・集計・グラフ描画はすべてこの中（ブラウザ側）で行う。
 * 分析ダッシュボードタブと予約データ一覧タブは、それぞれ別のフィルタを持つ。
 * ============================================================================
 */

// ---- 予約データ一覧タブの列定義（表示順の初期値・編集の種類をここで決める） ----
// kind: 'csv'（CSV由来・読み取り専用） / 'date'（CHK日など編集可の日付）
//       'ancillary'（保険/Wifi/キャンサポ/TAViCA：ステータス＋数量の組） / 'memo'（自由記述の編集可テキスト）
var DISPLAY_COLUMN_DEFS = [
  { key: 'reservationNo',  label: '予約番号',           kind: 'csv',       field: 'reservationNo' },
  { key: 'staff',          label: '担当者',             kind: 'csv',       field: 'staff' },
  { key: 'departureDate',  label: '出発予定日',         kind: 'csv',       field: 'departureDate' },
  { key: 'chkDate',        label: 'CHK日',              kind: 'date',      field: 'chkDate' },
  { key: 'memo',           label: 'メモ',               kind: 'memo',      field: 'memo' },
  { key: 'insurance',      label: '保険',               kind: 'ancillary', item: 'insurance' },
  { key: 'wifi',           label: 'Wifi',               kind: 'ancillary', item: 'wifi' },
  { key: 'cansapo',        label: 'キャンサポ',         kind: 'ancillary', item: 'cansapo' },
  { key: 'tavica',         label: 'TAViCA',             kind: 'ancillary', item: 'tavica' },
  { key: 'bookingDate',    label: '予約日',             kind: 'csv',       field: 'bookingDate' },
  { key: 'destination',    label: '最終目的地',         kind: 'csv',       field: 'destination' },
  { key: 'travelDays',     label: '旅行日数',           kind: 'csv',       field: 'travelDays' },
  { key: 'productCategory',label: '商品分類',           kind: 'csv',       field: 'productCategory' },
  { key: 'tourBrand',      label: 'ツアーブランド区分', kind: 'csv',       field: 'tourBrand' },
  { key: 'tourCode',       label: 'ツアーコード',       kind: 'csv',       field: 'tourCode' },
  { key: 'carrier',        label: 'キャリア',           kind: 'csv',       field: 'carrier' },
  { key: 'salesAmount',    label: '売上(商品請求金額)', kind: 'csv',       field: 'salesAmount' },
  { key: 'paymentAmount',  label: '入金額',             kind: 'csv',       field: 'paymentAmount' },
  { key: 'sts',            label: 'STS',                kind: 'csv',       field: 'sts' },
  { key: 'productTitle',   label: '商品タイトル',       kind: 'csv',       field: 'productTitle' },
  { key: 'office',         label: '営業所',             kind: 'csv',       field: 'office' }
];
var DISPLAY_COLUMN_DEFS_BY_KEY = {};
DISPLAY_COLUMN_DEFS.forEach(function (d) { DISPLAY_COLUMN_DEFS_BY_KEY[d.key] = d; });
var DEFAULT_COLUMN_ORDER = DISPLAY_COLUMN_DEFS.map(function (d) { return d.key; });

// ---- 予約番号（記録番号／チャレンジ番号）→「チャレンジ記録」へのリンク ----
// ベースURLが変わった場合はここだけ書き換えればよい。
var CHALLENGE_RECORD_BASE_URL = 'http://applweb.center.his/cgi-bin/b/btcq1_0_3ui?scid=_new&rsv=01102';
/** 半角英数字ちょうど11文字のときだけ「チャレンジ記録」へのURLを組み立てる。それ以外はnull（通常の値として扱う）。 */
function buildChallengeRecordUrl_(value) {
  if (typeof value !== 'string' || !/^[0-9A-Za-z]{11}$/.test(value)) return null;
  return CHALLENGE_RECORD_BASE_URL + value;
}

var STATE = {
  ready: false,
  accessDenied: false,
  invalidRole: false,
  columns: [], columnByKey: {},
  editableColumns: [], editableColumnByKey: {},
  ancillaryItems: [], ancillaryItemByKey: {},
  ancillaryStatusOptions: [], ancillaryStatusLabelByValue: {},
  userContext: null,
  meta: null,
  rows: [],
  staffList: [],
  staffNameMap: {},
  staffNameList: [],

  dashFiltered: [],
  dataFiltered: [],

  rankingSortKey: 'count', rankingSortDir: -1,
  dataSortKey: 'departureDate', dataSortDir: -1,
  dataPage: 1, dataPageSize: 50,
  personalSortKey: 'count', personalSortDir: -1,

  columnOrder: DEFAULT_COLUMN_ORDER.slice(),
  charts: {},

  selectedRowIndexes: {}, // 予約データ一覧の一括登録用：チェックされている行番号の集合
  currentPageRowIndexes: [],

  pendingChanges: {}, // 予約データ一覧「まとめて保存する」用：未保存の編集（key→変更内容）

  // 編集は常に「予約データ一覧」タブで発生するため、見えていないダッシュボード／個人別サマリータブは
  // 編集直後には再描画せず「汚れている」とだけ記録しておき、実際にそのタブへ切り替えられた時点で
  // まとめて再描画する（非表示タブのグラフ再描画・再集計という無駄な処理を避けるための遅延評価）。
  activeTab: 'dashboard',
  appliedDataWindowUi: null, // 最後に実際に読み込んだときの表示期間の入力欄の状態（再読込を取りやめた時に戻す用）
  dashDirty: false,
  personalDirty: false
};

document.addEventListener('DOMContentLoaded', function () {
  bindStaticEvents();
  boot();
});

// 未保存の変更がある状態でタブを閉じる・再読み込みする場合に、ブラウザの確認を出す。
// （Apps ScriptのWebアプリは埋め込み枠の中で動くため、ブラウザによっては確認が表示されない場合がある）
window.addEventListener('beforeunload', function (e) {
  if (!hasPendingChanges_()) return;
  e.preventDefault();
  e.returnValue = '';
});

// ============================================================================
// 初期ロード
// ============================================================================

/**
 * データを読み込み直す。サーバー側でデータを変更した直後（CSV取込・重複削除など）に呼ぶため、
 * 未保存の変更の確認は呼び出し元の操作の前に済ませておく（confirmDiscardPending_）。
 * 画面を開いた直後の1回目は、Index.html の先頭で部品の読み込みと並行して始めておいた
 * データの取得（window.__bootRequest）の結果を使う（待ち時間を重ねて起動を速くするため）。
 */
function boot() {
  var early = window.__bootRequest;
  window.__bootRequest = null;
  var option = buildRangeOptionFromUi_();
  if (early && early.option && early.option.mode === option.mode && !!early.option.includeArchive === !!option.includeArchive) {
    var uiAtRequest = snapshotDataWindowUi_();
    showLoading(true);
    var onData = function (data) { handleBootstrapResponse_(data, early.startedAt, early.receivedAt || performance.now(), uiAtRequest); };
    // 先行取得が失敗した場合は、通常の取得でもう一度だけ試す（一時的な通信の失敗で起動できなくなるのを防ぐ）。
    var onError = function () { requestDataWindow_(option, { skipConfirm: true }); };
    if (early.done) { if (early.error) onError(early.error); else onData(early.data); }
    else early.waiters.push({ ok: onData, ng: onError });
    return;
  }
  requestDataWindow_(option, { skipConfirm: true });
}

/** 行データの送り方：gzipを展開できるブラウザは圧縮形式、できない古いブラウザは非圧縮の列形式で受け取る。 */
function bootPacking_() {
  if (STATE.forceUncompressed) return 'col';
  return (typeof DecompressionStream === 'function') ? 'gzip' : 'col';
}

function base64ToBytes_(b64) {
  var bin = window.atob(b64);
  var out = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

function gunzipToText_(bytes) {
  var stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  return new Response(stream).text();
}

/**
 * サーバーから届いた行データ（packedRows：列ごとにまとめて辞書化・圧縮した文字列）を、
 * 画面の処理で使う「行ごとのオブジェクト」の配列（data.rows）に戻す。
 */
function decodeBootstrapData_(data) {
  if (!data || typeof data.packedRows !== 'string') return Promise.resolve(data);
  // 展開の準備中の失敗（その場で起きる例外）も、取り直しの処理へ渡せるよう Promise の失敗として扱う。
  return Promise.resolve().then(function () {
    return data.packing === 'gzip' ? gunzipToText_(base64ToBytes_(data.packedRows)) : data.packedRows;
  }).then(function (text) {
    var o = JSON.parse(text);
    var keys = o.k, n = o.n;
    var getters = keys.map(function (k, ci) {
      var c = o.c[ci];
      return c.d ? function (i) { return c.d[c.i[i]]; } : function (i) { return c.v[i]; };
    });
    var rows = new Array(n);
    for (var i = 0; i < n; i++) {
      var r = {};
      for (var k = 0; k < keys.length; k++) {
        var v = getters[k](i);
        if (keys[k] === 'isArchived' && !v) continue;
        r[keys[k]] = v;
      }
      rows[i] = r;
    }
    data.rows = rows;
    delete data.packedRows;
    return data;
  });
}

/**
 * 起動データの受信後の共通処理（展開→画面表示→かかった時間の記録）。
 * 圧縮の展開に失敗した場合（ブラウザの不具合など）は、以後は圧縮しない形式で1回だけ取り直す。
 */
function handleBootstrapResponse_(data, startedAt, receivedAt, uiAtRequest) {
  var wasCompressed = !!(data && data.packing === 'gzip');
  decodeBootstrapData_(data).then(function (decoded) {
    var decodedAt = performance.now();
    STATE.appliedDataWindowUi = uiAtRequest;
    onBootstrapSuccess(decoded);
    recordBootTiming_(decoded, startedAt, receivedAt, decodedAt, performance.now());
  }, function (err) {
    if (wasCompressed && !STATE.forceUncompressed) {
      STATE.forceUncompressed = true;
      if (window.console && console.warn) console.warn('圧縮データの展開に失敗したため、圧縮しない形式で取り直します', err);
      requestDataWindow_(buildRangeOptionFromUi_(), { skipConfirm: true });
      return;
    }
    showLoading(false);
    onServerError(err);
  }).catch(function (err) {
    // 画面表示の途中での失敗も、読み込み中の表示を消して知らせる（画面が読み込み中のまま止まらないように）。
    showLoading(false);
    onServerError(err);
  });
}

/**
 * 起動にかかった時間の内訳を記録する（データ管理タブの「状況」に表示する）。
 * サーバー処理・通信（サーバーとの往復からサーバー処理を除いた時間）・展開・画面表示に分けて記録し、
 * 遅いと感じたときにどこに時間がかかっているかを確認できるようにする。
 */
function recordBootTiming_(data, startedAt, receivedAt, decodedAt, renderedAt) {
  var t = (data && data.meta && data.meta.timing) || {};
  var roundTrip = receivedAt - startedAt;
  STATE.lastBootTiming = {
    totalMs: Math.round(renderedAt - startedAt),
    serverMs: t.serverMs || 0,
    transferMs: Math.max(0, Math.round(roundTrip - (t.serverMs || 0))),
    decodeMs: Math.round(decodedAt - receivedAt),
    renderMs: Math.round(renderedAt - decodedAt),
    source: t.snapshot || '',
    sizeKb: data && data.meta && data.meta.packedChars ? Math.round(data.meta.packedChars / 1024) : null,
    rows: (data && data.rows) ? data.rows.length : 0
  };
  if (window.console && console.info) console.info('起動時間の内訳', STATE.lastBootTiming);
  renderAdminStatus();
}

/**
 * データを変更した後、結果を待たずにサーバーへ「写しの作り直し」を頼んでおく
 * （次に画面を開く人が、シートの読み込みを待たずに済むようにするため）。短時間に何度呼ばれても1回にまとめる。
 */
function warmSnapshotSoon_() {
  if (STATE.warmTimer) clearTimeout(STATE.warmTimer);
  STATE.warmTimer = setTimeout(function () {
    STATE.warmTimer = null;
    try { google.script.run.withFailureHandler(function () {}).warmSnapshot(); } catch (e) { /* 写しの作り直しは補助的な処理のため、失敗しても画面の動作には影響させない */ }
  }, 1500);
}

function hasPendingChanges_() { return Object.keys(STATE.pendingChanges).length > 0; }

/**
 * 未保存の変更がある場合に、それが破棄される操作を行ってよいかを事前に確認する。
 * 変更が無ければ確認せずtrueを返す。actionTextは「データを読み込み直す」のような操作の説明。
 */
function confirmDiscardPending_(actionText) {
  if (!hasPendingChanges_()) return true;
  return window.confirm('未保存の変更が' + Object.keys(STATE.pendingChanges).length + '件あります。' + actionText +
    'と、保存されていない変更は破棄されます。続けますか？\n（保存する場合は「キャンセル」を押し、「まとめて保存する」を押してください）');
}

/** 表示期間の入力欄（期間の種類・期間指定・アーカイブを含めるか）の現在値を記録用に取り出す。 */
function snapshotDataWindowUi_() {
  return {
    mode: document.getElementById('data-window-mode').value,
    from: document.getElementById('data-window-from').value,
    to: document.getElementById('data-window-to').value,
    includeArchive: document.getElementById('data-window-include-archive').checked
  };
}

/** 表示期間の入力欄を、最後に実際に読み込んだときの状態に戻す（再読込を取りやめた場合用）。 */
function restoreDataWindowUi_() {
  var ui = STATE.appliedDataWindowUi;
  if (!ui) return;
  document.getElementById('data-window-mode').value = ui.mode;
  document.getElementById('data-window-from').value = ui.from;
  document.getElementById('data-window-to').value = ui.to;
  document.getElementById('data-window-include-archive').checked = ui.includeArchive;
  var customBox = document.getElementById('data-window-custom');
  var isCustom = ui.mode === 'custom';
  customBox.classList.toggle('hidden', !isCustom);
  customBox.classList.toggle('flex', isCustom);
}

// ============================================================================
// 表示期間（データが増えるほど画面が重くなるのを防ぐための絞り込み。Code.gsのgetBootstrapData参照）
// ============================================================================

/**
 * 「表示期間」セレクタ・カスタム期間入力・「アーカイブ済みデータも含める」チェックボックスの
 * 現在値から、getBootstrapData()へ渡すrangeOptionを作る。
 */
function buildRangeOptionFromUi_() {
  var mode = document.getElementById('data-window-mode').value;
  var includeArchiveEl = document.getElementById('data-window-include-archive');
  var includeArchive = !!(includeArchiveEl && includeArchiveEl.checked);

  var base;
  if (mode === 'all') base = { mode: 'all' };
  else if (mode === '1y') base = { mode: 'custom', from: isoDateMonthsAgo_(12), to: null };
  else if (mode === 'fy-current' || mode === 'fy-prev') {
    var fy = computeFiscalYearRange_(mode === 'fy-current' ? 0 : -1);
    base = { mode: 'custom', from: fy.from, to: fy.to };
  } else if (mode === 'custom') {
    var from = document.getElementById('data-window-from').value || null;
    var to = document.getElementById('data-window-to').value || null;
    base = { mode: 'custom', from: from, to: to };
  } else {
    base = { mode: 'default' }; // 既定（直近6ヶ月＋今後の予定。サーバー側で計算する）
  }
  base.includeArchive = includeArchive;
  return base;
}

/** 今日からNヶ月前の日付を'yyyy-MM-dd'で返す（表示期間セレクタの「直近1年」用）。 */
function isoDateMonthsAgo_(n) {
  // その月に同じ日が無い場合は月末にする（2月29日の1年前は2月28日。setMonthだけだと3月1日になる）。
  var d = new Date();
  var day = d.getDate();
  d.setDate(1);
  d.setMonth(d.getMonth() - n);
  d.setDate(Math.min(day, new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate()));
  var pad = function (v) { return (v < 10 ? '0' : '') + v; };
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
}

/**
 * 「期」の範囲（出発予定日ベース、開始は11月・終了は翌年10月）を'yyyy-MM-dd'で返す。
 * offsetYears: 0=今期、-1=前期。
 */
function computeFiscalYearRange_(offsetYears) {
  var now = new Date();
  var fyStartYear = (now.getMonth() + 1 >= 11) ? now.getFullYear() : now.getFullYear() - 1;
  fyStartYear += offsetYears;
  return { from: fyStartYear + '-11-01', to: (fyStartYear + 1) + '-10-31' };
}

/** 表示期間セレクタが変更されたときの処理。「期間を指定」は入力欄を出すだけで、「適用」を押すまで再読み込みしない。 */
function onDataWindowModeChange_() {
  var mode = document.getElementById('data-window-mode').value;
  var customBox = document.getElementById('data-window-custom');
  var isCustom = mode === 'custom';
  customBox.classList.toggle('hidden', !isCustom);
  customBox.classList.toggle('flex', isCustom);
  if (isCustom) return;
  requestDataWindow_(buildRangeOptionFromUi_());
}

/**
 * rangeOptionを指定してサーバーからデータを読み込み直す（onBootstrapSuccessで画面を丸ごと更新する）。
 * 読み込み直すと未保存の変更は破棄されるため、変更がある場合は事前に確認する（opts.skipConfirmで省略）。
 * 取りやめた場合は、表示期間の入力欄を元の状態に戻す。
 */
function requestDataWindow_(rangeOption, opts) {
  if (!(opts && opts.skipConfirm) && !confirmDiscardPending_('データを読み込み直す')) {
    restoreDataWindowUi_();
    return;
  }
  var uiAtRequest = snapshotDataWindowUi_();
  showLoading(true);
  var startedAt = performance.now();
  var option = Object.assign({}, rangeOption || {}, { packing: bootPacking_() });
  google.script.run
    .withSuccessHandler(function (data) { handleBootstrapResponse_(data, startedAt, performance.now(), uiAtRequest); })
    .withFailureHandler(function (err) { showLoading(false); onServerError(err); })
    .getBootstrapData(option);
}

/** 表示期間バーの説明文（現在の期間・件数・期間外で非表示になっている件数）を更新する。 */
function renderDataWindowBanner_() {
  var box = document.getElementById('data-window-summary');
  var meta = STATE.meta;
  if (!box || !meta || !meta.window) { if (box) box.textContent = ''; return; }
  var w = meta.window;
  var rangeText;
  if (w.mode === 'all') {
    rangeText = '全期間';
  } else {
    var fromText = w.from ? ('出発予定日 ' + w.from + ' 以降') : '';
    var toText = w.to ? '（' + w.to + ' まで）' : '（今後の予定も含む）';
    rangeText = fromText + toText;
  }
  var text = '表示期間：' + rangeText + '　／　表示中：' + formatNumber(meta.totalRows) + ' 件';
  if (meta.includesArchive) {
    text += '　／　うちアーカイブ済み：' + formatNumber(meta.archivedRowCount || 0) + ' 件（閲覧専用）';
  }
  if (meta.excludedByWindow > 0) {
    text += '　／　表示期間外のため非表示：' + formatNumber(meta.excludedByWindow) + ' 件（「全期間を表示」で確認できます）';
  }
  box.textContent = text;
}

function onBootstrapSuccess(data) {
  showLoading(false);
  STATE.columns = data.columns;
  STATE.columnByKey = {};
  data.columns.forEach(function (c) { STATE.columnByKey[c.key] = c; });

  STATE.editableColumns = data.editableColumns || [];
  STATE.editableColumnByKey = {};
  STATE.editableColumns.forEach(function (c) { STATE.editableColumnByKey[c.key] = c; });

  STATE.ancillaryItems = data.ancillaryItems || [];
  STATE.ancillaryItemByKey = {};
  STATE.ancillaryItems.forEach(function (a) { STATE.ancillaryItemByKey[a.key] = a; });

  STATE.ancillaryStatusOptions = data.ancillaryStatusOptions || [];
  STATE.ancillaryStatusLabelByValue = {};
  STATE.ancillaryStatusOptions.forEach(function (o) { STATE.ancillaryStatusLabelByValue[o.value] = o.label; });

  STATE.staffNameMap = data.staffNameMap || {};

  // データを読み込み直すと行番号(rowIndex)の対応関係が変わる可能性がある（重複削除・アーカイブ等で
  // 行がずれる、表示期間の変更で対象行の集合が変わる等）。古いrowIndexを指したまま残った選択・
  // 未保存の変更は、後で別の行を誤って一括編集・上書きする事故につながるため、読み込み直す前に
  // 必ず破棄し、未保存の変更があった場合はその旨を知らせる。
  var hadPendingChanges = STATE.pendingChanges && Object.keys(STATE.pendingChanges).length > 0;
  STATE.pendingChanges = {};
  STATE.selectedRowIndexes = {};

  STATE.userContext = data.userContext || null;
  STATE.rows = data.rows || [];
  STATE.ready = data.ready;
  STATE.accessDenied = !!data.accessDenied;
  STATE.invalidRole = !!data.invalidRole;

  document.getElementById('setup-banner').classList.toggle('hidden', data.ready);
  if (!data.ready) {
    document.getElementById('setup-banner-detail').textContent = (data.status && data.status.detail) || '';
    document.getElementById('access-denied-banner').classList.add('hidden');
    document.getElementById('invalid-role-banner').classList.add('hidden');
    document.getElementById('app-content').classList.add('hidden');
    renderRoleBadge();
    return;
  }

  document.getElementById('access-denied-banner').classList.toggle('hidden', !STATE.accessDenied);
  document.getElementById('invalid-role-banner').classList.toggle('hidden', !STATE.invalidRole);
  document.getElementById('app-content').classList.toggle('hidden', STATE.accessDenied || STATE.invalidRole);
  renderRoleBadge();
  if (STATE.accessDenied) {
    document.getElementById('access-denied-email').textContent = (STATE.userContext && STATE.userContext.email) || '';
    return;
  }
  if (STATE.invalidRole) {
    document.getElementById('invalid-role-email').textContent = (STATE.userContext && STATE.userContext.email) || '';
    return;
  }

  var lastLabel = document.getElementById('last-imported-label');
  if (data.meta && data.meta.lastImportedAt) {
    lastLabel.textContent = '最終取込：' + formatDateTime(data.meta.lastImportedAt) +
      (data.meta.lastImportedFile ? '（' + data.meta.lastImportedFile + '）' : '');
    lastLabel.classList.remove('hidden');
  } else {

/**
 * 担当者コードを、担当者マスタに登録があれば氏名に変換する（未登録ならコードのまま）。
 * 同じ氏名（空白の有無の違いを含む）の担当者が複数いる場合は、区別できるようコードを併記する
 * （絞り込みの選択肢や集計表で、同姓同名の別人が見分けられなくなるのを防ぐ）。
 */
function formatStaffName_(code) {
  if (!code) return code;
  var name = STATE.staffNameMap[code];
  if (!name) return code;
  return duplicateStaffNames_()[String(name).replace(/\s+/g, '')] ? name + '（' + code + '）' : name;
}

function duplicateStaffNames_() {
  if (STATE.staffNameDupFor === STATE.staffNameMap) return STATE.staffNameDup;
  var count = {}, dup = {};
  Object.keys(STATE.staffNameMap).forEach(function (c) {
    var key = String(STATE.staffNameMap[c]).replace(/\s+/g, '');
    count[key] = (count[key] || 0) + 1;
    if (count[key] > 1) dup[key] = true;
  });
  STATE.staffNameDupFor = STATE.staffNameMap;
  STATE.staffNameDup = dup;
  return dup;
}

/** 保険/Wifi/TAViCA/キャンサポのステータス値を、既定値'-'（NO ACT）にそろえて返す（空欄='-'扱い）。 */
function normalizeAncillaryStatus_(v) {
  return (v === null || v === undefined || v === '') ? '-' : v;
}

function distinctValues_(key) {

  STATE.rows.forEach(function (r) {

    if (v !== null && v !== undefined && v !== '') set[v] = true;

}

function fillMultiSelect_(id, values) {

function getSelectedValues_(id) {
  return Array.from(document.getElementById(id).selectedOptions).map(function (o) { return o.value; });
}

function toSet_(arr) {
  if (!arr || arr.length === 0) return null;
  var s = {};
  arr.forEach(function (v) { s[v] = true; });
  return s;
}

/** 行配列から、指定キーの重複無し値一覧を五十音順で返す（distinctValues_のSTATE.rows全体版に対して、絞り込み済みの行集合に使う）。 */
function distinctValuesFromRows_(rows, key) {
  var set = {};
  rows.forEach(function (r) {
    var v = r[key];
    if (v !== null && v !== undefined && v !== '') set[v] = true;
  });
  return Object.keys(set).sort(function (a, b) { return a.localeCompare(b, 'ja'); });
}

/** 選択肢を入れ替えつつ、入れ替え後も有効な選択済みの値は選択状態を維持する（連動フィルタ用）。 */
function fillMultiSelectPreserving_(id, values, labelFn) {
  var el = document.getElementById(id);
  var prevSelected = toSet_(Array.from(el.selectedOptions).map(function (o) { return o.value; }));
  el.innerHTML = values.map(function (v) {
    var label = labelFn ? labelFn(v) : v;
    var sel = (prevSelected && prevSelected[v]) ? ' selected' : '';
    return '<option value="' + escapeHtml(v) + '"' + sel + '>' + escapeHtml(label) + '</option>';
  }).join('');
}

/**
 * 予約データ一覧の「店舗」「担当者」フィルタの選択肢を、現在の「エリア」「店舗」の選択状況に応じて絞り込む。
 * エリアを選ぶと同じエリアの店舗だけに、店舗を選ぶと同じ店舗の担当者だけに選択肢が絞り込まれる。
 * 担当者の表示名は担当者マスタで氏名に変換する（コードのまま出さない）。
 */
function updateDataOfficeStaffFilterOptions_() {
  var areaSet = toSet_(getSelectedValues_('data-filter-area'));
  var rowsInArea = areaSet ? STATE.rows.filter(function (r) { return areaSet[r.area]; }) : STATE.rows;
  fillMultiSelectPreserving_('data-filter-office', distinctValuesFromRows_(rowsInArea, 'office'));

  var officeSet = toSet_(getSelectedValues_('data-filter-office'));
  var rowsInOffice = officeSet ? rowsInArea.filter(function (r) { return officeSet[r.office]; }) : rowsInArea;
  // 担当者の選択肢は、表示している氏名の五十音順に並べる（担当者コード順にしない）。
  var staffCodes = distinctValuesFromRows_(rowsInOffice, 'staff').sort(function (a, b) {
    return String(formatStaffName_(a)).localeCompare(String(formatStaffName_(b)), 'ja');
  });
  fillMultiSelectPreserving_('data-filter-staff', staffCodes, formatStaffName_);
}

function applyDashFilters() {
  var areaSet = toSet_(getSelectedValues_('dash-filter-area'));
  var officeSet = toSet_(getSelectedValues_('dash-filter-office'));
  var catSet = toSet_(getSelectedValues_('dash-filter-category'));
  var tourBrandSet = toSet_(getSelectedValues_('dash-filter-tourbrand'));
  var destinationSet = toSet_(getSelectedValues_('dash-filter-destination'));
  var dateField = document.getElementById('dash-filter-date-field').value || 'bookingDate';
  var dateFrom = document.getElementById('dash-filter-date-from').value || '';
  var dateTo = document.getElementById('dash-filter-date-to').value || '';

  STATE.dashFiltered = STATE.rows.filter(function (r) {
    if (areaSet && !areaSet[r.area]) return false;
    if (officeSet && !officeSet[r.office]) return false;
    if (catSet && !catSet[r.productCategory]) return false;
    if (tourBrandSet && !tourBrandSet[r.tourBrand]) return false;
    if (destinationSet && !destinationSet[r.destination]) return false;
    var dateVal = r[dateField];
    if (dateFrom && (!dateVal || dateVal < dateFrom)) return false;
    if (dateTo && (!dateVal || dateVal > dateTo)) return false;
    return true;
  });

  document.getElementById('dash-filter-summary').textContent =
    STATE.dashFiltered.length + ' 件を表示中（あなたが閲覧できる ' + STATE.rows.length + ' 件中）';

  renderKpis();
  renderCharts();
  renderRanking();
}

function clearDashFilters() {
  ['dash-filter-area', 'dash-filter-office', 'dash-filter-category', 'dash-filter-tourbrand', 'dash-filter-destination'].forEach(function (id) {
    Array.from(document.getElementById(id).options).forEach(function (o) { o.selected = false; });
  });
  document.getElementById('dash-filter-date-from').value = '';
  document.getElementById('dash-filter-date-to').value = '';
  applyDashFilters();
}

// typeof NaN === 'number' となるため、typeof チェックだけではNaNを除外できない。
// 1件でもNaNが混ざると集計全体がNaNに汚染されてしまうため、isNaN()も必ず併用する。
function isValidNumber_(v) { return typeof v === 'number' && !isNaN(v); }
function sumBy_(rows, key) {
  var sum = 0;
  rows.forEach(function (r) { if (isValidNumber_(r[key])) sum += r[key]; });
  return sum;
}
function avgBy_(rows, key) {
  var sum = 0, n = 0;
  rows.forEach(function (r) { if (isValidNumber_(r[key])) { sum += r[key]; n++; } });
  return n > 0 ? sum / n : 0;
}
function countBy_(rows, key) {
  var map = {};
  rows.forEach(function (r) {
    var v = (r[key] === null || r[key] === undefined || r[key] === '') ? '(空欄)' : r[key];
    map[v] = (map[v] || 0) + 1;
  });
  return map;
}
function topEntries_(map, n) {
  return Object.keys(map)
    .map(function (k) { return [k, map[k]]; })
    .sort(function (a, b) { return b[1] - a[1]; })
    .slice(0, n);
}

/**
 * ヘッダーKPI：予約件数と、保険/Wifi/TAViCA/キャンサポの合計数量（数量欄の合計）。

 */

  document.getElementById('kpi-tavica').textContent = formatNumber(sumBy_(rows, 'tavicaQty'));

}

var CHART_COLORS = ['#1d4ed8', '#f59e0b', '#10b981', '#ef4444', '#8b5cf6', '#0ea5e9', '#f97316', '#84cc16', '#ec4899', '#64748b'];

function upsertChart_(canvasId, config) {
  var canvas = document.getElementById(canvasId);
  if (!canvas) return;
  if (STATE.charts[canvasId]) { STATE.charts[canvasId].destroy(); delete STATE.charts[canvasId]; }
  // グラフ部品（Chart.js）を外部から読み込めなかった場合も、グラフ以外（集計表・一覧・編集）は使えるようにする。
  if (typeof Chart !== 'function') { notifyChartLibMissing_(); return; }
  STATE.charts[canvasId] = new Chart(canvas.getContext('2d'), config);
}

/**
 * グラフ部品がまだ無い場合：読み込み中なら、読み込み終わった時点でグラフを描き直す。
 * 読み込みに失敗した（または長時間届かない）場合だけ、グラフ以外は使える旨を知らせる。
 */
function notifyChartLibMissing_() {
  if (STATE.chartLibWaiting || STATE.chartLibWarned) return;
  STATE.chartLibWaiting = true;
  var warn = function () {
    if (STATE.chartLibWarned || typeof Chart === 'function') return;
    STATE.chartLibWarned = true;
    showToast('グラフの表示部品を読み込めなかったため、グラフを表示できません（集計表・一覧・編集は使えます）。ページを読み込み直すと表示される場合があります。', 'error');
  };
  var el = document.getElementById('chartjs-lib');
  if (!el || window.__chartLibFailed) { warn(); return; } // 既に読み込みに失敗している場合はすぐ知らせる
  el.addEventListener('load', function () {
    STATE.chartLibWaiting = false;
    if (typeof Chart !== 'function') { warn(); return; }
    if (STATE.activeTab === 'dashboard') renderCharts(); else STATE.dashDirty = true;
  });
  el.addEventListener('error', warn);
  setTimeout(warn, 20000); // 読み込みの成否の知らせを受け取れなかった場合の保険
}

function renderCharts() {
  var rows = STATE.dashFiltered;
  renderCategoryChart_(rows);

  renderAncillaryCombinedChart_(rows);

  renderAncillaryChart_('chart-cansapo', rows, 'cansapoQty', 'キャンサポ加入数');

}

function getDashDateField_() {
  return document.getElementById('dash-filter-date-field').value || 'bookingDate';
}

/** 保険/Wifi/キャンサポ/TAViCAの月別数量（加入・販売数）を1つの折れ線グラフに重ねて表示する（総合比較用）。 */
function renderAncillaryCombinedChart_(rows) {
  var field = getDashDateField_();
  var items = [
    { qtyKey: 'insuranceQty', label: '保険', color: '#1d4ed8' },
    { qtyKey: 'wifiQty', label: 'Wifi', color: '#f59e0b' },
    { qtyKey: 'cansapoQty', label: 'キャンサポ', color: '#ec4899' },
    { qtyKey: 'tavicaQty', label: 'TAViCA', color: '#8b5cf6' }
  ];
  var monthSet = {};
  rows.forEach(function (r) {
    var v = r[field];
    if (v) monthSet[v.slice(0, 7)] = true;
  });
  var months = Object.keys(monthSet).sort();

  upsertChart_('chart-ancillary-combined', {
    data: {
      labels: months,
      datasets: items.map(function (it) {
        var byMonth = {};
        months.forEach(function (m) { byMonth[m] = 0; });
        rows.forEach(function (r) {
          var v = r[field];
          if (!v) return;
          var m = v.slice(0, 7);
          if (typeof r[it.qtyKey] === 'number') byMonth[m] += r[it.qtyKey];
        });
        return {
          type: 'line', label: it.label, data: months.map(function (m) { return byMonth[m]; }),
          borderColor: it.color, backgroundColor: it.color, tension: 0.25
        };
      })
    },
    options: {
      responsive: true,
      interaction: { mode: 'index', intersect: false },
      plugins: { legend: { position: 'bottom' } },
      scales: { y: { beginAtZero: true, ticks: { precision: 0 } } }
    }
  });
}

/** 保険/Wifi/キャンサポ/TAViCAそれぞれの「NB付帯（〇）」「PUSH成約（☆）」の実績件数をカードの見出し下に表示する。 */
function renderAncillaryBreakdown_(rows) {
  STATE.ancillaryItems.forEach(function (item) {
    var el = document.getElementById('ancillary-breakdown-' + item.key);
    if (!el) return;
    var nb = 0, push = 0;
    rows.forEach(function (r) {
      var status = r[item.statusKey];
      if (status === '〇') nb++;
      else if (status === '☆') push++;
    });
    el.textContent = 'NB付帯実績：' + formatNumber(nb) + '件　／　PUSH成約実績：' + formatNumber(push) + '件';
  });
}

/** 保険・Wifi・TAViCA・キャンサポ共通：棒＝リスト数（月別件数）、折れ線＝加入・販売数（数量合計）。 */
function renderAncillaryChart_(canvasId, rows, qtyKey, lineLabel) {
  var field = getDashDateField_();
  var byMonth = {};
  rows.forEach(function (r) {
    var v = r[field];
    if (!v) return;
    var month = v.slice(0, 7);
    if (!byMonth[month]) byMonth[month] = { count: 0, qty: 0 };
    byMonth[month].count++;
    if (typeof r[qtyKey] === 'number') byMonth[month].qty += r[qtyKey];
  });
  var months = Object.keys(byMonth).sort();
  upsertChart_(canvasId, {
    data: {
      labels: months,
      datasets: [
        { type: 'bar', label: 'リスト数', data: months.map(function (m) { return byMonth[m].count; }), backgroundColor: '#c7d2fe', yAxisID: 'y' },
        { type: 'line', label: lineLabel, data: months.map(function (m) { return byMonth[m].qty; }), borderColor: '#059669', backgroundColor: '#059669', yAxisID: 'y1', tension: 0.25 }
      ]
    },
    options: {
      responsive: true,
      interaction: { mode: 'index', intersect: false },
      plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 10 } } } },
      scales: {
        y: { beginAtZero: true, ticks: { precision: 0, font: { size: 9 } } },
        y1: { beginAtZero: true, position: 'right', grid: { drawOnChartArea: false }, ticks: { precision: 0, font: { size: 9 } } },
        x: { ticks: { font: { size: 9 } } }
      }
    }
  });
}

/**
 * 方面別（最終目的地）グラフ：棒＝方面ごとの予約件数（上位10）、折れ線＝同じ方面の
 * 保険・Wifi・キャンサポ・TAViCA各付帯の販売数量。件数の多い方面トップ10に絞って表示する。
 */
function renderDestinationComboChart_(rows) {
  var items = [
    { qtyKey: 'insuranceQty', label: '保険', color: '#1d4ed8' },
    { qtyKey: 'wifiQty', label: 'Wifi', color: '#f59e0b' },
    { qtyKey: 'cansapoQty', label: 'キャンサポ', color: '#ec4899' },
    { qtyKey: 'tavicaQty', label: 'TAViCA', color: '#8b5cf6' }
  ];
  var countMap = countBy_(rows, 'destination');
  var topDestinations = topEntries_(countMap, 10).map(function (e) { return e[0]; });

  var qtyByDestination = {};
  topDestinations.forEach(function (d) {
    qtyByDestination[d] = { insuranceQty: 0, wifiQty: 0, cansapoQty: 0, tavicaQty: 0 };
  });
  rows.forEach(function (r) {
    var d = (r.destination === null || r.destination === undefined || r.destination === '') ? '(空欄)' : r.destination;
    if (!qtyByDestination[d]) return;
    items.forEach(function (it) {
      if (typeof r[it.qtyKey] === 'number') qtyByDestination[d][it.qtyKey] += r[it.qtyKey];
    });
  });

  upsertChart_('chart-destination', {
    data: {
      labels: topDestinations,
      datasets: [
        { type: 'bar', label: '予約件数', data: topDestinations.map(function (d) { return countMap[d]; }), backgroundColor: '#c7d2fe', yAxisID: 'y' }
      ].concat(items.map(function (it) {
        return {
          type: 'line', label: it.label, data: topDestinations.map(function (d) { return qtyByDestination[d][it.qtyKey]; }),
          borderColor: it.color, backgroundColor: it.color, yAxisID: 'y1', tension: 0.25
        };
      }))
    },
    options: {
      responsive: true,
      interaction: { mode: 'index', intersect: false },
      plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 10 } } } },
      scales: {
        y: { beginAtZero: true, ticks: { precision: 0, font: { size: 9 } } },
        y1: { beginAtZero: true, position: 'right', grid: { drawOnChartArea: false }, ticks: { precision: 0, font: { size: 9 } } },
        x: { ticks: { font: { size: 9 } } }
      }
    }
  });
}

function renderCategoryChart_(rows) {

/** 営業所別ランキング：個人別サマリーと同じ集計（エリア・営業所・担当者ごとの記録件数と付帯実績）を使う。 */
function renderRanking() {
  var list = buildPersonalSummary_(STATE.dashFiltered);
  var key = STATE.rankingSortKey, dir = STATE.rankingSortDir;
  list.sort(function (a, b) {
    if (key === 'area') return a.area.localeCompare(b.area, 'ja') * dir;
    if (key === 'office') return a.office.localeCompare(b.office, 'ja') * dir;
    if (key === 'staff') return formatStaffName_(a.staff).localeCompare(formatStaffName_(b.staff), 'ja') * dir;
    return (a[key] - b[key]) * dir;
  });
  renderSortMarks_('tab-panel-dashboard', key, dir);

  var tbody = document.getElementById('ranking-tbody');
  if (list.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-slate-400 py-6">データがありません</td></tr>';
    return;
  }
  tbody.innerHTML = list.map(function (b) {
    return '<tr class="hover:bg-slate-50">' +
      '<td class="px-3 py-2">' + escapeHtml(b.area) + '</td>' +
      '<td class="px-3 py-2">' + escapeHtml(b.office) + '</td>' +
      '<td class="px-3 py-2">' + escapeHtml(formatStaffName_(b.staff)) + '</td>' +
      '<td class="px-3 py-2 text-right">' + formatNumber(b.count) + '</td>' +
      '<td class="px-3 py-2 text-right">' + formatAncillaryTallyCell_(b.insurance) + '</td>' +
      '<td class="px-3 py-2 text-right">' + formatAncillaryTallyCell_(b.wifi) + '</td>' +
      '<td class="px-3 py-2 text-right">' + formatAncillaryTallyCell_(b.cansapo) + '</td>' +
      '<td class="px-3 py-2 text-right">' + formatAncillaryTallyCell_(b.tavica) + '</td>' +
      '</tr>';
  }).join('');
}

// ============================================================================
// 予約データ一覧タブ：フィルタ・列の並び替え・編集・並べ替え・ページング
// ============================================================================

function applyDataFilters() {
  var areaSet = toSet_(getSelectedValues_('data-filter-area'));
  var officeSet = toSet_(getSelectedValues_('data-filter-office'));
  var staffSet = toSet_(getSelectedValues_('data-filter-staff'));
  var dateFrom = document.getElementById('data-filter-date-from').value || '';
  var dateTo = document.getElementById('data-filter-date-to').value || '';
  var insuranceStsSet = toSet_(getSelectedValues_('data-filter-insurance-status'));
  var wifiStsSet = toSet_(getSelectedValues_('data-filter-wifi-status'));
  var tavicaStsSet = toSet_(getSelectedValues_('data-filter-tavica-status'));
  var cansapoStsSet = toSet_(getSelectedValues_('data-filter-cansapo-status'));

  STATE.dataFiltered = STATE.rows.filter(function (r) {
    if (areaSet && !areaSet[r.area]) return false;
    if (officeSet && !officeSet[r.office]) return false;
    if (staffSet && !staffSet[r.staff]) return false;
    var dep = r.departureDate;
    if (dateFrom && (!dep || dep < dateFrom)) return false;
    if (dateTo && (!dep || dep > dateTo)) return false;
    if (insuranceStsSet && !insuranceStsSet[normalizeAncillaryStatus_(r.insuranceStatus)]) return false;
    if (wifiStsSet && !wifiStsSet[normalizeAncillaryStatus_(r.wifiStatus)]) return false;
    if (tavicaStsSet && !tavicaStsSet[normalizeAncillaryStatus_(r.tavicaStatus)]) return false;
    if (cansapoStsSet && !cansapoStsSet[normalizeAncillaryStatus_(r.cansapoStatus)]) return false;
    return true;
  });

  // フィルタ変更で画面から隠れた行の選択は、本人が見えないまま一括編集の対象になってしまうため解除する。
  var visibleRowIndexes = {};
  STATE.dataFiltered.forEach(function (r) { visibleRowIndexes[r.rowIndex] = true; });
  Object.keys(STATE.selectedRowIndexes).forEach(function (ri) {
    if (!visibleRowIndexes[ri]) delete STATE.selectedRowIndexes[ri];
  });

  document.getElementById('data-filter-summary').textContent =
    STATE.dataFiltered.length + ' 件を表示中（あなたが閲覧できる ' + STATE.rows.length + ' 件中）';

  STATE.dataPage = 1;
  renderDataTable();
}

function clearDataFilters() {
  ['data-filter-area', 'data-filter-office', 'data-filter-staff',
    'data-filter-insurance-status', 'data-filter-wifi-status', 'data-filter-tavica-status', 'data-filter-cansapo-status'].forEach(function (id) {
    Array.from(document.getElementById(id).options).forEach(function (o) { o.selected = false; });
  });
  document.getElementById('data-filter-date-from').value = '';
  document.getElementById('data-filter-date-to').value = '';
  updateDataOfficeStaffFilterOptions_();
  applyDataFilters();
}

function renderDataThead() {
  var thead = document.getElementById('data-thead');
  var checkboxTh = '<th class="px-2 py-2 text-center w-8"><input type="checkbox" id="data-select-all-page" title="このページの行をすべて選択"></th>';
  thead.innerHTML = '<tr>' + checkboxTh + STATE.columnOrder.map(function (key) {
    var def = DISPLAY_COLUMN_DEFS_BY_KEY[key];
    if (!def) return '';
    var sortable = def.kind !== 'ancillary';
    var col = def.kind === 'csv' ? STATE.columnByKey[def.field] : null;
    var align = (col && col.type === 'number') ? 'text-right' : (def.kind === 'ancillary' ? 'text-center' : 'text-left');
    var editableBg = def.kind === 'ancillary' || def.kind === 'date' || def.kind === 'memo' ? ' bg-blue-50' : '';
    var mark = (sortable && STATE.dataSortKey === key) ? ('<span class="sort-mark">' + (STATE.dataSortDir > 0 ? '▲' : '▼') + '</span>') : '';
    var cls = (sortable ? 'sortable ' : '') + 'px-3 py-2 ' + align + editableBg;
    var dataSort = sortable ? ' data-sort="' + key + '"' : '';
    return '<th class="' + cls + '"' + dataSort + '>' + escapeHtml(def.label) + mark + '</th>';
  }).join('') + '</tr>';

  thead.querySelectorAll('.sortable').forEach(function (th) {
    th.addEventListener('click', function () {
      var key = th.getAttribute('data-sort');
      if (STATE.dataSortKey === key) STATE.dataSortDir *= -1; else { STATE.dataSortKey = key; STATE.dataSortDir = 1; }
      renderDataThead();
      renderDataTable();
    });
  });

  document.getElementById('data-select-all-page').addEventListener('change', function (e) {
    var checked = e.target.checked;
    STATE.currentPageRowIndexes.forEach(function (ri) {
      if (checked) STATE.selectedRowIndexes[ri] = true; else delete STATE.selectedRowIndexes[ri];
    });
    renderDataTable();
  });
}

function compareRows_(a, b, def) {
  if (!def) return 0;
  var va = a[def.field], vb = b[def.field];
  var type = def.kind === 'csv' ? STATE.columnByKey[def.field].type : (def.kind === 'date' ? 'date' : 'text');
  var aEmpty = (va === null || va === undefined || va === '');
  var bEmpty = (vb === null || vb === undefined || vb === '');
  if (aEmpty && bEmpty) return 0;
  if (aEmpty) return 1;
  if (bEmpty) return -1;
  if (type === 'number') return va - vb;
  // 担当者は画面に表示している氏名（担当者マスタで変換した名前）の順に並べる。
  if (def.field === 'staff') return String(formatStaffName_(va)).localeCompare(String(formatStaffName_(vb)), 'ja');
  return String(va).localeCompare(String(vb), 'ja');
}

/** 予約データ一覧に表示する順（今の並べ替え）にした行の配列。 */
function sortedDataRows_() {
  var def = DISPLAY_COLUMN_DEFS_BY_KEY[STATE.dataSortKey];
  var rows = STATE.dataFiltered.slice();
  rows.sort(function (a, b) { return compareRows_(a, b, def) * STATE.dataSortDir; });
  return rows;
}

/** 指定した行が載っているページを開く（今の絞り込み結果に無ければfalse）。 */
function showDataRow_(rowIndex) {
  var rows = sortedDataRows_();
  for (var i = 0; i < rows.length; i++) {
    if (rows[i].rowIndex === rowIndex) {
      STATE.dataPage = Math.floor(i / STATE.dataPageSize) + 1;
      if (STATE.activeTab !== 'data') switchTab('data');
      renderDataTable();
      return true;
    }
  }
  return false;
}

function renderDataTable() {
  var rows = sortedDataRows_();

  var total = rows.length;
  var totalPages = Math.max(1, Math.ceil(total / STATE.dataPageSize));
  if (STATE.dataPage > totalPages) STATE.dataPage = totalPages;
  var start = (STATE.dataPage - 1) * STATE.dataPageSize;
  var pageRows = rows.slice(start, start + STATE.dataPageSize);

  var tbody = document.getElementById('data-tbody');
  document.getElementById('data-empty').classList.toggle('hidden', total > 0);
  hideHoverTooltip_(); // 再描画でホバー中の要素が消えると、ツールチップが消えずに残るため

  // アーカイブ済みの行（閲覧専用）は、「このページを全選択」や一括登録の対象に含めない。
  STATE.currentPageRowIndexes = pageRows.filter(function (r) { return !r.isArchived; }).map(function (r) { return r.rowIndex; });

  tbody.innerHTML = pageRows.map(function (r) {
    // アーカイブ済みの行（別スプレッドシートから読み込んだ過去データ）は閲覧専用。
    // 一括登録の選択対象にもしない（選択チェックボックスの代わりに鍵アイコンを表示する）。
    var checkboxTd = r.isArchived
      ? '<td class="px-2 py-2 text-center text-slate-300" title="アーカイブ済み（閲覧専用）"><i class="fa-solid fa-lock"></i></td>'
      : (function () {
          var checked = STATE.selectedRowIndexes[r.rowIndex] ? ' checked' : '';
          return '<td class="px-2 py-2 text-center"><input type="checkbox" class="row-select-checkbox" data-row="' + r.rowIndex + '"' + checked + '></td>';
        })();
    var rowClass = r.isArchived ? 'hover:bg-amber-50 bg-amber-50/40' : 'hover:bg-slate-50';
    return '<tr class="' + rowClass + '" data-row-index="' + r.rowIndex + '">' + checkboxTd + STATE.columnOrder.map(function (key) {
      return buildCellHtml_(r, DISPLAY_COLUMN_DEFS_BY_KEY[key]);
    }).join('') + '</tr>';
  }).join('');

  document.getElementById('pagination-info').textContent =
    total === 0 ? '0件' : (start + 1) + '〜' + Math.min(start + STATE.dataPageSize, total) + ' / ' + total + '件';
  document.getElementById('btn-prev-page').disabled = STATE.dataPage <= 1;
  document.getElementById('btn-next-page').disabled = STATE.dataPage >= totalPages;

  syncSelectAllCheckbox_();
  updateBulkEditBar_();
}

/** ヘッダーの「このページを全選択」チェックボックスを、現在の選択状態に合わせて更新する（全選択／一部選択／未選択）。 */
function syncSelectAllCheckbox_() {
  var cb = document.getElementById('data-select-all-page');
  if (!cb) return;
  var pageIndexes = STATE.currentPageRowIndexes;
  var allSelected = pageIndexes.length > 0 && pageIndexes.every(function (ri) { return !!STATE.selectedRowIndexes[ri]; });
  var someSelected = pageIndexes.some(function (ri) { return !!STATE.selectedRowIndexes[ri]; });
  cb.checked = allSelected;
  cb.indeterminate = !allSelected && someSelected;
}

function getSelectedRowIndexes_() { return Object.keys(STATE.selectedRowIndexes).map(Number); }

function clearRowSelection_() {
  STATE.selectedRowIndexes = {};
  syncSelectAllCheckbox_();
  updateBulkEditBar_();
  renderDataTable();
}

/** 一括登録バーの表示・選択件数を、現在の選択状態に合わせて更新する。 */
function updateBulkEditBar_() {
  var count = getSelectedRowIndexes_().length;
  var countEl = document.getElementById('bulk-selected-count');
  if (countEl) countEl.textContent = count;
  var bar = document.getElementById('bulk-edit-bar');
  if (bar) bar.classList.toggle('hidden', count === 0);
}

function formatCell_(v, col) {
  if (v === null || v === undefined || v === '') return '<span class="text-slate-300">－</span>';
  if (col.type === 'number') return formatNumber(v);
  if (col.type === 'date') return escapeHtml(String(v).replace(/-/g, '/'));
  return escapeHtml(String(v));
}

/** 保険/Wifi/TAViCA/キャンサポ：ステータスに応じて数量欄を編集できるかどうか（〇・☆のみ入力必須で編集可）。 */
function isAncillaryQtyEditable_(status) {
  return status === '〇' || status === '☆';
}

function buildCellHtml_(row, def) {
  if (!def) return '<td></td>';
  var archived = !!row.isArchived;

  if (def.kind === 'csv') {
    var col = STATE.columnByKey[def.field];
    var align = col.type === 'number' ? 'text-right' : 'text-left';
    var displayValue = row[def.field];
    if (def.field === 'staff' && displayValue) displayValue = formatStaffName_(displayValue);
    if (def.field === 'reservationNo') {
      var badge = archived ? '<span class="text-[10px] font-semibold text-amber-600 bg-amber-100 rounded px-1 py-0.5 mr-1" title="アーカイブ済み（閲覧専用）">アーカイブ</span>' : '';
      if (displayValue) {
        var challengeUrl = buildChallengeRecordUrl_(displayValue);
        if (challengeUrl) {
          return '<td class="px-3 py-2 ' + align + '">' + badge + '<a href="' + escapeHtml(challengeUrl) + '" target="_blank" rel="noopener noreferrer" class="text-blue-700 hover:underline">' + escapeHtml(displayValue) + '</a></td>';
        }
        return '<td class="px-3 py-2 ' + align + '">' + badge + formatCell_(displayValue, col) + '</td>';
      }
      return '<td class="px-3 py-2 ' + align + '">' + badge + formatCell_(displayValue, col) + '</td>';
    }
    return '<td class="px-3 py-2 ' + align + '">' + formatCell_(displayValue, col) + '</td>';
  }

  // アーカイブ済みの行は、現場入力項目（CHK日・保険/Wifi/TAViCA/キャンサポ・メモ）も
  // 編集用の入力欄ではなく、通常のCSV項目と同じ読み取り専用表示にする
  // （アーカイブ先スプレッドシートへの書き戻しには対応していないため）。
  if (archived) {
    if (def.kind === 'date') {
      return '<td class="px-3 py-2 text-left">' + formatCell_(row[def.field], { type: 'date' }) + '</td>';
    }
    if (def.kind === 'memo') {
      var mv0 = row[def.field] || '';
      var truncated0 = mv0.length > 10 ? mv0.slice(0, 10) + '…' : mv0;
      return '<td class="px-3 py-2 text-left"' + (mv0 ? ' title="' + escapeHtml(mv0) + '"' : '') + '>' + (mv0 ? escapeHtml(truncated0) : '<span class="text-slate-300">－</span>') + '</td>';
    }
    if (def.kind === 'ancillary') {
      var item0 = STATE.ancillaryItemByKey[def.item];
      var status0 = normalizeAncillaryStatus_(row[item0.statusKey]);
      var qty0 = row[item0.qtyKey];
      var text0 = status0 + (qty0 !== null && qty0 !== undefined && qty0 !== '' ? '（' + formatNumber(qty0) + '）' : '');
      return '<td class="px-3 py-2 text-center">' + escapeHtml(text0) + '</td>';
    }
  }

  if (def.kind === 'date') {
    var dv = row[def.field] || '';
    var pendingDate = hasPendingFieldChange_(row.rowIndex, def.field) ? ' pending-edit' : '';
    return '<td class="editable-cell px-2 py-1"><input type="date" data-row="' + row.rowIndex + '" data-col="' + def.field + '" value="' + escapeHtml(dv) + '" class="border border-slate-300 rounded px-1 py-1 text-xs w-32' + pendingDate + '"></td>';
  }

  if (def.kind === 'memo') {
    var mv = row[def.field] || '';
    var truncated = mv.length > 10 ? mv.slice(0, 10) + '…' : mv;
    var pendingMemo = hasPendingFieldChange_(row.rowIndex, def.field) ? ' pending-edit' : '';
    var display = mv
      ? '<span class="memo-display' + pendingMemo + '" data-row="' + row.rowIndex + '" data-col="' + def.field + '" data-tooltip="' + escapeHtml(mv) + '">' + escapeHtml(truncated) + '</span>'
      : '<span class="memo-display text-slate-300' + pendingMemo + '" data-row="' + row.rowIndex + '" data-col="' + def.field + '">（ダブルクリックで入力）</span>';
    return '<td class="editable-cell px-2 py-1">' + display + '</td>';
  }

  if (def.kind === 'ancillary') {
    var item = STATE.ancillaryItemByKey[def.item];
    var status = normalizeAncillaryStatus_(row[item.statusKey]);
    var qty = row[item.qtyKey];
    var reason = row[item.reasonKey];
    var opts = STATE.ancillaryStatusOptions.map(function (o) {
      return '<option value="' + o.value + '"' + (status === o.value ? ' selected' : '') + '>' + o.value + ' ' + escapeHtml(o.label) + '</option>';
    }).join('');
    var qtyEditable = isAncillaryQtyEditable_(status);
    var qtyVal = (qty === null || qty === undefined) ? '' : qty;
    var qtyTooltip = (status === '×' && reason) ? ' data-tooltip="失注理由：' + escapeHtml(reason) + '"' : '';
    var flagged = (status === '〇' || status === '☆') && (qty === null || qty === undefined || qty === '') ? ' ancillary-flagged' : '';
    var pendingAncillary = hasPendingAncillaryChange_(row.rowIndex, item.key) ? ' pending-edit' : '';
    // 失注（×）の行は、同じ「×」を選び直しても変更イベントが起きず理由を直せないため、理由の編集ボタンを出す。
    var reasonBtn = status === '×'
      ? '<button type="button" class="ancillary-reason-edit text-slate-400 hover:text-blue-700 text-xs px-1" data-row="' + row.rowIndex + '" data-item="' + item.key + '" title="失注理由を編集" aria-label="失注理由を編集">✎</button>'
      : '';
    return '<td class="editable-cell px-2 py-1 text-center">' +
      '<div class="flex items-center justify-center gap-1"' + qtyTooltip + '>' +
      '<select data-row="' + row.rowIndex + '" data-col="' + item.statusKey + '" data-item="' + item.key + '" class="ancillary-status border border-slate-300 rounded px-1 py-1 text-xs' + pendingAncillary + '">' + opts + '</select>' +
      '<input type="number" min="0" step="1" data-row="' + row.rowIndex + '" data-col="' + item.qtyKey + '" data-item="' + item.key + '" value="' + escapeHtml(String(qtyVal)) + '" ' + (qtyEditable ? '' : 'disabled') + ' class="ancillary-qty' + flagged + pendingAncillary + ' border border-slate-300 rounded px-1 py-1 text-xs w-14" placeholder="数">' +
      reasonBtn +
      '</div></td>';
  }

  return '<td class="px-3 py-2"></td>';
}

// ============================================================================
// 予約データ一覧：編集の「まとめて保存する」（他のリセール管理システムと同様、
// 1項目ずつ即時保存するのではなく、複数の編集をためておいて1回のボタン操作でまとめて保存する）
// ============================================================================

function pendingKey_(rowIndex, fieldOrItem) { return rowIndex + '|' + fieldOrItem; }
function hasPendingFieldChange_(rowIndex, columnKey) { return !!STATE.pendingChanges[pendingKey_(rowIndex, columnKey)]; }
function hasPendingAncillaryChange_(rowIndex, itemKey) { return !!STATE.pendingChanges[pendingKey_(rowIndex, 'ancillary:' + itemKey)]; }

/** 保険/Wifi/TAViCA/キャンサポの未保存変更レコードを取得（無ければ現在値をoriginalとして新規作成）する。 */
function getOrCreatePendingAncillary_(rowIndex, itemKey) {
  var key = pendingKey_(rowIndex, 'ancillary:' + itemKey);
  if (!STATE.pendingChanges[key]) {
    var row = STATE.rows.filter(function (r) { return r.rowIndex === rowIndex; })[0];
    var item = STATE.ancillaryItemByKey[itemKey];
    STATE.pendingChanges[key] = {
      kind: 'ancillary', rowIndex: rowIndex, itemKey: itemKey,
      original: { status: row[item.statusKey], qty: row[item.qtyKey], reason: row[item.reasonKey] }
    };
  }
  return STATE.pendingChanges[key];
}

/** 画面に表示している行の行トークン（保存時にサーバーで今の行と照合する値）。 */
function rowTokenOf_(rowIndex) {
  var row = findRow_(rowIndex);
  return row && row._t ? row._t : null;
}

/** rowIndexの行データを返す（無ければundefined）。数万行でも速く引けるよう、行番号の索引を作って使う。 */
function findRow_(rowIndex) {
  if (STATE.rowIndexMapFor !== STATE.rows) {
    var map = Object.create(null);
    STATE.rows.forEach(function (r) { map[r.rowIndex] = r; });
    STATE.rowIndexMap = map;
    STATE.rowIndexMapFor = STATE.rows;
  }
  return STATE.rowIndexMap[rowIndex];
}

/**
 * 予約データ一覧の、1行の1項目（CHK日・メモ・付帯商品1件）のセルだけを描き直す。
 * 表全体（tbody）を作り直すと、編集を確定した瞬間（入力欄からフォーカスが外れた瞬間）に、
 * 次にクリック・Tabキーで移ろうとしていた別のセルの入力欄やプルダウンまで作り直されてしまい、
 * クリックが空振りしたりフォーカスが消えたりするため。並べ替え・絞り込みもこの時点では適用し直さない
 * （入力した瞬間に行が別の位置・別のページへ飛ばないようにするため。次に絞り込み・並べ替え・
 * ページ移動をした時点で反映される）。該当セルが今のページに表示されていなければfalseを返す。
 */
function refreshDataCell_(rowIndex, displayKey) {
  var colPos = STATE.columnOrder.indexOf(displayKey);
  if (colPos === -1) return false;
  var findTd = function () {
    var tr = document.querySelector('#data-tbody tr[data-row-index="' + rowIndex + '"]');
    return tr ? tr.children[colPos + 1] : null; // 先頭の列は選択チェックボックス
  };
  var td = findTd();
  if (!td) return false;
  // 差し替えるセルの中の入力欄に入力中の場合は、先に入力を確定させる。差し替えの途中で入力欄が
  // 取り除かれると、その瞬間に確定処理（同じセルの描き直し）が割り込み、差し替え先のセルが
  // 既に無くなっている状態になるため（確定処理が描き直した後のセルを改めて探して差し替える）。
  var active = document.activeElement;
  if (active && active !== document.body && td.contains(active)) {
    active.blur();
    td = findTd();
    if (!td) return false;
  }
  var row = findRow_(rowIndex);
  if (!row) return false;
  var holder = document.createElement('tbody');
  holder.innerHTML = '<tr>' + buildCellHtml_(row, DISPLAY_COLUMN_DEFS_BY_KEY[displayKey]) + '</tr>';
  hideHoverTooltip_();
  if (!td.parentNode) return false;
  td.replaceWith(holder.firstChild.firstChild);
  return true;
}

/**
 * 画面を編集した直後の共通処理（この時点ではまだサーバーには保存しない）。
 * rowIndexとdisplayKey（CHK日='chkDate'、メモ='memo'、付帯商品=itemKey）が指定されれば、
 * 予約データ一覧はそのセルだけを描き直す（refreshDataCell_参照）。指定が無ければ表全体を描き直す。
 * ダッシュボード（グラフ7〜8個）・個人別サマリーは、今見えていないタブなら再描画せず
 * 「汚れている」フラグだけ立て、実際にそのタブへ切り替えられた時に再描画する
 * （1件編集するたびに非表示のグラフまで全部再描画する無駄を避けるため）。
 */
function afterLocalEdit_(rowIndex, displayKey) {
  if (rowIndex === undefined || !refreshDataCell_(rowIndex, displayKey)) renderDataTable();
  if (STATE.activeTab === 'dashboard') applyDashFilters(); else STATE.dashDirty = true;
  if (STATE.activeTab === 'personal') renderPersonalTab(); else STATE.personalDirty = true;
  updatePendingChangesBar_();
}
// 旧名（他の箇所からの呼び出しと互換のため残す）。
function afterCellSaved_() { afterLocalEdit_(); }

/** 未入力（null・undefined・空文字）を同じものとみなして、2つの値が同じかを判定する。 */
function sameEditValue_(a, b) {
  var na = (a === null || a === undefined || a === '') ? null : String(a).trim();
  var nb = (b === null || b === undefined || b === '') ? null : String(b).trim();
  return na === nb;
}

/**
 * 保留中の変更が、結果的に元の値と同じになった（何も変えずにフォーカスを外した・元の値に戻した）
 * 場合は、「未保存の変更」から取り除く。
 */
function prunePendingIfUnchanged_(key) {
  var c = STATE.pendingChanges[key];
  if (!c) return;
  var unchanged = c.kind === 'field'
    ? sameEditValue_(c.value, c.original)
    : (normalizeAncillaryStatus_(c.status) === normalizeAncillaryStatus_(c.original.status) &&
       sameEditValue_(c.qty, c.original.qty) && sameEditValue_(c.reason, c.original.reason));
  if (unchanged) delete STATE.pendingChanges[key];
}

/** 未保存の変更バー（件数表示・保存/取消ボタン）の表示を更新する。 */
function updatePendingChangesBar_() {
  var count = Object.keys(STATE.pendingChanges).length;
  var countEl = document.getElementById('pending-changes-count');
  if (countEl) countEl.textContent = count;
  var bar = document.getElementById('pending-changes-bar');
  if (bar) bar.classList.toggle('hidden', count === 0);
}

/**
 * 一覧の編集セル1つ分を画面上でだけ変更する（CHK日・メモに使う。保険等のステータス/数量は専用の
 * ハンドラーを使う）。サーバーへは送らず、「まとめて保存する」を押すまで保留する。
 */
function saveCell(rowIndex, columnKey, value) {
  var row = findRow_(rowIndex);
  if (!row) return;
  // サーバー側でも前後の空白は取り除いて保存するため、画面上の値もそろえておく。
  var trimmed = (value === undefined || value === null) ? '' : String(value).trim();
  var normalized = trimmed === '' ? null : trimmed;

  var key = pendingKey_(rowIndex, columnKey);
  if (!STATE.pendingChanges[key]) {
    if (sameEditValue_(normalized, row[columnKey])) {
      // 値を変えずにフォーカスを外しただけ：未保存の変更にはしない（メモの編集欄を表示に戻すだけ）。
      afterLocalEdit_(rowIndex, columnKey);
      return;
    }
    STATE.pendingChanges[key] = { kind: 'field', rowIndex: rowIndex, columnKey: columnKey, original: row[columnKey] };
  }
  STATE.pendingChanges[key].value = normalized;
  row[columnKey] = normalized;
  prunePendingIfUnchanged_(key);

  afterLocalEdit_(rowIndex, columnKey);
}

/**
 * 保険/Wifi/TAViCA/キャンサポのステータスが変更されたときの処理。
 * ・「×（失注）」を選ぶと理由の入力を求める（キャンセルした場合は選択を元に戻す）。
 * ・「〇（NB付帯）」「☆（PUSH成約）」を選んだときに数量が未入力なら、アラートで入力を促す。
 * ・それ以外（NO ACT／セールス中）に変えたときは数量・理由をクリアする。
 * いずれも画面上の変更を保留するだけで、サーバーへの保存は「まとめて保存する」を押すまで行わない。
 */
function handleAncillaryStatusChange(selectEl) {
  var rowIndex = Number(selectEl.dataset.row);
  var itemKey = selectEl.dataset.item;
  var item = STATE.ancillaryItemByKey[itemKey];
  var row = STATE.rows.filter(function (r) { return r.rowIndex === rowIndex; })[0];
  if (!row || !item) return;
  var previousStatus = normalizeAncillaryStatus_(row[item.statusKey]);
  var newStatus = selectEl.value;

  if (newStatus === '×') {
    var reason = window.prompt('失注理由を入力してください（キャンセルすると変更されません）', row[item.reasonKey] || '');
    if (reason === null) {
      selectEl.value = previousStatus;
      return;
    }
    var pendingLost = getOrCreatePendingAncillary_(rowIndex, itemKey);
    pendingLost.status = '×';
    pendingLost.qty = 0;
    pendingLost.reason = reason.trim();
    row[item.statusKey] = '×';
    row[item.qtyKey] = 0;
    row[item.reasonKey] = reason.trim();
    prunePendingIfUnchanged_(pendingKey_(rowIndex, 'ancillary:' + itemKey));
    afterLocalEdit_(rowIndex, itemKey);
    return;
  }

  var pending = getOrCreatePendingAncillary_(rowIndex, itemKey);
  pending.status = newStatus;
  pending.qty = (newStatus === '〇' || newStatus === '☆') ? row[item.qtyKey] : null;
  pending.reason = null;

  row[item.statusKey] = newStatus;
  if (newStatus !== '〇' && newStatus !== '☆') row[item.qtyKey] = null;
  row[item.reasonKey] = null;
  prunePendingIfUnchanged_(pendingKey_(rowIndex, 'ancillary:' + itemKey));

  afterLocalEdit_(rowIndex, itemKey);

  if ((newStatus === '〇' || newStatus === '☆') && (row[item.qtyKey] === null || row[item.qtyKey] === undefined || row[item.qtyKey] === '')) {
    showToast(item.label + 'の数量が入力されていません。数量を入力してください。', 'error');
    setTimeout(function () {
      var qtyInput = document.querySelector('input.ancillary-qty[data-row="' + rowIndex + '"][data-item="' + itemKey + '"]');
      if (qtyInput) qtyInput.focus();
    }, 0);
  }
}

/**
 * 保険/Wifi/TAViCA/キャンサポの数量欄からフォーカスが外れたときの処理。
 * ステータスが「〇」「☆」なのに数量が未入力ならアラートを出して保留しない（値も変更しない）。
 */
function handleAncillaryQtyBlur(inputEl) {
  var rowIndex = Number(inputEl.dataset.row);
  var itemKey = inputEl.dataset.item;
  var item = STATE.ancillaryItemByKey[itemKey];
  var row = STATE.rows.filter(function (r) { return r.rowIndex === rowIndex; })[0];
  if (!row || !item) return;
  var status = normalizeAncillaryStatus_(row[item.statusKey]);
  var currentQty = row[item.qtyKey];
  // 入力欄の表示を、内部で保持している数量（変更しなかった場合は元の値）に戻す。
  var restoreInput = function () {
    inputEl.value = (currentQty === null || currentQty === undefined) ? '' : String(currentQty);
  };
  if (!isAncillaryQtyEditable_(status)) { restoreInput(); return; }

  // 入力欄が数値として読めない文字（記号だけ等）の場合も、ブラウザはvalueを空文字にする。
  var raw = inputEl.value.trim();
  if (raw === '') {
    // ここで inputEl.focus() を呼ぶと、自分自身のblurハンドラーの中で再度フォーカスし直すことになり、
    // ブラウザによってはblur→focus→blur…の無限ループ（アラートが閉じられず画面が固まる不具合）を招く。
    // そのためフォーカスは戻さず、トースト通知のみで知らせる。値は変更せず、表示も元の値に戻す
    // （空欄の表示のまま内部の値だけ元の数量が残り、見た目と実データが食い違うのを防ぐ）。
    showToast(item.label + 'の数量が入力されていません。数量を入力してください。', 'error');
    restoreInput();
    return;
  }
  var n = Number(raw);
  if (!isFinite(n) || n < 0) {
    showToast('数量には0以上の数値を入力してください。', 'error');
    restoreInput();
    return;
  }
  // サーバー側と同じく0以上の整数にそろえる（小数は切り捨て）。画面の表示・集計と保存値を一致させるため。
  var normalizedQty = Math.floor(n);
  if (sameEditValue_(normalizedQty, currentQty)) { restoreInput(); return; }
  var pending = getOrCreatePendingAncillary_(rowIndex, itemKey);
  pending.status = status;
  pending.qty = normalizedQty;
  pending.reason = row[item.reasonKey];
  row[item.qtyKey] = normalizedQty;
  prunePendingIfUnchanged_(pendingKey_(rowIndex, 'ancillary:' + itemKey));
  afterLocalEdit_(rowIndex, itemKey);
}

/** 失注（×）の行で、失注理由だけを編集し直す（同じ「×」を選び直しても変更イベントが起きないため）。 */
function editAncillaryReason_(btn) {
  var rowIndex = Number(btn.dataset.row);
  var itemKey = btn.dataset.item;
  var item = STATE.ancillaryItemByKey[itemKey];
  var row = findRow_(rowIndex);
  if (!row || !item || normalizeAncillaryStatus_(row[item.statusKey]) !== '×') return;
  var reason = window.prompt('失注理由を入力してください（キャンセルすると変更されません）', row[item.reasonKey] || '');
  if (reason === null) return;
  var pending = getOrCreatePendingAncillary_(rowIndex, itemKey);
  pending.status = '×';
  pending.qty = 0;
  pending.reason = reason.trim();
  row[item.reasonKey] = reason.trim();
  prunePendingIfUnchanged_(pendingKey_(rowIndex, 'ancillary:' + itemKey));
  afterLocalEdit_(rowIndex, itemKey);
}

/** 「まとめて保存する」：保留中の変更をすべて1回のサーバー呼び出しで反映する。 */
function saveAllPendingChanges_() {
  // 一覧の入力欄に入力中（確定前）の内容があれば、先に確定させてから保存対象に含める。
  var active = document.activeElement;
  var tbody = document.getElementById('data-tbody');
  if (active && active !== document.body && tbody && tbody.contains(active)) active.blur();
  var sentKeys = Object.keys(STATE.pendingChanges);
  var changes = sentKeys.map(function (k) { return STATE.pendingChanges[k]; });
  if (changes.length === 0) return;

  // 「〇（NB付帯）」「☆（PUSH成約）」なのに数量が空欄の変更は保存させない（件数と数量合計の集計が合わなくなるため）。
  var missingQty = changes.filter(function (c) {
    return c.kind === 'ancillary' && (c.status === '〇' || c.status === '☆') &&
      (c.qty === null || c.qty === undefined || c.qty === '');
  });
  if (missingQty.length > 0) {
    var first = missingQty[0];
    var firstItem = STATE.ancillaryItemByKey[first.itemKey];
    showToast('「〇」「☆」なのに数量が入力されていない変更が' + missingQty.length + '件あります（例：' +
      (firstItem ? firstItem.label : '') + '）。数量を入力してから保存してください。', 'error');
    var qtyInput = document.querySelector('input.ancillary-qty[data-row="' + first.rowIndex + '"][data-item="' + first.itemKey + '"]');
    if (!qtyInput && showDataRow_(first.rowIndex)) {
      // 別のページにある場合は、そのページを開いてから入力欄に移る。
      qtyInput = document.querySelector('input.ancillary-qty[data-row="' + first.rowIndex + '"][data-item="' + first.itemKey + '"]');
    }
    if (qtyInput) {
      qtyInput.focus();
    } else {
      // 絞り込みで一覧に出ていない場合は、予約番号を知らせる。
      var hiddenRow = findRow_(first.rowIndex);
      showToast('数量が未入力の行は、今の絞り込み条件では一覧に表示されていません（予約番号：' +
        ((hiddenRow && hiddenRow.reservationNo) || '不明') + '）。絞り込みを解除して確認してください。', 'error');
    }
    return;
  }

  // 行トークン（画面に表示した時点の行の内容から作った値）も送り、サーバー側で今の行と照合させる。
  var payload = changes.map(function (c) {
    var token = rowTokenOf_(c.rowIndex);
    return c.kind === 'field'
      ? { kind: 'field', rowIndex: c.rowIndex, token: token, columnKey: c.columnKey, value: c.value }
      : { kind: 'ancillary', rowIndex: c.rowIndex, token: token, itemKey: c.itemKey, status: c.status, qty: c.qty, reason: c.reason };
  });

  showLoading(true);
  google.script.run
    .withSuccessHandler(function (result) {
      showLoading(false);
      // 保存できなかった変更は「未保存の変更」として残す（オレンジ枠のまま。「取り消す」で元の値に戻せる）。
      // 以前はすべて消していたため、保存に失敗した行も画面上は保存済みに見えていた。
      var errors = result.errors || [];
      var failedKeys = {};
      errors.forEach(function (err) {
        if (err.kind === 'field') failedKeys[pendingKey_(err.rowIndex, err.columnKey)] = true;
        else if (err.kind === 'ancillary') failedKeys[pendingKey_(err.rowIndex, 'ancillary:' + err.itemKey)] = true;
      });
      var sentKeySet = {};
      sentKeys.forEach(function (k) { sentKeySet[k] = true; });
      Object.keys(STATE.pendingChanges).forEach(function (k) {
        if (sentKeySet[k] && !failedKeys[k]) delete STATE.pendingChanges[k];
      });
      afterLocalEdit_();
      if (result.updated > 0) warmSnapshotSoon_();
      if (errors.length > 0) {
        showToast(formatNumber(result.updated) + '件を保存しました。' + formatNumber(errors.length) +
          '件は保存できませんでした（理由：' + errors[0].message + '）。保存できなかった変更は未保存のまま残しています。', 'error');
      } else {
        showToast(formatNumber(result.updated) + '件を保存しました', 'success');
      }
    })
    .withFailureHandler(function (err) { showLoading(false); onServerError(err); })
    .batchUpdateCells(payload);
}

/** 「取り消す」：保留中の変更をすべて画面上でも元に戻す（サーバーへは何も送らない）。 */
function discardPendingChanges_() {
  var count = Object.keys(STATE.pendingChanges).length;
  if (count === 0) return;
  if (!window.confirm('未保存の変更（' + count + '件）を取り消します。よろしいですか？')) return;

  Object.keys(STATE.pendingChanges).forEach(function (k) {
    var c = STATE.pendingChanges[k];
    var row = STATE.rows.filter(function (r) { return r.rowIndex === c.rowIndex; })[0];
    if (!row) return;
    if (c.kind === 'field') {
      row[c.columnKey] = c.original;
    } else {
      var item = STATE.ancillaryItemByKey[c.itemKey];
      row[item.statusKey] = c.original.status;
      row[item.qtyKey] = c.original.qty;
      row[item.reasonKey] = c.original.reason;
    }
  });
  STATE.pendingChanges = {};
  afterLocalEdit_();
  showToast('未保存の変更を取り消しました', 'info');
}

function bindPendingChangesEvents_() {
  document.getElementById('btn-save-pending-changes').addEventListener('click', saveAllPendingChanges_);
  document.getElementById('btn-discard-pending-changes').addEventListener('click', discardPendingChanges_);
}

// ============================================================================
// 予約データ一覧：一括登録（複数行を選択して同じ値をまとめて登録する）
// ============================================================================

/** 一括登録バーの保険/Wifi/キャンサポ/TAViCAステータス選択肢を、通常の行と同じ5段階で用意する。 */
function populateBulkAncillarySelects_() {
  document.querySelectorAll('.bulk-ancillary-status').forEach(function (el) {
    el.innerHTML = STATE.ancillaryStatusOptions.map(function (o) {
      return '<option value="' + o.value + '">' + o.value + ' ' + escapeHtml(o.label) + '</option>';
    }).join('');
    // 最初に選ばれている状態（NO ACT）では数量を入力できないようにする（入力しても使われないため）。
    var qtyInput = document.getElementById('bulk-' + el.dataset.item + '-qty');
    if (qtyInput) {
      qtyInput.disabled = !isAncillaryQtyEditable_(el.value);
      if (qtyInput.disabled) qtyInput.value = '';
    }
  });
}

/** 一括登録結果（成功件数・エラー件数）をバー下部に表示する。 */
function showBulkEditResult_(result) {
  if (result.updated > 0) warmSnapshotSoon_();
  var el = document.getElementById('bulk-edit-result');
  var lines = [formatNumber(result.updated) + '件に反映しました。'];
  if (result.errors && result.errors.length > 0) {
    lines.push('（' + formatNumber(result.errors.length) + '件は反映されませんでした。理由：' + result.errors[0].message + '）');
  }
  el.textContent = lines.join('');
  el.classList.remove('hidden');
  showToast(lines.join(''), result.errors && result.errors.length > 0 ? 'error' : 'success');
}

/** CHK日・メモの一括登録（選択中の行すべてに同じ値を設定する）。 */
function applyBulkField_(field) {
  var rowIndexes = getSelectedRowIndexes_();
  if (rowIndexes.length === 0) { showToast('行が選択されていません。', 'error'); return; }
  var value = field === 'chkDate'
    ? document.getElementById('bulk-chkdate-input').value
    : document.getElementById('bulk-memo-input').value;

  // 処理中にボタンを何度も押されないよう、完了まで読み込み中の表示で画面を覆う。
  showLoading(true);
  google.script.run
    .withSuccessHandler(function (result) {
      showLoading(false);
      var trimmed = String(value || '').trim();
      var normalized = trimmed === '' ? null : trimmed;
      var failedRowIndexes = {};
      (result.errors || []).forEach(function (err) { failedRowIndexes[err.rowIndex] = true; });
      rowIndexes.forEach(function (ri) {
        if (failedRowIndexes[ri]) return; // サーバー側で拒否された行には反映しない
        var row = STATE.rows.filter(function (r) { return r.rowIndex === ri; })[0];
        if (row) row[field] = normalized;
        // 一括登録はサーバーへ即時保存されるため、この行に関する未保存の変更（保留中）は
        // 古い値のまま残ってしまうと、後で「まとめて保存する」を押した際に今回の一括登録結果を
        // 上書きしてしまう。保存済みになった分の保留は破棄する。
        delete STATE.pendingChanges[pendingKey_(ri, field)];
      });
      afterCellSaved_();
      showBulkEditResult_(result);
    })
    .withFailureHandler(function (err) { showLoading(false); onServerError(err); })
    .bulkUpdateCellValue(rowIndexes, field, value, rowIndexes.map(rowTokenOf_));
}

/** 保険/Wifi/キャンサポ/TAViCAの一括登録（選択中の行すべてに同じステータス・数量を設定する）。 */
function applyBulkAncillary_(itemKey) {
  var rowIndexes = getSelectedRowIndexes_();
  if (rowIndexes.length === 0) { showToast('行が選択されていません。', 'error'); return; }
  var item = STATE.ancillaryItemByKey[itemKey];
  var status = document.getElementById('bulk-' + itemKey + '-status').value;
  var qtyInput = document.getElementById('bulk-' + itemKey + '-qty');
  var qty = qtyInput.value;
  var reason = '';

  if (status === '×') {
    reason = window.prompt('失注理由を入力してください（キャンセルすると変更されません）', '');
    if (reason === null) return;
  } else if ((status === '〇' || status === '☆') && qty.trim() === '') {
    showToast(item.label + 'の数量を入力してください。', 'error');
    return;
  } else if ((status === '〇' || status === '☆') && (!isFinite(Number(qty)) || Number(qty) < 0)) {
    showToast('数量には0以上の数値を入力してください。', 'error');
    return;
  }

  showLoading(true);
  google.script.run
    .withSuccessHandler(function (result) {
      showLoading(false);
      var failedRowIndexes = {};
      (result.errors || []).forEach(function (err) { failedRowIndexes[err.rowIndex] = true; });
      rowIndexes.forEach(function (ri) {
        if (failedRowIndexes[ri]) return; // サーバー側で拒否された行には反映しない
        var row = STATE.rows.filter(function (r) { return r.rowIndex === ri; })[0];
        if (!row) return;
        row[item.statusKey] = status;
        if (status === '×') {
          row[item.qtyKey] = 0;
          row[item.reasonKey] = reason.trim();
        } else if (status === '〇' || status === '☆') {
          row[item.qtyKey] = qty === '' ? null : Math.floor(Number(qty)); // サーバー側と同じく整数に切り捨て
          row[item.reasonKey] = null;
        } else {
          row[item.qtyKey] = null;
          row[item.reasonKey] = null;
        }
        // applyBulkField_と同様、保存済みになった分の保留中の変更は破棄する（古い値による上書きを防ぐ）。
        delete STATE.pendingChanges[pendingKey_(ri, 'ancillary:' + itemKey)];
      });
      afterCellSaved_();
      showBulkEditResult_(result);
    })
    .withFailureHandler(function (err) { showLoading(false); onServerError(err); })
    .bulkSetAncillaryStatus(rowIndexes, itemKey, status, qty, reason, rowIndexes.map(rowTokenOf_));
}

function bindBulkEditEvents_() {
  document.getElementById('btn-bulk-clear-selection').addEventListener('click', clearRowSelection_);
  document.querySelectorAll('.bulk-apply-field-btn').forEach(function (btn) {
    btn.addEventListener('click', function () { applyBulkField_(btn.dataset.field); });
  });
  document.querySelectorAll('.bulk-apply-ancillary-btn').forEach(function (btn) {
    btn.addEventListener('click', function () { applyBulkAncillary_(btn.dataset.item); });
  });
  document.querySelectorAll('.bulk-ancillary-status').forEach(function (sel) {
    sel.addEventListener('change', function () {
      var qtyInput = document.getElementById('bulk-' + sel.dataset.item + '-qty');
      qtyInput.disabled = !isAncillaryQtyEditable_(sel.value);
      if (qtyInput.disabled) qtyInput.value = '';
    });
  });
}

/** メモ欄をダブルクリックしたセルだけを、その場でテキスト入力に切り替える。 */
function beginMemoEdit_(span) {
  var rowIndex = Number(span.dataset.row);
  var columnKey = span.dataset.col;
  var current = span.getAttribute('data-tooltip') || '';
  var td = span.closest('td');
  // ホバー中の要素（span）を消すとツールチップを閉じるきっかけ（mouseout）が起きなくなるため、先に閉じる。
  hideHoverTooltip_();
  td.innerHTML = '<input type="text" class="memo-edit-input border border-slate-300 rounded px-1 py-1 text-xs w-48" data-row="' + rowIndex + '" data-col="' + columnKey + '" value="' + escapeHtml(current) + '">';
  var input = td.querySelector('input');
  input.focus();
  input.select();
}

function bindDataTableEditEvents_() {
  var tbody = document.getElementById('data-tbody');

  tbody.addEventListener('change', function (e) {
    var t = e.target;
    if (t.matches('input[type="date"][data-col]')) {
      saveCell(Number(t.dataset.row), t.dataset.col, t.value);
    } else if (t.matches('select.ancillary-status')) {
      handleAncillaryStatusChange(t);
    } else if (t.matches('input.row-select-checkbox')) {
      var rowIndex = Number(t.dataset.row);
      if (t.checked) STATE.selectedRowIndexes[rowIndex] = true; else delete STATE.selectedRowIndexes[rowIndex];
      syncSelectAllCheckbox_();
      updateBulkEditBar_();
    }
  });

  // blurはバブリングしないため、capture:trueでイベント委譲する
  tbody.addEventListener('blur', function (e) {
    var t = e.target;
    if (t.matches('input.memo-edit-input')) {
      if (t.dataset.cancelled === '1') {
        // Escキーで取り消した場合は保存せず、元の表示に戻すだけにする。
        afterLocalEdit_(Number(t.dataset.row), t.dataset.col);
        return;
      }
      saveCell(Number(t.dataset.row), t.dataset.col, t.value);
    } else if (t.matches('input.ancillary-qty')) {
      handleAncillaryQtyBlur(t);
    }
  }, true);

  // メモ欄・数量欄：Enterキーで確定、メモ欄はEscキーで取り消し。
  tbody.addEventListener('keydown', function (e) {
    var t = e.target;
    if (!t.matches('input.memo-edit-input, input.ancillary-qty')) return;
    if (e.key === 'Enter') {
      e.preventDefault();
      t.blur();
    } else if (e.key === 'Escape' && t.matches('input.memo-edit-input')) {
      e.preventDefault();
      t.dataset.cancelled = '1';
      t.blur();
    }
  });

  tbody.addEventListener('click', function (e) {
    var btn = e.target.closest('.ancillary-reason-edit');
    if (btn) editAncillaryReason_(btn);
  });

  tbody.addEventListener('dblclick', function (e) {
    var span = e.target.closest('.memo-display');
    if (span) beginMemoEdit_(span);
  });

  // メモ全文・失注理由のホバー表示（要素は再描画のたびに入れ替わるためイベント委譲する）
  tbody.addEventListener('mouseover', function (e) {
    var target = e.target.closest('[data-tooltip]');
    if (target) showHoverTooltip_(e.clientX, e.clientY, target.getAttribute('data-tooltip'));
  });
  tbody.addEventListener('mousemove', function (e) {
    var target = e.target.closest('[data-tooltip]');
    if (target) showHoverTooltip_(e.clientX, e.clientY, target.getAttribute('data-tooltip'));
  });
  tbody.addEventListener('mouseout', function (e) {
    if (e.target.closest('[data-tooltip]')) hideHoverTooltip_();
  });
  // 表や画面をスクロールすると、ツールチップだけが元の位置に取り残されるため閉じる。
  window.addEventListener('scroll', hideHoverTooltip_, true);
}

/** メモ全文・失注理由を表示する共通のホバーポップアップ。 */
function showHoverTooltip_(x, y, text) {
  if (!text) return;
  var el = document.getElementById('hover-tooltip');
  el.textContent = text;
  el.classList.remove('hidden');
  // 実際の大きさを測ってから、画面の右端・下端からはみ出さない位置に置く（狭い画面・画面下部でも見切れないように）。
  var margin = 8;
  var w = el.offsetWidth, h = el.offsetHeight;
  var left = Math.max(margin, Math.min(x + 12, window.innerWidth - w - margin));
  var top = y + 16;
  if (top + h > window.innerHeight - margin) top = Math.max(margin, y - h - 12);
  el.style.left = left + 'px';
  el.style.top = top + 'px';
}
function hideHoverTooltip_() {
  document.getElementById('hover-tooltip').classList.add('hidden');
}

/** 付帯商品1件分の集計初期値（合計数量・NB付帯件数・PUSH成約件数）。 */
function emptyAncillaryTally_() {
  return { qty: 0, nb: 0, push: 0 };
}
function addToAncillaryTally_(tally, row, item) {
  if (typeof row[item.qtyKey] === 'number') tally.qty += row[item.qtyKey];
  var status = row[item.statusKey];
  if (status === '〇') tally.nb++;
  else if (status === '☆') tally.push++;
}

function buildPersonalSummary_(rows) {
  var map = {};
  rows.forEach(function (r) {
    var key = (r.area || '(未設定)') + '\u0001' + (r.office || '(未設定)') + '\u0001' + (r.staff || '(未設定)');
    if (!map[key]) {
      map[key] = {
        area: r.area || '(未設定)', office: r.office || '(未設定)', staff: r.staff || '(未設定)', count: 0,
        insurance: emptyAncillaryTally_(), wifi: emptyAncillaryTally_(), cansapo: emptyAncillaryTally_(), tavica: emptyAncillaryTally_()
      };
    }
    var b = map[key];
    b.count++;
    addToAncillaryTally_(b.insurance, r, STATE.ancillaryItemByKey.insurance);
    addToAncillaryTally_(b.wifi, r, STATE.ancillaryItemByKey.wifi);
    addToAncillaryTally_(b.cansapo, r, STATE.ancillaryItemByKey.cansapo);
    addToAncillaryTally_(b.tavica, r, STATE.ancillaryItemByKey.tavica);
  });
  return Object.keys(map).map(function (k) { return map[k]; });
}

/** ランキング・個人別サマリーの見出しに、現在の並べ替えの列と向き（▲昇順／▼降順）を表示する。 */
function renderSortMarks_(panelId, key, dir) {
  document.querySelectorAll('#' + panelId + ' th[data-sort]').forEach(function (th) {
    var old = th.querySelector('.sort-mark');
    if (old) old.remove();
    if (th.getAttribute('data-sort') === key) {
      var mark = document.createElement('span');
      mark.className = 'sort-mark';
      mark.textContent = dir > 0 ? '▲' : '▼';
      th.appendChild(mark);
    }
  });
}

/** 付帯商品1件分のセル表示：合計／NB付帯／PUSH成約の3つの数値を1セルにまとめて表示する。 */
function formatAncillaryTallyCell_(tally) {
  return '<div>合計 ' + formatNumber(tally.qty) + '</div>' +
    '<div class="text-[10px] text-slate-400">NB付帯 ' + formatNumber(tally.nb) + '／PUSH成約 ' + formatNumber(tally.push) + '</div>';
}

function renderPersonalTab() {
  var keyword = (document.getElementById('personal-search').value || '').trim().toLowerCase();
  var list = buildPersonalSummary_(STATE.rows).filter(function (b) {
    if (!keyword) return true;
    // 画面に表示されるのは担当者コードを氏名に変換した表示名のため、検索も表示名を対象にする
    // （担当者コードのままだと、画面に見えている氏名で検索しても0件になってしまう）。
    return (b.area + ' ' + b.office + ' ' + formatStaffName_(b.staff)).toLowerCase().indexOf(keyword) !== -1;
  });

  var key = STATE.personalSortKey, dir = STATE.personalSortDir;
  list.sort(function (a, b) {
    if (key === 'area') return a.area.localeCompare(b.area, 'ja') * dir;
    if (key === 'office') return a.office.localeCompare(b.office, 'ja') * dir;
    if (key === 'staff') return formatStaffName_(a.staff).localeCompare(formatStaffName_(b.staff), 'ja') * dir;
    return (a[key] - b[key]) * dir;
  });
  renderSortMarks_('tab-panel-personal', key, dir);

  var tbody = document.getElementById('personal-tbody');
  document.getElementById('personal-empty').classList.toggle('hidden', list.length > 0);
  tbody.innerHTML = list.map(function (b) {
    return '<tr class="hover:bg-slate-50">' +
      '<td class="px-3 py-2">' + escapeHtml(b.area) + '</td>' +
      '<td class="px-3 py-2">' + escapeHtml(b.office) + '</td>' +
      '<td class="px-3 py-2">' + escapeHtml(formatStaffName_(b.staff)) + '</td>' +
      '<td class="px-3 py-2 text-right">' + formatNumber(b.count) + '</td>' +
      '<td class="px-3 py-2 text-right">' + formatAncillaryTallyCell_(b.insurance) + '</td>' +
      '<td class="px-3 py-2 text-right">' + formatAncillaryTallyCell_(b.wifi) + '</td>' +
      '<td class="px-3 py-2 text-right">' + formatAncillaryTallyCell_(b.cansapo) + '</td>' +
      '<td class="px-3 py-2 text-right">' + formatAncillaryTallyCell_(b.tavica) + '</td>' +
      '</tr>';
  }).join('');
}

/** 直近のデータ読み込みにかかった時間の内訳（遅いと感じたときに、どこで時間がかかっているかを確かめる用）。 */
function bootTimingHtml_(t) {
  if (!t) return '';
  var sec = function (ms) { return (Math.round(ms / 100) / 10).toFixed(1) + ' 秒'; };
  var sourceLabel = { cache: 'サーバーに保存済みの写しを使用', sheet: 'シートから読み込み', 'response-cache': '同じ条件の結果を再利用' };
  return '<p class="mt-2 text-xs text-slate-500">直近の読み込み時間：合計 <b>' + sec(t.totalMs) + '</b>' +
    '（サーバー処理 ' + sec(t.serverMs) + '／通信 ' + sec(t.transferMs) + '／展開 ' + sec(t.decodeMs) + '／画面表示 ' + sec(t.renderMs) + '）' +
    '　データ量 ' + (t.sizeKb === null ? '—' : formatNumber(t.sizeKb) + ' KB') + '・' + formatNumber(t.rows) + ' 件' +
    (t.source ? '　' + escapeHtml(sourceLabel[t.source] || t.source) : '') + '</p>';
}
