    $(id).classList.remove('hidden');
  }

  // ---------- 新規依頼（店舗ロール専用。拡張要望2章） ----------
  const SHOP_NEW_TEXT_FIELDS = ['challengeno', 'groom-last', 'groom', 'bride-last', 'bride', 'groom-age', 'bride-age',
    'sale', 'location', 'remarks',
    // ★要件：オプションは最大10件（フリー入力）
    'option1', 'option2', 'option3', 'option4', 'option5',
    'option6', 'option7', 'option8', 'option9', 'option10'];
  const SHOP_NEW_DATE_FIELDS = ['hope1', 'hope2', 'hope3', 'hope4', 'hope5'];
  // ★要件：希望日ごとの時間帯（AM/PM）・プラン欄
  const SHOP_NEW_HOPE_TIME_FIELDS = ['hopetime1', 'hopetime2', 'hopetime3', 'hopetime4', 'hopetime5'];
  const SHOP_NEW_HOPE_PLAN_FIELDS = ['hopeplan1', 'hopeplan2', 'hopeplan3', 'hopeplan4', 'hopeplan5'];
  async function openShopNewView() {
    showView('shop-new');
    $('shop-new-error').classList.add('hidden');
    $('shop-new-success').classList.add('hidden');
    SHOP_NEW_TEXT_FIELDS.forEach(k => { $('shop-new-' + k).value = ''; });
    SHOP_NEW_DATE_FIELDS.forEach(k => { $('shop-new-' + k).value = ''; });
    SHOP_NEW_HOPE_TIME_FIELDS.forEach(k => { $('shop-new-' + k).value = ''; });
    // ★要件：希望日のカレンダーで今日より前の日付が選べてしまわないよう下限を付ける
    SHOP_NEW_DATE_FIELDS.forEach(k => { $('shop-new-' + k).min = todayIsoDate_(); });
    $('shop-new-initial-status').value = 'RQ';
    if (!branchesCache.length) {
      const data = await gsRun('apiGetDashboard', session.token, { showAll: true });
      branchesCache = data.branches || [];
    }
    $('shop-new-branch').innerHTML = branchesCache
      .map(b => `<option value="${escapeAttr(b.code)}">${escapeHtml(b.name)}（${escapeHtml(b.country || '')}/${escapeHtml(b.city || '')}）</option>`).join('');
    $('shop-new-team').innerHTML = JP_TEAMS.map(t => `<option value="${escapeAttr(t)}">${escapeHtml(t)}手配課</option>`).join('');
    $('shop-new-prep').innerHTML = '<option value="">-</option>' +
      PREP_CHOICES.map(p => `<option value="${escapeAttr(p)}">${escapeHtml(p)}</option>`).join('');
    // ★要件変更：希望日ごとのプランは、この案件の依頼先支店（都市）だけでなく全支店を横断して
    // 選べるようにする（例：第一希望はロンドン支店のロンドンフォト、第二希望はローマ支店の
    // ローマフォト）。案件全体の「プラン」単独欄は廃止し、代わりに希望日①（第一希望）の
    // プラン選択が、これまで単独のプラン欄が担っていた役目（撮影希望場所の入力方式切替・
    // セール名のプラン別絞り込み）も兼ねる。支店切り替えに関わらず一度だけ全支店分の候補を
    // 取得して都市ごとの<optgroup>にまとめる。
    try {
      shopNewAllPlansCache = await gsRun('apiListAllActivePlans', session.token);
      const hopePlanOptsHtml = allPlanOptionsHtml_(shopNewAllPlansCache, '', 'プラン未設定');
      SHOP_NEW_HOPE_PLAN_FIELDS.forEach(k => { $('shop-new-' + k).innerHTML = hopePlanOptsHtml; });
    } catch (e) { shopNewAllPlansCache = []; /* 候補が取れなくても入力自体は続けられる（プランは未設定のまま） */ }
    onShopNewHopePlan1Change();
    onShopNewBranchChange();
  }

  // 支店（都市）を選ぶと、その支店のセール・撮影希望場所・オプションの候補を反映し、
  // 準備場所（イタリアのみ）・パスポート番号（必須の支店のみ）の表示を切り替える。
  async function onShopNewBranchChange() {
    const branchCode = $('shop-new-branch').value;
    if (!branchCode) return;
    const meta = branchesCache.find(b => b.code === branchCode) || {};
    $('shop-new-prep-block').classList.toggle('hidden', meta.country !== 'イタリア');
    // ★要件：希望日の時間帯（AM/PM）欄は、支店マスタの「希望日時間帯表示」がONの支店だけ表示する
    document.querySelectorAll('.shop-new-hopetime').forEach(el => el.classList.toggle('hidden', !meta.showHopeTime));
    // ★要件変更：パスポート番号欄は支店の必須設定に関わらず常に表示する（※ISWのみ必要、と注記）
    try {
      const [sales, locations, options] = await Promise.all([
        gsRun('apiListSales', session.token, branchCode),
        gsRun('apiListLocations', session.token, branchCode),
        gsRun('apiListOptionItems', session.token, branchCode)
      ]);
      shopNewSalesCache = sales || [];
      const activeNames = (list) => (list || []).filter(x => x.active).map(x => x.name);
      const optionNames = activeNames(options);
      $('shop-new-location-datalist').innerHTML = activeNames(locations).map(n => `<option value="${escapeAttr(n)}">`).join('');
      // ★要件：オプション名はマスタからの選択式ではなく、候補（datalist）を出しつつ自由に書ける
      // 入力欄にする（フリー入力）。マスタに無い名称も入力できる
      $('shop-new-option-datalist').innerHTML = optionNames.map(n => `<option value="${escapeAttr(n)}">`).join('');
      // ★要件：支店（＝セールの候補）を切り替えたら、希望日①のプランに応じたセール絞り込みを再適用する
      onShopNewHopePlan1Change();
    } catch (e) { /* 候補が取れなくても入力自体は続けられる（セール等は未設定のまま） */ }
  }

  // ★要件：プラン・セール名・撮影希望場所は支店に紐づくだけでなく、撮影希望場所とセール名は
  // 選んだプランにも紐づく（プランごとに撮影場所の入力方式・候補が変わり、セールも
  // 「そのプラン専用」のものだけに絞り込まれる）。サーバーには取りに行かず、キャッシュしておいた
  // 全支店分のプラン一覧・この支店のセール一覧を手元でフィルタするだけで済ませる。
  function shopNewLocationFieldHtml_(planMeta) {
    const mode = planMeta ? planMeta.locationMode : 'free';
    const candidates = (planMeta && planMeta.locationCandidates) || [];
    if (mode === 'select') {
      return `<select id="shop-new-location">
        <option value="">未設定</option>
        ${candidates.map(c => `<option value="${escapeAttr(c)}">${escapeHtml(c)}</option>`).join('')}
      </select>`;
    }
    if (mode === 'checkbox') {
      return `
        <div id="shop-new-location-checks">
          ${candidates.map(c => `<label class="checkbox-label"><input type="checkbox" class="shop-new-location-cb" value="${escapeAttr(c)}"> ${escapeHtml(c)}</label>`).join('')}
        </div>
        <input type="hidden" id="shop-new-location">`;
    }
    return `<input id="shop-new-location" type="text" list="shop-new-location-datalist" placeholder="任意入力">
      <datalist id="shop-new-location-datalist"></datalist>`;
  }
  // ★要件変更：案件全体の「プラン」単独欄を廃止したため、希望日①（第一希望）のプラン選択が
  // 変わるたびに、撮影希望場所の入力方式・セール名の絞り込みを差し替える
  // （旧onShopNewPlanChangeと同じ役目。プランは全支店横断のためshopNewAllPlansCacheから探す）。
  function onShopNewHopePlan1Change() {
    const planName = $('shop-new-hopeplan1').value;
    const planMeta = shopNewAllPlansCache.find(p => p.name === planName);
    $('shop-new-location-wrap').innerHTML = shopNewLocationFieldHtml_(planMeta);
    if (planMeta && planMeta.locationMode === 'checkbox') {
      const wrap = $('shop-new-location-wrap');
      wrap.querySelectorAll('.shop-new-location-cb').forEach(cb => {
        cb.addEventListener('change', () => {
          const vals = [...wrap.querySelectorAll('.shop-new-location-cb:checked')].map(x => x.value);
          $('shop-new-location').value = vals.join('、');
        });
      });
    }
    const saleNames = shopNewSalesCache.filter(s => s.active && (!s.targetPlan || s.targetPlan === planName)).map(s => s.name);
    const currentSale = $('shop-new-sale').value;
    $('shop-new-sale').innerHTML = '<option value="">未設定</option>' +
      saleNames.map(n => `<option value="${escapeAttr(n)}" ${n === currentSale ? 'selected' : ''}>${escapeHtml(n)}</option>`).join('');
  }

  async function submitShopNewRequest() {
    $('shop-new-error').classList.add('hidden');
    $('shop-new-success').classList.add('hidden');
    const payload = {
      branchCode: $('shop-new-branch').value,
      team: $('shop-new-team').value,
      initialStatus: $('shop-new-initial-status').value,
      challengeNo: $('shop-new-challengeno').value.trim(),
      groomLastName: $('shop-new-groom-last').value.trim(),
      groomName: $('shop-new-groom').value.trim(),
      brideLastName: $('shop-new-bride-last').value.trim(),
      brideName: $('shop-new-bride').value.trim(),
      groomAge: $('shop-new-groom-age').value.trim(),
      brideAge: $('shop-new-bride-age').value.trim(),
      saleName: $('shop-new-sale').value.trim(),
      location: $('shop-new-location').value.trim(),
      prep: $('shop-new-prep-block').classList.contains('hidden') ? '' : $('shop-new-prep').value,
      // ★要件：パスポート番号欄は新規依頼フォームからは廃止（申し込み時点では不要とのこと。
      // 既存案件の詳細画面では引き続き入力できる）
      hope1: $('shop-new-hope1').value, hope2: $('shop-new-hope2').value, hope3: $('shop-new-hope3').value,
      hope4: $('shop-new-hope4').value, hope5: $('shop-new-hope5').value,
      remarks: $('shop-new-remarks').value.trim()
    };
    // ★要件：希望日ごとの時間帯（AM/PM）・プラン（複数プラン希望）
    for (let i = 1; i <= 5; i++) {
      payload['hopeTime' + i] = $('shop-new-hopetime' + i).value;
      payload['hopePlan' + i] = $('shop-new-hopeplan' + i).value;
    }
    // ★要件：オプションは最大10件（フリー入力）
    for (let i = 1; i <= 10; i++) payload['option' + i] = $('shop-new-option' + i).value.trim();
    // ★要件：チャレンジ番号は任意ではなく必須。英数字11桁固定（0やアルファベットから始まる場合もある）
    if (!payload.challengeNo) { showFieldError('shop-new-error', 'チャレンジ番号を入力してください。'); return; }
    if (!/^[A-Za-z0-9]{11}$/.test(payload.challengeNo)) {
      showFieldError('shop-new-error', 'チャレンジ番号は英数字11桁で入力してください（例：14126000123）。'); return;
    }
    // ★要件変更：新郎新婦の姓・名は4項目とも必須（以前は新郎の名だけ必須だった）。
    // 大文字で保存する仕様のため、送信前にクライアント側でも大文字化しておく（表示との食い違い防止）。
    ['groomLastName', 'groomName', 'brideLastName', 'brideName'].forEach(k => { payload[k] = String(payload[k] || '').toUpperCase(); });
    if (!payload.groomLastName) { showFieldError('shop-new-error', '新郎姓（ローマ字）を入力してください。'); return; }
    if (!payload.groomName) { showFieldError('shop-new-error', '新郎名（ローマ字）を入力してください。'); return; }
    if (!payload.brideLastName) { showFieldError('shop-new-error', '新婦姓（ローマ字）を入力してください。'); return; }
    if (!payload.brideName) { showFieldError('shop-new-error', '新婦名（ローマ字）を入力してください。'); return; }
    if (!payload.hope1) { showFieldError('shop-new-error', '希望日（第一希望）を入力してください。'); return; }
    try {
      const res = await gsRun('apiShopCreateRequest', session.token, payload);
      // ★機能追加：送信後に「回答までお待ちください」の案内を出す
      // ★要件：文言を「予約依頼（空き確認の時は空き確認依頼）をしました。回答までしばらくお待ちください。
      // 予約番号 ○○」に変更。PC幅では画面中央に目立つモーダルで表示し（success-banner-prominent、
      // Stylesheet.html参照）、あわせて「案件一覧（トップ）へ戻る」ボタンも併設する。
      const kindLabel = payload.initialStatus === 'CHK' ? '空き確認依頼' : '予約依頼';
      $('shop-new-success-text').innerHTML = `${escapeHtml(kindLabel)}をしました。<br>回答までしばらくお待ちください。<br>予約番号 ${escapeHtml(res.kanriNo)}`;
      $('shop-new-success').classList.remove('hidden');
      if (typeof $('shop-new-success').scrollIntoView === 'function') {
        $('shop-new-success').scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
      SHOP_NEW_TEXT_FIELDS.forEach(k => { $('shop-new-' + k).value = ''; });
      SHOP_NEW_DATE_FIELDS.forEach(k => { $('shop-new-' + k).value = ''; });
      SHOP_NEW_HOPE_TIME_FIELDS.forEach(k => { $('shop-new-' + k).value = ''; });
      SHOP_NEW_HOPE_PLAN_FIELDS.forEach(k => { $('shop-new-' + k).value = ''; });
      $('shop-new-initial-status').value = 'RQ';
    } catch (e) {
      showFieldError('shop-new-error', e.message);
    }
  }

  // ---------- 設定（現地スタッフ手配メール。自支店 or JPが編集可能） ----------
  async function openSettingsView() {
    showView('settings');
    if (session.role === 'JP') {
      if (!branchesCache.length) branchesCache = await gsRun('apiListBranches', session.token);
      const branchOnly = branchesCache.filter(b => b.role !== 'JP' && b.active);
      $('settings-branch-select').innerHTML = branchOnly
        .map(b => `<option value="${escapeAttr(b.code)}">${escapeHtml(b.name)}（${escapeHtml(b.code)}）</option>`).join('');
      if (!settingsBranchCode && branchOnly.length) settingsBranchCode = branchOnly[0].code;
      $('settings-branch-select').value = settingsBranchCode;
    } else {
      settingsBranchCode = session.branchCode;
    }
    await loadSettings(settingsBranchCode);
  }

  async function loadSettings(branchCode) {
    if (!branchCode) return;
    settingsBranchCode = branchCode;
    $('settings-content').innerHTML = '<p class="hint-text">読み込み中...</p>';
    try {
      const res = await gsRun('apiGetArrangementSettings', session.token, branchCode);
      renderSettings(res);
    } catch (e) { handleAuthError(e); }
  }

  function renderSettings(res) {
    $('settings-content').innerHTML = `
      <div class="section-card">
        <h3>現地スタッフ手配メール</h3>
        <p class="hint-text">カメラマン・ヘアメイクなどのボタンを案件詳細の「手配」タブで押すと、
          ここで登録した宛先へ手配メールの下書きが自動作成されます。担当者が内容を確認・編集してから送信します。
          同じ宛先を複数カテゴリに登録すれば「1件の委託先へまとめて依頼」にもできます。空欄のカテゴリはボタンが無効になります。</p>
        <label class="checkbox-label" style="margin-top:12px;">
          <input type="checkbox" id="settings-enabled" ${res.enabled ? 'checked' : ''}> この機能を使う
        </label>
        <div style="margin-top:14px;display:flex;flex-direction:column;gap:12px;">
          ${res.categories.map(c => `
            <div class="field-block">
              <label>${escapeHtml(c.label)}</label>
              <input data-arr-name="${escapeAttr(c.key)}" placeholder="宛先名（任意）" value="${escapeAttr(c.name)}" style="margin-bottom:6px;">
              <input data-arr-email="${escapeAttr(c.key)}" placeholder="メールアドレス" value="${escapeAttr(c.email)}" type="email">
            </div>`).join('')}
        </div>
      </div>`;
  }

  async function saveArrangementSettings() {
    if (!$('settings-enabled')) return;
    const enabled = $('settings-enabled').checked;
    const categories = {};
    ARRANGEMENT_CATEGORIES.forEach(c => {
      const nameEl = document.querySelector(`[data-arr-name="${cssEscape_(c.key)}"]`);
      const emailEl = document.querySelector(`[data-arr-email="${cssEscape_(c.key)}"]`);
      categories[c.key] = { name: nameEl ? nameEl.value.trim() : '', email: emailEl ? emailEl.value.trim() : '' };
    });
    try {
      await gsRun('apiSaveArrangementSettings', session.token, settingsBranchCode, { enabled, categories });
      showToast('設定を保存しました');
    } catch (e) { handleAuthError(e); }
  }
</script>
