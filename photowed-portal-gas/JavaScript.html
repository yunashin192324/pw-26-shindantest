<script>
  // =====================================================
  // WEDLINK 支店ポータル クライアントロジック
  // =====================================================
  const STORAGE_KEY = 'photowed_session';
  // ★機能追加（拡張要望3章）：DC（日付変更依頼）・PC（プラン・式場変更依頼）を追加。
  // ★機能廃止：ネームチェンジ専用のNCは廃止した（新郎名・新婦名欄を直接編集して送信すれば
  // 「ネームチェンジのお知らせ」として現地に伝わる。Code.gsのapiCommitChanges参照）。
  // STは希望日ごとのSTS(支店側)の初期値（現地未確認）に使う（Code.gsのSTATUS_CODESと一致させる）。
  const STATUS_CODES = ['RQ', 'OK', 'CHK', 'CR', 'FN', 'CW', 'UC', 'CF', 'DC', 'PC', 'ST'];
  const JP_TEAMS = ['関東', '関西'];
  const BILLING_REGIONS = ['北海道', '東北', '関東', '中部', '関西', '中四国', '九州'];
  // 支店側がSTS(支店側)を編集できる条件。キー＝対になるSTS(JP側)の現在値。
  // null=制限なし／配列=その中からのみ／キーなし=支店側は編集不可
  // ★機能追加（拡張要望3-2章）：DC/PCへの支店側の応答（OK/UC）はSTS(JP側)にもそのまま反映される
  // （Code.gsのSTATUS_AUTO_CASCADE参照）。FNはSTS(JP側)がFNになった後、現地側が自分のSTS(支店側)を
  // FNにするためだけに使う。
  const BRANCH_EDIT_GATE = { 'RQ': null, 'CHK': null, 'CR': ['CW', 'CF'], 'DC': ['OK', 'UC'], 'PC': ['OK', 'UC'], 'FN': ['FN'] };
  // 希望日ごとのSTS(支店側)は、現地が自由に選べる（Code.gsのapplyHopeStatusCascade_が連動を担当するため、
  // ここでは値の範囲を絞らずSTATUS_CODESすべてから選べるようにする）
  // ★機能追加（拡張要望3章）：店舗が案件作成後に設定できるSTS(JP側)（Code.gsのSHOP_STATUS_TARGETSと一致）
  const SHOP_STATUS_TARGETS = ['RQ', 'FN', 'CR', 'DC', 'PC'];
  const SHOP_STATUS_LABELS = { RQ: 'RQ（予約依頼）', FN: 'FN（最終確定）', CR: 'CR（キャンセル依頼）',
    DC: 'DC（日付変更依頼）', PC: 'PC（プラン・式場変更依頼）' };
  // 必要書類チェックリスト（Code.gsのCHECKLIST_ITEMSと一致させる）
  const CHECKLIST_ITEMS = ['ヘアメイク画像', '衣裳画像', '撮影指示書', '着付け指示書'];
  // ドライブアップロードの書類種別（Code.gsのSHOP_UPLOAD_DOC_TYPESと一致させる）
  const SHOP_UPLOAD_DOC_TYPES = ['ヘアメイク画像', '衣裳画像', '撮影指示書', '着付け指示書'];
  const DETAIL_TABS = [
    { key: 'message', label: 'メッセージ' },
    { key: 'customer', label: 'お客様情報' },
    { key: 'reservation', label: '予約内容' },
    { key: 'jpEntry', label: '日本記入欄', jpOnly: true },
    { key: 'local', label: '現地記入欄' },
    { key: 'arrangement', label: '手配' },
    { key: 'drive', label: 'ドライブ' },
    { key: 'timeline', label: '履歴' }
  ];
  // 日本記入欄：AI加工の選択肢（Code.gs の AI_EDIT_OPTIONS と一致させる）
  const AI_EDIT_OPTIONS = ['美肌・小顔・痩身加工', '美肌加工'];
  // 予約内容：準備場所の選択肢（イタリアの支店のみ表示。Code.gs の PREP_CHOICES と一致させる）
  const PREP_CHOICES = ['ホテル', 'サロン'];
  // 現地スタッフ手配メールのカテゴリ（Code.gs の ARRANGEMENT_CATEGORIES と一致させる）
  const ARRANGEMENT_CATEGORIES = [
    { key: 'photographer', label: 'カメラマン' },
    { key: 'hairMakeup', label: 'ヘアメイク' },
    { key: 'assistant', label: 'アシスタント' },
    { key: 'florist', label: '花屋さん' },
    { key: 'transport', label: '送迎車' }
  ];
  // メモ履歴の種別（Code.gs の MEMO_TYPE_* と一致させる）
  const MEMO_TYPE_SHARED = '共有メモ';
  const MEMO_TYPE_LOCAL = 'メモ（現地用）';
  const MEMO_TYPE_SURVEY = 'アンケート回答';

  let session = null;
  let currentKanri = null;
  let currentUserName = ''; // ★要件：Googleアカウント（氏名@his-world.com）から取れる実名
  let detailActiveTab = 'message';
  let dashboardScope = { showAll: true, teams: [], branches: [] };
  let dashboardSortKey = 'default';  // 案件一覧の並び替え
  let dashboardViewMode = 'card';    // 案件一覧の表示形式：'card'（カード）／'table'（表）
  let searchScope = { showAll: true, teams: [], branches: [] };
  let statsScope = { showAll: true, teams: [], branches: [] };
  let dayScope = { showAll: true, teams: [], branches: [] };
  let deliveryScope = { showAll: true, teams: [], branches: [] };
  let currentDetail = null;    // 開いている案件の詳細（ワンタップ回答・重複検知で参照）
  let branchesCache = [];      // 一覧/新規画面用（BRANCHロールのみに絞った支店一覧。JPログイン時に取得）
  let lastDashboardData = null; // キャンセル表示チェックボックスの再描画用にキャッシュ
  let pendingChanges = {}; // 「保存のみ／メッセージのみ送信／変更＋メッセージ送信」待ちの変更（既存予約の全項目が対象）
  let settingsBranchCode = ''; // 「設定」画面で編集対象にしている支店コード（JPは選べる／支店は自分の支店固定）
  let arrangementDraft = null; // 手配メールの下書き（確認モーダル表示中の内容）

  function gsRun(fnName, ...args) {
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(err => reject(err))
        [fnName](...args);
    });
  }

  function $(id) { return document.getElementById(id); }

  function showToast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.remove('hidden');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => t.classList.add('hidden'), 2600);
  }

  function showView(name) {
    document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
    $('view-' + name).classList.remove('hidden');
  }

  function applyRoleUI() {
    const isJp = session && session.role === 'JP';
    const isShop = session && session.role === 'SHOP';
    document.querySelectorAll('.jp-only').forEach(el => el.classList.toggle('hidden', !isJp));
    // ★機能追加：店舗ロールには通常の一覧系画面（検索・当日表・納品待ち・設定・通常の新規案件作成）を
    // 出さない代わりに、店舗専用の「＋新規依頼」を出す
    document.querySelectorAll('.non-shop').forEach(el => el.classList.toggle('hidden', isShop));
    document.querySelectorAll('.shop-only').forEach(el => el.classList.toggle('hidden', !isShop));
    $('branch-badge').textContent = session
      ? (isJp ? `${session.branchName}（${session.team}）` : `${session.branchName}（${session.branchCode}）`)
      : '';
  }

  // ★要件：Googleアカウント（氏名@his-world.com）から実際の担当者名を取得して表示する
  async function loadCurrentUserName() {
    try {
      const res = await gsRun('apiGetCurrentUserName', session.token);
      currentUserName = res.name || '';
      if (currentUserName) $('branch-badge').textContent += `・${currentUserName}`;
    } catch (e) { /* 取得できなくても致命的ではないので無視 */ }
  }

  // ---------- 起動 ----------
  window.addEventListener('DOMContentLoaded', () => {
    bindEvents();
    populateLoginOptions();
    populateStatusSelect('s-sts-jp');
    populateStatusSelect('s-sts-branch');
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      session = JSON.parse(saved);
      afterLogin();
    } else {
      showView('login');
    }
  });

  function populateStatusSelect(id) {
    const sel = $(id);
    if (!sel) return;
    sel.innerHTML = '<option value="">指定なし</option>' + STATUS_CODES.map(c => `<option value="${c}">${c}</option>`).join('');
  }

  async function populateLoginOptions() {
    try {
      const options = await gsRun('apiListLoginOptions');
      const sel = $('login-branchcode');
      sel.innerHTML = '<option value="">選択してください</option>' +
        // ★不具合修正：支店マスタ由来の値も念のためエスケープ（未ログインの公開画面のため特に）
        options.map(o => `<option value="${escapeAttr(o.code)}">${escapeHtml(o.name)}${o.role === 'JP' ? '' : '（' + escapeHtml(o.code) + '）'}</option>`).join('');
    } catch (e) {
      $('login-branchcode').innerHTML = '<option value="">読み込みに失敗しました</option>';
    }
  }

  function bindEvents() {
    $('login-submit').addEventListener('click', doLogin);
    $('nav-dashboard').addEventListener('click', () => loadDashboard());
    $('nav-search').addEventListener('click', openSearchView);
    $('nav-stats').addEventListener('click', () => loadStats());
    $('nav-day').addEventListener('click', openDayView);
    $('nav-delivery').addEventListener('click', () => loadPendingDeliveries());
    $('nav-new').addEventListener('click', openNewView);
    $('nav-shop-new').addEventListener('click', openShopNewView);
    $('shop-new-branch').addEventListener('change', onShopNewBranchChange);
    $('shop-new-submit').addEventListener('click', submitShopNewRequest);
    $('nav-settings').addEventListener('click', openSettingsView);
    $('nav-logout').addEventListener('click', doLogout);
    $('detail-back').addEventListener('click', () => loadDashboard());
    $('new-submit').addEventListener('click', submitNewReservation);
    $('search-submit').addEventListener('click', submitSearch);
    $('export-submit').addEventListener('click', submitExport);
    $('day-submit').addEventListener('click', loadDaySchedule);
    $('billing-submit').addEventListener('click', loadBillingGaps);
    $('show-cancelled').addEventListener('change', () => { if (lastDashboardData) renderDashboard(lastDashboardData); });
    // ★機能追加：店舗ロール向けの一覧絞り込み（担当の手配課・チャレンジ番号／お名前／管理番号で検索）
    $('shop-dashboard-search').addEventListener('input', () => { if (lastDashboardData) renderDashboard(lastDashboardData); });
    $('shop-dashboard-team').addEventListener('change', () => { if (lastDashboardData) renderDashboard(lastDashboardData); });
    $('dashboard-sort').addEventListener('change', () => {
      dashboardSortKey = $('dashboard-sort').value;
      if (lastDashboardData) renderDashboard(lastDashboardData);
    });
    $('view-mode-card').addEventListener('click', () => setDashboardViewMode('card'));
    $('view-mode-table').addEventListener('click', () => setDashboardViewMode('table'));
    $('arrangement-modal-cancel').addEventListener('click', closeArrangementModal);
    $('arrangement-modal-send').addEventListener('click', sendArrangementRequest);
    $('settings-branch-select').addEventListener('change', () => loadSettings($('settings-branch-select').value));
    $('settings-save').addEventListener('click', saveArrangementSettings);
  }

  // ---------- ログイン ----------
  async function doLogin() {
    const branchCode = $('login-branchcode').value;
    const passcode = $('login-passcode').value;
    $('login-error').classList.add('hidden');
    if (!branchCode || !passcode) return;
    $('login-submit').disabled = true;
    try {
      const res = await gsRun('apiLogin', branchCode, passcode);
      if (!res.ok) {
        $('login-error').textContent = res.error;
        $('login-error').classList.remove('hidden');
        return;
      }
      session = res.session;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(session));
      afterLogin();
    } catch (e) {
      $('login-error').textContent = 'ログインに失敗しました：' + e.message;
      $('login-error').classList.remove('hidden');
    } finally {
      $('login-submit').disabled = false;
    }
  }

  function doLogout() {
    if (session) gsRun('apiLogout', session.token).catch(() => {});
    localStorage.removeItem(STORAGE_KEY);
    session = null;
    currentUserName = '';
    $('app-header').classList.add('hidden');
    $('login-branchcode').value = '';
    $('login-passcode').value = '';
    showView('login');
  }

  function afterLogin() {
    $('app-header').classList.remove('hidden');
    applyRoleUI();
    loadCurrentUserName();
    dashboardScope = { showAll: true, teams: [], branches: [] };
    searchScope = { showAll: true, teams: [], branches: [] };
    statsScope = { showAll: true, teams: [], branches: [] };
    dayScope = { showAll: true, teams: [], branches: [] };
    deliveryScope = { showAll: true, teams: [], branches: [] };
    loadDashboard();
  }

  function handleAuthError(e) {
    showToast(e.message || '通信エラーが発生しました');
    if (String(e.message || '').includes('セッション')) doLogout();
  }

  // ---------- 表示範囲スコープ（全国／関東手配課／関西手配課／支店ごと） ----------
  function renderScopeSelector(container, scope, onChange) {
    if (session.role !== 'JP') { container.classList.add('hidden'); return; }
    container.classList.remove('hidden');

    const teamChips = JP_TEAMS.map(t => scopeChipHtml(
      `${t}手配課`, 'team', t, !scope.showAll && scope.teams.includes(t)
    )).join('');
    const branchChips = branchesCache.filter(b => b.role !== 'JP').map(b => scopeChipHtml(
      b.name, 'branch', b.code, !scope.showAll && scope.branches.includes(b.code)
    )).join('');

    container.innerHTML = `
      <div class="scope-title">表示範囲</div>
      <div class="scope-row">
        ${scopeChipHtml('全国', 'all', '', scope.showAll)}
        ${teamChips}
        ${branchChips}
      </div>`;

    container.querySelectorAll('input[type=checkbox]').forEach(cb => {
      cb.addEventListener('change', () => {
        const role = cb.dataset.role;
        const val = cb.dataset.val;
        if (role === 'all') {
          scope.showAll = cb.checked;
          if (cb.checked) { scope.teams = []; scope.branches = []; }
        } else {
          scope.showAll = false;
          const arr = role === 'team' ? scope.teams : scope.branches;
          const idx = arr.indexOf(val);
          if (cb.checked && idx === -1) arr.push(val);
          if (!cb.checked && idx !== -1) arr.splice(idx, 1);
          if (scope.teams.length === 0 && scope.branches.length === 0) scope.showAll = true;
        }
        renderScopeSelector(container, scope, onChange);
        onChange();
      });
    });
  }

  function scopeChipHtml(label, role, val, checked) {
    return `<label class="scope-chip ${checked ? 'active' : ''}">
      <input type="checkbox" data-role="${escapeAttr(role)}" data-val="${escapeAttr(val)}" ${checked ? 'checked' : ''}>${escapeHtml(label)}
    </label>`;
  }

  // ---------- ダッシュボード ----------
  async function loadDashboard() {
    showView('dashboard');
    try {
      const data = await gsRun('apiGetDashboard', session.token, dashboardScope);
      if (data.role === 'JP' || data.role === 'SHOP') branchesCache = data.branches;
      lastDashboardData = data;
      renderDashboard(data);
    } catch (e) { handleAuthError(e); }
  }

  function renderDashboard(data) {
    $('dashboard-title').textContent = data.role === 'JP' ? `案件一覧 — ${session.team}手配課` : `案件一覧（${data.branchName}）`;
    renderScopeSelector($('scope-selector'), dashboardScope, loadDashboard);

    const showCancelled = $('show-cancelled').checked;
    // ★要件：基本は生きてる（キャンセルでない）記録だけを表示し、チェックで両方表示に切り替える
    let list = showCancelled
      ? data.reservations
      : data.reservations.filter(r => r.statusJp !== 'CW' && r.statusBranch !== 'CW');

    // ★機能追加：店舗ロールの一覧絞り込み（担当の手配課・チャレンジ番号／お名前／管理番号で検索）
    if (data.role === 'SHOP') {
      const team = $('shop-dashboard-team').value;
      if (team) list = list.filter(r => r.area === team);
      const q = $('shop-dashboard-search').value.trim().toLowerCase();
      if (q) {
        list = list.filter(r => [r.challengeNo, r.groomName, r.brideName, r.kanriNo]
          .some(v => String(v || '').toLowerCase().includes(q)));
      }
    }

    list = sortReservations(list, dashboardSortKey);

    $('dashboard-empty').classList.toggle('hidden', list.length > 0);

    if (dashboardViewMode === 'table') {
      $('reservation-list').classList.add('hidden');
      $('reservation-table-wrap').classList.toggle('hidden', list.length === 0);
      renderReservationTable(list);
    } else {
      $('reservation-table-wrap').classList.add('hidden');
      $('reservation-list').classList.remove('hidden');
      const listEl = $('reservation-list');
      listEl.innerHTML = '';
      list.forEach(r => listEl.appendChild(buildReservationCard(r)));
    }
  }

  // ★要件：案件一覧を並び替えられるように。日付は 'yyyy/MM/dd' 文字列で来るのでDate化して比較する
  function sortReservations(list, key) {
    const dateMs = (r) => r.confirmedDate ? new Date(r.confirmedDate.replace(/\//g, '-')).getTime() : Infinity;
    const arr = list.slice();
    switch (key) {
      case 'dateAsc': arr.sort((a, b) => dateMs(a) - dateMs(b)); break;
      case 'dateDesc': arr.sort((a, b) => dateMs(b) - dateMs(a)); break;
      case 'updated': arr.sort((a, b) => String(b.lastUpdated || '').localeCompare(String(a.lastUpdated || ''))); break;
      case 'name': arr.sort((a, b) => String(a.groomName || '').localeCompare(String(b.groomName || ''), 'ja')); break;
      case 'kanri': arr.sort((a, b) => String(a.kanriNo || '').localeCompare(String(b.kanriNo || ''), undefined, { numeric: true })); break;
      default: break; // 既定：サーバ側で組んだ「要対応優先→撮影日が近い順」のまま
    }
    return arr;
  }

  // ★要件：カード表示／表（一覧表）表示を切り替えられるように
  function setDashboardViewMode(mode) {
    dashboardViewMode = mode;
    $('view-mode-card').classList.toggle('active', mode === 'card');
    $('view-mode-table').classList.toggle('active', mode === 'table');
    if (lastDashboardData) renderDashboard(lastDashboardData);
  }

  // ★要件：一覧表では、日付・都市・チャレンジ番号・お名前・STS JP・STS 支店・予約番号（管理番号）・
  // プラン名を一目で見られるように（カード表示では既にSTSがチップ表示されていたが、表側には無かった）
  function renderReservationTable(list) {
    const body = $('reservation-table-body');
    body.innerHTML = '';
    list.forEach(r => {
      const cancelled = r.statusJp === 'CW' || r.statusBranch === 'CW';
      const tr = document.createElement('tr');
      tr.className = r.needsAction ? 'needs-action-row' : '';
      // ★不具合修正：カード表示と同様、自由入力項目はエスケープしてから差し込む（保存型XSS対策）
      tr.innerHTML = `
        <td class="res-table-date">${escapeHtml(r.confirmedDate || '撮影日未定')}</td>
        <td>${escapeHtml(r.city || '-')}</td>
        <td>${escapeHtml(r.challengeNo || 'なし')}</td>
        <td>${escapeHtml(r.groomName || '')}${r.brideName ? '／' + escapeHtml(r.brideName) : ''}${r.needsAction ? ' ●' : ''}${cancelled ? '（キャンセル）' : ''}</td>
        <td>${r.statusJp ? `<span class="chip hq">${escapeHtml(r.statusJp)}</span>` : '-'}</td>
        <td>${r.statusBranch ? `<span class="chip branch">${escapeHtml(r.statusBranch)}</span>` : '-'}</td>
        <td>${escapeHtml(r.kanriNo)}</td>
        <td>${escapeHtml(r.plan || '-')}</td>`;
      tr.addEventListener('click', () => openDetail(r.kanriNo));
      body.appendChild(tr);
    });
  }

  function buildReservationCard(r) {
    const card = document.createElement('div');
    // ★要件：相手からの未読メッセージ・変更がある案件は色を変えて一目でわかるように、一覧の上に来る（サーバ側でソート済み）
    card.className = 'res-card' + (r.needsAction ? ' needs-action' : '');
    const cancelled = r.statusJp === 'CW' || r.statusBranch === 'CW';
    // ★不具合修正：新郎名・新婦名・CHG NO・プラン名などは各拠点の担当者が自由に入力できる項目のため、
    // エスケープせずinnerHTMLへ差し込むと保存型XSS（悪意あるHTMLをそのまま実行）につながる。
    // ダッシュボードはログイン直後に必ず表示される画面なので、ここでのエスケープ漏れは特に危険。
    card.innerHTML = `
      <div class="res-card-top"><span>${escapeHtml(r.kanriNo)} ・ CHG: ${escapeHtml(r.challengeNo || 'なし')}</span><span>${escapeHtml(r.confirmedDate || '撮影日未定')}</span></div>
      <div class="res-card-names">${escapeHtml(r.groomName || '')} ${r.brideName ? '／ ' + escapeHtml(r.brideName) : ''}</div>
      <div class="res-card-bottom">
        ${r.needsAction ? '<span class="chip needs-action-chip">● 要対応</span>' : ''}
        <span class="chip branch">${escapeHtml(r.branchName || r.branchCode)}${r.city ? '・' + escapeHtml(r.city) : ''}</span>
        ${r.area ? `<span class="chip hq">担当: ${escapeHtml(r.area)}手配課</span>` : ''}
        ${r.statusJp ? `<span class="chip hq">STS JP: ${escapeHtml(r.statusJp)}</span>` : ''}
        ${r.statusBranch ? `<span class="chip branch">STS 支店: ${escapeHtml(r.statusBranch)}</span>` : ''}
        ${cancelled ? '<span class="chip" style="background:#fee2e2;color:#b91c1c;">キャンセル</span>' : ''}
        ${r.plan ? `<span class="chip">${escapeHtml(r.plan)}</span>` : ''}
      </div>`;
    card.addEventListener('click', () => openDetail(r.kanriNo));
    return card;
  }

  // ---------- 検索 ----------
  function openSearchView() {
    showView('search');
    renderScopeSelector($('search-scope'), searchScope, () => {});
  }

  // 検索画面の入力内容を条件オブジェクトにまとめる（検索と書き出しで共通利用）
  function currentSearchCriteria() {
    return {
      kanriNo: $('s-kanri').value.trim(),
      challengeNo: $('s-challenge').value.trim(),
      name: $('s-name').value.trim(),
      country: $('s-country').value.trim(),
      city: $('s-city').value.trim(),
      statusJp: $('s-sts-jp').value,
      statusBranch: $('s-sts-branch').value,
      dateField: $('s-datefield').value,

    try {
      const res = await gsRun('apiSearchReservations', session.token, criteria);
      const list = $('search-results');
      list.innerHTML = '';
      $('search-empty').classList.toggle('hidden', res.results.length > 0);
      res.results.forEach(r => {
        const card = document.createElement('div');
        card.className = 'res-card';
        // ★不具合修正：検索結果も自由入力の値をエスケープせず描画していたため保存型XSSの経路になっていた
        card.innerHTML = `
          <div class="res-card-top"><span>${escapeHtml(r.kanriNo)} ・ CHG: ${escapeHtml(r.challengeNo || 'なし')}</span><span>${escapeHtml(r.confirmedDate || '撮影日未定')}</span></div>

            ${r.statusBranch ? `<span class="chip branch">STS 支店: ${escapeHtml(r.statusBranch)}</span>` : ''}

        card.addEventListener('click', () => openDetail(r.kanriNo));

  // ---------- 当日スケジュール表 ----------
  function openDayView() {
    showView('day');
    renderScopeSelector($('day-scope'), dayScope, () => { if ($('day-date').value) loadDaySchedule(); });
    if (!$('day-date').value) {
      const t = new Date();
      $('day-date').value = `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`;
    }
    loadDaySchedule();
  }

  // ★要件：同意書は撮影当日までに必要なため、当日表でも状態が一目で分かるようにする。
  // 必須の支店（例：ローマ）で未回収なら警告、取得済みなら控えめに表示する。
  function consentChip(r) {
    const done = !!String(r.consent || '').trim();
    if (done) return `<div class="hint-text" style="margin-top:6px;">同意書：取得済み</div>`;
    if (!r.consentRequired) return '';
    return `<div class="conflict-box" style="margin-top:8px;">同意書が未回収です（この支店は必須）</div>`;
  }

  async function loadDaySchedule() {
    const date = $('day-date').value;
    if (!date) { showToast('日付を選んでください'); return; }
    $('day-content').innerHTML = '<p class="hint-text">読み込み中...</p>';
    try {
      const res = await gsRun('apiGetDaySchedule', session.token, date, dayScope);
      if (!res.results.length) {
        $('day-content').innerHTML = '<p class="empty-text">この日の撮影はありません。</p>';
        return;
      }
      $('day-content').innerHTML = res.results.map(r => `
        <div class="section-card day-card" data-open="${escapeAttr(r.kanriNo)}">
          <div class="day-card-top">
            <span class="day-time">${escapeHtml(r.pickupTime || '配車時間 未定')}</span>
            <span class="hint-text">${escapeHtml(r.kanriNo)}</span>
          </div>
          <div class="res-card-names">${escapeHtml(r.groomName || '')} ${r.brideName ? '／ ' + escapeHtml(r.brideName) : ''}</div>
          <div class="res-card-bottom">
            ${session.role === 'JP' ? `<span class="chip branch">${escapeHtml(r.branchName)}</span>` : ''}
            ${r.plan ? `<span class="chip">${escapeHtml(r.plan)}</span>` : ''}
            ${r.saleName ? `<span class="chip">${escapeHtml(r.saleName)}</span>` : ''}
            ${r.statusBranch ? `<span class="chip branch">STS 支店: ${escapeHtml(r.statusBranch)}</span>` : ''}
          </div>
          ${consentChip(r)}
          <div class="detail-grid" style="margin-top:8px;">
            <div class="field-block"><label>撮影希望場所</label><div class="val">${escapeHtml(r.location || '-')}</div></div>
            <div class="field-block"><label>準備場所</label><div class="val">${escapeHtml(r.prep || '-')}</div></div>
            <div class="field-block"><label>ホテル</label><div class="val">${escapeHtml(r.hotel || '-')}</div></div>
            <div class="field-block"><label>当日の担当</label><div class="val">${escapeHtml(r.dayStaff || '-')}</div></div>
            <div class="field-block"><label>ヘアメイク</label><div class="val">${escapeHtml(r.hairMakeup || '-')}</div></div>
            <div class="field-block"><label>カメラマン</label><div class="val">${escapeHtml(r.photographer || '-')}</div></div>
            <div class="field-block"><label>アシスタント</label><div class="val">${escapeHtml(r.assistant || '-')}</div></div>
            ${r.localMemo ? `<div class="field-block" style="grid-column:1/-1;"><label>メモ（現地用）</label><div class="val">${escapeHtml(r.localMemo)}</div></div>` : ''}
          </div>
        </div>`).join('');
      $('day-content').querySelectorAll('[data-open]').forEach(el =>
        el.addEventListener('click', () => openDetail(el.dataset.open)));
    } catch (e) { handleAuthError(e); }
  }

  // ---------- 納品待ち ----------
  async function loadPendingDeliveries() {
    showView('delivery');
    $('delivery-content').innerHTML = '<p class="hint-text">読み込み中...</p>';
    try {
      const res = await gsRun('apiGetPendingDeliveries', session.token, deliveryScope);
      renderScopeSelector($('delivery-scope'), deliveryScope, loadPendingDeliveries);
      if (!res.results.length) {
        $('delivery-content').innerHTML = '<p class="empty-text">納品待ちの案件はありません。</p>';
        return;
      }
      $('delivery-content').innerHTML = `<div class="card-list">` + res.results.map(r => `
        <div class="res-card needs-action" data-open="${escapeAttr(r.kanriNo)}">
          <div class="res-card-top">
            <span>${escapeHtml(r.kanriNo)}</span>
            <span>撮影日: ${escapeHtml(r.confirmedDate || '-')}</span>
          </div>
          <div class="res-card-names">${escapeHtml(r.groomName || '')} ${r.brideName ? '／ ' + escapeHtml(r.brideName) : ''}</div>
          <div class="res-card-bottom">
            <span class="chip needs-action-chip">撮影から${r.daysPast}日経過</span>
            <span class="chip">期限 ${r.limitDays}日</span>
            ${session.role === 'JP' ? `<span class="chip branch">${escapeHtml(r.branchName)}</span>` : ''}
            ${r.area ? `<span class="chip hq">担当: ${escapeHtml(r.area)}手配課</span>` : ''}
          </div>
          ${session.role === 'JP' ? `<button type="button" class="send-btn remind-btn" data-remind="${escapeAttr(r.kanriNo)}" style="margin-top:8px;padding:8px 14px;">納品を督促する</button>` : ''}
        </div>`).join('') + `</div>`;
      $('delivery-content').querySelectorAll('[data-open]').forEach(el => {
        el.addEventListener('click', (ev) => {
          if (ev.target.closest('[data-remind]')) return;   // 督促ボタンは詳細を開かない
          openDetail(el.dataset.open);
        });
      });
      $('delivery-content').querySelectorAll('[data-remind]').forEach(btn => {
        btn.addEventListener('click', () => sendDeliveryReminder(btn.dataset.remind, btn));
      });
    } catch (e) { handleAuthError(e); }
  }

  // ★機能：納品督促のワンタップ送信（既存のメッセージ送信APIをそのまま利用）
  async function sendDeliveryReminder(kanriNo, btn) {
    btn.disabled = true;
    try {
      await gsRun('apiCommitChanges', session.token, kanriNo, {},
        '撮影データ（DriveフォルダURL）のご登録をお願いします。ポータルの「ドライブ」タブから登録できます。');
      showToast(`${kanriNo} へ督促を送信しました`);
      btn.textContent = '督促済み';
    } catch (e) {
      btn.disabled = false;
      handleAuthError(e);
    }
  }

  // ---------- 書き出し（JPのみ・検索条件をそのまま利用） ----------
  async function submitExport() {
    const btn = $('export-submit');
    btn.disabled = true;
    $('export-result').classList.add('hidden');
    try {
      const res = await gsRun('apiExportReservations', session.token, currentSearchCriteria());
      $('export-result').textContent = `「${res.sheetName}」シートに${res.count}件を書き出しました。スプレッドシートをご確認ください。`;
      $('export-result').classList.remove('hidden');

  // ---------- 統計（JPのみ） ----------
  async function loadStats() {
    showView('stats');
    try {
      const data = await gsRun('apiGetStats', session.token, statsScope);
      renderScopeSelector($('stats-scope'), statsScope, loadStats);
      renderStats(data);
    } catch (e) { handleAuthError(e); }
  }

  // 統計：月カード内の「未対応／RQ／OK／FN」内訳（色は常にテキストと併記＝色だけに頼らない）
  function statsBreakdownLines(m, sizeClass, compactLabel) {
    const naLabel = compactLabel ? '要' : '未対応';
    return `
      <div class="stats-status-line ${sizeClass}"><span class="stats-dot needs-action"></span>${naLabel} ${m.needsAction}</div>
      <div class="stats-status-line ${sizeClass}"><span class="stats-dot rq"></span>RQ ${m.rq}</div>
      <div class="stats-status-line ${sizeClass}"><span class="stats-dot ok"></span>OK ${m.ok}</div>
      <div class="stats-status-line ${sizeClass}"><span class="stats-dot fn"></span>FN ${m.fn}</div>`;
  }
  // ★要件：直近3ヶ月は大きく
  function statsMonthCardLg(m) {
    return `<div class="stats-month-card-lg">
      <div class="stats-month-label">${escapeHtml(m.label)}</div>
      <div class="stats-month-total">${m.total}件</div>
      ${statsBreakdownLines(m, '', false)}
    </div>`;
  }
  // ★要件：残りの月は小さく下に並べる
  function statsMonthCardSm(m) {
    return `<div class="stats-month-card-sm">
      <div class="stats-month-label">${escapeHtml(m.label)}</div>
      <div class="stats-month-total">${m.total}件</div>
      <div class="stats-dots-row">${statsBreakdownLines(m, 'sm', true)}</div>
    </div>`;
  }

  function renderStats(data) {
    const listRows = (entries) => entries.map(e =>
      `<div class="stats-row"><span>${escapeHtml(e.key)}</span><span>${e.count}件</span></div>`
    ).join('') || '<p class="hint-text">データがありません。</p>';

    const months = data.months || [];
    const bigMonths = months.slice(0, 3);
    const smallTiles = months.slice(3).concat(data.undated ? [data.undated] : []);

    $('stats-content').innerHTML = `
      <div class="section-card">
        <div class="stats-total">現在進行中：${data.total}件</div>
        <p class="hint-text" style="margin-top:4px;">キャンセル（CW）・過去一覧（アーカイブ済み）を除く、今まさに動いている案件の件数です。</p>
        <p class="hint-text" style="margin-top:6px;">累計（アーカイブ済み・キャンセル済みを含む全期間）：${data.cumulativeTotal}件</p>
      </div>
      <div class="stats-month-grid-lg">${bigMonths.map(statsMonthCardLg).join('')}</div>
      <div class="stats-month-grid-sm">${smallTiles.map(statsMonthCardSm).join('')}</div>
      <div class="section-card">
        <h3>国別件数（現在進行中）</h3>
        ${listRows(data.byCountry)}
      </div>
      <div class="section-card">
        <h3>日本側店舗別件数（現在進行中）</h3>
        ${listRows(data.byJpShop)}
      </div>
    `;
  }

  // ---------- 詳細 ----------
  // keepTab=true のときは今開いているタブを維持する。
  // ★不具合修正：「予約内容」「現地記入欄」タブの下部ボタンで保存すると、再描画のたびに
  // 「メッセージ」タブへ戻されてしまい、"メッセージタブに戻るのが面倒"という
  // 追加要望そのものが解決しない状態だった。保存後の再描画では元のタブに留まる。
  async function openDetail(kanriNo, keepTab) {
    if (kanriNo !== currentKanri) pendingChanges = {};
    currentKanri = kanriNo;
    // ★要件：一覧から開いたときはまずメッセージ（未読の有無）が目に入るようにする
    if (!keepTab) detailActiveTab = 'message';
    showView('detail');
    $('detail-content').innerHTML = '<p class="hint-text">読み込み中...</p>';
    try {
      // ★機能追加：店舗ロールは項目編集・現地スタッフ手配・日本記入欄など一切使わないため、
      // JP／支店向けの巨大なrenderDetail（マスタ一覧の取得込み）を通さず、
      // メッセージのやり取りに必要な最小限だけを専用の描画関数で表示する
      if (session.role === 'SHOP') {
        const shopDetailRes = await gsRun('apiGetReservationDetail', session.token, kanriNo);
        // ★要件：プラン・セール名・オプションは自由入力ではなく、依頼先支店のマスタ一覧から選べるように
        const shopBranchCode = shopDetailRes.detail['支店コード'];
        const [shopPlanList, shopOptionList, shopSaleList] = await Promise.all([
          gsRun('apiListPlans', session.token, shopBranchCode),
          gsRun('apiListOptionItems', session.token, shopBranchCode),
          gsRun('apiListSales', session.token, shopBranchCode)
        ]);
        currentDetail = shopDetailRes.detail;
        renderShopDetail(shopDetailRes.detail, shopPlanList, shopOptionList, shopSaleList);
        return;
      }
      const detailRes = await gsRun('apiGetReservationDetail', session.token, kanriNo);
      const branchCode = detailRes.detail['支店コード'];
      const [planList, optionList, locationList, staffList, phraseList, saleList] = await Promise.all([
        gsRun('apiListPlans', session.token, branchCode),
        gsRun('apiListOptionItems', session.token, branchCode),
        gsRun('apiListLocations', session.token, branchCode),
        gsRun('apiListStaff', session.token, branchCode),
        gsRun('apiListPhrases', session.token, branchCode),
        gsRun('apiListSales', session.token, branchCode)
      ]);
      currentDetail = detailRes.detail;
      renderDetail(detailRes.detail, planList, optionList, locationList, staffList, phraseList, saleList);
    } catch (e) { handleAuthError(e); }
  }

  // ★機能追加：店舗ロール向けの案件詳細（依頼状況の確認・許可された項目の編集・メッセージのやり取り）
  // 拡張要望2章・3章に対応し、当初の「読み取り専用＋メッセージのみ」から、
  // 通常の3択（保存のみ／メッセージのみ／変更＋メッセージ）で編集できる画面へ拡張した。
  function renderShopDetail(d, planList, optionList, saleList) {
    const c = $('detail-content');
    const historyHtml = (d.history || []).length === 0
      ? '<p class="hint-text">まだやり取りがありません。</p>'
      : d.history.map(h => `
        <div class="history-item">
          <div class="history-meta"><span>${escapeHtml(h.sender)}</span><span>${escapeHtml(h.datetime)}</span></div>
          <div class="history-body">${escapeHtml(h.body)}</div>
        </div>`).join('');

    // ★機能追加：希望日ごとの空き確認ステータスは店舗にも見せる（編集はできない。読み取り専用）。
    // 「優先順位・日付・日本STS・現地STS」の表で表示する（JP/支店の予約内容タブと同じ形式）。
    const SHOP_HOPE_FIELDS = ['希望日①', '希望日②', '希望日③', '希望日④', '希望日⑤'];
    const hopeTableRowsShop = SHOP_HOPE_FIELDS.map((f, i) => {
      const jpVal = d[`${f} STS JP`], branchVal = d[`${f} STS 支店`];
      return `
        <tr>
          <td>第${i + 1}希望</td>
          <td><input type="date" data-pending="${escapeAttr(f)}" value="${escapeAttr(toIsoDate(d[f]))}" style="width:100%;"></td>
          <td>${escapeHtml(jpVal || '')}</td>
          <td>${escapeHtml(branchVal || '')}</td>
        </tr>`;
    }).join('');
    const hopeTableHtmlShop = `
      <div class="table-wrap" style="margin-top:6px;">
        <table class="res-table">
          <thead><tr><th>優先順位</th><th>日付</th><th>日本STS</th><th>現地STS</th></tr></thead>
          <tbody>${hopeTableRowsShop}</tbody>
        </table>
      </div>`;

    // ★要件：オプション名のすぐ隣にSTS（JP・支店）を、希望日テーブルと同じ表形式で表示する。
    // STS JPは店舗自身がその場でRQ→CR等へ直接変更できる（専用の「ステータス変更」欄は廃止）。
    // STS 支店は従来どおり読み取り専用（クリックで履歴）。
    // ★要件：オプション名は自由入力ではなく、依頼先支店のオプションマスタから選ぶ選択式にする
    // （JP/支店側の予約内容タブと同じnameListWithCurrentの仕組みを再利用）。
    const optionRowsShop = (d.options || []).map(o => {
      const optNames = nameListWithCurrent(optionList, o.name);
      const nameSelect = `<select data-pending="OP${o.n}" style="width:100%;"><option value="">（未使用）</option>${optNames.map(n =>
        `<option value="${escapeAttr(n)}" ${n === o.name ? 'selected' : ''}>${escapeHtml(n)}</option>`).join('')}</select>`;
      return `
      <tr>
        <td>オプション${o.n}</td>
        <td>${nameSelect}</td>
        <td>${!o.name ? '' : shopStatusCell('OP' + o.n + ' STS JP', o.stsJp)}</td>
        <td>${!o.name ? '' : inlineStatusBadge('OP' + o.n + ' STS 支店', o.stsBranch, 'branch')}</td>
      </tr>`;
    }).join('');
    const optionsHtml = `
      <div class="table-wrap" style="margin-top:6px;">
        <table class="res-table">
          <thead><tr><th>オプション</th><th>名称</th><th>STS JP</th><th>STS 支店</th></tr></thead>
          <tbody>${optionRowsShop}</tbody>
        </table>
      </div>`;

    const checklistHtml = (d.checklist || []).map(c2 => `
      <label class="checkbox-label">
        <input type="checkbox" data-pending="${escapeAttr('必要書類チェック:' + c2.item)}" data-bool-checkbox="1" ${c2.checked ? 'checked' : ''}>
        ${escapeHtml(c2.item)}
      </label>`).join('');

    // ★要件：メッセージ欄まで画面が長く、スクロールが大変とのご指摘への対応。
    // JP/支店側のようなタブ切替（他を隠す）ではなく、上部に置いたボタンを押すと該当セクションまで
    // スムーズにスクロールする「クイックナビ」にする（店舗の画面はそもそも編集項目が少なく、
    // 1画面で全体を見渡せる構成の良さは保ちたいため）。
    const shopQuickNavHtml = `
      <div class="tab-bar" id="shop-quick-nav">
        <button type="button" class="tab-btn" data-scroll-to="shop-sec-status">依頼状況</button>
        <button type="button" class="tab-btn" data-scroll-to="shop-sec-customer">お客様情報</button>
        <button type="button" class="tab-btn" data-scroll-to="shop-sec-reservation">予約内容</button>
        <button type="button" class="tab-btn" data-scroll-to="shop-sec-options">オプション</button>
        <button type="button" class="tab-btn" data-scroll-to="shop-sec-docs">書類</button>
        <button type="button" class="tab-btn" data-scroll-to="shop-sec-message">メッセージ</button>
        <button type="button" class="tab-btn" data-scroll-to="shop-sec-history">履歴</button>
      </div>`;

    c.innerHTML = `
      <div class="detail-header">
        <div class="kanri">管理番号: ${escapeHtml(d['管理番号'])}</div>
        <div class="chg-no">CHG NO: ${escapeHtml(d['CHG NO'] || 'なし')}</div>
        <button type="button" class="print-btn" id="print-arrangement-btn">🖨 手配内容をPDFで保存</button>
      </div>
      ${shopQuickNavHtml}
      <div class="section-card" id="shop-sec-status">

    c.querySelectorAll('#shop-quick-nav [data-scroll-to]').forEach(btn => {
      btn.addEventListener('click', () => {
        const target = $(btn.dataset.scrollTo);
        if (target && typeof target.scrollIntoView === 'function') {

        }
      });
    });

    // ★要件：専用の「ステータス変更」欄は廃止し、プラン・各オプションの隣のSTS JPバッジ
    // （shopStatusCellで生成した<select>）から直接変更できるようにする。DC/PCがどれか1つでも
    // 選ばれていれば、共通の警告（チャージ規定の確認）を表示する。
    const updateShopChargeWarning = () => {
      const warn = $('shop-status-warning');
      if (!warn) return;
      const hasChargeRisk = Object.keys(pendingChanges).some(f =>
        (f === 'STS JP' || /^OP\d+ STS JP$/.test(f)) && (pendingChanges[f] === 'DC' || pendingChanges[f] === 'PC'));
      warn.classList.toggle('hidden', !hasChargeRisk);
    };
    c.querySelectorAll('[data-shop-status-field]').forEach(sel => {
      const field = sel.dataset.shopStatusField;
      if (Object.prototype.hasOwnProperty.call(pendingChanges, field)) sel.value = pendingChanges[field];
      sel.addEventListener('change', () => {
        const v = sel.value;
        if (v) pendingChanges[field] = v; else delete pendingChanges[field];
        updateShopChargeWarning();
        updatePendingIndicator();
      });
    });
    updateShopChargeWarning();

    loadShopUploadedDocsInto('shop-upload-list');

    (d.history || []).forEach(h => {
      if (h.senderRole !== 'SHOP' && !h.checkShop) {
        gsRun('apiToggleHistoryCheck', session.token, h.id, true).catch(() => {});
      }
    });

  // ★機能追加（拡張要望8章）：店舗が選んだファイルをBase64にしてアップロードする
  async function submitShopUpload() {
    $('shop-upload-error').classList.add('hidden');
    const fileInput = $('shop-upload-file');
    const file = fileInput.files && fileInput.files[0];
    if (!file) { showFieldError('shop-upload-error', 'ファイルを選択してください。'); return; }
    const docType = $('shop-upload-doctype').value;
    try {
      const base64 = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result).split(',').pop());
        reader.onerror = () => reject(new Error('ファイルの読み込みに失敗しました。'));
        reader.readAsDataURL(file);
      });
      await gsRun('apiShopUploadDocument', session.token, currentKanri, docType, file.name, file.type, base64);
      fileInput.value = '';
      showToast('アップロードしました');
      loadShopUploadedDocsInto('shop-upload-list');
    } catch (e) {
      showFieldError('shop-upload-error', e.message);
    }
  }

  // ★機能追加（拡張要望10章）：同意書・アンケートフォームの事前入力済みURLを取得して表示する
  // （店舗向け画面・JP/支店向けの「予約内容」タブの両方から使う共通関数）
  async function loadFormUrlsInto(elId) {
    const el = $(elId);
    if (!el) return;
    try {
      const res = await gsRun('apiGetPrefilledFormUrls', session.token, currentKanri);
      const rows = [];
      if (res.consentFormUrl) rows.push(`<div><a href="${escapeAttr(res.consentFormUrl)}" target="_blank" rel="noopener">同意書フォームを開く</a></div>`);
      if (res.surveyFormUrl) rows.push(`<div><a href="${escapeAttr(res.surveyFormUrl)}" target="_blank" rel="noopener">アンケートフォームを開く</a></div>`);
      el.innerHTML = rows.length ? rows.join('') : '<p class="hint-text">フォームが未設定です（管理者へお問い合わせください）。</p>';
    } catch (e) {
      el.innerHTML = `<p class="error-text">${escapeHtml(e.message)}</p>`;
    }
  }

  // 支店側がSTS(支店側)を編集できるかどうかを、対になるSTS(JP側)の現在値から判定する
  function branchGateFor(jpValue) {
    const key = jpValue || '';
    if (!(key in BRANCH_EDIT_GATE)) return { editable: false, allowed: null };
    return { editable: true, allowed: BRANCH_EDIT_GATE[key] };
  }

  // STSセレクト（編集可なら<select data-pending>、不可なら読み取り専用表示）＋変更履歴リンク付き
  function statusCell(fieldName, current, editableByMe, allowedValues, lockedReason) {
    const control = editableByMe
      ? (() => {
          const codes = allowedValues || STATUS_CODES;
          const opts = ['<option value="">-</option>'].concat(
            codes.map(c => `<option value="${c}" ${c === current ? 'selected' : ''}>${c}</option>`)
          ).join('');
          return `<select data-pending="${fieldName}">${opts}</select>`;
        })()
      // ★不具合修正：STSの値は本来アプリ経由ならSTATUS_CODESの範囲内だが、スプレッドシートを
      // 直接編集された場合は任意の文字列になり得るため、読み取り専用表示でもエスケープする
      : `<div class="val locked-val">🔒 ${escapeHtml(current || '-')}${lockedReason ? `<span class="hint-text"> (${escapeHtml(lockedReason)})</span>` : ''}</div>`;
    const hid = 'fh-' + fieldName.replace(/[^A-Za-z0-9]/g, '_');
    return `${control}<button type="button" class="history-link" data-history-field="${escapeAttr(fieldName)}" data-history-target="${hid}">履歴</button>
      <div class="history-panel hidden" id="${hid}"></div>`;
  }

  // ★要件：プラン名など、項目の名前のすぐ隣に現在のSTSを小さなバッジで表示する（クリックで履歴）。
  // 編集はしない（編集は各タブの通常のSTS欄・3択フローで行う）ための、読み取り専用の簡易表示。
  function inlineStatusBadge(fieldName, current, chipClass) {
    const hid = 'fh-inline-' + fieldName.replace(/[^A-Za-z0-9]/g, '_');
    return `<span class="chip ${chipClass}" data-history-field="${escapeAttr(fieldName)}" data-history-target="${hid}"
        style="cursor:pointer;font-weight:700;">${escapeHtml(current || '未設定')}</span>
      <div class="history-panel hidden" id="${hid}" style="width:100%;margin-top:4px;"></div>`;
  }

  // ★要件：専用の「ステータス変更」欄は廃止し、プラン・各オプションの隣に出るSTS(JP側)バッジ
  // から店舗自身がその場でRQ→CR等へ直接変更できるようにする（Code.gsのSHOP_STATUS_TARGETS参照）。
  // 現在値がFN/CR/DC/PCのいずれでもない（RQ等）場合も、選択肢の先頭に現在値を追加してそのまま表示する
  // （現在値を選び直しても実質「変更なし」なので、送信時は「-（変更しない）」と同じ扱いになる）。
  function shopStatusCell(fieldName, current) {
    const codes = (!current || SHOP_STATUS_TARGETS.includes(current)) ? SHOP_STATUS_TARGETS : [current, ...SHOP_STATUS_TARGETS];
    const opts = ['<option value="">-（変更しない）</option>'].concat(
      codes.map(c => `<option value="${c}" ${c === current ? 'selected' : ''}>${escapeHtml(SHOP_STATUS_LABELS[c] || c)}</option>`)
    ).join('');
    const hid = 'fh-shopsts-' + fieldName.replace(/[^A-Za-z0-9]/g, '_');
    return `<select data-shop-status-field="${escapeAttr(fieldName)}">${opts}</select>
      <button type="button" class="history-link" data-history-field="${escapeAttr(fieldName)}" data-history-target="${hid}">履歴</button>
      <div class="history-panel hidden" id="${hid}"></div>`;
  }

  // ★要件：手配内容をPDFにできるようにしてほしい、との要望への対応。
  // GAS上のWebアプリなのでサーバー側でPDFを生成するのではなく、画面上に「印刷用の手配内容」を
  // 常時（非表示で）用意しておき、ブラウザの印刷機能（送信先を「PDFに保存」）でPDF化してもらう方式。
  // JP/支店/店舗いずれの詳細画面でも同じ関数を使い回せるよう、共通のフィールド名（希望日・オプション
  // 一覧の形は buildShopReservationDetail_ と renderDetail 用の集計処理で揃えてある）だけを参照する。
  function buildArrangementPrintHtml(d) {
    const hopeRows = ['①', '②', '③', '④', '⑤'].map((mark, i) => {
      const n = i + 1;
      const dateVal = d[`希望日${mark}`];
      if (!dateVal) return '';
      return `<tr><td>第${n}希望</td><td>${escapeHtml(dateVal)}</td>
        <td>${escapeHtml(d[`希望日${mark} STS JP`] || '-')}</td><td>${escapeHtml(d[`希望日${mark} STS 支店`] || '-')}</td></tr>`;
    }).filter(Boolean).join('');
    const optionRows = (d.options || []).filter(o => o.name).map(o => `
      <tr><td>オプション${o.n}</td><td>${escapeHtml(o.name)}</td>
        <td>${escapeHtml(o.stsJp || '-')}</td><td>${escapeHtml(o.stsBranch || '-')}</td></tr>`).join('');
    const stamp = new Date().toLocaleString('ja-JP');
    return `
      <h1 style="margin:0 0 4px;">手配内容</h1>
      <p style="margin:0 0 16px;color:#555;">出力日時: ${escapeHtml(stamp)}</p>
      <table class="print-kv">
        <tr><th>管理番号</th><td>${escapeHtml(d['管理番号'] || '')}</td><th>CHG NO</th><td>${escapeHtml(d['CHG NO'] || 'なし')}</td></tr>
        <tr><th>支店</th><td>${escapeHtml(d.branchName || '')}（${escapeHtml(d['支店コード'] || '')}）</td><th>担当</th><td>${escapeHtml(d['管轄'] || '未設定')}${d['管轄'] ? '手配課' : ''}</td></tr>
        <tr><th>新郎名</th><td>${escapeHtml(fullNameClient_(d['新郎姓（ローマ字）'], d['新郎名（ローマ字）']))}</td><th>新婦名</th><td>${escapeHtml(fullNameClient_(d['新婦姓（ローマ字）'], d['新婦名（ローマ字）']))}</td></tr>
        <tr><th>プラン</th><td>${escapeHtml(d['プラン名'] || '未設定')}</td><th>セール名</th><td>${escapeHtml(d['セール名'] || '')}</td></tr>
        <tr><th>撮影希望場所</th><td>${escapeHtml(d['撮影希望場所'] || '')}</td><th>撮影日FIX</th><td>${escapeHtml(d['撮影日FIX'] || '未定')}</td></tr>
        <tr><th>STS JP</th><td>${escapeHtml(d['STS JP'] || '')}</td><th>STS 支店</th><td>${escapeHtml(d['STS 支店'] || '')}</td></tr>
      </table>
      ${!hopeRows ? '' : `<h2>希望日ごとのステータス</h2>
        <table class="print-table"><thead><tr><th>優先順位</th><th>日付</th><th>日本STS</th><th>現地STS</th></tr></thead>
        <tbody>${hopeRows}</tbody></table>`}
      ${!optionRows ? '' : `<h2>オプション・プラン明細</h2>
        <table class="print-table"><thead><tr><th>No.</th><th>名称</th><th>STS JP</th><th>STS 支店</th></tr></thead>
        <tbody>${optionRows}</tbody></table>`}
      <h2>備考</h2>
      <p>${escapeHtml(d['備考'] || 'なし')}</p>`;
  }

  // 詳細画面の見出しに「PDFとして保存」ボタンと、印刷専用の非表示ブロックを差し込む。
  // ボタンは画面上でwindow.print()を呼ぶだけ（印刷用CSSが他の要素を隠し、この内容だけを印刷対象にする）
  function renderPrintArrangement(d) {
    const el = $('print-arrangement');
    if (el) el.innerHTML = buildArrangementPrintHtml(d);
  }

  // ★機能：共有メモ／メモ（現地用）を「積み上げ式」で表示する。日付・記入者は自動、内容だけ手入力。
  // 追加すると即座に保存される（社内進行管理欄のチェックボックスと同じ考え方で、3択保留の対象外）。
  function memoLogSectionHtml(d, memoType, title, placeholder, legacyValue) {
    const tlItem = (who, when, body) => `
      <div class="tl-item">
        <div class="tl-meta"><span>${escapeHtml(who)}</span><span>${escapeHtml(when)}</span></div>
        <div class="tl-body">${escapeHtml(body)}</div>
      </div>`;
    const entries = (d.memoLog || []).filter(m => m.type === memoType);
    const listHtml = entries.length
      ? entries.map(m => tlItem(m.who, m.datetime, m.body)).join('')
      : (legacyValue ? tlItem('（この機能を追加する前の記録）', '', legacyValue) : '<p class="hint-text">まだ記録はありません。</p>');
    return `
      <div class="section-card">
        <h3>${escapeHtml(title)}</h3>
        <div class="msg-row">
          <textarea data-memo-input="${escapeAttr(memoType)}" rows="2" placeholder="${escapeAttr(placeholder)}"></textarea>
          <button type="button" class="send-btn" data-memo-add="${escapeAttr(memoType)}">追加</button>
        </div>
        <p class="hint-text" style="margin:4px 0 0;">日付・記入者は自動で記録されます。追加すると即座に保存されます（他の項目のような保留はありません）。</p>
        <div style="margin-top:10px;">${listHtml}</div>
      </div>`;
  }

  // ★機能：お客様がGoogleフォームで回答したアンケート内容を、案件ごとに時系列で表示する（読み取り専用）
  function surveyLogSectionHtml(d) {
    const entries = (d.memoLog || []).filter(m => m.type === MEMO_TYPE_SURVEY);
    const listHtml = entries.length
      ? entries.map(m => `
          <div class="tl-item">
            <div class="tl-meta"><span>${escapeHtml(m.who)}</span><span>${escapeHtml(m.datetime)}</span></div>
            <div class="tl-body">${escapeHtml(m.body)}</div>
          </div>`).join('')
      : '<p class="hint-text">まだ回答はありません（Googleフォームの回答が届くと自動で表示されます）。</p>';
    return `
      <div class="section-card">

            <p class="hint-text">この支店では現地スタッフ手配メール機能が無効になっています。使う場合は「設定」画面から有効にしてください。</p>
          </div>
          ${surveyLogSectionHtml(d)}
        </div>`;
    }
    const buttonsHtml = (d.arrangementCategories || []).map(c => `
      <button type="button" class="send-btn arrangement-btn" data-arrangement-category="${escapeAttr(c.key)}"
        style="width:100%;${c.available ? '' : 'background:var(--color-muted);'}" ${c.available ? '' : 'disabled'}>
        ${escapeHtml(c.label)}${c.available ? 'を手配依頼' : '（未設定）'}
      </button>`).join('');
    const logHtml = (d.arrangementLog || []).length
      ? d.arrangementLog.map(a => `
          <div class="tl-item">
            <div class="tl-meta"><span>${escapeHtml(a.category)} 宛: ${escapeHtml(a.toName || a.toEmail)} ・ ${escapeHtml(a.who)}</span><span>${escapeHtml(a.datetime)}</span></div>
            <div class="tl-body">${escapeHtml(a.subject)}</div>
          </div>`).join('')
      : '<p class="hint-text">まだ手配依頼を送っていません。</p>';
    return `
      <div class="tab-pane ${detailActiveTab === 'arrangement' ? '' : 'hidden'}" data-tab-pane="arrangement">
        <div class="section-card">
          <h3>スタッフ手配</h3>
          <p class="hint-text" style="margin-bottom:10px;">ボタンを押すと宛先・内容を確認できる下書きが開きます。内容を確認・編集してから送信してください（宛先は「設定」画面の登録内容から自動で決まります）。</p>
          <div style="display:flex;flex-direction:column;gap:8px;">${buttonsHtml}</div>
        </div>
        <div class="section-card">
          <h3>手配履歴（新しい順）</h3>
          ${logHtml}
        </div>
        ${surveyLogSectionHtml(d)}
      </div>`;
  }

  // ★要件：新郎名・新婦名は姓・名を分けて入力する。表示用のフルネームはどこでもこの関数で組み立てる
  // （Code.gsのfullName_と同じロジック。姓・名がずれて食い違わないよう、フルネームだけの列は持たない）
  function fullNameClient_(lastName, firstName) {
    const l = String(lastName || '').trim();
    const f = String(firstName || '').trim();
    return [l, f].filter(Boolean).join(' ');
  }

  function nameListWithCurrent(masterList, current) {
    const names = (masterList || []).filter(x => x.active).map(x => x.name);
    if (current && !names.includes(current)) names.push(current);
    return names;
  }

  // 「2026/12/3」「2026-12-03」等を <input type="date"> 用の yyyy-MM-dd に変換（不正ならnull）
  function toIsoDate(v) {
    const m = String(v || '').trim().match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})$/);
    if (!m) return null;
    return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
  }

  function renderDetail(d, planList, optionList, locationList, staffList, phraseList, saleList) {
    const c = $('detail-content');

    const planNames = nameListWithCurrent(planList, d['プラン名']);
    const planSelect = `<select data-pending="プラン名"><option value="">未設定</option>${planNames.map(n =>
      `<option value="${escapeAttr(n)}" ${n === d['プラン名'] ? 'selected' : ''}>${escapeHtml(n)}</option>`).join('')}</select>`;

    // ★機能：セールは頻度が高く名称も毎回変わるため、プラン名とは別の欄にする（機能⑤）。
    // マスターに事前登録した候補（datalist）から選べる＋自由入力もできる（撮影希望場所と同じ運用）
    const saleNames = nameListWithCurrent(saleList, d['セール名']);
    const saleDatalist = `<datalist id="sale-datalist">${saleNames.map(n => `<option value="${escapeAttr(n)}">`).join('')}</datalist>`;

    // ★要件：撮影希望場所は各地で違うので必須の選択式にせず、任意入力＋マスターの候補（datalist）にする
    const locationNames = nameListWithCurrent(locationList, d['撮影希望場所']);
    const locationDatalist = `<datalist id="location-datalist">${locationNames.map(n => `<option value="${escapeAttr(n)}">`).join('')}</datalist>`;

    // ★機能：お客様のGoogleフォーム『同意書』回答を反映する欄（機能④）。
    // 支店マスタで「同意書必須」の支店（例：ローマ）は、未回収のとき赤字で警告を出す
    // ★要件：表示は日本側、またはイタリアの支店のみ（他支店には出さない）
    const consentDone = !!String(d['同意書'] || '').trim();
    const consentWarn = d.consentRequired && !consentDone;
    const showConsent = session.role === 'JP' || d.isItaly;
    const consentBlock = !showConsent ? '' : `
      <div class="section-card">
        <h3>同意書</h3>
        <label class="checkbox-label" style="${consentWarn ? 'color:var(--color-danger,#c0392b);font-weight:bold;' : ''}">
          <input type="checkbox" data-pending="同意書" data-consent-checkbox="1" ${consentDone ? 'checked' : ''}>
          同意書取得済み${d.consentRequired ? '（この支店は必須）' : '（任意）'}${consentWarn ? ' ─ 未回収です' : ''}
        </label>
        <p class="hint-text">Googleフォームで回答があると自動でチェックが付きます。手動でもチェック可能です（通常の保存の3択で確定してください）。</p>
      </div>`;

    // ★機能：スタッフ名の入力候補（表記ゆれを抑えてダブルブッキング検知の精度を上げる）
    const staffNames = (staffList || []).filter(x => x.active).map(x => x.name);
    const staffDatalist = `<datalist id="staff-datalist">${staffNames.map(n => `<option value="${escapeAttr(n)}">`).join('')}</datalist>`;

    // ★機能追加：希望日ごとの空き確認ステータス（第一〜第五希望それぞれにSTS JP／STS 支店）を
    // 「優先順位・日付・日本STS・現地STS」の表で表示する。
    // STS(JP側)は自動連動専用のシステム項目のため常に読み取り専用（editableByMe=false固定）。
    // STS(支店側)は現地が編集する（初期値ST→ベンダー確認後RQ／取れたらOK／取れなければUC）。
    // OK/UCの回答はSTS(JP側)にも自動反映され、OKになると他の希望日は自動でUCになり、
    // その日付が撮影日FIXへ反映される（Code.gsのapplyHopeStatusCascade_参照）。
    const HOPE_FIELDS = ['希望日①', '希望日②', '希望日③', '希望日④', '希望日⑤'];
    // ★要件：現地・日本共に一括でステータスをセットできるように。チェックした希望日のSTS(支店側)を
    // まとめて選んだ値にする（OK/UCならJP側にも自動反映される＝applyHopeStatusCascade_が担当）。
    const canBulkSetHope = session.role === 'BRANCH';
    const hopeTableRows = HOPE_FIELDS.map((f, i) => {
      const jpField = `${f} STS JP`, branchField = `${f} STS 支店`;
      const gate = branchGateFor(d[jpField]);
      const branchEditable = session.role === 'BRANCH' && gate.editable;
      const jpCell = d[jpField] ? statusCell(jpField, d[jpField], false, null) : '';
      const branchCell = branchEditable
        ? statusCell(branchField, d[branchField], true, gate.allowed, `${f} STS JP: ${d[jpField] || '未設定'}`)
        : (d[branchField] ? statusCell(branchField, d[branchField], false, null) : '');
      const checkCell = !canBulkSetHope ? '' :
        `<td><input type="checkbox" class="hope-bulk-check" data-hope-bulk-field="${escapeAttr(branchField)}" ${branchEditable ? '' : 'disabled'}></td>`;
      return `
        <tr>
          ${checkCell}
          <td>第${i + 1}希望</td>
          <td><input data-pending="${escapeAttr(f)}" value="${escapeAttr(d[f])}" style="width:100%;"></td>
          <td>${jpCell}</td>
          <td>${branchCell}</td>
        </tr>`;
    }).join('');
    const hopeBulkBarHtml = !canBulkSetHope ? '' : `
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px;">
        <span class="hint-text">選択した希望日の現地STSをまとめて設定：</span>
        <select id="hope-bulk-value" class="sort-select">${STATUS_CODES.map(c => `<option value="${c}">${c}</option>`).join('')}</select>
        <button type="button" class="send-btn-sm" id="hope-bulk-apply">まとめて設定</button>
      </div>
      <p class="hint-text" style="margin-top:4px;">OK／UCを選ぶと、日本側のSTSにも自動で反映されます。下の3択（保存のみ／メッセージ／変更＋メッセージ）で確定してください。</p>`;
    const hopeFieldsHtml = `
      <div class="table-wrap" style="margin-top:6px;">
        <table class="res-table">
          <thead><tr>${canBulkSetHope ? '<th></th>' : ''}<th>優先順位</th><th>日付</th><th>日本STS</th><th>現地STS</th></tr></thead>
          <tbody>${hopeTableRows}</tbody>
        </table>
      </div>
      ${hopeBulkBarHtml}`;
    // ★機能：希望日からのワンタップ回答（対象の希望日のSTS(支店側)をOKにする分かりやすいショートカット。
    // 実際の反映はapplyHopeStatusCascade_を通る＝上のSTSセレクトで選んだ場合と全く同じ結果になる）
    const hopeButtons = HOPE_FIELDS.map((f, i) => {
      const iso = toIsoDate(d[f]);
      if (!iso) return '';
      const jpField = `${f} STS JP`, branchField = `${f} STS 支店`;
      const gate = branchGateFor(d[jpField]);
      const canAnswer = session.role === 'BRANCH' && gate.editable &&
        (gate.allowed === null || gate.allowed.indexOf('OK') !== -1);
      if (!canAnswer) return '';
      return `<button type="button" class="hope-btn" data-hope-field="${escapeAttr(branchField)}" data-hope-iso="${iso}" data-hope-label="${escapeAttr(f)}">${escapeHtml(f)}（${escapeHtml(d[f])}）で確定</button>`;
    }).filter(Boolean).join('');
    const hopeBlock = hopeButtons
      ? `<div class="hope-box"><div class="hint-text" style="margin-bottom:6px;">希望日から確定する（その希望日のSTS 支店をOKにします。撮影日FIXへの反映・他の希望日の自動UC・日本側への通知は自動で行われます）</div>${hopeButtons}</div>`
      : '';

    // ★要件：「空きだけ確認」にチェックを入れて確定すると、STS JPが自動でCHK（確認依頼中）になり、
    // 撮影日FIXではなく上の希望日①〜⑤の空き状況を現地へ確認する依頼になる（日本側のみ操作）
    const inquiryDone = !!String(d['空き確認のみ'] || '').trim();
    const inquiryBlock = session.role !== 'JP' ? '' : `
      <label class="checkbox-label">
        <input type="checkbox" data-pending="空き確認のみ" data-consent-checkbox="1" ${inquiryDone ? 'checked' : ''}>
        空きだけ確認する（予約ではなく、下の希望日で空きがあるか現地へ確認する依頼になります）
      </label>
      <p class="hint-text">チェックして「変更（＋メッセージ）を決定して送信」すると、STS JPが自動でCHKになり現地へ確認依頼が届きます。現地はUC（空きなし）で回答するか、メッセージで空き状況を返信します。</p>`;

    const mainGate = branchGateFor(d['STS JP']);
    const statusRowHtml = `
      <div class="status-row">
        <div class="status-card"><div class="who">STS JP</div>${statusCell('STS JP', d['STS JP'], session.role === 'JP', null)}</div>
        <div class="status-card"><div class="who">STS 支店</div>${statusCell('STS 支店', d['STS 支店'], session.role === 'BRANCH' && mainGate.editable, mainGate.allowed, `STS JP: ${d['STS JP'] || '未設定'}`)}</div>
      </div>`;

    // ★要件：準備場所はイタリアの支店のみ表示し、ホテル／サロンの選択式にする（他支店は非表示）
    const prepFieldHtml = !d.isItaly ? '' : `
      <div class="field-block"><label>準備場所</label>
        <select data-pending="準備場所"><option value="">未設定</option>${PREP_CHOICES.map(p =>
          `<option value="${escapeAttr(p)}" ${d['準備場所'] === p ? 'selected' : ''}>${escapeHtml(p)}</option>`).join('')}</select>
      </div>`;

    // ★機能追加（拡張要望9章）：必要書類チェックリスト（店舗・現地の双方向チェック）
    const checklistHtml = (d.checklist || []).map(c => `
      <label class="checkbox-label">
        <input type="checkbox" data-pending="${escapeAttr('必要書類チェック:' + c.item)}" data-bool-checkbox="1" ${c.checked ? 'checked' : ''}>
        ${escapeHtml(c.item)}
      </label>`).join('');

    // ★機能追加（拡張要望6章）：店舗発の案件だけ、起票した店舗の請求先（営業本部）を表示する
    const shopBillingBlock = !d.originShop ? '' : `
      <div class="section-card">
        <h3>店舗発の依頼情報</h3>
        <div class="detail-grid">
          <div class="field-block"><label>起票元店舗</label><div>${escapeHtml(d.originShopName || d.originShop)}</div></div>
          ${!d.shopBilling ? '' : `<div class="field-block"><label>請求先（店舗の営業本部）</label><div>${escapeHtml(d.shopBilling)}</div></div>`}
        </div>
      </div>`;

    // ★要件：オプション名のすぐ隣にステータス（STS JP・STS 支店）を置く（従来は名前の下に
    // 別ブロックとして表示していた）。クリックすると誰が・いつ変更したかの履歴が見られる仕様は
    // 既存のstatusCell（「履歴」リンク）をそのまま使うので変わらない。
    const optionsHtml = d.options.map(o => {
      const gate = branchGateFor(o.stsJp);
      const optNames = nameListWithCurrent(optionList, o.name);
      const nameSelect = `<select data-pending="OP${o.n}"><option value="">（未使用）</option>${optNames.map(n =>
        `<option value="${escapeAttr(n)}" ${n === o.name ? 'selected' : ''}>${escapeHtml(n)}</option>`).join('')}</select>`;
      return `
        <div class="option-row" style="align-items:center;gap:10px;">
          <div style="flex:1;min-width:0;">${nameSelect}</div>
          <div style="display:flex;gap:6px;flex:none;">
            <div style="width:112px;">${statusCell('OP' + o.n + ' STS JP', o.stsJp, session.role === 'JP', null)}</div>
            <div style="width:112px;">${statusCell('OP' + o.n + ' STS 支店', o.stsBranch, session.role === 'BRANCH' && gate.editable, gate.allowed, `STS JP: ${o.stsJp || '未設定'}`)}</div>
          </div>
        </div>`;
    }).join('');

    // ★要件：メッセージ・変更のチェック（既読）は「誰が・いつ」確認したかも表示し、未読かどうか一目でわかるようにする
    const historyHtml = d.history.map(h => {
      const isFromCounterpart = h.senderRole && h.senderRole !== session.role;
      const myChecked = session.role === 'JP' ? h.checkJp : h.checkBranch;
      const unread = isFromCounterpart && !myChecked;
      const jpCheckLabel = h.checkJp ? `JP確認済み：${escapeHtml(h.checkedByJp || '')}（${escapeHtml(h.dateJp || '')}）` : 'JP未確認';
      const branchCheckLabel = h.checkBranch ? `支店確認済み：${escapeHtml(h.checkedByBranch || '')}（${escapeHtml(h.dateBranch || '')}）` : '支店未確認';
      return `
      <div class="history-item ${unread ? 'unread' : ''}">
        <div class="history-meta"><span>${escapeHtml(h.sender)}</span><span>${escapeHtml(h.datetime)}</span></div>
        <div class="history-body">${escapeHtml(h.body)}</div>
        <div class="history-checks">
          <label><input type="checkbox" data-hid="${escapeAttr(h.id)}" data-side="JP" ${h.checkJp ? 'checked' : ''} ${session.role !== 'JP' ? 'disabled' : ''}> ${jpCheckLabel}</label>
          <label><input type="checkbox" data-hid="${escapeAttr(h.id)}" data-side="BRANCH" ${h.checkBranch ? 'checked' : ''} ${session.role !== 'BRANCH' ? 'disabled' : ''}> ${branchCheckLabel}</label>
        </div>
      </div>`;
    }).join('') || '<p class="hint-text">やり取りはまだありません。</p>';

    const pendingCount = Object.keys(pendingChanges).length;
    const invoiceLabel = d.invoiceLabel || '請求番号';

    // ★機能：メッセージタブに戻らなくても、予約内容・現地記入欄の下からそのまま確定できるようにする。
    // 「メッセージのみ送信」はメッセージ本文が必須なのでここには置かず、他の2択のみ複製する。
    // メッセージタブのボタン（btn-commit/btn-save-quiet）と挙動は同じ（メッセージタブのmsg-inputは
    // 非表示でもDOM上には存在するため、入力済みならそのまま一緒に送信される）
    const quickActionsHtml = `
      <div class="section-card">
        <div style="display:flex;flex-direction:column;gap:8px;">
          <button type="button" class="send-btn quick-commit-btn" style="width:100%;">変更（＋メッセージ）を決定して送信</button>
          <button type="button" class="send-btn quick-save-btn" style="width:100%;background:var(--color-muted);">保存のみ（通知しない）</button>
        </div>
        <p class="hint-text" style="margin-top:8px;">「メッセージ」タブに戻らずここから直接確定できます（メッセージ欄に入力済みの内容があれば一緒に送られます）。</p>
      </div>`;

    // ★機能：日本の手配課側のみが見る「日本記入欄」タブ。支店には一切表示しない（値もサーバーから届かない）。
    // 通常の3択（保存のみ／メッセージ／変更＋メッセージ）とは別に、変更した瞬間に単独で保存する
    // （支店に見える履歴・通知メールへ絶対に混ざらないようにするため）。
    const jpEntryTabHtml = session.role !== 'JP' ? '' : `
      <div class="tab-pane ${detailActiveTab === 'jpEntry' ? '' : 'hidden'}" data-tab-pane="jpEntry">
        <div class="section-card">
          <h3>管轄</h3>
          <select data-pending="管轄"><option value="">未定</option>${JP_TEAMS.map(t => `<option value="${t}" ${d['管轄'] === t ? 'selected' : ''}>${t}</option>`).join('')}</select>
          <p class="hint-text">担当する手配課（関東／関西）です。通常の保存の3択で確定してください。</p>
        </div>
        <div class="section-card">
          <h3>日本記入欄</h3>
          <label class="checkbox-label">
            <input type="checkbox" data-internal-flag="フォトブリッジ登録" ${d['フォトブリッジ登録'] === '済' ? 'checked' : ''}>
            フォトブリッジ登録（${d['フォトブリッジ登録'] === '済' ? '済' : '未'}）
          </label>
          <p class="hint-text" style="margin:0 0 10px 26px;">${d['フォトブリッジ登録者'] ? `登録者: ${escapeHtml(d['フォトブリッジ登録者'])}${d['フォトブリッジ登録日時'] ? `（${escapeHtml(d['フォトブリッジ登録日時'])}）` : ''}` : ''}</p>

          <label>AI加工</label>
          <select data-internal-value="AI加工"><option value="">未設定</option>${AI_EDIT_OPTIONS.map(o =>
            `<option value="${escapeAttr(o)}" ${d['AI加工'] === o ? 'selected' : ''}>${escapeHtml(o)}</option>`).join('')}</select>

          <label class="checkbox-label" style="margin-top:10px;">
            <input type="checkbox" data-internal-flag="データアップロード" ${d['データアップロード'] === '済' ? 'checked' : ''}>
            データアップロード（${d['データアップロード'] === '済' ? '済' : '未'}）
          </label>
          <p class="hint-text" style="margin:0 0 10px 26px;">${d['データアップロード者'] ? `アップロード者: ${escapeHtml(d['データアップロード者'])}${d['データアップロード日時'] ? `（${escapeHtml(d['データアップロード日時'])}）` : ''}` : ''}</p>

          <label>納品先メールアドレス</label>
          <input type="email" data-internal-value="納品先メールアドレス" value="${escapeAttr(d['納品先メールアドレス'])}" placeholder="delivery@example.com">

          <label class="checkbox-label" style="margin-top:10px;">
            <input type="checkbox" data-internal-flag="早期納品" ${d['早期納品'] === '有' ? 'checked' : ''}>
            早期納品（${d['早期納品'] === '有' ? '有' : '無'}）
          </label>
          <p class="hint-text" style="margin-top:8px;">チェックする・選ぶ・入力すると即座に保存されます（フォトブリッジ登録・データアップロードは担当者名と日時が自動で記録されます）。</p>
        </div>
        ${quickActionsHtml}
      </div>`;

    const tabBarHtml = `
      <div class="tab-bar">
        ${DETAIL_TABS.filter(t => !t.jpOnly || session.role === 'JP').map(t =>
          `<button type="button" class="tab-btn ${detailActiveTab === t.key ? 'active' : ''}" data-tab="${t.key}">${t.label}</button>`).join('')}
      </div>`;

    // ★機能追加：店舗が起票した案件は、宛先が固定の2択（JP⇔支店）ではなくなる。
    // 支店マスタの「店舗直接やり取り許可」がOFFの間は、日本側（JP）が「支店へ」「店舗へ」を
    // 選んで送る（＝現地の回答を店舗の画面へ中継する操作）。ONなら支店⇔店舗が直接やり取りするため
    // 選択は不要（JPは従来どおり支店へ）。
    const shopBanner = !d.originShop ? '' : `

  async function loadShopUploadedDocsInto(elId) {
    const el = $(elId);
    if (!el) return;
    try {
      const res = await gsRun('apiListShopUploadedDocuments', session.token, currentKanri);
      if (!res.visible) {
        el.innerHTML = '<p class="hint-text">現地への公開が許可されていないため、この画面では表示されません。</p>';
        return;
      }
      const nonEmpty = (res.folders || []).filter(f => f.files.length > 0);
      if (!nonEmpty.length) { el.innerHTML = '<p class="hint-text">まだアップロードはありません。</p>'; return; }
      el.innerHTML = nonEmpty.map(f => `
        <div style="margin-bottom:8px;">
          <strong>${escapeHtml(f.docType)}</strong>
          <ul style="margin:4px 0 0 18px;">
            ${f.files.map(file => `<li><a href="${escapeAttr(file.url)}" target="_blank" rel="noopener">${escapeHtml(file.name)}</a>（${escapeHtml(file.updatedAt || '')}）</li>`).join('')}

        </div>`).join('');
    } catch (e) {
      el.innerHTML = `<p class="error-text">${escapeHtml(e.message)}</p>`;
    }
  }

    const shown = iso.replace(/-/g, '/');

      await gsRun('apiCommitChanges', session.token, currentKanri,
        { [hopeField]: 'OK' },
        `${label}（${shown}）で確定します。`);

  // ★機能：同じ支店・同じ撮影日に同名スタッフが既に割り当てられていないか確認して警告する。
  // 保存はブロックせず、あくまで気づきのための表示にとどめる。
  async function checkStaffConflict() {
    const box = $('staff-conflict');
    if (!box || !currentDetail) return;
    const fields = ['当日の担当', 'ヘアメイク', 'カメラマン', 'アシスタント'];
    const names = {};
    fields.forEach(f => {
      const el = document.querySelector(`[data-pending="${f}"]`);
      if (el && el.value.trim()) names[f] = el.value.trim();
    });
    const dateEl = document.querySelector('[data-pending="撮影日FIX"]');
    const date = (dateEl && dateEl.value) || currentDetail['撮影日FIX'];
    if (!date || Object.keys(names).length === 0) { box.classList.add('hidden'); return; }
    try {
      const res = await gsRun('apiCheckStaffConflict', session.token, currentKanri, date, names);
      if (!res.conflicts.length) { box.classList.add('hidden'); box.innerHTML = ''; return; }
      box.innerHTML = `<strong>同じ日に重複しています</strong>` +
        res.conflicts.map(cf =>
          `<div>${escapeHtml(cf.staff)} … ${escapeHtml(cf.kanriNo)}（${escapeHtml(cf.groomName || '')}${cf.brideName ? ' / ' + escapeHtml(cf.brideName) : ''}）の「${escapeHtml(cf.conflictField)}」に割り当て済み</div>`
        ).join('') +
        `<div class="hint-text" style="margin-top:6px;">保存は可能です。意図した割り当てかご確認ください。</div>`;
      box.classList.remove('hidden');
    } catch (e) { /* 検知は補助機能のため、失敗しても操作は妨げない */ }
  }

  // ★不具合修正：「メッセージのみ送信」の直後など、未保存の変更（pendingChanges）を保持したまま
  // 画面を再描画する場面がある。以前はサーバーの値で入力欄が上書きされてしまい、
  // 「未保存の変更: 1件」と出ているのに画面上はどこが変更中なのか分からず、
  // そのまま「変更を決定して送信」を押すと画面に見えていない値が送信される状態だった。
  // 再描画後も入力欄に未保存の値を復元して、表示と実際に送信される内容を一致させる。
  // ★機能追加（拡張要望）：店舗ロール向けのrenderShopDetailからも共通利用できるよう独立した関数にした。
  function wirePendingInputs(container) {
    container.querySelectorAll('[data-pending]').forEach(el => {
      const field = el.dataset.pending;
      // ★機能：同意書チェックボックスは他のdata-pending項目と違いvalueではなくcheckedで持つため、
      // 「済／未」の文字列と相互変換する（サーバー側は文字列で保存しているため）
      if (el.dataset.consentCheckbox) {
        if (Object.prototype.hasOwnProperty.call(pendingChanges, field)) {
          el.checked = !!pendingChanges[field];
        }
        el.addEventListener('change', () => {
          pendingChanges[field] = el.checked ? '済' : '';
          updatePendingIndicator();
        });
        return;
      }
      // ★機能追加（拡張要望9章）：必要書類チェックリストは「済／未」ではなくTRUE/空欄で保存する
      // （Code.gs側のisActiveFlag_と一致させるため）
      if (el.dataset.boolCheckbox) {
        if (Object.prototype.hasOwnProperty.call(pendingChanges, field)) {
          el.checked = !!pendingChanges[field];
        }
        el.addEventListener('change', () => {
          pendingChanges[field] = el.checked ? 'TRUE' : '';
          updatePendingIndicator();
        });
        return;
      }
      if (Object.prototype.hasOwnProperty.call(pendingChanges, field)) {
        el.value = pendingChanges[field];
      }
      el.addEventListener('change', () => {
        pendingChanges[el.dataset.pending] = el.value;
        updatePendingIndicator();
      });
    });
  }

  function updatePendingIndicator() {
    const el = $('pending-indicator');
    if (!el) return;
    const n = Object.keys(pendingChanges).length;
    el.textContent = `未保存の変更: ${n}件（「予約内容」「現地記入欄」タブでの入力を含みます）`;
    el.classList.toggle('hidden', n === 0);
  }

  function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }
  function escapeAttr(s) { return escapeHtml(s); }

  // data-属性のセレクタに日本語の値をそのまま使うため、CSS.escape相当の簡易版を用意
  function cssEscape_(s) {
    if (window.CSS && CSS.escape) return CSS.escape(s);
    return String(s).replace(/["\\\]]/g, (ch) => '\\' + ch);
  }

    if (!branchCode) return;
    settingsBranchCode = branchCode;
    $('settings-content').innerHTML = '<p class="hint-text">読み込み中...</p>';
    try {
      const res = await gsRun('apiGetArrangementSettings', session.token, branchCode);
      renderSettings(res);
    } catch (e) { handleAuthError(e); }
  }

  function renderSettings(res) {
    $('settings-content').innerHTML = `
      <div class="section-card">
        <h3>現地スタッフ手配メール</h3>
        <p class="hint-text">カメラマン・ヘアメイクなどのボタンを案件詳細の「手配」タブで押すと、
          ここで登録した宛先へ手配メールの下書きが自動作成されます。担当者が内容を確認・編集してから送信します。
          同じ宛先を複数カテゴリに登録すれば「1件の委託先へまとめて依頼」にもできます。空欄のカテゴリはボタンが無効になります。</p>
        <label class="checkbox-label" style="margin-top:12px;">
          <input type="checkbox" id="settings-enabled" ${res.enabled ? 'checked' : ''}> この機能を使う
        </label>
        <div style="margin-top:14px;display:flex;flex-direction:column;gap:12px;">
          ${res.categories.map(c => `
            <div class="field-block">
              <label>${escapeHtml(c.label)}</label>
              <input data-arr-name="${escapeAttr(c.key)}" placeholder="宛先名（任意）" value="${escapeAttr(c.name)}" style="margin-bottom:6px;">
              <input data-arr-email="${escapeAttr(c.key)}" placeholder="メールアドレス" value="${escapeAttr(c.email)}" type="email">
            </div>`).join('')}
        </div>
      </div>`;
  }

  async function saveArrangementSettings() {
    if (!$('settings-enabled')) return;
    const enabled = $('settings-enabled').checked;
    const categories = {};
    ARRANGEMENT_CATEGORIES.forEach(c => {
      const nameEl = document.querySelector(`[data-arr-name="${cssEscape_(c.key)}"]`);
      const emailEl = document.querySelector(`[data-arr-email="${cssEscape_(c.key)}"]`);
      categories[c.key] = { name: nameEl ? nameEl.value.trim() : '', email: emailEl ? emailEl.value.trim() : '' };
    });
    try {
      await gsRun('apiSaveArrangementSettings', session.token, settingsBranchCode, { enabled, categories });
      showToast('設定を保存しました');
    } catch (e) { handleAuthError(e); }
  }
</script>
