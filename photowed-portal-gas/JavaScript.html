<script>
  // =====================================================
  // PhotoWED 支店ポータル クライアントロジック
  // =====================================================
  const STORAGE_KEY = 'photowed_session';
  const STATUS_CODES = ['RQ', 'OK', 'CHK', 'CR', 'FN', 'CW', 'NC', 'UC', 'CF'];
  const JP_TEAMS = ['関東', '関西'];
  const BILLING_REGIONS = ['北海道', '東北', '関東', '中部', '関西', '中四国', '九州'];
  // 支店側がSTS(支店側)を編集できる条件。キー＝対になるSTS(JP側)の現在値。
  // null=制限なし／配列=その中からのみ／キーなし=支店側は編集不可
  const BRANCH_EDIT_GATE = { 'NC': null, 'RQ': null, 'CHK': null, 'CR': ['CW', 'CF'] };

  let session = null;
  let currentKanri = null;
  let dashboardScope = { showAll: true, teams: [], branches: [] };
  let searchScope = { showAll: true, teams: [], branches: [] };
  let branchesCache = [];      // 一覧/新規画面用（BRANCHロールのみに絞った支店一覧。JPログイン時に取得）
  let lastDashboardData = null; // キャンセル表示チェックボックスの再描画用にキャッシュ
  let pendingChanges = {}; // 「保存のみ／メッセージのみ送信／変更＋メッセージ送信」待ちの変更（既存予約の全項目が対象）

  function gsRun(fnName, ...args) {
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(err => reject(err))
        [fnName](...args);
    });
  }

  function $(id) { return document.getElementById(id); }

  function showToast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.remove('hidden');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => t.classList.add('hidden'), 2600);
  }

  function showView(name) {
    document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
    $('view-' + name).classList.remove('hidden');
  }

  function applyRoleUI() {
    const isJp = session && session.role === 'JP';
    document.querySelectorAll('.jp-only').forEach(el => el.classList.toggle('hidden', !isJp));
    $('branch-badge').textContent = session
      ? (isJp ? `${session.branchName}（${session.team}）` : `${session.branchName}（${session.branchCode}）`)
      : '';
  }

  // ---------- 起動 ----------
  window.addEventListener('DOMContentLoaded', () => {
    bindEvents();
    populateLoginOptions();
    populateStatusSelect('s-sts-jp');
    populateStatusSelect('s-sts-branch');
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      session = JSON.parse(saved);
      afterLogin();
    } else {
      showView('login');
    }
  });

  function populateStatusSelect(id) {
    const sel = $(id);
    if (!sel) return;
    sel.innerHTML = '<option value="">指定なし</option>' + STATUS_CODES.map(c => `<option value="${c}">${c}</option>`).join('');
  }

  async function populateLoginOptions() {
    try {
      const options = await gsRun('apiListLoginOptions');
      const sel = $('login-branchcode');
      sel.innerHTML = '<option value="">選択してください</option>' +
        options.map(o => `<option value="${o.code}">${o.name}${o.role === 'JP' ? '' : '（' + o.code + '）'}</option>`).join('');
    } catch (e) {
      $('login-branchcode').innerHTML = '<option value="">読み込みに失敗しました</option>';
    }
  }

  function bindEvents() {
    $('login-submit').addEventListener('click', doLogin);
    $('nav-dashboard').addEventListener('click', () => loadDashboard());
    $('nav-search').addEventListener('click', openSearchView);
    $('nav-new').addEventListener('click', openNewView);
    $('nav-logout').addEventListener('click', doLogout);
    $('detail-back').addEventListener('click', () => loadDashboard());
    $('new-submit').addEventListener('click', submitNewReservation);
    $('search-submit').addEventListener('click', submitSearch);
    $('show-cancelled').addEventListener('change', () => { if (lastDashboardData) renderDashboard(lastDashboardData); });
  }

  // ---------- ログイン ----------
  async function doLogin() {
    const branchCode = $('login-branchcode').value;
    const passcode = $('login-passcode').value;
    $('login-error').classList.add('hidden');
    if (!branchCode || !passcode) return;
    $('login-submit').disabled = true;
    try {
      const res = await gsRun('apiLogin', branchCode, passcode);
      if (!res.ok) {
        $('login-error').textContent = res.error;
        $('login-error').classList.remove('hidden');
        return;
      }
      session = res.session;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(session));
      afterLogin();
    } catch (e) {
      $('login-error').textContent = 'ログインに失敗しました：' + e.message;
      $('login-error').classList.remove('hidden');
    } finally {
      $('login-submit').disabled = false;
    }
  }

  function doLogout() {
    if (session) gsRun('apiLogout', session.token).catch(() => {});
    localStorage.removeItem(STORAGE_KEY);
    session = null;
    $('app-header').classList.add('hidden');
    $('login-branchcode').value = '';
    $('login-passcode').value = '';
    showView('login');
  }

  function afterLogin() {
    $('app-header').classList.remove('hidden');
    applyRoleUI();
    dashboardScope = { showAll: true, teams: [], branches: [] };
    searchScope = { showAll: true, teams: [], branches: [] };
    loadDashboard();
  }

  function handleAuthError(e) {
    showToast(e.message || '通信エラーが発生しました');
    if (String(e.message || '').includes('セッション')) doLogout();
  }

  // ---------- 表示範囲スコープ（全国／関東手配課／関西手配課／支店ごと） ----------
  function renderScopeSelector(container, scope, onChange) {
    if (session.role !== 'JP') { container.classList.add('hidden'); return; }
    container.classList.remove('hidden');

    const teamChips = JP_TEAMS.map(t => scopeChipHtml(
      `${t}手配課`, 'team', t, !scope.showAll && scope.teams.includes(t)
    )).join('');
    const branchChips = branchesCache.filter(b => b.role !== 'JP').map(b => scopeChipHtml(
      b.name, 'branch', b.code, !scope.showAll && scope.branches.includes(b.code)
    )).join('');

    container.innerHTML = `
      <div class="scope-title">表示範囲</div>
      <div class="scope-row">
        ${scopeChipHtml('全国', 'all', '', scope.showAll)}
        ${teamChips}
        ${branchChips}
      </div>`;

    container.querySelectorAll('input[type=checkbox]').forEach(cb => {
      cb.addEventListener('change', () => {
        const role = cb.dataset.role;
        const val = cb.dataset.val;
        if (role === 'all') {
          scope.showAll = cb.checked;
          if (cb.checked) { scope.teams = []; scope.branches = []; }
        } else {
          scope.showAll = false;
          const arr = role === 'team' ? scope.teams : scope.branches;
          const idx = arr.indexOf(val);
          if (cb.checked && idx === -1) arr.push(val);
          if (!cb.checked && idx !== -1) arr.splice(idx, 1);
          if (scope.teams.length === 0 && scope.branches.length === 0) scope.showAll = true;
        }
        renderScopeSelector(container, scope, onChange);
        onChange();
      });
    });
  }

  function scopeChipHtml(label, role, val, checked) {
    return `<label class="scope-chip ${checked ? 'active' : ''}">
      <input type="checkbox" data-role="${role}" data-val="${val}" ${checked ? 'checked' : ''}>${escapeHtml(label)}
    </label>`;
  }

  // ---------- ダッシュボード ----------
  async function loadDashboard() {
    showView('dashboard');
    try {
      const data = await gsRun('apiGetDashboard', session.token, dashboardScope);
      if (data.role === 'JP') branchesCache = data.branches;
      lastDashboardData = data;
      renderDashboard(data);
    } catch (e) { handleAuthError(e); }
  }

  function renderDashboard(data) {
    $('dashboard-title').textContent = data.role === 'JP' ? `案件一覧 — ${session.team}手配課` : `案件一覧（${data.branchName}）`;
    renderScopeSelector($('scope-selector'), dashboardScope, loadDashboard);

    const showCancelled = $('show-cancelled').checked;
    // ★要件：基本は生きてる（キャンセルでない）記録だけを表示し、チェックで両方表示に切り替える
    const list = showCancelled
      ? data.reservations
      : data.reservations.filter(r => r.statusJp !== 'CW' && r.statusBranch !== 'CW');

    const listEl = $('reservation-list');
    listEl.innerHTML = '';
    $('dashboard-empty').classList.toggle('hidden', list.length > 0);
    list.forEach(r => listEl.appendChild(buildReservationCard(r, data.role)));
  }

  function buildReservationCard(r, role) {
    const card = document.createElement('div');
    card.className = 'res-card';
    const cancelled = r.statusJp === 'CW' || r.statusBranch === 'CW';
    card.innerHTML = `
      <div class="res-card-top"><span>${r.kanriNo} ・ CHG: ${r.challengeNo || 'なし'}</span><span>${r.confirmedDate || '撮影日未定'}</span></div>
      <div class="res-card-names">${r.groomName || ''} ${r.brideName ? '／ ' + r.brideName : ''}</div>
      <div class="res-card-bottom">
        <span class="chip branch">${r.branchName || r.branchCode}${role === 'JP' && r.city ? '・' + r.city : ''}</span>
        ${r.statusJp ? `<span class="chip hq">STS JP: ${r.statusJp}</span>` : ''}
        ${r.statusBranch ? `<span class="chip branch">STS 支店: ${r.statusBranch}</span>` : ''}
        ${cancelled ? '<span class="chip" style="background:#fee2e2;color:#b91c1c;">キャンセル</span>' : ''}
        ${r.plan ? `<span class="chip">${r.plan}</span>` : ''}
      </div>`;
    card.addEventListener('click', () => openDetail(r.kanriNo));
    return card;
  }

  // ---------- 検索 ----------
  function openSearchView() {
    showView('search');
    renderScopeSelector($('search-scope'), searchScope, () => {});
  }

  async function submitSearch() {
    const criteria = {
      kanriNo: $('s-kanri').value.trim(),
      challengeNo: $('s-challenge').value.trim(),
      name: $('s-name').value.trim(),
      country: $('s-country').value.trim(),
      city: $('s-city').value.trim(),
      statusJp: $('s-sts-jp').value,
      statusBranch: $('s-sts-branch').value,
      dateField: $('s-datefield').value,
      dateFrom: $('s-from').value,
      dateTo: $('s-to').value,
      includeArchive: $('s-archive').checked,
      scope: searchScope
    };
    try {
      const res = await gsRun('apiSearchReservations', session.token, criteria);
      const list = $('search-results');
      list.innerHTML = '';
      $('search-empty').classList.toggle('hidden', res.results.length > 0);
      res.results.forEach(r => {
        const card = document.createElement('div');
        card.className = 'res-card';
        card.innerHTML = `
          <div class="res-card-top"><span>${r.kanriNo} ・ CHG: ${r.challengeNo || 'なし'}</span><span>${r.confirmedDate || '撮影日未定'}</span></div>
          <div class="res-card-names">${r.groomName || ''} ${r.brideName ? '／ ' + r.brideName : ''}</div>
          <div class="res-card-bottom">
            <span class="chip branch">${r.branchName}${r.city ? '・' + r.city : ''}</span>
            <span class="chip">${r.source}</span>
            ${r.statusJp ? `<span class="chip hq">STS JP: ${r.statusJp}</span>` : ''}
            ${r.statusBranch ? `<span class="chip branch">STS 支店: ${r.statusBranch}</span>` : ''}
          </div>`;
        card.addEventListener('click', () => openDetail(r.kanriNo));
        list.appendChild(card);
      });
    } catch (e) { handleAuthError(e); }
  }

  // ---------- 詳細 ----------
  async function openDetail(kanriNo) {
    if (kanriNo !== currentKanri) pendingChanges = {};
    currentKanri = kanriNo;
    showView('detail');
    $('detail-content').innerHTML = '<p class="hint-text">読み込み中...</p>';
    try {
      const detailRes = await gsRun('apiGetReservationDetail', session.token, kanriNo);
      const branchCode = detailRes.detail['支店コード'];
      const [planList, optionList] = await Promise.all([
        gsRun('apiListPlans', session.token, branchCode),
        gsRun('apiListOptionItems', session.token, branchCode)
      ]);
      renderDetail(detailRes.detail, planList, optionList);
    } catch (e) { handleAuthError(e); }
  }

  // 支店側がSTS(支店側)を編集できるかどうかを、対になるSTS(JP側)の現在値から判定する
  function branchGateFor(jpValue) {
    const key = jpValue || '';
    if (!(key in BRANCH_EDIT_GATE)) return { editable: false, allowed: null };
    return { editable: true, allowed: BRANCH_EDIT_GATE[key] };
  }

  // STSセレクト（編集可なら<select data-pending>、不可なら読み取り専用表示）
  function statusCell(fieldName, current, editableByMe, allowedValues) {
    if (!editableByMe) {
      return `<div class="val" style="font-family:ui-monospace,monospace;font-weight:700;">${current || '-'}</div>`;
    }
    const codes = allowedValues || STATUS_CODES;
    const opts = ['<option value="">-</option>'].concat(
      codes.map(c => `<option value="${c}" ${c === current ? 'selected' : ''}>${c}</option>`)
    ).join('');
    return `<select data-pending="${fieldName}">${opts}</select>`;
  }

  function nameListWithCurrent(masterList, current) {
    const names = (masterList || []).filter(x => x.active).map(x => x.name);
    if (current && !names.includes(current)) names.push(current);
    return names;
  }

  function renderDetail(d, planList, optionList) {
    const c = $('detail-content');

    const planNames = nameListWithCurrent(planList, d['プラン名']);
    const planSelect = `<select data-pending="プラン名"><option value="">未設定</option>${planNames.map(n =>
      `<option value="${escapeAttr(n)}" ${n === d['プラン名'] ? 'selected' : ''}>${escapeHtml(n)}</option>`).join('')}</select>`;

    const mainGate = branchGateFor(d['STS JP']);

    const optionsHtml = d.options.map(o => {
      const gate = branchGateFor(o.stsJp);
      const optNames = nameListWithCurrent(optionList, o.name);
      const nameSelect = `<select data-pending="OP${o.n}"><option value="">（未使用）</option>${optNames.map(n =>
        `<option value="${escapeAttr(n)}" ${n === o.name ? 'selected' : ''}>${escapeHtml(n)}</option>`).join('')}</select>`;
      return `
        <div class="option-row" style="flex-direction:column;align-items:stretch;gap:6px;">
          ${nameSelect}
          <div style="display:flex;gap:8px;">
            <div style="flex:1;"><div class="hint-text" style="margin-bottom:2px;">STS JP</div>${statusCell('OP' + o.n + ' STS JP', o.stsJp, session.role === 'JP', null)}</div>
            <div style="flex:1;"><div class="hint-text" style="margin-bottom:2px;">STS 支店${session.role === 'BRANCH' && !gate.editable ? '（変更不可）' : ''}</div>${statusCell('OP' + o.n + ' STS 支店', o.stsBranch, session.role === 'BRANCH' && gate.editable, gate.allowed)}</div>
          </div>
        </div>`;
    }).join('');

    const historyHtml = d.history.map(h => `
      <div class="history-item ${(!h.checkJp && !h.checkBranch) ? 'unread' : ''}">
        <div class="history-meta"><span>${h.sender}</span><span>${h.datetime}</span></div>
        <div class="history-body">${escapeHtml(h.body)}</div>
        <div class="history-checks">
          <label><input type="checkbox" data-hid="${h.id}" data-side="JP" ${h.checkJp ? 'checked' : ''} ${session.role !== 'JP' ? 'disabled' : ''}> JP確認</label>
          <label><input type="checkbox" data-hid="${h.id}" data-side="BRANCH" ${h.checkBranch ? 'checked' : ''} ${session.role !== 'BRANCH' ? 'disabled' : ''}> 支店確認</label>
        </div>
      </div>`).join('') || '<p class="hint-text">やり取りはまだありません。</p>';

    const pendingCount = Object.keys(pendingChanges).length;

    c.innerHTML = `
      <div class="detail-header">
        <div class="kanri">管理番号: ${d['管理番号']} ｜ CHG NO: ${d['CHG NO'] || 'なし'}</div>
        <div class="kanri">${d.branchName}（${d['支店コード']}）${d.country ? ' ・ ' + d.country : ''}${d.city ? ' ／ ' + d.city : ''}</div>
        <div class="names">新郎: ${d['新郎名（ローマ字）'] || ''}<br>新婦: ${d['新婦名（ローマ字）'] || ''}</div>
        <div class="detail-grid">
          <div class="field-block"><label>新郎名（ローマ字）</label><input data-pending="新郎名（ローマ字）" value="${escapeAttr(d['新郎名（ローマ字）'])}"></div>
          <div class="field-block"><label>新婦名（ローマ字）</label><input data-pending="新婦名（ローマ字）" value="${escapeAttr(d['新婦名（ローマ字）'])}"></div>
          <div class="field-block"><label>CHG NO</label><input data-pending="CHG NO" value="${escapeAttr(d['CHG NO'])}"></div>
          <div class="field-block"><label>撮影日FIX</label><input type="date" data-pending="撮影日FIX" value="${escapeAttr(d['撮影日FIX'])}"></div>
          <div class="field-block"><label>挙式日FIX</label><input type="date" data-pending="挙式日FIX" value="${escapeAttr(d['挙式日FIX'])}"></div>
          <div class="field-block"><label>希望日①</label><input data-pending="希望日①" value="${escapeAttr(d['希望日①'])}"></div>
          <div class="field-block"><label>希望日②</label><input data-pending="希望日②" value="${escapeAttr(d['希望日②'])}"></div>
          <div class="field-block"><label>希望日③</label><input data-pending="希望日③" value="${escapeAttr(d['希望日③'])}"></div>
          <div class="field-block"><label>プラン名（マスタから選択）</label>${planSelect}</div>
          <div class="field-block"><label>撮影希望場所</label><input data-pending="撮影希望場所" value="${escapeAttr(d['撮影希望場所'])}"></div>
          <div class="field-block"><label>準備場所</label><input data-pending="準備場所" value="${escapeAttr(d['準備場所'])}"></div>
          <div class="field-block"><label>ホテル</label><input data-pending="ホテル" value="${escapeAttr(d['ホテル'])}"></div>
          <div class="field-block"><label>管轄</label>
            <select data-pending="管轄"><option value="">未定</option>${JP_TEAMS.map(t => `<option value="${t}" ${d['管轄'] === t ? 'selected' : ''}>${t}</option>`).join('')}</select>
          </div>
          <div class="field-block"><label>請求先</label>
            <select data-pending="請求先"><option value="">未設定</option>${BILLING_REGIONS.map(r => `<option value="${r}" ${d['請求先'] === r ? 'selected' : ''}>${r}</option>`).join('')}</select>
          </div>
          <div class="field-block"><label>日本支店名</label><input data-pending="日本支店名" value="${escapeAttr(d['日本支店名'])}" placeholder="例）新宿西口店"></div>
          <div class="field-block"><label>店舗／担当（現地）</label><input data-pending="店舗／担当（現地）" value="${escapeAttr(d['店舗／担当（現地）'])}"></div>
          <div class="field-block" style="grid-column:1/-1;"><label>備考</label><input data-pending="備考" value="${escapeAttr(d['備考'])}"></div>
        </div>
      </div>

      <div class="section-card">
        <h3>ステータス</h3>
        <div class="status-row">
          <div class="status-card"><div class="who">STS JP</div>${statusCell('STS JP', d['STS JP'], session.role === 'JP', null)}</div>
          <div class="status-card"><div class="who">STS 支店${session.role === 'BRANCH' && !mainGate.editable ? '（変更不可）' : ''}</div>${statusCell('STS 支店', d['STS 支店'], session.role === 'BRANCH' && mainGate.editable, mainGate.allowed)}</div>
        </div>
        <h3>オプション（最大5件）</h3>
        ${optionsHtml}
      </div>

      <div class="section-card">
        <h3>共有メモ（支店・日本側どちらも自由に書けます）</h3>
        <textarea data-pending="共有メモ" rows="4" placeholder="社内向けの自由メモ">${escapeHtml(d['共有メモ'])}</textarea>
      </div>

      <div class="section-card">
        <h3>Driveフォルダ URL</h3>
        <div class="msg-row">
          <input id="drive-url-input" type="text" value="${escapeAttr(d['DriveフォルダURL'] || '')}" placeholder="https://drive.google.com/...">
          <button class="send-btn" id="drive-url-submit">保存</button>
        </div>
      </div>

      <div class="section-card">
        <h3>メッセージ・変更の送信</h3>
        <p id="pending-indicator" class="hint-text ${pendingCount ? '' : 'hidden'}">未保存の変更: ${pendingCount}件</p>
        <div class="msg-row"><textarea id="msg-input" placeholder="メッセージ（任意）"></textarea></div>
        <div style="display:flex;flex-direction:column;gap:8px;margin-top:10px;">
          <button class="send-btn" id="btn-msg-only" style="width:100%;">メッセージのみ送信</button>
          <button class="send-btn" id="btn-commit" style="width:100%;">変更（＋メッセージ）を決定して送信</button>
          <button class="send-btn" id="btn-save-quiet" style="width:100%;background:var(--color-muted);">保存のみ（通知しない）</button>
        </div>
        <p class="hint-text" style="margin-top:8px;">
          方向: ${session.role === 'JP' ? '日本 → 支店' : '支店 → 日本'}。
          「メッセージのみ送信」はメッセージだけを、「変更（＋メッセージ）を決定して送信」は入力中の全ての変更（ステータス・オプション含む）とメッセージをまとめて相手へ通知します。
          「保存のみ」は通知せずに変更を保存します（共有メモなど相手に知らせる必要がない変更向け）。
          日本側はSTS 支店を、支店側はSTS JPを直接変更できません（STS JPがNC/RQ/CHKのとき支店側は自由に、CRのときはCW/CFのみ選べます）。
        </p>
      </div>

      <div class="section-card">
        <h3>やり取り履歴（新しい順）</h3>
        ${historyHtml}
      </div>
    `;

    c.querySelectorAll('[data-pending]').forEach(el => {
      el.addEventListener('change', () => {
        pendingChanges[el.dataset.pending] = el.value;
        updatePendingIndicator();
      });
    });
    $('btn-msg-only').addEventListener('click', sendMessageOnly);
    $('btn-commit').addEventListener('click', commitChangesWithMessage);
    $('btn-save-quiet').addEventListener('click', saveQuiet);
    $('drive-url-submit').addEventListener('click', submitDriveUrl);
    c.querySelectorAll('input[data-hid]').forEach(el => {
      el.addEventListener('change', () => toggleHistoryCheck(el.dataset.hid, el.checked));
    });
  }

  function updatePendingIndicator() {
    const el = $('pending-indicator');
    if (!el) return;
    const n = Object.keys(pendingChanges).length;
    el.textContent = `未保存の変更: ${n}件`;
    el.classList.toggle('hidden', n === 0);
  }

  function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }
  function escapeAttr(s) { return escapeHtml(s); }

  // メッセージのみ送信（保留中の変更フィールドはそのまま残る＝未保存のまま）
  async function sendMessageOnly() {
    const msg = $('msg-input').value.trim();
    if (!msg) { showToast('メッセージを入力してください'); return; }
    try {
      await gsRun('apiCommitChanges', session.token, currentKanri, {}, msg);
      showToast('メッセージを送信しました');
      $('msg-input').value = '';
      openDetail(currentKanri);
    } catch (e) { handleAuthError(e); }
  }

  // 変更内容（＋任意でメッセージ）をまとめて決定・送信
  async function commitChangesWithMessage() {
    if (Object.keys(pendingChanges).length === 0) { showToast('変更内容がありません'); return; }
    const msg = $('msg-input').value.trim();
    try {
      const res = await gsRun('apiCommitChanges', session.token, currentKanri, pendingChanges, msg);
      pendingChanges = {};
      showToast(res.noChange ? '変更はありませんでした' : '変更を決定し、相手へ通知しました');
      openDetail(currentKanri);
    } catch (e) { handleAuthError(e); }
  }

  // 保存のみ（通知しない）
  async function saveQuiet() {
    if (Object.keys(pendingChanges).length === 0) { showToast('保存する変更がありません'); return; }
    try {
      await gsRun('apiSaveFieldsQuiet', session.token, currentKanri, pendingChanges);
      pendingChanges = {};
      showToast('変更を保存しました（通知は送信していません）');
      openDetail(currentKanri);
    } catch (e) { handleAuthError(e); }
  }

  async function submitDriveUrl() {
    const val = $('drive-url-input').value.trim();
    if (!val) return;
    try {
      await gsRun('apiSetDriveUrl', session.token, currentKanri, val);
      showToast('DriveフォルダURLを通知しました');
    } catch (e) { handleAuthError(e); }
  }

  async function toggleHistoryCheck(id, checked) {
    try {
      await gsRun('apiToggleHistoryCheck', session.token, id, checked);
      openDetail(currentKanri);
    } catch (e) { handleAuthError(e); }
  }

  // ---------- 新規案件 ----------
  async function openNewView() {
    showView('new');
    $('new-error').classList.add('hidden');
    $('new-success').classList.add('hidden');
    $('new-rawtext').value = '';
    if (session.role === 'JP') {
      if (!branchesCache.length) branchesCache = await gsRun('apiListBranches', session.token);
      $('new-branch').innerHTML = branchesCache.filter(b => b.role !== 'JP' && b.active)
        .map(b => `<option value="${b.code}">${b.name}（${b.code}）</option>`).join('');
    }
  }

  async function submitNewReservation() {
    const raw = $('new-rawtext').value.trim();
    $('new-error').classList.add('hidden');
    $('new-success').classList.add('hidden');
    if (!raw) { showFieldError('new-error', '手配依頼テキストを貼り付けてください。'); return; }
    const branchCode = session.role === 'JP' ? $('new-branch').value : session.branchCode;
    try {
      const res = await gsRun('apiCreateReservation', session.token, branchCode, raw);
      $('new-success').textContent = `案件 ${res.kanriNo} を作成しました。`;
      $('new-success').classList.remove('hidden');
      $('new-rawtext').value = '';
    } catch (e) {
      showFieldError('new-error', e.message);
    }
  }

  function showFieldError(id, msg) {
    $(id).textContent = msg;
    $(id).classList.remove('hidden');
  }
</script>
