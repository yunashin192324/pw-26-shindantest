<script>
/**
 * ============================================================================
 * Javascript.html
 * 「46期未成約リスト」ダッシュボード - クライアントサイド制御ロジック
 * ============================================================================
 */

// ---- 定数 ------------------------------------------------------------------
// 46期は11月始まり・10月終わり
const MONTH_CODES = ['11', '12', '01', '02', '03', '04', '05', '06', '07', '08', '09', '10'];
const MONTH_LABELS = MONTH_CODES.map(function (c) { return (c.indexOf('0') === 0 ? c.substring(1) : c) + '月'; });
const PAGE_SIZE = 50;
const ALERT_THRESHOLD_DAYS = 7; // 前回アクション（最終アクション日）からこの日数以上経過してもSTS未入力（未対応）の場合にアラート対象とする
const MULTILINE_COLUMNS = ['詳細', '備考', '次回ACT・進捗★手入力']; // インライン編集時にテキストエリアを使う列

// ---- グローバル状態 ----------------------------------------------------------
let allDataCache = [];              // getDashboardData() の統合生データ（超高速フィルタの元データ）
let metaMasters = {};                // getMetaMasters() のマスタ一式
let employeeSummaryCache = { first_half: null, second_half: null };
let currentEmployeePeriod = 'first_half';
let myChart1 = null;
let myChart2 = null;
let dmCurrentPage = 1;
let dmFilteredCache = [];
let rankingSortState = { key: 'total', dir: 'desc' };
let loadCompletedCount = 0;
const LOAD_TARGET = 4;
let currentUserContext = { email: '', identified: false, isManager: true, officeCode: null, officeName: null, employeeName: null };

// ============================================================================
// 初期化
// ============================================================================
document.addEventListener('DOMContentLoaded', function () {
  initTabs();
  initHeaderEvents();
  initDashboardEvents();
  initEmployeeEvents();
  initDataManagerEvents();
  initModalEvents();
  initCsvImportEvents();
  initAdminEvents();
  loadAllData();
});

function loadAllData() {
  showLoading(true);
  loadCompletedCount = 0;

  google.script.run
    .withSuccessHandler(function (res) {
      try {
        if (res && res.success) {
          allDataCache = res.data;
        } else {
          showToast('ダッシュボードデータの取得に失敗しました: ' + (res ? res.error : '不明なエラー'), 'error');
        }
      } catch (e) {
        showToast('ダッシュボードデータの処理中にエラーが発生しました: ' + e.message, 'error');
      } finally {
        onLoadStepComplete();
      }
    })
    .withFailureHandler(function (err) {
      showToast('通信エラー（getDashboardData）: ' + err.message, 'error');
      onLoadStepComplete();
    })
    .getDashboardData();

  google.script.run
    .withSuccessHandler(function (res) {
      try {
        if (res && res.success) {
          metaMasters = res;
          populateAllMasterSelects();
        } else {
          showToast('マスタデータの取得に失敗しました: ' + (res ? res.error : '不明なエラー'), 'error');
        }
      } catch (e) {
        showToast('マスタデータの処理中にエラーが発生しました: ' + e.message, 'error');
      } finally {
        onLoadStepComplete();
      }
    })
    .withFailureHandler(function (err) {
      showToast('通信エラー（getMetaMasters）: ' + err.message, 'error');
      onLoadStepComplete();
    })
    .getMetaMasters();

  google.script.run
    .withSuccessHandler(function (res) {
      try {
        if (res && res.success) {
          employeeSummaryCache.first_half = res;
        } else {
          showToast('個人別サマリ(上期)の取得に失敗しました: ' + (res ? res.error : '不明なエラー'), 'error');
        }
      } catch (e) {
        showToast('個人別サマリ(上期)の処理中にエラーが発生しました: ' + e.message, 'error');
      } finally {
        onLoadStepComplete();
      }
    })
    .withFailureHandler(function (err) {
      showToast('通信エラー（getEmployeeSummary）: ' + err.message, 'error');
      onLoadStepComplete();
    })
    .getEmployeeSummary('first_half');

  google.script.run
    .withSuccessHandler(function (res) {
      try {
        if (res && res.success) {
          currentUserContext = res.context;
          applyUserContextToUi();
        } else {
          showToast('権限情報の取得に失敗しました: ' + (res ? res.error : '不明なエラー'), 'error');
        }
      } catch (e) {
        showToast('権限情報の処理中にエラーが発生しました: ' + e.message, 'error');
      } finally {
        onLoadStepComplete();
      }
    })
    .withFailureHandler(function (err) {
      showToast('通信エラー（getCurrentUserContext）: ' + err.message, 'error');
      onLoadStepComplete();
    })
    .getCurrentUserContext();
}

// ログイン中ユーザーの権限（管理者／一般スタッフ・自店舗スコープ）をUIへ反映する。
// ・管理者（所長・チーフ）：CSVインポートボタンを表示
// ・一般スタッフ：CSVインポートボタンを非表示にし、閲覧スコープ（自店舗）をヘッダーに表示
function applyUserContextToUi() {
  const csvBtn = document.getElementById('btn-open-csv-modal');
  csvBtn.classList.toggle('hidden', !currentUserContext.isManager);

  const badge = document.getElementById('user-scope-badge');
  const badgeText = document.getElementById('user-scope-badge-text');
  if (!currentUserContext.isManager && currentUserContext.officeName) {
    badgeText.textContent = '表示範囲：' + currentUserContext.officeName + '（自店舗のみ）';
    badge.classList.remove('hidden');
  } else {
    badge.classList.add('hidden');
  }
}

function onLoadStepComplete() {
  loadCompletedCount++;
  if (loadCompletedCount >= LOAD_TARGET) {
    showLoading(false);
    renderDashboardTab();
    renderEmployeeTab();
    renderDataManagerTab();
  }
}

function showLoading(flag) {
  document.getElementById('loading-overlay').classList.toggle('hidden', !flag);
}

// ============================================================================
// 共通UI（タブ・トースト・ヘッダー）
// ============================================================================
function initTabs() {
  document.querySelectorAll('.tab-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('.tab-btn').forEach(function (b) {
        b.classList.remove('active', 'bg-blue-700', 'text-white');
        b.classList.add('bg-slate-100', 'text-slate-600');
      });
      btn.classList.add('active');
      btn.classList.remove('bg-slate-100', 'text-slate-600');

      document.querySelectorAll('.tab-panel').forEach(function (p) { p.classList.add('hidden'); });
      document.getElementById('tab-panel-' + btn.dataset.tab).classList.remove('hidden');

      // 非表示（display:none）だったcanvasはサイズを正しく測れないため、
      // ダッシュボードタブに戻ってきたタイミングでグラフを再生成してレイアウト崩れを防ぐ
      if (btn.dataset.tab === 'dashboard') {
        renderDashboardTab();
      }
      // 店舗・スタッフ管理タブは開くたびに最新状態を取得する（頻繁に変わる画面ではないため）
      if (btn.dataset.tab === 'admin') {
        loadAdminData();
      }
    });
  });
}

function initHeaderEvents() {
  document.getElementById('btn-refresh').addEventListener('click', function () {
    loadAllData();
  });
}

function showToast(message, type) {
  const container = document.getElementById('toast-container');
  const colors = {
    success: 'bg-emerald-600',
    error: 'bg-red-600',
    info: 'bg-blue-600'
  };
  const icon = {
    success: 'fa-circle-check',
    error: 'fa-circle-exclamation',
    info: 'fa-circle-info'
  };
  const t = type || 'info';

  const div = document.createElement('div');
  div.className = 'toast text-white text-sm rounded-lg shadow-lg px-4 py-3 flex items-start gap-2 ' + colors[t];
  div.innerHTML = '<i class="fa-solid ' + icon[t] + ' mt-0.5"></i><span>' + escapeHtml(message) + '</span>';
  container.appendChild(div);

  setTimeout(function () {
    div.style.opacity = '0';
    div.style.transition = 'opacity .3s';
    setTimeout(function () { div.remove(); }, 300);
  }, 3200);
}

function escapeHtml(str) {
  return String(str === undefined || str === null ? '' : str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// ============================================================================
// 日付ユーティリティ（長期未対応アラート判定用）
// ============================================================================
function parseYyyymmdd(str) {
  const s = String(str || '');
  if (s.length < 8) return null;
  const y = Number(s.substring(0, 4));
  const m = Number(s.substring(4, 6));
  const d = Number(s.substring(6, 8));
  if (!y || !m || !d) return null;
  return new Date(y, m - 1, d);
}

function daysSince(dateStr) {
  const target = parseYyyymmdd(dateStr);
  if (!target) return null;
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  target.setHours(0, 0, 0, 0);
  return Math.floor((today.getTime() - target.getTime()) / 86400000);
}

// STSが未対応（空欄）のまま、前回アクション（最終アクション日）から ALERT_THRESHOLD_DAYS 日以上経過している行を
// 「要フォロー」とみなす。まだ一度もアクションしていない行は、最終アクション日が空欄のため対象年月日を基準にする。
function alertBasisDate(row) {
  return row['最終アクション日'] || row['対象年月日'];
}

function isAlertRow(row) {
  if (row['STS']) return false; // 失注／成約／リセール中いずれかが入っていれば対象外
  const days = daysSince(alertBasisDate(row));
  return days !== null && days >= ALERT_THRESHOLD_DAYS;
}

// ============================================================================
// マスタ反映（フィルタ／モーダルの各種セレクトボックス）
// ============================================================================
function populateAllMasterSelects() {
  const shopList = metaMasters.shopList || [];

  fillOptions('filter-shop', shopList.map(function (s) { return { value: s, label: s }; }), true);
  fillOptions('filter-month', MONTH_CODES.map(function (c, i) { return { value: c, label: MONTH_LABELS[i] }; }), true);

  fillSelectWithBlank('dm-filter-shop', shopList);
  fillSelectWithBlank('dm-filter-month', MONTH_CODES.map(function (c, i) { return MONTH_LABELS[i]; }), MONTH_CODES);
  fillSelectWithBlank('dm-filter-contact', metaMasters.contactMaster || []);
  fillSelectWithBlank('dm-filter-purpose', metaMasters.purposeMaster || []);

  const employeeNames = (metaMasters.employeeList || [])
    .map(function (e) { return e.employeeName; })
    .filter(function (name, idx, arr) { return name && arr.indexOf(name) === idx; })
    .sort(function (a, b) { return String(a).localeCompare(String(b), 'ja'); });
  fillSelectWithBlank('dm-filter-employee', employeeNames);

  const modalShopSelect = document.querySelector('#register-form select[name="sheetName"]');
  modalShopSelect.innerHTML = '<option value="">選択してください</option>' +
    shopList.map(function (s) { return '<option value="' + escapeHtml(s) + '">' + escapeHtml(s) + '</option>'; }).join('');

  fillSelectSimple('#register-form select[name="未成約理由(大)"]', metaMasters.reasonMaster || []);
  fillSelectSimple('#register-form select[name="種別"]', metaMasters.typeMaster || []);
  fillSelectSimple('#register-form select[name="旅行目的(小)"]', metaMasters.purposeMaster || []);
  fillSelectSimple('#register-form select[name="接客方法"]', metaMasters.contactMaster || []);
}

function fillOptions(elId, items, multi) {
  const el = document.getElementById(elId);
  el.innerHTML = items.map(function (it) {
    return '<option value="' + escapeHtml(it.value) + '">' + escapeHtml(it.label) + '</option>';
  }).join('');
}

function fillSelectWithBlank(elId, labels, values) {
  const el = document.getElementById(elId);
  const opts = ['<option value="">すべて</option>'];
  labels.forEach(function (label, i) {
    const v = values ? values[i] : label;
    opts.push('<option value="' + escapeHtml(v) + '">' + escapeHtml(label) + '</option>');
  });
  el.innerHTML = opts.join('');
}

function fillSelectSimple(selector, labels) {
  const el = document.querySelector(selector);
  const opts = ['<option value="">－</option>'];
  labels.forEach(function (label) {
    opts.push('<option value="' + escapeHtml(label) + '">' + escapeHtml(label) + '</option>');
  });
  el.innerHTML = opts.join('');
}

function getSelectedMultiValues(elId) {
  return Array.from(document.getElementById(elId).selectedOptions).map(function (o) { return o.value; });
}

// ============================================================================
// タブ1: 店舗分析ダッシュボード
// ============================================================================
function initDashboardEvents() {
  document.getElementById('filter-shop').addEventListener('change', renderDashboardTab);
  document.getElementById('filter-month').addEventListener('change', renderDashboardTab);
  document.getElementById('btn-clear-dashboard-filter').addEventListener('click', function () {
    Array.from(document.getElementById('filter-shop').options).forEach(function (o) { o.selected = false; });
    Array.from(document.getElementById('filter-month').options).forEach(function (o) { o.selected = false; });
    renderDashboardTab();
  });
  document.querySelectorAll('#tab-panel-dashboard .sortable').forEach(function (th) {
    th.addEventListener('click', function () {
      const key = th.dataset.sort;
      if (rankingSortState.key === key) {
        rankingSortState.dir = rankingSortState.dir === 'asc' ? 'desc' : 'asc';
      } else {
        rankingSortState = { key: key, dir: 'desc' };
      }
      renderRankingTable(getDashboardFilteredData());
    });
  });
}

function getDashboardFilteredData() {
  const shops = getSelectedMultiValues('filter-shop');
  const months = getSelectedMultiValues('filter-month');

  return allDataCache.filter(function (row) {
    if (shops.length && shops.indexOf(row.__sheetName) === -1) return false;
    if (months.length && months.indexOf(String(row['月'])) === -1) return false;
    return true;
  });
}

function renderDashboardTab() {
  const filtered = getDashboardFilteredData();
  renderKpi(filtered);
  renderChart1(filtered);
  renderChart2(filtered);
  renderRankingTable(filtered);
}

function renderKpi(data) {
  const total = data.length;
  const contractRows = data.filter(function (r) { return r['STS'] === '成約'; });
  const contract = contractRows.length;
  const pax = contractRows.reduce(function (sum, r) { return sum + (Number(r['成約PAX']) || 0); }, 0);
  const resaleAction = data.filter(function (r) { return r['リセール'] === '〇'; }).length;
  const resaleProgress = data.filter(function (r) { return r['STS'] === 'リセール中'; }).length;
  // リセール継続率 = リセールアクション数 ÷ 未成約件数（リセールをしない場合＝失注）。最重要KPI。
  const resaleContinueRate = total > 0 ? (resaleAction / total) * 100 : 0;
  const alertCount = data.filter(isAlertRow).length;

  document.getElementById('kpi-total').textContent = total.toLocaleString();
  document.getElementById('kpi-contract').textContent = contract.toLocaleString();
  document.getElementById('kpi-pax').textContent = pax.toLocaleString();
  document.getElementById('kpi-resale-action').textContent = resaleAction.toLocaleString();
  document.getElementById('kpi-resale-progress').textContent = resaleProgress.toLocaleString();
  document.getElementById('kpi-resale-rate').textContent = resaleContinueRate.toFixed(1) + '%';
  document.getElementById('kpi-alert-count').textContent = alertCount.toLocaleString();
}

function renderChart1(data) {
  const totalByMonth = MONTH_CODES.map(function (code) {
    return data.filter(function (r) { return String(r['月']) === code; }).length;
  });
  const resaleActionByMonth = MONTH_CODES.map(function (code) {
    return data.filter(function (r) { return String(r['月']) === code && r['リセール'] === '〇'; }).length;
  });

  const ctx = document.getElementById('chart1').getContext('2d');
  if (myChart1) { myChart1.destroy(); }
  myChart1 = new Chart(ctx, {
    data: {
      labels: MONTH_LABELS,
      datasets: [
        {
          type: 'bar',
          label: '未成約数',
          data: totalByMonth,
          backgroundColor: '#93c5fd',
          yAxisID: 'y'
        },
        {
          type: 'line',
          label: 'リセール実施数',
          data: resaleActionByMonth,
          borderColor: '#4f46e5',
          backgroundColor: '#4f46e5',
          tension: 0.3,
          yAxisID: 'y1'
        }
      ]
    },
    options: {
      responsive: true,
      interaction: { mode: 'index', intersect: false },
      scales: {
        y: { type: 'linear', position: 'left', beginAtZero: true, title: { display: true, text: '未成約数' } },
        y1: { type: 'linear', position: 'right', beginAtZero: true, grid: { drawOnChartArea: false }, title: { display: true, text: 'リセール実施数' } }
      }
    }
  });
}

function renderChart2(data) {
  const counts = {};
  data.forEach(function (r) {
    const reason = r['未成約理由(大)'] || '未設定';
    counts[reason] = (counts[reason] || 0) + 1;
  });
  const labels = Object.keys(counts);
  const values = labels.map(function (l) { return counts[l]; });
  const total = values.reduce(function (a, b) { return a + b; }, 0);
  const palette = ['#1d4ed8', '#3b82f6', '#60a5fa', '#93c5fd', '#f59e0b', '#fbbf24', '#10b981', '#34d399', '#ef4444', '#f87171', '#8b5cf6', '#a78bfa'];

  const ctx = document.getElementById('chart2').getContext('2d');
  if (myChart2) { myChart2.destroy(); }
  myChart2 = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels: labels,
      datasets: [{ data: values, backgroundColor: labels.map(function (_, i) { return palette[i % palette.length]; }) }]
    },
    options: {
      responsive: true,
      plugins: {
        legend: { position: 'right', labels: { boxWidth: 12, font: { size: 11 } } },
        tooltip: {
          callbacks: {
            label: function (ctx) {
              const v = ctx.parsed;
              const pct = total > 0 ? ((v / total) * 100).toFixed(1) : '0.0';
              return ctx.label + ': ' + v + '件 (' + pct + '%)';
            }
          }
        }
      }
    }
  });
}

function renderRankingTable(data) {
  const shopList = metaMasters.shopList || [];
  const rows = shopList.map(function (shopName) {
    const shopRows = data.filter(function (r) { return r.__sheetName === shopName; });
    const total = shopRows.length;
    const resaleAction = shopRows.filter(function (r) { return r['リセール'] === '〇'; }).length;
    const contractRows = shopRows.filter(function (r) { return r['STS'] === '成約'; });
    const contract = contractRows.length;
    const pax = contractRows.reduce(function (sum, r) { return sum + (Number(r['成約PAX']) || 0); }, 0);
    const resaleRate = resaleAction > 0 ? (contract / resaleAction) * 100 : 0;
    // リセール継続率：どの営業所がリセールをちゃんとやっているか（未成約のうちリセールしている割合）
    const resaleContinueRate = total > 0 ? (resaleAction / total) * 100 : 0;
    return { shopName: shopName, total: total, resaleAction: resaleAction, contract: contract, pax: pax, resaleRate: resaleRate, resaleContinueRate: resaleContinueRate };
  });

  const key = rankingSortState.key;
  const dir = rankingSortState.dir === 'asc' ? 1 : -1;
  rows.sort(function (a, b) {
    if (typeof a[key] === 'string') return a[key].localeCompare(b[key]) * dir;
    return (a[key] - b[key]) * dir;
  });

  const tbody = document.getElementById('ranking-tbody');
  tbody.innerHTML = rows.map(function (r) {
    return '<tr class="hover:bg-blue-50">' +
      '<td class="px-3 py-2">' + escapeHtml(r.shopName) + '</td>' +
      '<td class="px-3 py-2 text-right">' + r.total.toLocaleString() + '</td>' +
      '<td class="px-3 py-2 text-right">' + r.resaleAction.toLocaleString() + '</td>' +
      '<td class="px-3 py-2 text-right font-semibold text-indigo-700 bg-indigo-50">' + r.resaleContinueRate.toFixed(1) + '%</td>' +
      '<td class="px-3 py-2 text-right">' + r.contract.toLocaleString() + '</td>' +
      '<td class="px-3 py-2 text-right">' + r.pax.toLocaleString() + '</td>' +
      '<td class="px-3 py-2 text-right">' + r.resaleRate.toFixed(1) + '%</td>' +
      '</tr>';
  }).join('');
}

// ============================================================================
// タブ2: 個人別サマリー
// ============================================================================
function initEmployeeEvents() {
  document.getElementById('btn-emp-first').addEventListener('click', function () { switchEmployeePeriod('first_half'); });
  document.getElementById('btn-emp-second').addEventListener('click', function () { switchEmployeePeriod('second_half'); });
  document.getElementById('emp-search').addEventListener('input', renderEmployeeTab);
}

function switchEmployeePeriod(period) {
  currentEmployeePeriod = period;
  document.getElementById('btn-emp-first').classList.toggle('bg-blue-700', period === 'first_half');
  document.getElementById('btn-emp-first').classList.toggle('text-white', period === 'first_half');
  document.getElementById('btn-emp-first').classList.toggle('bg-slate-100', period !== 'first_half');
  document.getElementById('btn-emp-first').classList.toggle('text-slate-600', period !== 'first_half');

  document.getElementById('btn-emp-second').classList.toggle('bg-blue-700', period === 'second_half');
  document.getElementById('btn-emp-second').classList.toggle('text-white', period === 'second_half');
  document.getElementById('btn-emp-second').classList.toggle('bg-slate-100', period !== 'second_half');
  document.getElementById('btn-emp-second').classList.toggle('text-slate-600', period !== 'second_half');

  if (employeeSummaryCache[period]) {
    renderEmployeeTab();
  } else {
    showLoading(true);
    google.script.run
      .withSuccessHandler(function (res) {
        if (res && res.success) {
          employeeSummaryCache[period] = res;
          renderEmployeeTab();
        } else {
          showToast('個人別サマリの取得に失敗しました: ' + (res ? res.error : '不明なエラー'), 'error');
        }
        showLoading(false);
      })
      .withFailureHandler(function (err) {
        showToast('通信エラー（getEmployeeSummary）: ' + err.message, 'error');
        showLoading(false);
      })
      .getEmployeeSummary(period);
  }
}

function renderEmployeeTab() {
  const cache = employeeSummaryCache[currentEmployeePeriod];
  const thead = document.getElementById('employee-thead');
  const tbody = document.getElementById('employee-tbody');
  const emptyMsg = document.getElementById('employee-empty');

  if (!cache) {
    thead.innerHTML = '';
    tbody.innerHTML = '';
    return;
  }

  const blockOrder = cache.blockOrder;
  const metrics = ['リセール数', 'リセール中', '⭐継続率', '成約件数', 'PAX数'];

  let headRow1 = '<tr>' +
    '<th rowspan="2" class="px-3 py-2 text-left border-r border-slate-200">営業所名</th>' +
    '<th rowspan="2" class="px-3 py-2 text-left border-r border-slate-200">社員名</th>';
  let headRow2 = '<tr>';
  blockOrder.forEach(function (block) {
    headRow1 += '<th colspan="' + metrics.length + '" class="px-3 py-2 text-center border-r border-slate-200">' + escapeHtml(block) + '</th>';
    metrics.forEach(function (m) {
      const cls = m === '⭐継続率' ? ' bg-indigo-50 text-indigo-700 font-semibold' : '';
      headRow2 += '<th class="px-2 py-1 text-right font-normal text-xs' + cls + '" title="⭐継続率＝リセール継続率（リセール数÷未成約数）">' + m + '</th>';
    });
  });
  headRow1 += '</tr>';
  headRow2 += '</tr>';
  thead.innerHTML = headRow1 + headRow2;

  const keyword = document.getElementById('emp-search').value.trim().toLowerCase();
  const employees = cache.employees.filter(function (e) {
    if (!keyword) return true;
    return String(e.employeeName).toLowerCase().indexOf(keyword) !== -1 ||
      String(e.employeeNo).toLowerCase().indexOf(keyword) !== -1 ||
      String(e.officeName).toLowerCase().indexOf(keyword) !== -1;
  });

  if (employees.length === 0) {
    tbody.innerHTML = '';
    emptyMsg.classList.remove('hidden');
    return;
  }
  emptyMsg.classList.add('hidden');

  tbody.innerHTML = employees.map(function (e) {
    let row = '<tr class="hover:bg-blue-50">' +
      '<td class="px-3 py-2 border-r border-slate-100">' + escapeHtml(e.officeName) + '</td>' +
      '<td class="px-3 py-2 border-r border-slate-100">' +
        '<button type="button" class="text-blue-700 hover:underline font-semibold emp-detail-link" data-emp-no="' + escapeHtml(e.employeeNo) + '" data-emp-name="' + escapeHtml(e.employeeName) + '">' +
          escapeHtml(e.employeeName) +
        '</button>' +
      '</td>';
    blockOrder.forEach(function (block) {
      const p = e.periods[block] || {};
      metrics.forEach(function (m) {
        if (m === '⭐継続率') {
          const denom = Number(p['未成約数']) || 0;
          const numer = Number(p['リセール数']) || 0;
          const rate = denom > 0 ? (numer / denom) * 100 : 0;
          row += '<td class="px-2 py-1 text-right bg-indigo-50/50 text-indigo-700 font-semibold">' + (denom > 0 ? rate.toFixed(1) + '%' : '－') + '</td>';
        } else {
          row += '<td class="px-2 py-1 text-right">' + (p[m] !== undefined && p[m] !== '' ? p[m] : '－') + '</td>';
        }
      });
    });
    row += '</tr>';
    return row;
  }).join('');

  tbody.querySelectorAll('.emp-detail-link').forEach(function (btn) {
    btn.addEventListener('click', function () {
      openEmployeeDetailModal(btn.dataset.empNo, btn.dataset.empName);
    });
  });
}

// 個人詳細ドリルダウン（都市コード別／未成約理由別の内訳）

function openEmployeeDetailModal(employeeNo, employeeName) {
  // 期間（上期/下期）の縛りを受けず、全期間のデータから該当社員の行を横断的に抽出する
  const rows = allDataCache.filter(function (r) {
    return String(r['社員番号']) === String(employeeNo) && r['社員名'] === employeeName;
  });

  document.getElementById('employee-detail-name').textContent = employeeName;

  const total = rows.length;
  const resaleAction = rows.filter(function (r) { return r['リセール'] === '〇'; }).length;
  const contract = rows.filter(function (r) { return r['STS'] === '成約'; }).length;
  const continueRate = total > 0 ? (resaleAction / total) * 100 : 0;

  const kpiHtml = [
    { label: '未成約数', value: total.toLocaleString(), cls: 'bg-blue-50 text-blue-700' },
    { label: 'リセール数', value: resaleAction.toLocaleString(), cls: 'bg-amber-50 text-amber-700' },
    { label: '⭐ リセール継続率', value: continueRate.toFixed(1) + '%', cls: 'bg-indigo-50 text-indigo-700' },
    { label: '成約件数', value: contract.toLocaleString(), cls: 'bg-emerald-50 text-emerald-700' }
  ].map(function (k) {
    return '<div class="rounded-lg p-3 text-center ' + k.cls + '"><p class="text-xs font-semibold opacity-80">' + k.label + '</p><p class="text-xl font-bold">' + k.value + '</p></div>';
  }).join('');
  document.getElementById('employee-detail-kpis').innerHTML = kpiHtml;

  renderEmployeeDetailBreakdown('employee-detail-city-list', rows, '都市コード');
  renderEmployeeDetailBreakdown('employee-detail-reason-list', rows, '未成約理由(大)');

  openAdminModal('employee-detail-modal');
}

function renderEmployeeDetailBreakdown(containerId, rows, columnName) {
  const counts = {};
  rows.forEach(function (r) {
    const key = r[columnName] || '未設定';
    counts[key] = (counts[key] || 0) + 1;
  });
  const total = rows.length;
  const entries = Object.keys(counts).map(function (k) { return { label: k, count: counts[k] }; })
    .sort(function (a, b) { return b.count - a.count; });

  const container = document.getElementById(containerId);
  if (entries.length === 0) {
    container.innerHTML = '<p class="text-slate-400">データがありません</p>';
    return;
  }
  container.innerHTML = entries.map(function (e) {
    const pct = total > 0 ? ((e.count / total) * 100).toFixed(1) : '0.0';
    return '<div class="flex items-center gap-2">' +
      '<span class="flex-1 truncate">' + escapeHtml(e.label) + '</span>' +
      '<span class="w-24 bg-slate-100 rounded-full h-2 overflow-hidden"><span class="block h-2 bg-blue-500" style="width:' + pct + '%"></span></span>' +
      '<span class="w-20 text-right text-slate-500">' + e.count + '件（' + pct + '%）</span>' +
      '</div>';
  }).join('');
}

function initDataManagerEvents() {
  ['dm-filter-shop', 'dm-filter-month', 'dm-filter-sts', 'dm-filter-contact', 'dm-filter-purpose',
    'dm-filter-employee', 'dm-filter-date-from', 'dm-filter-date-to', 'dm-filter-alert-only'].forEach(function (id) {
    document.getElementById(id).addEventListener('change', function () {
      dmCurrentPage = 1;
      renderDataManagerTab();
    });
  });
  document.getElementById('btn-prev-page').addEventListener('click', function () {
    if (dmCurrentPage > 1) { dmCurrentPage--; renderDataManagerGrid(); }
  });
  document.getElementById('btn-next-page').addEventListener('click', function () {
    const maxPage = Math.max(1, Math.ceil(dmFilteredCache.length / PAGE_SIZE));
    if (dmCurrentPage < maxPage) { dmCurrentPage++; renderDataManagerGrid(); }
  });
}

function renderDataManagerTab() {
  const shop = document.getElementById('dm-filter-shop').value;
  const month = document.getElementById('dm-filter-month').value;
  const sts = document.getElementById('dm-filter-sts').value;
  const contact = document.getElementById('dm-filter-contact').value;
  const purpose = document.getElementById('dm-filter-purpose').value;
  const employee = document.getElementById('dm-filter-employee').value;
  const dateFrom = document.getElementById('dm-filter-date-from').value.replace(/-/g, '');
  const dateTo = document.getElementById('dm-filter-date-to').value.replace(/-/g, '');
  const alertOnly = document.getElementById('dm-filter-alert-only').checked;

  dmFilteredCache = allDataCache.filter(function (row) {
    if (shop && row.__sheetName !== shop) return false;
    if (month && String(row['月']) !== month) return false;
    if (sts === '__blank__') {
      if (row['STS']) return false;
    } else if (sts && row['STS'] !== sts) {
      return false;
    }
    if (contact && row['接客方法'] !== contact) return false;
    if (purpose && row['旅行目的(小)'] !== purpose) return false;
    if (employee && row['社員名'] !== employee) return false;
    if (dateFrom && String(row['対象年月日']) < dateFrom) return false;
    if (dateTo && String(row['対象年月日']) > dateTo) return false;
    if (alertOnly && !isAlertRow(row)) return false;
    return true;
  });

  renderDataManagerGrid();
}

function renderDataManagerGrid() {
  const tbody = document.getElementById('data-tbody');
  const emptyMsg = document.getElementById('data-empty');
  const maxPage = Math.max(1, Math.ceil(dmFilteredCache.length / PAGE_SIZE));
  if (dmCurrentPage > maxPage) dmCurrentPage = maxPage;

  const startIdx = (dmCurrentPage - 1) * PAGE_SIZE;
  const pageRows = dmFilteredCache.slice(startIdx, startIdx + PAGE_SIZE);

  document.getElementById('pagination-info').textContent =
    dmFilteredCache.length === 0 ? '0 件' : (startIdx + 1) + ' - ' + Math.min(startIdx + PAGE_SIZE, dmFilteredCache.length) + ' 件 / 全 ' + dmFilteredCache.length + ' 件（' + dmCurrentPage + ' / ' + maxPage + ' ページ）';

  if (pageRows.length === 0) {
    tbody.innerHTML = '';
    emptyMsg.classList.remove('hidden');
    return;
  }
  emptyMsg.classList.add('hidden');

  tbody.innerHTML = pageRows.map(function (row) {
    const rid = row.__sheetName + '::' + row.__rowIndex;
    const stsOptions = ['失注', '成約', 'リセール中'].map(function (s) {
      return '<option value="' + s + '"' + (row['STS'] === s ? ' selected' : '') + '>' + s + '</option>';
    }).join('');
    const resaleOptions = ['〇', '✖'].map(function (s) {
      return '<option value="' + s + '"' + (row['リセール'] === s ? ' selected' : '') + '>' + s + '</option>';
    }).join('');

    const alert = isAlertRow(row);
    const rowClass = alert ? 'hover:bg-rose-100 bg-rose-50' : 'hover:bg-blue-50';
    const alertDays = alert ? daysSince(alertBasisDate(row)) : null;
    const alertCell = alert
      ? '<td class="px-2 py-2 text-center text-rose-600" title="前回アクションから' + alertDays + '日経過・未対応です">🔔</td>'
      : '<td class="px-2 py-2 text-center"></td>';

    return '<tr class="' + rowClass + '" data-rid="' + rid + '">' +
      alertCell +
      '<td class="px-3 py-2">' + escapeHtml(row['対象年月日']) + '</td>' +
      '<td class="px-3 py-2">' + escapeHtml(row.__sheetName) + '</td>' +
      '<td class="px-3 py-2">' + escapeHtml(row['社員名']) + '</td>' +
      '<td class="px-2 py-1">' +
        '<select class="sts-select border border-slate-300 rounded px-1 py-1 text-xs" data-sheet="' + escapeHtml(row.__sheetName) + '" data-row="' + row.__rowIndex + '">' +
          '<option value="">－</option>' + stsOptions +
        '</select>' +
      '</td>' +
      '<td class="px-2 py-1">' +
        '<select class="resale-select border border-slate-300 rounded px-1 py-1 text-xs" data-sheet="' + escapeHtml(row.__sheetName) + '" data-row="' + row.__rowIndex + '">' +
          '<option value="">－</option>' + resaleOptions +
        '</select>' +
      '</td>' +
      editableCellTd(row, '成約PAX', 'number') +
      '<td class="px-3 py-2">' + escapeHtml(row['未成約理由(大)']) + '</td>' +
      '<td class="px-3 py-2">' + escapeHtml(row['都市コード']) + '</td>' +
      '<td class="px-3 py-2">' + escapeHtml(row['種別']) + '</td>' +
      '<td class="px-3 py-2">' + escapeHtml(row['旅行目的(小)']) + '</td>' +
      '<td class="px-3 py-2">' + escapeHtml(row['接客方法']) + '</td>' +
      editableCellTd(row, 'ACT日', 'text') +
      editableCellTd(row, 'ACT内容', 'text') +
      editableCellTd(row, '詳細', 'text', true) +
      editableCellTd(row, '備考', 'text') +
      editableCellTd(row, '次回ACT・進捗★手入力', 'text') +
      '</tr>';
  }).join('');

  bindGridEditEvents();
}

function editableCellTd(row, columnName, type, isDetailColumn) {
  const val = row[columnName] !== undefined && row[columnName] !== null ? row[columnName] : '';
  const detailAttrs = isDetailColumn ? ' data-detail="1"' : '';
  const truncateClass = isDetailColumn ? ' truncate' : '';
  return '<td class="editable-cell px-3 py-2' + truncateClass + '" data-column="' + escapeHtml(columnName) + '" data-type="' + type + '" data-sheet="' + escapeHtml(row.__sheetName) + '" data-row="' + row.__rowIndex + '"' + detailAttrs + '>' +
    '<span class="cell-display">' + escapeHtml(val) + '</span></td>';
}

function bindGridEditEvents() {
  // リセール：常時表示のセレクトボックスで即時更新
  document.querySelectorAll('.resale-select').forEach(function (sel) {
    sel.addEventListener('change', function () {
      callUpdateCellValue(sel.dataset.sheet, sel.dataset.row, 'リセール', sel.value);
    });
  });

  // STS：常時表示のセレクトボックスで即時更新
  document.querySelectorAll('.sts-select').forEach(function (sel) {
    sel.addEventListener('change', function () {
      const sheetName = sel.dataset.sheet;
      const rowIndex = sel.dataset.row;
      const newStatus = sel.value;
      if (!newStatus) return;

      let contractPax = '';
      if (newStatus === '成約') {
        const row = dmFilteredCache.find(function (r) { return r.__sheetName === sheetName && String(r.__rowIndex) === String(rowIndex); });
        contractPax = row ? row['成約PAX'] : '';
        contractPax = window.prompt('成約PAX数を入力してください', contractPax || 0);
        if (contractPax === null) { renderDataManagerGrid(); return; }
      }

      callUpdateStatus(sheetName, rowIndex, newStatus, contractPax);
    });
  });

  // 「詳細」列：カーソルを合わせると全文をポップアップ表示（長文対策）
  document.querySelectorAll('.editable-cell[data-detail="1"]').forEach(function (td) {
    td.addEventListener('mouseenter', function () {
      if (td.querySelector('textarea, input')) return; // 編集中は出さない
      const text = td.querySelector('.cell-display').textContent;
      if (!text) return;
      showDetailTooltip(td, text);
    });
    td.addEventListener('mouseleave', hideDetailTooltip);
  });

  // テキストセル（成約PAX／詳細／ACT日／ACT内容／備考／進捗メモ）：ダブルクリックでインライン編集
  document.querySelectorAll('.editable-cell').forEach(function (td) {
    td.addEventListener('dblclick', function () {
      if (td.querySelector('input, textarea')) return;
      hideDetailTooltip();
      const span = td.querySelector('.cell-display');
      const currentVal = span.textContent;
      const type = td.dataset.type;
      const columnName = td.dataset.column;
      const isMultiline = MULTILINE_COLUMNS.indexOf(columnName) !== -1;

      const input = document.createElement(isMultiline ? 'textarea' : 'input');
      if (!isMultiline) { input.type = type === 'number' ? 'number' : 'text'; } else { input.rows = 3; }
      input.value = currentVal;
      input.className = 'w-full border border-blue-400 rounded px-1 py-0.5 text-sm';

      td.innerHTML = '';
      td.appendChild(input);
      input.focus();
      input.select();

      const commit = function () {
        const newVal = input.value;
        const sheetName = td.dataset.sheet;
        const rowIndex = td.dataset.row;
        const columnName = td.dataset.column;

        if (columnName === '成約PAX') {
          const row = dmFilteredCache.find(function (r) { return r.__sheetName === sheetName && String(r.__rowIndex) === String(rowIndex); });
          const currentSts = row ? row['STS'] : '';
          if (currentSts !== '成約') {
            showToast('成約PAXはSTSが「成約」の行のみ編集できます。', 'error');
            renderDataManagerGrid();
            return;
          }
          callUpdateStatus(sheetName, rowIndex, '成約', newVal);
        } else {
          callUpdateCellValue(sheetName, rowIndex, columnName, newVal);
        }
      };

      input.addEventListener('blur', commit);
      input.addEventListener('keydown', function (ev) {
        // 複数行入力（textarea）ではEnterは改行として使うため、Ctrl/Cmd+Enterのみ確定とする
        if (ev.key === 'Enter' && (!isMultiline || ev.ctrlKey || ev.metaKey)) { input.blur(); }
        if (ev.key === 'Escape') { input.removeEventListener('blur', commit); renderDataManagerGrid(); }
      });
    });
  });
}

// ============================================================================
// 「詳細」列ホバーポップアップ
// ============================================================================
function showDetailTooltip(targetEl, text) {
  const tooltip = document.getElementById('detail-tooltip');
  tooltip.textContent = text;
  tooltip.classList.remove('hidden');

  const rect = targetEl.getBoundingClientRect();
  const tooltipWidth = 384; // max-w-md相当
  let left = rect.left;
  if (left + tooltipWidth > window.innerWidth - 16) {
    left = Math.max(16, window.innerWidth - tooltipWidth - 16);
  }
  tooltip.style.left = left + 'px';
  tooltip.style.top = (rect.bottom + 6) + 'px';
}

function hideDetailTooltip() {
  document.getElementById('detail-tooltip').classList.add('hidden');
}

function callUpdateStatus(sheetName, rowIndex, newStatus, contractPax) {
  showLoading(true);
  google.script.run
    .withSuccessHandler(function (res) {
      showLoading(false);
      if (res && res.success) {
        applyUpdatedRowToCache(res.data);
        showToast('ステータスを更新しました（' + newStatus + '）', 'success');
        renderKpi(getDashboardFilteredData());
        renderRankingTable(getDashboardFilteredData());
        renderDataManagerGrid();
      } else {
        showToast('更新に失敗しました: ' + (res ? res.error : '不明なエラー'), 'error');
        renderDataManagerGrid();
      }
    })
    .withFailureHandler(function (err) {
      showLoading(false);
      showToast('通信エラー（updateStatus）: ' + err.message, 'error');
      renderDataManagerGrid();
    })
    .updateStatus(sheetName, rowIndex, newStatus, contractPax);
}

function callUpdateCellValue(sheetName, rowIndex, columnName, value) {
  google.script.run
    .withSuccessHandler(function (res) {
      if (res && res.success) {
        applyUpdatedRowToCache(res.data);
        showToast('「' + columnName + '」を更新しました', 'success');
      } else {
        showToast('更新に失敗しました: ' + (res ? res.error : '不明なエラー'), 'error');
      }
      renderDataManagerGrid();
    })
    .withFailureHandler(function (err) {
      showToast('通信エラー（updateCellValue）: ' + err.message, 'error');
      renderDataManagerGrid();
    })
    .updateCellValue(sheetName, rowIndex, columnName, value);
}

function applyUpdatedRowToCache(updatedRow) {
  const idx = allDataCache.findIndex(function (r) {
    return r.__sheetName === updatedRow.__sheetName && String(r.__rowIndex) === String(updatedRow.__rowIndex);
  });
  if (idx !== -1) {
    allDataCache[idx] = updatedRow;
  }
  const dmIdx = dmFilteredCache.findIndex(function (r) {
    return r.__sheetName === updatedRow.__sheetName && String(r.__rowIndex) === String(updatedRow.__rowIndex);
  });
  if (dmIdx !== -1) {
    dmFilteredCache[dmIdx] = updatedRow;
  }
}

// CSVファイルをテキスト化する。営業日報エクスポートはUTF-8/Shift_JISいずれもあり得るため、
// まずUTF-8として厳密デコードを試み、失敗した場合はShift_JISとして読み直す。
function readCsvFileAsText(file) {
  return file.arrayBuffer().then(function (buffer) {
    try {
      return new TextDecoder('utf-8', { fatal: true }).decode(buffer);
    } catch (e) {
      return new TextDecoder('shift_jis').decode(buffer);
    }
  });
}

function onSubmitCsvImport() {
  if (!selectedCsvFile) return;
  const submitBtn = document.getElementById('btn-submit-csv');
  submitBtn.disabled = true;
  showLoading(true);

  readCsvFileAsText(selectedCsvFile).then(function (csvText) {
    google.script.run
      .withSuccessHandler(function (res) {
        showLoading(false);
        submitBtn.disabled = false;
        renderCsvImportResult(res);
        if (res && res.success) {
          if (res.importedCount > 0) {
            showToast(res.importedCount + '件のデータを取り込みました。', 'success');
            loadAllData();
          } else {
            showToast('取り込める新規データがありませんでした。', 'info');
          }
        } else {
          showToast('CSVの取り込みに失敗しました: ' + (res ? res.error : '不明なエラー'), 'error');
        }
      })
      .withFailureHandler(function (err) {
        showLoading(false);
        submitBtn.disabled = false;
        showToast('通信エラー（importUncontractedCsv）: ' + err.message, 'error');
      })
      .importUncontractedCsv(csvText);
  }).catch(function (err) {
    showLoading(false);
    submitBtn.disabled = false;
    showToast('CSVファイルの読み込みに失敗しました: ' + err.message, 'error');
  });
}

function renderCsvImportResult(res) {
  const box = document.getElementById('csv-import-result');
  box.classList.remove('hidden');

  if (!res || !res.success) {
    box.innerHTML = '<p class="text-red-600 font-semibold">取り込みに失敗しました</p><p class="text-red-500">' + escapeHtml(res ? res.error : '不明なエラー') + '</p>';
    return;
  }

  let html = '<p class="text-emerald-700 font-semibold">取り込み結果</p>';
  html += '<p>取込件数：<b>' + res.importedCount + '</b> 件</p>';
  html += '<p>重複スキップ：' + res.skippedDuplicateCount + ' 件</p>';
  if (res.skippedBlankCount) html += '<p>対象年月日／営業所コード未入力によるスキップ：' + res.skippedBlankCount + ' 件</p>';
  if (res.skippedUnknownOfficeCount) {
    html += '<p class="text-amber-600">未登録の営業所コードによるスキップ：' + res.skippedUnknownOfficeCount + ' 件' +
      (res.unknownOfficeCodes && res.unknownOfficeCodes.length ? '（' + res.unknownOfficeCodes.map(escapeHtml).join(', ') + '）' : '') + '</p>';
  }
  if (res.perSheetCounts && Object.keys(res.perSheetCounts).length) {
    html += '<p class="mt-1 text-slate-500">内訳：' + Object.keys(res.perSheetCounts).map(function (k) {
      return escapeHtml(k) + ' ' + res.perSheetCounts[k] + '件';
    }).join(' / ') + '</p>';
  }
  box.innerHTML = html;
}

// ============================================================================
// 店舗・スタッフ管理
// ============================================================================
let shopMasterCache = [];
let staffMasterCache = [];

function initAdminEvents() {
  document.querySelectorAll('[data-close-modal]').forEach(function (btn) {
    btn.addEventListener('click', function () { closeAdminModal(btn.dataset.closeModal); });
  });

  document.getElementById('btn-open-shop-modal').addEventListener('click', function () { openShopModal('add'); });
  document.getElementById('shop-form').addEventListener('submit', onSubmitShopForm);

  document.getElementById('btn-open-staff-modal').addEventListener('click', function () { openStaffModal('add'); });
  document.getElementById('staff-form').addEventListener('submit', onSubmitStaffForm);
}

function openAdminModal(id) {
  document.getElementById(id).classList.remove('hidden');
  document.getElementById(id).classList.add('flex');
}
function closeAdminModal(id) {
  document.getElementById(id).classList.add('hidden');
  document.getElementById(id).classList.remove('flex');
}

function loadAdminData() {
  showLoading(true);
  let doneCount = 0;
  const onEachDone = function () {
    doneCount++;
    if (doneCount >= 2) showLoading(false);
  };

  google.script.run
    .withSuccessHandler(function (res) {
      if (res && res.success) {
        shopMasterCache = res.shops;
        renderShopMasterTable();
        populateStaffShopSelect();
      } else {
        showToast('店舗マスタの取得に失敗しました: ' + (res ? res.error : '不明なエラー'), 'error');
      }
      onEachDone();
    })
    .withFailureHandler(function (err) {
      showToast('通信エラー（getShopMasterList）: ' + err.message, 'error');
      onEachDone();
    })
    .getShopMasterList();

  google.script.run
    .withSuccessHandler(function (res) {
      if (res && res.success) {
        staffMasterCache = res.staff;
        renderStaffMasterTable(res.unregistered || []);
      } else {
        showToast('スタッフマスタの取得に失敗しました: ' + (res ? res.error : '不明なエラー'), 'error');
      }
      onEachDone();
    })
    .withFailureHandler(function (err) {
      showToast('通信エラー（getStaffMasterList）: ' + err.message, 'error');
      onEachDone();
    })
    .getStaffMasterList();
}

// ---- 店舗管理 ---------------------------------------------------------------
function renderShopMasterTable() {
  const tbody = document.getElementById('shop-master-tbody');
  tbody.innerHTML = shopMasterCache.map(function (shop) {
    const statusBadge = shop.active
      ? '<span class="inline-block px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700 text-xs font-semibold">有効</span>'
      : '<span class="inline-block px-2 py-0.5 rounded-full bg-slate-200 text-slate-500 text-xs font-semibold">無効</span>';

    return '<tr class="hover:bg-blue-50' + (shop.active ? '' : ' opacity-60') + '">' +
      '<td class="px-3 py-2">' + escapeHtml(shop.code) + '</td>' +
      '<td class="px-3 py-2">' + escapeHtml(shop.name) + '</td>' +
      '<td class="px-3 py-2 text-center">' + statusBadge + '</td>' +
      '<td class="px-3 py-2 text-right whitespace-nowrap">' +
        '<button class="text-blue-600 hover:underline text-xs mr-2" data-shop-edit="' + escapeHtml(shop.code) + '">編集</button>' +
        '<button class="text-amber-600 hover:underline text-xs mr-2" data-shop-toggle="' + escapeHtml(shop.code) + '">' + (shop.active ? '無効化' : '有効化') + '</button>' +
        '<button class="text-red-600 hover:underline text-xs" data-shop-delete="' + escapeHtml(shop.code) + '">削除</button>' +
      '</td></tr>';
  }).join('');

  tbody.querySelectorAll('[data-shop-edit]').forEach(function (btn) {
    btn.addEventListener('click', function () { openShopModal('edit', btn.dataset.shopEdit); });
  });
  tbody.querySelectorAll('[data-shop-toggle]').forEach(function (btn) {
    btn.addEventListener('click', function () { onToggleShopActive(btn.dataset.shopToggle); });
  });
  tbody.querySelectorAll('[data-shop-delete]').forEach(function (btn) {
    btn.addEventListener('click', function () { onDeleteShop(btn.dataset.shopDelete); });
  });
}

function openShopModal(mode, code) {
  document.getElementById('shop-form-mode').value = mode;
  const codeInput = document.getElementById('shop-form-code');
  const nameInput = document.getElementById('shop-form-name');

  if (mode === 'edit') {
    const shop = shopMasterCache.find(function (s) { return s.code === code; });
    document.getElementById('shop-modal-title').textContent = '店舗名を編集';
    codeInput.value = shop ? shop.code : '';
    codeInput.disabled = true;
    nameInput.value = shop ? shop.name : '';
  } else {
    document.getElementById('shop-modal-title').textContent = '店舗を追加';
    codeInput.value = '';
    codeInput.disabled = false;
    nameInput.value = '';
  }
  openAdminModal('shop-modal');
}

function onSubmitShopForm(ev) {
  ev.preventDefault();
  const mode = document.getElementById('shop-form-mode').value;
  const code = document.getElementById('shop-form-code').value.trim();
  const name = document.getElementById('shop-form-name').value.trim();
  if (!code || !name) { showToast('店番と店舗名は必須です。', 'error'); return; }

  showLoading(true);
  const runner = google.script.run
    .withSuccessHandler(function (res) {
      showLoading(false);
      if (res && res.success) {
        showToast(mode === 'edit' ? '店舗名を更新しました。' : '店舗を追加しました。', 'success');
        closeAdminModal('shop-modal');
        loadAdminData();
        loadAllData(); // 店舗一覧が変わるため、ダッシュボード側のマスタ・データも再取得する
      } else {
        showToast('保存に失敗しました: ' + (res ? res.error : '不明なエラー'), 'error');
      }
    })
    .withFailureHandler(function (err) {
      showLoading(false);
      showToast('通信エラー: ' + err.message, 'error');
    });

  if (mode === 'edit') {
    runner.renameShopMaster(code, name);
  } else {
    runner.addShopMaster(code, name);
  }
}

function onToggleShopActive(code) {
  const shop = shopMasterCache.find(function (s) { return s.code === code; });
  if (!shop) return;
  const nextActive = !shop.active;

  showLoading(true);
  google.script.run
    .withSuccessHandler(function (res) {
      showLoading(false);
      if (res && res.success) {
        showToast('店舗を' + (nextActive ? '有効化' : '無効化') + 'しました。', 'success');
        loadAdminData();
        loadAllData();
      } else {
        showToast('更新に失敗しました: ' + (res ? res.error : '不明なエラー'), 'error');
      }
    })
    .withFailureHandler(function (err) {
      showLoading(false);
      showToast('通信エラー: ' + err.message, 'error');
    })
    .setShopActive(code, nextActive);
}

function onDeleteShop(code) {
  const shop = shopMasterCache.find(function (s) { return s.code === code; });
  const label = shop ? shop.name : code;
  if (!window.confirm('店舗「' + label + '」を削除します。よろしいですか？\n（データが残っている店舗は削除できません）')) return;

  showLoading(true);
  google.script.run
    .withSuccessHandler(function (res) {
      showLoading(false);
      if (res && res.success) {
        showToast('店舗を削除しました。', 'success');
        loadAdminData();
        loadAllData();
      } else {
        showToast('削除に失敗しました: ' + (res ? res.error : '不明なエラー'), 'error');
      }
    })
    .withFailureHandler(function (err) {
      showLoading(false);
      showToast('通信エラー: ' + err.message, 'error');
    })
    .deleteShopMaster(code);
}

// ---- スタッフ管理 -------------------------------------------------------------
function populateStaffShopSelect() {
  const select = document.getElementById('staff-form-shop');
  select.innerHTML = '<option value="">選択してください</option>' +
    shopMasterCache.filter(function (s) { return s.active; }).map(function (s) {
      return '<option value="' + escapeHtml(s.code) + '">' + escapeHtml(s.name) + '</option>';
    }).join('');
}

function renderStaffMasterTable(unregistered) {
  const tbody = document.getElementById('staff-master-tbody');
  tbody.innerHTML = staffMasterCache.map(function (s) {
    const roleBadge = s.isManager
      ? '<span class="inline-block px-2 py-0.5 rounded-full bg-indigo-100 text-indigo-700 text-xs font-semibold">管理者</span>'
      : '<span class="inline-block px-2 py-0.5 rounded-full bg-slate-100 text-slate-500 text-xs">一般</span>';
    return '<tr class="hover:bg-blue-50">' +
      '<td class="px-3 py-2">' + escapeHtml(s.officeName) + '</td>' +
      '<td class="px-3 py-2">' + escapeHtml(s.employeeNo) + '</td>' +
      '<td class="px-3 py-2">' + escapeHtml(s.employeeName) + '</td>' +
      '<td class="px-3 py-2 text-slate-500">' + escapeHtml(s.googleAccount) + '</td>' +
      '<td class="px-3 py-2 text-center">' + roleBadge + '</td>' +
      '<td class="px-3 py-2 text-right whitespace-nowrap">' +
        '<button class="text-blue-600 hover:underline text-xs mr-2" data-staff-edit="' + s.rowIndex + '">編集</button>' +
        '<button class="text-red-600 hover:underline text-xs" data-staff-delete="' + s.rowIndex + '">削除</button>' +
      '</td></tr>';
  }).join('');

  tbody.querySelectorAll('[data-staff-edit]').forEach(function (btn) {
    btn.addEventListener('click', function () { openStaffModal('edit', Number(btn.dataset.staffEdit)); });
  });
  tbody.querySelectorAll('[data-staff-delete]').forEach(function (btn) {
    btn.addEventListener('click', function () { onDeleteStaff(Number(btn.dataset.staffDelete)); });
  });

  const box = document.getElementById('staff-unregistered-box');
  const list = document.getElementById('staff-unregistered-list');
  if (!unregistered || unregistered.length === 0) {
    box.classList.add('hidden');
    list.innerHTML = '';
    return;
  }
  box.classList.remove('hidden');
  list.innerHTML = unregistered.map(function (u) {
    return '<div class="flex items-center justify-between bg-amber-50 border border-amber-200 rounded-lg px-3 py-1.5 text-xs">' +
      '<span>' + escapeHtml(u.officeName) + ' ・ ' + escapeHtml(u.employeeName) + (u.employeeNo ? '（' + escapeHtml(u.employeeNo) + '）' : '') + '</span>' +
      '<button class="text-blue-600 hover:underline font-semibold" data-quick-add="' + escapeHtml(JSON.stringify(u)) + '">マスタに登録</button>' +
      '</div>';
  }).join('');
  list.querySelectorAll('[data-quick-add]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      const u = JSON.parse(btn.dataset.quickAdd);
      quickAddStaff(u.officeCode, u.employeeNo, u.employeeName);
    });
  });
}

function openStaffModal(mode, rowIndex) {
  document.getElementById('staff-form-rowindex').value = mode === 'edit' ? rowIndex : '';
  const shopSelect = document.getElementById('staff-form-shop');
  const empNoInput = document.getElementById('staff-form-empno');
  const empNameInput = document.getElementById('staff-form-empname');
  const googleAccountInput = document.getElementById('staff-form-google-account');
  const isManagerInput = document.getElementById('staff-form-is-manager');

  if (mode === 'edit') {
    const staff = staffMasterCache.find(function (s) { return s.rowIndex === rowIndex; });
    document.getElementById('staff-modal-title').textContent = 'スタッフを編集';
    shopSelect.value = staff ? staff.officeCode : '';
    empNoInput.value = staff ? staff.employeeNo : '';
    empNameInput.value = staff ? staff.employeeName : '';
    googleAccountInput.value = staff ? staff.googleAccount : '';
    isManagerInput.checked = !!(staff && staff.isManager);
  } else {
    document.getElementById('staff-modal-title').textContent = 'スタッフを追加';
    shopSelect.value = '';
    empNoInput.value = '';
    empNameInput.value = '';
    googleAccountInput.value = '';
    isManagerInput.checked = false;
  }
  openAdminModal('staff-modal');
}

function onSubmitStaffForm(ev) {
  ev.preventDefault();
  const rowIndexRaw = document.getElementById('staff-form-rowindex').value;
  const officeCode = document.getElementById('staff-form-shop').value;
  const empNo = document.getElementById('staff-form-empno').value.trim();
  const empName = document.getElementById('staff-form-empname').value.trim();
  const googleAccount = document.getElementById('staff-form-google-account').value.trim();
  const isManager = document.getElementById('staff-form-is-manager').checked;
  if (!officeCode || !empName) { showToast('所属店舗と社員名は必須です。', 'error'); return; }
  if (isManager && !googleAccount) { showToast('管理者権限を付与するスタッフは、Googleアカウントの登録が必須です。', 'error'); return; }

  showLoading(true);
  const runner = google.script.run
    .withSuccessHandler(function (res) {
      showLoading(false);
      if (res && res.success) {
        showToast(rowIndexRaw ? 'スタッフ情報を更新しました。' : 'スタッフを追加しました。', 'success');
        closeAdminModal('staff-modal');
        loadAdminData();
        loadAllData(); // フィルタ等の社員一覧・権限コンテキストを最新化
      } else {
        showToast('保存に失敗しました: ' + (res ? res.error : '不明なエラー'), 'error');
      }
    })
    .withFailureHandler(function (err) {
      showLoading(false);
      showToast('通信エラー: ' + err.message, 'error');
    });

  if (rowIndexRaw) {
    runner.updateStaffMaster(Number(rowIndexRaw), officeCode, empNo, empName, googleAccount, isManager);
  } else {
    runner.addStaffMaster(officeCode, empNo, empName, googleAccount, isManager);
  }
}

function onDeleteStaff(rowIndex) {
  const staff = staffMasterCache.find(function (s) { return s.rowIndex === rowIndex; });
  const label = staff ? staff.employeeName : rowIndex;
  if (!window.confirm('スタッフ「' + label + '」をマスタから削除します。よろしいですか？\n（過去の実績データは削除されません）')) return;

  showLoading(true);
  google.script.run
    .withSuccessHandler(function (res) {
      showLoading(false);
      if (res && res.success) {
        showToast('スタッフを削除しました。', 'success');
        loadAdminData();
      } else {
        showToast('削除に失敗しました: ' + (res ? res.error : '不明なエラー'), 'error');
      }
    })
    .withFailureHandler(function (err) {
      showLoading(false);
      showToast('通信エラー: ' + err.message, 'error');
    })
    .deleteStaffMaster(rowIndex);
}

function quickAddStaff(officeCode, employeeNo, employeeName) {
  showLoading(true);
  google.script.run
    .withSuccessHandler(function (res) {
      showLoading(false);
      if (res && res.success) {
        showToast('スタッフをマスタに登録しました。', 'success');
        loadAdminData();
      } else {
        showToast('登録に失敗しました: ' + (res ? res.error : '不明なエラー'), 'error');
      }
    })
    .withFailureHandler(function (err) {
      showLoading(false);
      showToast('通信エラー: ' + err.message, 'error');
    })
    .addStaffMaster(officeCode, employeeNo, employeeName);
}
