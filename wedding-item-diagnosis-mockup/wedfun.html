<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WEDFUN | 演出アイテム診断</title>
<style>
  /* =========================================================
     設計基準は参考動画の画面サイズ 540 x 720（縦型）。
     寸法・文字サイズは --u（= 実際の幅 / 540）で等倍スケールする。
     ========================================================= */
  :root{
    --u:1px;
    --white:#ffffff;
    --gold:#c89752;
    --yellow:#f9e15c;
    --text:#3a3a3a;
    --text-sub:#8c8c8c;
    --line:#555555;
    --line-soft:#cfcfcf;
    --sans:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;
    --serif:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",serif;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;-webkit-text-size-adjust:100%}
  body{background:#ececec;font-family:var(--sans);color:var(--text);-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none!important}

  #app{position:fixed;inset:0;display:flex;justify-content:center;align-items:stretch}
  /* 幅はJSで「画面の高さ×0.75（設計比率）」と実際の画面幅の小さい方に決める */
  #frame{position:relative;width:100%;max-width:540px;height:100%;background:var(--white);overflow:hidden}

  .screen{position:absolute;inset:0;opacity:0;pointer-events:none;background:var(--white);
    transition:opacity 620ms ease}
  .screen.active{opacity:1;pointer-events:auto}

  /* --- 遷移1：上から滑り込む（ようこそ → 入口メニュー） --- */
  .screen.anim-slide{opacity:1;z-index:20;animation:slideDown 380ms cubic-bezier(.22,.61,.36,1) both}
  @keyframes slideDown{from{transform:translateY(-100%)}to{transform:translateY(0)}}

  /* --- 遷移2：白へ抜けたあと、要素が上から順に現れる --- */
  .stag{opacity:0}
  .anim-stagger .stag{animation:stagIn 380ms ease both;animation-delay:var(--d,0ms)}
  @keyframes stagIn{from{opacity:0}to{opacity:1}}
  .screen.settled .stag{opacity:1}

  /* =========================================================
     1. スプラッシュ
     ========================================================= */
  #s-splash{cursor:pointer}
  .logo-lockup{position:absolute;left:0;right:0;top:calc(203 * var(--u));height:calc(238 * var(--u))}
  .logo-circle{position:absolute;left:calc(113 * var(--u));top:0;
    width:calc(238 * var(--u));height:calc(238 * var(--u));border-radius:50%;background:var(--yellow)}
  .logo-type{position:absolute;left:0;right:0;top:calc(93 * var(--u));text-align:center;
    transform:translateX(calc(20 * var(--u)))}
  .logo-type .main{display:block;font-size:calc(55 * var(--u));font-weight:700;
    letter-spacing:.07em;line-height:1;color:#111}
  .logo-type .sub{display:block;margin-top:calc(7 * var(--u));
    font-size:calc(18 * var(--u));font-weight:700;letter-spacing:.3em;color:#111}
  .splash-credit{position:absolute;left:0;right:0;
    bottom:calc(36 * var(--u) + env(safe-area-inset-bottom,0px));text-align:center;
    font-size:calc(9 * var(--u));font-weight:700;letter-spacing:.16em;color:#333}

  /* =========================================================
     2. ようこそ
     ========================================================= */
  #s-welcome{display:flex;flex-direction:column;
    padding:calc(144 * var(--u)) 0 calc(63 * var(--u) + env(safe-area-inset-bottom,0px))}
  .welcome-head{padding:0 calc(52 * var(--u));font-size:calc(15 * var(--u));
    line-height:calc(31 * var(--u));letter-spacing:.1em;color:var(--text);min-height:calc(62 * var(--u))}
  .welcome-head .ch{opacity:0;animation:chIn 260ms ease forwards}
  @keyframes chIn{from{opacity:0}to{opacity:1}}
  .choice-list{margin-top:calc(61 * var(--u));padding:0 calc(52 * var(--u));
    display:flex;flex-direction:column;gap:calc(28 * var(--u))}
  .choice{display:flex;align-items:center;height:calc(44 * var(--u));
    border-radius:calc(22 * var(--u));border:1px solid var(--line);
    padding-left:calc(22 * var(--u));color:var(--text);background:var(--white);
    transition:border-color 200ms ease,color 200ms ease}
  .choice .ico{width:calc(26 * var(--u));height:calc(26 * var(--u));flex-shrink:0;
    display:flex;align-items:center;justify-content:center}
  .choice .ico svg{width:100%;height:100%;stroke:currentColor;fill:none;stroke-width:1.4}
  .choice .txt{margin-left:calc(18 * var(--u));font-size:calc(14 * var(--u));letter-spacing:.14em}
  .choice.on{border-color:var(--gold);border-width:2px;color:var(--gold)}
  .welcome-spacer{flex:1}
  .navbar{display:flex;gap:calc(17 * var(--u));padding:0 calc(52 * var(--u))}
  .nav-btn{flex:1;height:calc(55 * var(--u));border-radius:calc(28 * var(--u));
    font-size:calc(15 * var(--u));letter-spacing:.12em;
    display:flex;align-items:center;justify-content:center;transition:opacity 200ms ease}
  .nav-btn:active{opacity:.7}
  .nav-btn.ghost{border:1px solid var(--line-soft);color:var(--text-sub);background:var(--white)}
  .nav-btn.solid{background:var(--gold);color:var(--white)}
  .nav-btn[disabled]{opacity:.4;pointer-events:none}

  /* =========================================================
     3. 入口メニュー
     ========================================================= */
  #s-menu{background-size:cover;background-position:center top;background-repeat:no-repeat}
  .menu-message{position:absolute;left:0;right:0;top:calc(112 * var(--u));
    padding:0 calc(34 * var(--u));text-align:center;
    font-family:var(--serif);font-size:calc(13 * var(--u));line-height:calc(24 * var(--u));
    letter-spacing:.1em;color:#2e2a26;white-space:pre-line}
  .path-row{position:absolute;left:0;right:0;top:calc(491 * var(--u));
    display:flex;justify-content:center;gap:calc(35 * var(--u))}
  .path-card{position:relative;width:calc(190 * var(--u));height:calc(160 * var(--u));
    border-radius:calc(9 * var(--u));overflow:hidden;background-size:cover;background-position:center;
    transition:transform 220ms cubic-bezier(.16,1,.3,1),opacity 220ms ease}
  .path-card:active{transform:scale(.97)}
  .path-card.dim{opacity:.4}
  .path-card.pick{transform:scale(1.04)}
  .path-label{position:absolute;left:calc(5 * var(--u));right:calc(5 * var(--u));
    top:calc(11 * var(--u));height:calc(22 * var(--u));border-radius:calc(11 * var(--u));
    background:rgba(255,255,255,.93);display:flex;align-items:center;justify-content:center;
    font-size:calc(12 * var(--u));letter-spacing:.1em;color:var(--text)}

  /* =========================================================
     4. 質問（全幅の写真バンド3枚）
     ========================================================= */
  #s-question{display:flex;flex-direction:column;gap:calc(4 * var(--u));
    padding:calc(5 * var(--u)) 0 calc(5 * var(--u) + env(safe-area-inset-bottom,0px))}
  .band{position:relative;flex:1;min-height:0;overflow:hidden;
    background-size:cover;background-position:center;
    transition:transform 220ms cubic-bezier(.16,1,.3,1),opacity 220ms ease,filter 220ms ease}
  .band:active{transform:scale(.995)}
  .band.dim{opacity:.35;filter:saturate(.7)}
  .band.pick{transform:scale(1.02)}
  .band-inner{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    padding:0 calc(28 * var(--u))}
  .band-text{text-align:center;color:#fff;
    font-size:calc(17 * var(--u));line-height:calc(34 * var(--u));letter-spacing:.11em;
    white-space:pre-line;padding:calc(14 * var(--u)) calc(26 * var(--u));
    background:rgba(255,255,255,.14);text-shadow:0 1px calc(10 * var(--u)) rgba(0,0,0,.45)}

  /* =========================================================
     5. Favorite
     ========================================================= */
  .fav-title{position:absolute;left:0;right:0;top:calc(28 * var(--u));text-align:center;
    font-size:calc(19 * var(--u));font-weight:300;letter-spacing:.18em;color:var(--text)}
  .fav-grid{position:absolute;left:calc(42 * var(--u));right:calc(43 * var(--u));top:calc(67 * var(--u));
    display:grid;grid-template-columns:1fr 1fr;column-gap:calc(13 * var(--u));row-gap:calc(24 * var(--u))}
  .fav-item{display:block;transition:transform 200ms ease,opacity 200ms ease}
  .fav-item:active{transform:scale(.98)}
  .fav-photo{display:block;width:100%;aspect-ratio:222/274;
    background-size:cover;background-position:center;background-color:#eee}
  .fav-cap{display:block;margin-top:calc(11 * var(--u));text-align:center;
    font-size:calc(11 * var(--u));line-height:calc(13 * var(--u));letter-spacing:.12em;color:var(--text)}
  /* 動画に戻る導線は無いが、店頭端末で行き止まりにならないよう控えめに置く */
  .back-link{position:absolute;font-size:calc(11 * var(--u));letter-spacing:.14em;color:var(--text-sub)}
  .back-link:active{opacity:.6}
  #favBack{left:0;right:0;bottom:calc(8 * var(--u) + env(safe-area-inset-bottom,0px));text-align:center}

  /* =========================================================
     6. 商品詳細（1画面固定・スクロールなし）
     ========================================================= */
  .pd-top{position:absolute;left:calc(10 * var(--u));top:calc(10 * var(--u));
    display:flex;gap:calc(10 * var(--u));height:calc(312 * var(--u))}
  .pd-top div{background-size:cover;background-position:center;background-color:#eee}
  .pd-top div:first-child{width:calc(254 * var(--u))}
  .pd-top div:last-child{width:calc(257 * var(--u))}
  .pd-name{position:absolute;left:0;right:0;top:calc(345 * var(--u));text-align:center;
    font-size:calc(18 * var(--u));font-weight:300;letter-spacing:.34em;color:#4a4a4a}
  .pd-shot{position:absolute;left:calc(10 * var(--u));top:calc(387 * var(--u));
    width:calc(254 * var(--u));height:calc(333 * var(--u));
    background-size:cover;background-position:center;background-color:#eee}
  .pd-desc{position:absolute;left:calc(304 * var(--u));top:calc(400 * var(--u));
    width:calc(190 * var(--u));font-size:calc(13 * var(--u));line-height:calc(24 * var(--u));
    letter-spacing:.04em;color:#4a4a4a}
  #pdBack{left:calc(304 * var(--u));top:calc(520 * var(--u))}
  /* 動画ボタン：参考動画と同じく右下のスマホ型。画面下端で切れる位置まで含めて合わせる */
  .pd-phone{position:absolute;left:calc(418 * var(--u));top:calc(561 * var(--u));
    width:calc(103 * var(--u));height:calc(200 * var(--u));
    border:calc(4 * var(--u)) solid #1b1b1b;border-radius:calc(15 * var(--u));
    background:#000;overflow:hidden;box-shadow:0 calc(3 * var(--u)) calc(12 * var(--u)) rgba(0,0,0,.22);
    transition:transform 200ms ease}
  .pd-phone:active{transform:scale(.97)}
  .pd-phone .notch{position:absolute;left:50%;top:0;transform:translateX(-50%);
    width:calc(44 * var(--u));height:calc(9 * var(--u));background:#1b1b1b;
    border-radius:0 0 calc(6 * var(--u)) calc(6 * var(--u));z-index:2}
  .pd-phone .shot{position:absolute;inset:0;background-size:cover;background-position:center}
  .pd-phone .play{position:absolute;left:50%;top:calc(46 * var(--u));transform:translate(-50%,-50%);
    width:calc(30 * var(--u));height:calc(30 * var(--u));border-radius:50%;
    background:rgba(255,255,255,.88);display:flex;align-items:center;justify-content:center;z-index:2}
  .pd-phone .play::after{content:"";width:0;height:0;margin-left:calc(3 * var(--u));
    border-style:solid;border-width:calc(6 * var(--u)) 0 calc(6 * var(--u)) calc(10 * var(--u));
    border-color:transparent transparent transparent #222}

  /* =========================================================
     7. 動画（全画面・レターボックス）
     ========================================================= */
  #s-video{background:#000;display:flex;align-items:center;justify-content:center;transition:opacity 260ms ease}
  .video-stage{width:100%;aspect-ratio:16/9;background:#0a0a0a;position:relative;overflow:hidden}
  .video-stage video{width:100%;height:100%;object-fit:cover;display:block}
  .video-fallback{position:absolute;inset:0;background-size:cover;background-position:center}
  .video-fallback::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.3)}
  .video-note{position:absolute;left:0;right:0;bottom:calc(14 * var(--u));z-index:2;text-align:center;
    font-size:calc(10 * var(--u));letter-spacing:.14em;color:rgba(255,255,255,.75)}
  .video-close{position:absolute;z-index:3;top:calc(20 * var(--u) + env(safe-area-inset-top,0px));
    right:calc(22 * var(--u));font-size:calc(11 * var(--u));letter-spacing:.16em;color:rgba(255,255,255,.85)}

  @media (prefers-reduced-motion:reduce){
    .screen,.band,.path-card,.fav-item,.pd-phone{transition:none!important}
    .screen.anim-slide,.anim-stagger .stag,.welcome-head .ch{animation:none!important;opacity:1!important}
  }
</style>
</head>
<body>

<noscript>
  <div style="position:fixed;inset:0;z-index:999;background:#fff;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;padding:0 32px;font-size:14px;line-height:2">
    <p>このページはJavaScriptが有効な状態でご覧ください。</p>
    <p style="margin-top:14px;color:#8c8c8c;font-size:12px">
      アプリ内のプレビューで開いている場合は、共有メニューから<br>SafariやChromeなどのブラウザで開き直してください。
    </p>
  </div>
</noscript>

<div id="app">
  <div id="frame">

    <section class="screen" id="s-splash">
      <div class="logo-lockup">
        <span class="logo-circle"></span>
        <span class="logo-type">
          <span class="main">WEDFUN</span>
          <span class="sub">WEDDING=FUN</span>
        </span>
      </div>
      <div class="splash-credit" id="splashCredit"></div>
    </section>

    <section class="screen" id="s-welcome">
      <div class="welcome-head" id="welcomeHead"></div>
      <div class="choice-list" id="choiceList"></div>
      <div class="welcome-spacer"></div>
      <div class="navbar">
        <button class="nav-btn ghost" id="welcomeBack">戻る</button>
        <button class="nav-btn solid" id="welcomeNext" disabled>次へ</button>
      </div>
    </section>

    <section class="screen" id="s-menu">
      <div class="menu-message" id="menuMessage"></div>
      <div class="path-row" id="pathRow"></div>
    </section>

    <section class="screen" id="s-question"></section>

    <section class="screen" id="s-favorite">
      <div class="fav-title stag" style="--d:0ms">Favorite</div>
      <div class="fav-grid" id="favGrid"></div>
      <button class="back-link" id="favBack">← 戻る</button>
    </section>

    <section class="screen" id="s-product">
      <div class="pd-top stag" style="--d:0ms" id="pdTop"></div>
      <div class="pd-name stag" style="--d:120ms" id="pdName"></div>
      <div class="pd-shot stag" style="--d:200ms" id="pdShot"></div>
      <div class="pd-desc stag" style="--d:280ms" id="pdDesc"></div>
      <button class="back-link stag" id="pdBack" style="--d:360ms">← 戻る</button>
      <button class="pd-phone stag" style="--d:360ms" id="pdVideo">
        <span class="notch"></span>
        <span class="shot" id="pdPhoneShot"></span>
        <span class="play"></span>
      </button>
    </section>

    <section class="screen" id="s-video">
      <button class="video-close" id="videoClose">閉じる</button>
      <div class="video-stage" id="videoStage"></div>
    </section>

  </div>
</div>

<script>
(function(){
  "use strict";

  // =================================================================
  // データ（UIはこのデータだけを読む。会場ごとに差し替え可能）
  // 写真は参考動画から切り出したもの。band-*.jpg と card-*.jpg は
  // 動画側で文字が焼き込まれているため bakedText / bakedLabel を立て、
  // アプリ側では文字を重ねない。
  // =================================================================

  var MASTER_PRODUCTS = [
    {
      id:"lovelove", name:"ラブラブ危機一髪",
      photo:"images/video/fav-loveloveqiki.jpg",
      detail:["images/video/prod-barrel-knife.jpg","images/video/prod-guests.jpg"],
      shot:"images/video/prod-couple-barrel.jpg",
      desc:"樽に剣を差し込み、当たりを引いた人が飛び出す仕掛けです。ゲストを巻き込んで会場が一体になります。",
      tags:["ゲスト参加","盛り上がる","おもてなし"],
      video:null
    },
    {
      id:"champagne", name:"シャンパンタワー",
      photo:"images/video/fav-champagne.jpg",
      detail:["images/video/fav-champagne.jpg","images/video/fav-champagne.jpg"],
      shot:"images/video/fav-champagne.jpg",
      desc:"積み上げたグラスの頂点から注ぐ、披露宴の定番演出です。照明を落とすと写真に残りやすくなります。",
      tags:["華やか","定番","結婚式らしい","写真映え"],
      video:null
    },
    {
      id:"lantern", name:"スカイランタン",
      photo:"images/video/fav-skylantern.jpg",
      detail:["images/video/fav-skylantern.jpg","images/video/fav-skylantern.jpg"],
      shot:"images/video/fav-skylantern.jpg",
      desc:"灯りを入れたランタンを空へ放つ演出です。メッセージを書き込めるので、ふたりらしさを出せます。",
      tags:["幻想的","二人らしい","写真映え"],
      video:null
    },
    {
      id:"flair", name:"フレアカクテルショー",
      photo:"images/video/fav-flaircocktail.jpg",
      detail:["images/video/fav-flaircocktail.jpg","images/video/fav-flaircocktail.jpg"],
      shot:"images/video/fav-flaircocktail.jpg",
      desc:"バーテンダーがボトルを操りながらカクテルを作る演出です。目の前で行うため、歓談の時間が盛り上がります。",
      tags:["盛り上がる","ゲスト参加","華やか"],
      video:null
    }
  ];

  var VENUES = {
    "default":{
      brand:{ logoMain:"WEDFUN", logoSub:"WEDDING=FUN",
        credit:"Produced by  AKI ENTERPRISE CO.,LTD.", primary:"#c89752", circle:"#f9e15c" },
      welcome:{ title:"ようこそ\nどちらに当てはまりますか？",
        options:[ {id:"couple",label:"新郎・新婦",icon:"couple"}, {id:"guest",label:"ゲスト",icon:"guest"} ] },
      menu:{
        image:"images/video/menu-poster.jpg",
        bakedMessage:true,
        message:"私達は常にニーズに応え、時には一歩進んだ提案を掲げ\n「笑顔・感動・記憶に残る」をキーワードに\n「もっと特別なウエディング」を創り上げていきます。",
        paths:[
          { id:"feeling", label:"想いから選ぶ", image:"images/video/card-feeling.jpg", bakedLabel:true },
          { id:"taste",   label:"好みから選ぶ", image:"images/video/card-taste.jpg",    bakedLabel:true }
        ]
      },
      questions:{
        feeling:[
          { id:"hospitality", text:"ゲストに楽しんでほしい。\nおもてなしを大切にしたい。",
            image:"images/video/band-guest.jpg", bakedText:true, tags:["おもてなし","ゲスト参加"] },
          { id:"classic", text:"折角の特別な結婚式なので\n「結婚式らしい」は押さえたい。",
            image:"images/video/band-classic.jpg", bakedText:true, tags:["結婚式らしい","定番"] },
          { id:"original", text:"ありきたりな演出じゃなく\n二人らしいにこだわりたい。",
            image:"images/video/band-original.jpg", bakedText:true, tags:["二人らしい","幻想的"] }
        ],
        taste:[
          { id:"bright", text:"華やかで写真に残る演出がいい。",
            image:"images/video/fav-champagne.jpg", tags:["華やか","写真映え"] },
          { id:"light", text:"光や灯りで\n幻想的に見せたい。",
            image:"images/video/fav-skylantern.jpg", tags:["幻想的","写真映え"] },
          { id:"lively", text:"ゲストと一緒に\n盛り上がりたい。",
            image:"images/video/fav-flaircocktail.jpg", tags:["盛り上がる","ゲスト参加"] }
        ]
      },
      hideProducts:[], productOverrides:{}
    },

    "venue-a":{
      brand:{ logoMain:"WEDFUN", logoSub:"GRAND HILLS",
        credit:"Produced by  GRAND HILLS WEDDING", primary:"#a8506b", circle:"#f4d8df" },
      welcome:null, menu:null, questions:null,
      hideProducts:[], productOverrides:{ "champagne":{ name:"グランヒルズ シャンパンタワー" } }
    },

    "venue-b":{
      brand:{ logoMain:"WEDFUN", logoSub:"AQUA TERRACE",
        credit:"Produced by  AQUA TERRACE WEDDING", primary:"#2f7d78", circle:"#cfe9e6" },
      welcome:null, menu:null, questions:null,
      hideProducts:["flair"], productOverrides:{}
    }
  };

  // 会場固有の指定が無い項目は default から引き継ぐ（マスター継承）
  Object.keys(VENUES).forEach(function(id){
    if (id === "default") return;
    ["welcome","menu","questions"].forEach(function(k){
      if (!VENUES[id][k]) VENUES[id][k] = VENUES["default"][k];
    });
  });

  var ICONS = {
    couple:'<svg viewBox="0 0 32 32" stroke-linecap="round" stroke-linejoin="round">'+
      '<circle cx="10" cy="7" r="3"/><path d="M10 10v9"/><path d="M7 19h6"/><path d="M8 19l-1 8"/><path d="M12 19l1 8"/>'+
      '<circle cx="22" cy="7" r="3"/><path d="M22 10c-3 0-4 3-4 6l1 4h6l1-4c0-3-1-6-4-6z"/><path d="M18 20l-1 7h10l-1-7"/></svg>',
    guest:'<svg viewBox="0 0 32 32" stroke-linecap="round" stroke-linejoin="round">'+
      '<circle cx="16" cy="10" r="4"/><path d="M9 25c0-4 3-7 7-7s7 3 7 7"/>'+
      '<circle cx="6" cy="13" r="3"/><path d="M1 24c0-3 2-5 5-5"/>'+
      '<circle cx="26" cy="13" r="3"/><path d="M31 24c0-3-2-5-5-5"/></svg>'
  };

  // =================================================================
  // 状態
  // =================================================================

  var state = { venueId:"default", userType:null, pathId:null, answer:null,
                candidates:[], productId:null, history:[] };
  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function el(id){ return document.getElementById(id); }
  function venue(){ return VENUES[state.venueId]; }

  function applyScale(){
    var app = el("app");
    var availW = app.clientWidth || window.innerWidth || 540;
    var availH = app.clientHeight || window.innerHeight || 720;
    var w = Math.min(availW, Math.round(availH * 0.75), 820);
    var frame = el("frame");
    frame.style.maxWidth = "none";
    frame.style.width = w + "px";
    document.documentElement.style.setProperty("--u", (w / 540) + "px");
  }
  window.addEventListener("resize", applyScale);
  window.addEventListener("orientationchange", applyScale);

  function applyBrand(){
    var b = venue().brand;
    document.documentElement.style.setProperty("--gold", b.primary);
    document.documentElement.style.setProperty("--yellow", b.circle);
    var lock = document.querySelector(".logo-type");
    lock.querySelector(".main").textContent = b.logoMain;
    lock.querySelector(".sub").textContent = b.logoSub;
    el("splashCredit").textContent = b.credit;
  }

  // =================================================================
  // 画面遷移（参考動画で使い分けられている3種類を再現する）
  //   fade   : ゆっくりしたクロスフェード（ロゴ → ようこそ）
  //   slide  : 新しい画面が上から滑り込んで覆う（ようこそ → メニュー）
  //   white  : 一度白に抜けてから、要素が上から順に現れる（質問・Favorite）
  //   quick  : 短いクロスフェード（Favorite → 商品詳細）
  // =================================================================

  var current = null;
  var timers = [];
  function clearTimers(){ timers.forEach(clearTimeout); timers = []; }
  function later(fn, ms){ timers.push(setTimeout(fn, ms)); }

  function show(id, mode, noHistory){
    if (current === id) return;
    clearTimers();
    mode = reduceMotion ? "quick" : (mode || "fade");
    var prev = current ? el(current) : null;
    var next = el(id);
    if (current && !noHistory) state.history.push(current);
    current = id;

    next.classList.remove("anim-slide","anim-stagger","settled");
    next.style.transitionDuration = "";
    if (prev) prev.style.transitionDuration = "";

    if (mode === "slide") {
      next.classList.add("active","anim-slide");
      later(function(){
        if (prev) prev.classList.remove("active");
        next.classList.remove("anim-slide");
      }, 400);

    } else if (mode === "white") {
      // 旧画面を白へ抜く → 新画面の要素を順に出す
      if (prev) { prev.style.transitionDuration = "170ms"; prev.classList.remove("active"); }
      later(function(){
        next.classList.add("active","anim-stagger");
        next.style.transitionDuration = "0ms";
        later(function(){
          next.classList.remove("anim-stagger");
          next.classList.add("settled");
        }, 1500);
      }, 180);

    } else {
      var dur = (mode === "quick") ? 200 : 620;
      next.style.transitionDuration = dur + "ms";
      if (prev) prev.style.transitionDuration = dur + "ms";
      next.classList.add("settled","active");
      if (prev) prev.classList.remove("active");
    }

    if (id === "s-welcome") typeWelcome();
  }

  function goBack(){
    var prev = state.history.pop();
    if (!prev) return;
    var cur = current ? el(current) : null;
    current = prev;
    var next = el(prev);
    next.style.transitionDuration = "200ms";
    next.classList.add("settled","active");
    if (cur) { cur.style.transitionDuration = "200ms"; cur.classList.remove("active"); }
  }

  // =================================================================
  // 2. ようこそ（見出しは1文字ずつ表示される）
  // =================================================================

  var typeTimer = null;

  function typeWelcome(){
    var head = el("welcomeHead");
    var text = venue().welcome.title;
    if (typeTimer) clearInterval(typeTimer);
    head.innerHTML = "";
    if (reduceMotion) { head.textContent = text; head.style.whiteSpace = "pre-line"; return; }
    head.style.whiteSpace = "pre-line";
    var i = 0;
    typeTimer = setInterval(function(){
      if (i >= text.length) { clearInterval(typeTimer); typeTimer = null; return; }
      var c = text.charAt(i);
      if (c === "\n") { head.appendChild(document.createTextNode("\n")); }
      else {
        var s = document.createElement("span");
        s.className = "ch";
        s.textContent = c;
        head.appendChild(s);
      }
      i++;
    }, 60);
  }

  function buildWelcome(){
    var w = venue().welcome;
    var list = el("choiceList");
    list.innerHTML = "";
    w.options.forEach(function(opt){
      var b = document.createElement("button");
      b.type = "button"; b.className = "choice"; b.dataset.id = opt.id;
      var ico = document.createElement("span");
      ico.className = "ico"; ico.innerHTML = ICONS[opt.icon] || "";
      var txt = document.createElement("span");
      txt.className = "txt"; txt.textContent = opt.label;
      b.appendChild(ico); b.appendChild(txt);
      b.addEventListener("click", function(){
        state.userType = opt.id;
        list.querySelectorAll(".choice").forEach(function(c){ c.classList.toggle("on", c === b); });
        el("welcomeNext").disabled = false;
      });
      list.appendChild(b);
    });
  }

  // =================================================================
  // 3. 入口メニュー
  // =================================================================

  function buildMenu(){
    var m = venue().menu;
    el("s-menu").style.backgroundImage = 'url("' + m.image + '")';
    var msg = el("menuMessage");
    // 背景写真に文言が入っている場合は重ねない
    if (m.bakedMessage) { msg.textContent = ""; msg.hidden = true; }
    else { msg.hidden = false; msg.textContent = m.message; }

    var row = el("pathRow");
    row.innerHTML = "";
    m.paths.forEach(function(p){
      var card = document.createElement("button");
      card.type = "button"; card.className = "path-card";
      card.style.backgroundImage = 'url("' + p.image + '")';
      card.setAttribute("aria-label", p.label);
      if (!p.bakedLabel) {
        var label = document.createElement("span");
        label.className = "path-label"; label.textContent = p.label;
        card.appendChild(label);
      }
      card.addEventListener("click", function(){
        if (card.classList.contains("pick")) return;
        row.querySelectorAll(".path-card").forEach(function(c){
          c.classList.toggle("pick", c === card);
          c.classList.toggle("dim", c !== card);
        });
        state.pathId = p.id;
        later(function(){
          buildQuestion();
          show("s-question", "white");
          row.querySelectorAll(".path-card").forEach(function(c){ c.classList.remove("pick","dim"); });
        }, 260);
      });
      row.appendChild(card);
    });
  }

  // =================================================================
  // 4. 質問
  // =================================================================

  function buildQuestion(){
    var qs = venue().questions[state.pathId] || venue().questions.feeling;
    var wrap = el("s-question");
    wrap.innerHTML = "";
    qs.forEach(function(q, idx){
      var band = document.createElement("button");
      band.type = "button";
      band.className = "band stag";
      band.style.setProperty("--d", (idx * 160) + "ms");
      band.style.backgroundImage = 'url("' + q.image + '")';
      band.setAttribute("aria-label", q.text.replace(/\n/g, ""));
      // 写真に文言が焼き込まれている場合は重ねない
      if (!q.bakedText) {
        var inner = document.createElement("span");
        inner.className = "band-inner";
        var t = document.createElement("span");
        t.className = "band-text"; t.textContent = q.text;
        inner.appendChild(t); band.appendChild(inner);
      }
      band.addEventListener("click", function(){
        if (band.classList.contains("pick")) return;
        wrap.querySelectorAll(".band").forEach(function(b){
          b.classList.toggle("pick", b === band);
          b.classList.toggle("dim", b !== band);
        });
        state.answer = q;
        later(function(){
          buildFavorite();
          show("s-favorite", "white");
          wrap.querySelectorAll(".band").forEach(function(b){ b.classList.remove("pick","dim"); });
        }, 280);
      });
      wrap.appendChild(band);
    });
  }

  // =================================================================
  // 診断ロジック（UIから独立。タグ一致数で並べ替える）
  // =================================================================

  function rankProducts(){
    var hidden = venue().hideProducts || [];
    var tags = (state.answer && state.answer.tags) || [];
    return MASTER_PRODUCTS
      .filter(function(p){ return hidden.indexOf(p.id) === -1; })
      .map(function(p){
        return { p:p, s:p.tags.filter(function(t){ return tags.indexOf(t) !== -1; }).length };
      })
      .sort(function(a,b){
        if (b.s !== a.s) return b.s - a.s;
        return MASTER_PRODUCTS.indexOf(a.p) - MASTER_PRODUCTS.indexOf(b.p);
      })
      .map(function(x){ return x.p; });
  }

  function productName(p){
    var ov = (venue().productOverrides || {})[p.id] || {};
    return ov.name || p.name;
  }

  // =================================================================
  // 5. Favorite
  // =================================================================

  function buildFavorite(){
    state.candidates = rankProducts().slice(0, 4);
    var grid = el("favGrid");
    grid.innerHTML = "";
    state.candidates.forEach(function(p, idx){
      var item = document.createElement("button");
      item.type = "button";
      item.className = "fav-item stag";
      item.style.setProperty("--d", (160 + idx * 150) + "ms");
      var ph = document.createElement("span");
      ph.className = "fav-photo";
      ph.style.backgroundImage = 'url("' + p.photo + '")';
      var cap = document.createElement("span");
      cap.className = "fav-cap"; cap.textContent = productName(p);
      item.appendChild(ph); item.appendChild(cap);
      item.addEventListener("click", function(){
        state.productId = p.id;
        buildProduct(p);
        show("s-product", "quick");
      });
      grid.appendChild(item);
    });
  }

  // =================================================================
  // 6. 商品詳細
  // =================================================================

  function buildProduct(p){
    var top = el("pdTop");
    top.innerHTML = "";
    p.detail.slice(0,2).forEach(function(src){
      var d = document.createElement("div");
      d.style.backgroundImage = 'url("' + src + '")';
      top.appendChild(d);
    });
    el("pdName").textContent = productName(p);
    el("pdShot").style.backgroundImage = 'url("' + p.shot + '")';
    el("pdDesc").textContent = p.desc;
    el("pdPhoneShot").style.backgroundImage = 'url("' + p.photo + '")';
  }

  // =================================================================
  // 7. 動画
  // =================================================================

  function openVideo(){
    var p = MASTER_PRODUCTS.filter(function(x){ return x.id === state.productId; })[0];
    var stage = el("videoStage");
    stage.innerHTML = "";
    if (p && p.video) {
      var v = document.createElement("video");
      v.src = p.video;
      v.autoplay = true; v.muted = true; v.loop = true; v.controls = true;
      v.playsInline = true; v.setAttribute("playsinline","");
      stage.appendChild(v);
      var pl = v.play();
      if (pl && pl.catch) pl.catch(function(){ v.controls = true; });
    } else {
      var fb = document.createElement("div");
      fb.className = "video-fallback";
      fb.style.backgroundImage = 'url("' + (p ? p.photo : "") + '")';
      var note = document.createElement("div");
      note.className = "video-note";
      note.textContent = "紹介動画（モックアップのため準備中）";
      stage.appendChild(fb); stage.appendChild(note);
    }
    show("s-video", "quick");
  }

  function closeVideo(){
    var v = el("videoStage").querySelector("video");
    if (v) v.pause();
    goBack();
  }

  // =================================================================
  // 初期化
  // =================================================================

  function init(){
    var q = new URLSearchParams(window.location.search).get("venue");
    if (q && VENUES[q]) state.venueId = q;

    applyScale();
    applyBrand();
    buildWelcome();
    buildMenu();

    el("s-splash").classList.add("settled","active");
    current = "s-splash";

    var left = false;
    function leaveSplash(){
      if (left) return;
      left = true;
      show("s-welcome", "fade");
    }
    el("s-splash").addEventListener("click", leaveSplash);
    setTimeout(leaveSplash, reduceMotion ? 600 : 4400);

    el("welcomeNext").addEventListener("click", function(){
      if (!state.userType) return;
      show("s-menu", "slide");
    });
    el("welcomeBack").addEventListener("click", function(){
      state.userType = null;
      el("welcomeNext").disabled = true;
      el("choiceList").querySelectorAll(".choice").forEach(function(c){ c.classList.remove("on"); });
      state.history = [];
      show("s-splash", "fade", true);
      left = false;
      setTimeout(leaveSplash, reduceMotion ? 600 : 4400);
    });

    el("favBack").addEventListener("click", goBack);
    el("pdBack").addEventListener("click", goBack);
    el("pdVideo").addEventListener("click", openVideo);
    el("videoClose").addEventListener("click", closeVideo);
  }

  document.addEventListener("DOMContentLoaded", init);
})();
</script>
