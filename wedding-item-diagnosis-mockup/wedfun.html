<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WEDFUN | 演出アイテム診断</title>
<style>
  /* =========================================================
     設計基準は参考動画の画面サイズ 540 x 720（縦型）。
     横方向の寸法・文字サイズは --u（= 実際の幅 / 540）で
     等倍スケールし、縦方向はflexで伸縮させる。
     ========================================================= */
  :root{
    --u:1px;
    --white:#ffffff;
    --gold:#c89752;
    --gold-line:#c79a55;
    --yellow:#f9e15c;
    --text:#3a3a3a;
    --text-sub:#8c8c8c;
    --line:#555555;
    --line-soft:#cfcfcf;
    --sans:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;
    --serif:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",serif;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;-webkit-text-size-adjust:100%}
  body{
    background:#ececec;
    font-family:var(--sans);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
  }
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none!important}

  /* PCでは横長に広げず、縦型のアプリ本体を中央に置く */
  #app{position:fixed;inset:0;display:flex;justify-content:center;align-items:stretch}
  /* 幅はJSで「画面の高さ×0.75（設計比率）」と実際の画面幅の小さい方に決める。
     縦型タブレットでは画面いっぱい、PCでは中央に縦型のまま置かれる。 */
  #frame{position:relative;width:100%;max-width:540px;height:100%;background:var(--white);overflow:hidden}

  .screen{position:absolute;inset:0;opacity:0;pointer-events:none;
    transform:translateY(calc(10 * var(--u)));
    transition:opacity 320ms ease,transform 320ms ease}
  .screen.active{opacity:1;pointer-events:auto;transform:none}
  .screen.scrollable{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}

  /* ---------- 共通：下部ナビゲーション ---------- */
  .navbar{display:flex;gap:calc(17 * var(--u));
    padding:0 calc(52 * var(--u)) 0}
  .nav-btn{flex:1;height:calc(55 * var(--u));border-radius:calc(28 * var(--u));
    font-size:calc(15 * var(--u));letter-spacing:.12em;
    display:flex;align-items:center;justify-content:center;
    transition:opacity 200ms ease}
  .nav-btn:active{opacity:.7}
  .nav-btn.ghost{border:1px solid var(--line-soft);color:var(--text-sub);background:var(--white)}
  .nav-btn.solid{background:var(--gold);color:var(--white)}
  .nav-btn[disabled]{opacity:.4;pointer-events:none}

  /* =========================================================
     1. スプラッシュ（WEDFUNロゴ）
     ========================================================= */
  /* ロゴは動画の実測位置に合わせる。円は画面中心より左、文字は円より右へ
     はみ出して組まれているため、両者を別々に置いて重ねる。 */
  #s-splash{background:var(--white);cursor:pointer}
  .logo-lockup{position:absolute;left:0;right:0;top:calc(203 * var(--u));
    height:calc(238 * var(--u))}
  .logo-circle{position:absolute;left:calc(113 * var(--u));top:0;
    width:calc(238 * var(--u));height:calc(238 * var(--u));border-radius:50%;
    background:var(--yellow);
    opacity:0;transform:scale(.96);
    animation:circleIn 700ms cubic-bezier(.16,1,.3,1) 120ms forwards}
  @keyframes circleIn{to{opacity:1;transform:scale(1)}}
  .logo-type{position:absolute;left:0;right:0;top:calc(93 * var(--u));text-align:center;
    opacity:0;transform:translate(calc(20 * var(--u)),calc(6 * var(--u)));
    animation:typeIn 700ms cubic-bezier(.16,1,.3,1) 300ms forwards}
  @keyframes typeIn{to{opacity:1;transform:translate(calc(20 * var(--u)),0)}}
  .logo-type .main{display:block;font-size:calc(55 * var(--u));font-weight:700;
    letter-spacing:.07em;line-height:1;color:#111}
  .logo-type .sub{display:block;margin-top:calc(7 * var(--u));
    font-size:calc(18 * var(--u));font-weight:700;letter-spacing:.3em;color:#111}
  .splash-credit{position:absolute;left:0;right:0;
    bottom:calc(36 * var(--u) + env(safe-area-inset-bottom,0px));
    text-align:center;font-size:calc(9 * var(--u));font-weight:700;letter-spacing:.16em;color:#333;
    opacity:0;animation:fadeIn 600ms ease 700ms forwards}
  @keyframes fadeIn{to{opacity:1}}

  /* =========================================================
     2. ようこそ（新郎・新婦 / ゲスト）
     ========================================================= */
  #s-welcome{display:flex;flex-direction:column;
    padding:calc(144 * var(--u)) 0 calc(63 * var(--u) + env(safe-area-inset-bottom,0px))}
  .welcome-head{padding:0 calc(52 * var(--u));font-size:calc(15 * var(--u));
    line-height:calc(31 * var(--u));letter-spacing:.1em;color:var(--text)}
  .choice-list{margin-top:calc(61 * var(--u));padding:0 calc(52 * var(--u));
    display:flex;flex-direction:column;gap:calc(28 * var(--u))}
  .choice{display:flex;align-items:center;height:calc(44 * var(--u));
    border-radius:calc(22 * var(--u));border:1px solid var(--line);
    padding-left:calc(22 * var(--u));color:var(--text);background:var(--white);
    transition:border-color 200ms ease,color 200ms ease}
  .choice .ico{width:calc(26 * var(--u));height:calc(26 * var(--u));flex-shrink:0;
    display:flex;align-items:center;justify-content:center}
  .choice .ico svg{width:100%;height:100%;stroke:currentColor;fill:none;stroke-width:1.4}
  .choice .txt{margin-left:calc(18 * var(--u));font-size:calc(14 * var(--u));letter-spacing:.14em}
  .choice.on{border-color:var(--gold-line);border-width:2px;color:var(--gold)}
  .welcome-spacer{flex:1}

  /* =========================================================
     3. 入口メニュー（想いから選ぶ / 好みから選ぶ）
     ========================================================= */
  #s-menu{display:flex;flex-direction:column;justify-content:flex-end;
    background-size:cover;background-position:center;background-repeat:no-repeat}
  /* 会場写真の明るさに関わらず上部の本文が読めるよう、白のベールを重ねる */
  .menu-veil{position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(255,255,255,.82) 0%,rgba(255,255,255,.62) 34%,rgba(255,255,255,.34) 62%,rgba(255,255,255,.3) 100%)}
  .menu-message{position:absolute;left:0;right:0;top:calc(112 * var(--u));
    padding:0 calc(34 * var(--u));text-align:center;
    font-family:var(--serif);font-size:calc(13 * var(--u));line-height:calc(24 * var(--u));
    letter-spacing:.1em;color:#2e2a26;white-space:pre-line}
  .path-row{position:relative;display:flex;justify-content:center;gap:calc(36 * var(--u));
    padding:0 calc(60 * var(--u)) calc(70 * var(--u) + env(safe-area-inset-bottom,0px))}
  .path-card{position:relative;flex:1;max-width:calc(189 * var(--u));
    height:calc(159 * var(--u));border-radius:calc(9 * var(--u));overflow:hidden;
    background-size:cover;background-position:center;
    transition:transform 220ms cubic-bezier(.16,1,.3,1),opacity 220ms ease}
  .path-card:active{transform:scale(.97)}
  .path-card.dim{opacity:.45}
  .path-card.pick{transform:scale(1.04)}
  .path-label{position:absolute;left:calc(5 * var(--u));right:calc(5 * var(--u));
    top:calc(11 * var(--u));height:calc(22 * var(--u));border-radius:calc(11 * var(--u));
    background:rgba(255,255,255,.93);display:flex;align-items:center;justify-content:center;
    font-size:calc(12 * var(--u));letter-spacing:.1em;color:var(--text)}

  /* =========================================================
     4. 質問（全幅の写真バンド3枚）
     ========================================================= */
  #s-question{display:flex;flex-direction:column;gap:calc(4 * var(--u));
    padding:calc(4 * var(--u)) 0 calc(4 * var(--u) + env(safe-area-inset-bottom,0px));
    background:var(--white)}
  .band{position:relative;flex:1;min-height:0;overflow:hidden;
    background-size:cover;background-position:center;
    transition:transform 220ms cubic-bezier(.16,1,.3,1),opacity 220ms ease,filter 220ms ease}
  .band:active{transform:scale(.995)}
  .band.dim{opacity:.4;filter:saturate(.7)}
  .band.pick{transform:scale(1.02)}
  .band-inner{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    padding:0 calc(28 * var(--u))}
  .band-text{position:relative;text-align:center;color:#fff;
    font-size:calc(17 * var(--u));line-height:calc(34 * var(--u));letter-spacing:.11em;
    white-space:pre-line;padding:calc(14 * var(--u)) calc(26 * var(--u));
    background:rgba(255,255,255,.14);
    text-shadow:0 1px calc(10 * var(--u)) rgba(0,0,0,.45)}

  /* =========================================================
     5. Favorite（2×2グリッド）
     ========================================================= */
  #s-favorite{display:flex;flex-direction:column}
  .fav-title{padding:calc(26 * var(--u)) 0 calc(18 * var(--u));text-align:center;
    font-size:calc(19 * var(--u));letter-spacing:.18em;color:var(--text);font-weight:300}
  .fav-grid{flex:1;display:grid;grid-template-columns:1fr 1fr;
    column-gap:calc(13 * var(--u));row-gap:calc(20 * var(--u));
    padding:0 calc(42 * var(--u));align-content:start}
  .fav-item{display:flex;flex-direction:column;transition:opacity 200ms ease,transform 200ms ease}
  .fav-item:active{transform:scale(.98)}
  .fav-photo{width:100%;aspect-ratio:221/265;background-size:cover;background-position:center;
    background-color:#eee}
  .fav-cap{margin-top:calc(14 * var(--u));text-align:center;
    font-size:calc(11 * var(--u));letter-spacing:.12em;color:var(--text)}
  /* 動画に戻る導線は無いが、店頭端末で行き止まりにならないよう控えめに置く */
  .fav-foot{padding:calc(22 * var(--u)) 0 calc(26 * var(--u) + env(safe-area-inset-bottom,0px));
    justify-content:center}
  .fav-foot .nav-btn,.pd-foot .nav-btn{flex:0 0 auto;
    min-width:calc(180 * var(--u));height:calc(46 * var(--u));border-radius:calc(23 * var(--u))}

  /* =========================================================
     6. 商品詳細
     ========================================================= */
  #s-product{background:var(--white)}
  .pd-inner{min-height:100%;display:flex;flex-direction:column;
    padding-bottom:calc(28 * var(--u) + env(safe-area-inset-bottom,0px))}
  .pd-hero{display:grid;grid-template-columns:1fr 1fr;gap:calc(12 * var(--u));
    padding:calc(11 * var(--u)) calc(11 * var(--u)) 0}
  .pd-hero div{aspect-ratio:251/313;background-size:cover;background-position:center;background-color:#eee}
  .pd-name{padding:calc(30 * var(--u)) calc(24 * var(--u)) calc(28 * var(--u));text-align:center;
    font-size:calc(18 * var(--u));font-weight:300;letter-spacing:.34em;color:#4a4a4a}
  .pd-body{padding:0 calc(42 * var(--u));font-size:calc(13 * var(--u));
    line-height:calc(26 * var(--u));letter-spacing:.06em;color:#5a5a5a}
  .pd-feats{margin-top:calc(22 * var(--u));padding:0 calc(42 * var(--u));
    display:flex;flex-direction:column;gap:calc(10 * var(--u))}
  .pd-feat{display:flex;align-items:flex-start;gap:calc(10 * var(--u));
    font-size:calc(12 * var(--u));line-height:calc(22 * var(--u));letter-spacing:.06em;color:#5a5a5a}
  .pd-feat::before{content:"";flex-shrink:0;width:calc(5 * var(--u));height:calc(5 * var(--u));
    border-radius:50%;background:var(--gold);margin-top:calc(9 * var(--u))}
  .pd-shot{margin-top:calc(30 * var(--u));width:100%;aspect-ratio:503/560;
    background-size:cover;background-position:center;background-color:#eee}
  .pd-actions{margin-top:calc(30 * var(--u));padding:0 calc(52 * var(--u));
    display:flex;flex-direction:column;gap:calc(14 * var(--u))}
  .pd-foot{margin-top:calc(26 * var(--u));justify-content:center}

  /* =========================================================
     7. 動画（全画面・レターボックス）
     ========================================================= */
  #s-video{background:#000;display:flex;align-items:center;justify-content:center}
  .video-stage{width:100%;aspect-ratio:16/9;background:#0a0a0a;position:relative;overflow:hidden}
  .video-stage video{width:100%;height:100%;object-fit:cover;display:block}
  .video-fallback{position:absolute;inset:0;background-size:cover;background-position:center}
  .video-fallback::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.35)}
  .video-note{position:absolute;left:0;right:0;bottom:calc(16 * var(--u));z-index:2;text-align:center;
    font-size:calc(10 * var(--u));letter-spacing:.14em;color:rgba(255,255,255,.75)}
  .video-close{position:absolute;z-index:3;
    top:calc(20 * var(--u) + env(safe-area-inset-top,0px));right:calc(22 * var(--u));
    font-size:calc(11 * var(--u));letter-spacing:.16em;color:rgba(255,255,255,.85)}

  @media (prefers-reduced-motion:reduce){
    .screen{transition:none}
    .logo-circle,.logo-type,.splash-credit{animation:none;opacity:1}
    .band,.path-card,.fav-item{transition:none}
  }
</style>
</head>
<body>

<noscript>

    <p>このページはJavaScriptが有効な状態でご覧ください。</p>

</noscript>

<div id="app">
  <div id="frame">

    <!-- 1. スプラッシュ -->
    <section class="screen" id="s-splash">
      <div class="logo-lockup">
        <span class="logo-circle"></span>
        <span class="logo-type">
          <span class="main">WEDFUN</span>
          <span class="sub">WEDDING=FUN</span>
        </span>
      </div>

    <!-- 2. ようこそ -->
    <section class="screen" id="s-welcome">
      <div class="welcome-head" id="welcomeHead"></div>

      <div class="welcome-spacer"></div>
      <div class="navbar">

    <section class="screen" id="s-menu">

    <section class="screen" id="s-question"></section>

    <section class="screen scrollable" id="s-favorite">

    <section class="screen scrollable" id="s-product">

    </section>

    <!-- 7. 動画 -->
    <section class="screen" id="s-video">
      <button class="video-close" id="videoClose">閉じる</button>
      <div class="video-stage" id="videoStage"></div>
    </section>

  </div>
</div>

          { id:"bright",   text:"華やかで写真に残る演出がいい。",
            image:"images/champagne-tower.jpg", tags:["華やか","写真映え"] },
          { id:"light",    text:"光や灯りで\n幻想的に見せたい。",
            image:"images/sky-lanterns.jpg",    tags:["幻想的","写真映え"] },
          { id:"lively",   text:"ゲストと一緒に\n盛り上がりたい。",
            image:"images/balloons.webp",       tags:["盛り上がる","ゲスト参加"] }
        ]
      },
      hideProducts:[],
      productOverrides:{}
    },

    "venue-a":{
      venueId:"venue-a",
      brand:{
        logoMain:"WEDFUN", logoSub:"GRAND HILLS",
        credit:"Produced by  GRAND HILLS WEDDING",
        primary:"#a8506b", circle:"#f4d8df"
      },
      welcome:{
        title:"ようこそ\nどちらに当てはまりますか？",
        options:[
          { id:"couple", label:"新郎・新婦", icon:"couple" },
          { id:"guest",  label:"ゲスト",     icon:"guest"  }
        ]
      },
      menu:{
        image:"images/table-candles.webp",
        message:"おふたりの想いを伺いながら、\n「この会場でしかできない一日」を\nご一緒に組み立てていきます。",
        paths:[
          { id:"feeling", label:"想いから選ぶ", image:"images/garden-couple.webp" },
          { id:"taste",   label:"好みから選ぶ", image:"images/champagne-tower.jpg" }
        ]
      },
      questions:null,
      hideProducts:[],
      productOverrides:{ "table":{ name:"グランヒルズ テーブルコーディネート" } }
    },

    "venue-b":{
      venueId:"venue-b",
      brand:{
        logoMain:"WEDFUN", logoSub:"AQUA TERRACE",
        credit:"Produced by  AQUA TERRACE WEDDING",
        primary:"#2f7d78", circle:"#cfe9e6"
      },
      welcome:{
        title:"ようこそ\nどちらに当てはまりますか？",
        options:[
          { id:"couple", label:"新郎・新婦", icon:"couple" },
          { id:"guest",  label:"ゲスト",     icon:"guest"  }
        ]
      },
      menu:{
        image:"images/garden-couple.webp",
        message:"水と光に包まれたテラスで、\nおふたりらしい時間を\nかたちにしていきます。",
        paths:[
          { id:"feeling", label:"想いから選ぶ", image:"images/sky-lanterns.jpg" },
          { id:"taste",   label:"好みから選ぶ", image:"images/balloons.webp" }
        ]
      },
      questions:null,
      hideProducts:["fire"],
      productOverrides:{}
    }
  };

  // 会場固有の質問が未設定なら default の質問を使う（マスター継承）
  Object.keys(VENUES).forEach(function(id){
    if (!VENUES[id].questions) VENUES[id].questions = VENUES["default"].questions;
  });

  var ICONS = {
    couple:'<svg viewBox="0 0 32 32" stroke-linecap="round" stroke-linejoin="round">'+
      '<circle cx="10" cy="7" r="3"/><path d="M10 10v9"/><path d="M7 19h6"/><path d="M8 19l-1 8"/><path d="M12 19l1 8"/>'+
      '<circle cx="22" cy="7" r="3"/><path d="M22 10c-3 0-4 3-4 6l1 4h6l1-4c0-3-1-6-4-6z"/><path d="M18 20l-1 7h10l-1-7"/></svg>',
    guest:'<svg viewBox="0 0 32 32" stroke-linecap="round" stroke-linejoin="round">'+
      '<circle cx="16" cy="10" r="4"/><path d="M9 25c0-4 3-7 7-7s7 3 7 7"/>'+
      '<circle cx="6" cy="13" r="3"/><path d="M1 24c0-3 2-5 5-5"/>'+
      '<circle cx="26" cy="13" r="3"/><path d="M31 24c0-3-2-5-5-5"/></svg>'
  };

  // =================================================================
  // 状態
  // =================================================================

  var state = {
    venueId:"default",
    userType:null,
    pathId:null,
    answer:null,
    candidates:[],
    productId:null,
    history:[]
  };

  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function el(id){ return document.getElementById(id); }
  function venue(){ return VENUES[state.venueId]; }

  // =================================================================
  // 基準幅540pxに対する等倍スケール（--u）を実寸から算出
  // =================================================================

  function applyScale(){
    var app = el("app");
    var availW = app.clientWidth || window.innerWidth || 540;
    var availH = app.clientHeight || window.innerHeight || 720;
    // 設計比率 540:720 を超えて横に広げない。上限は大画面で巨大化しないため。
    var w = Math.min(availW, Math.round(availH * 0.75), 820);
    var frame = el("frame");
    frame.style.maxWidth = "none";
    frame.style.width = w + "px";
    document.documentElement.style.setProperty("--u", (w / 540) + "px");
  }
  window.addEventListener("resize", applyScale);
  window.addEventListener("orientationchange", applyScale);

  function applyBrand(){
    var b = venue().brand;
    document.documentElement.style.setProperty("--gold", b.primary);
    document.documentElement.style.setProperty("--gold-line", b.primary);
    document.documentElement.style.setProperty("--yellow", b.circle);
    var lock = document.querySelector(".logo-type");
    lock.querySelector(".main").textContent = b.logoMain;
    lock.querySelector(".sub").textContent = b.logoSub;
    el("splashCredit").textContent = b.credit;
  }

  // =================================================================
  // 画面遷移（白基調の静かなフェード）
  // =================================================================

  var current = null;

  function show(id, opts){
    opts = opts || {};
    if (current === id) return;
    if (current && !opts.noHistory) state.history.push(current);
    var prev = current ? el(current) : null;
    if (prev) prev.classList.remove("active");
    current = id;
    var next = el(id);
    next.scrollTop = 0;
    // 旧画面のフェードアウトと重ねて自然に切り替える
    requestAnimationFrame(function(){ next.classList.add("active"); });
  }

  function goBack(){
    var prev = state.history.pop();
    if (!prev) return;
    var cur = current ? el(current) : null;
    if (cur) cur.classList.remove("active");
    current = prev;
    el(prev).classList.add("active");
  }

  // =================================================================
  // 2. ようこそ
  // =================================================================

  function buildWelcome(){
    var w = venue().welcome;
    el("welcomeHead").textContent = w.title;
    el("welcomeHead").style.whiteSpace = "pre-line";
    var list = el("choiceList");
    list.innerHTML = "";
    w.options.forEach(function(opt){
      var b = document.createElement("button");
      b.type = "button";
      b.className = "choice";
      b.dataset.id = opt.id;
      var ico = document.createElement("span");
      ico.className = "ico";
      ico.innerHTML = ICONS[opt.icon] || "";
      var txt = document.createElement("span");
      txt.className = "txt";
      txt.textContent = opt.label;
      b.appendChild(ico); b.appendChild(txt);
      b.addEventListener("click", function(){
        state.userType = opt.id;
        list.querySelectorAll(".choice").forEach(function(c){
          c.classList.toggle("on", c === b);
        });
        el("welcomeNext").disabled = false;
      });
      list.appendChild(b);
    });
  }

  // =================================================================
  // 3. 入口メニュー
  // =================================================================

  function buildMenu(){
    var m = venue().menu;
    el("s-menu").style.backgroundImage = 'url("' + m.image + '")';
    el("menuMessage").textContent = m.message;
    var row = el("pathRow");
    row.innerHTML = "";
    m.paths.forEach(function(p){
      var card = document.createElement("button");
      card.type = "button";
      card.className = "path-card";
      card.style.backgroundImage = 'url("' + p.image + '")';
      var label = document.createElement("span");
      label.className = "path-label";
      label.textContent = p.label;
      card.appendChild(label);
      card.addEventListener("click", function(){
        if (card.classList.contains("pick")) return;
        row.querySelectorAll(".path-card").forEach(function(c){
          c.classList.toggle("pick", c === card);
          c.classList.toggle("dim", c !== card);
        });
        state.pathId = p.id;
        setTimeout(function(){
          buildQuestion();
          show("s-question");
          row.querySelectorAll(".path-card").forEach(function(c){
            c.classList.remove("pick","dim");
          });
        }, reduceMotion ? 0 : 260);
      });
      row.appendChild(card);
    });
  }

  // =================================================================
  // 4. 質問（写真バンド3枚）
  // =================================================================

  function buildQuestion(){
    var qs = venue().questions[state.pathId] || venue().questions.feeling;
    var wrap = el("s-question");
    wrap.innerHTML = "";
    qs.forEach(function(q){
      var band = document.createElement("button");
      band.type = "button";
      band.className = "band";
      band.style.backgroundImage = 'url("' + q.image + '")';
      var inner = document.createElement("span");
      inner.className = "band-inner";
      var t = document.createElement("span");
      t.className = "band-text";
      t.textContent = q.text;
      inner.appendChild(t);
      band.appendChild(inner);
      band.addEventListener("click", function(){
        if (band.classList.contains("pick")) return;
        wrap.querySelectorAll(".band").forEach(function(b){
          b.classList.toggle("pick", b === band);
          b.classList.toggle("dim", b !== band);
        });
        state.answer = q;
        setTimeout(function(){
          buildFavorite();
          show("s-favorite");
          wrap.querySelectorAll(".band").forEach(function(b){
            b.classList.remove("pick","dim");
          });
        }, reduceMotion ? 0 : 280);
      });
      wrap.appendChild(band);
    });
  }

  // =================================================================
  // 診断ロジック（UIから独立。タグ一致数で候補を並べる）
  // =================================================================

  function rankProducts(){
    var v = venue();
    var hidden = v.hideProducts || [];
    var tags = (state.answer && state.answer.tags) || [];
    return MASTER_PRODUCTS
      .filter(function(p){ return hidden.indexOf(p.id) === -1; })
      .map(function(p){
        var score = p.tags.filter(function(t){ return tags.indexOf(t) !== -1; }).length;
        return { product:p, score:score };
      })
      .sort(function(a, b){
        if (b.score !== a.score) return b.score - a.score;
        return MASTER_PRODUCTS.indexOf(a.product) - MASTER_PRODUCTS.indexOf(b.product);
      })
      .map(function(x){ return x.product; });
  }

  function productName(p){
    var ov = (venue().productOverrides || {})[p.id] || {};
    return ov.name || p.name;
  }

  // =================================================================
  // 5. Favorite
  // =================================================================

  function buildFavorite(){
    state.candidates = rankProducts().slice(0, 4);
    var grid = el("favGrid");
    grid.innerHTML = "";
    state.candidates.forEach(function(p){
      var item = document.createElement("button");
      item.type = "button";
      item.className = "fav-item";
      var ph = document.createElement("span");
      ph.className = "fav-photo";
      ph.style.backgroundImage = 'url("' + p.photo + '")';
      var cap = document.createElement("span");
      cap.className = "fav-cap";
      cap.textContent = productName(p);
      item.appendChild(ph); item.appendChild(cap);
      item.addEventListener("click", function(){
        state.productId = p.id;
        buildProduct(p);
        show("s-product");
      });
      grid.appendChild(item);
    });
  }

  // =================================================================
  // 6. 商品詳細
  // =================================================================

  function buildProduct(p){
    var hero = el("pdHero");
    hero.innerHTML = "";
    p.sub.slice(0, 2).forEach(function(src){
      var d = document.createElement("div");
      d.style.backgroundImage = 'url("' + src + '")';
      hero.appendChild(d);
    });
    el("pdName").textContent = productName(p);
    el("pdBody").textContent = p.desc;
    var feats = el("pdFeats");
    feats.innerHTML = "";
    p.feats.forEach(function(f){
      var d = document.createElement("div");
      d.className = "pd-feat";
      d.textContent = f;
      feats.appendChild(d);
    });
    el("pdShot").style.backgroundImage = 'url("' + p.photo + '")';
  }

  // =================================================================
  // 7. 動画
  // =================================================================

  function openVideo(){
    var p = MASTER_PRODUCTS.filter(function(x){ return x.id === state.productId; })[0];
    var stage = el("videoStage");
    stage.innerHTML = "";
    if (p && p.video) {
      var v = document.createElement("video");
      v.src = p.video;
      v.autoplay = true; v.muted = true; v.loop = true;
      v.playsInline = true; v.setAttribute("playsinline", "");
      v.controls = true;
      stage.appendChild(v);
      // 自動再生がブラウザに止められた場合に備える
      var play = v.play();
      if (play && play.catch) play.catch(function(){ v.controls = true; });
    } else {
      var fb = document.createElement("div");
      fb.className = "video-fallback";
      fb.style.backgroundImage = 'url("' + (p ? p.photo : "") + '")';
      var note = document.createElement("div");
      note.className = "video-note";
      note.textContent = "紹介動画（モックアップのため準備中）";
      stage.appendChild(fb);
      stage.appendChild(note);
    }
    show("s-video");
  }

  function closeVideo(){
    var v = el("videoStage").querySelector("video");
    if (v) { v.pause(); }
    goBack();
  }

  // =================================================================
  // 初期化
  // =================================================================

  function init(){
    var q = new URLSearchParams(window.location.search).get("venue");
    if (q && VENUES[q]) state.venueId = q;

    applyScale();
    applyBrand();
    buildWelcome();
    buildMenu();

    show("s-splash", { noHistory:true });

    var advanced = false;
    function leaveSplash(){
      if (advanced) return;
      advanced = true;
      show("s-welcome");
    }
    el("s-splash").addEventListener("click", leaveSplash);
    setTimeout(leaveSplash, reduceMotion ? 600 : 3200);

    el("welcomeNext").addEventListener("click", function(){
      if (!state.userType) return;
      show("s-menu");
    });
    el("welcomeBack").addEventListener("click", function(){
      state.userType = null;
      el("welcomeNext").disabled = true;
      el("choiceList").querySelectorAll(".choice").forEach(function(c){ c.classList.remove("on"); });
      advanced = false;
      state.history = [];
      current = "s-welcome";
      el("s-welcome").classList.remove("active");
      el("s-splash").classList.add("active");
      current = "s-splash";
      setTimeout(leaveSplash, reduceMotion ? 600 : 3200);
    });

    el("favBack").addEventListener("click", goBack);
    el("pdBack").addEventListener("click", goBack);
    el("pdVideo").addEventListener("click", openVideo);
    el("videoClose").addEventListener("click", closeVideo);
    el("pdContact").addEventListener("click", function(){
      window.alert("お申し込み・ご相談フォームへの導線です。\n本番環境では会場ごとに設定したURLへ遷移します。（モックアップ）");
    });
  }

  document.addEventListener("DOMContentLoaded", init);
})();
</script>
</body>
